<style>
html,body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  overscroll-behavior:none;
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
}
/* RuntimeProfile document viewport lock. iOS Safari may pan the document
   itself to reveal a focused textarea even though the chat owns its own scroller.
   Lock only the app shell; ScrollRoot remains the sole conversation scroll owner. */
:root[data-runtime-document-viewport-lock] #appShell{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  background:var(--theme-surface-primary);
  color:var(--theme-content-primary);
  font-family:var(--font-family-sans);
  -webkit-font-smoothing:antialiased;
  font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  -webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;
  user-select:none;
}
button,textarea{font-size:16px}
.native-file-input{
  position:fixed;
  inline-size:1px;
  block-size:1px;
  inset-inline-start:-10000px;
  inset-block-start:0;
  opacity:0;
  pointer-events:none;
}

:root{
  --text-primary:var(--cgpt-text-primary);
  --text-secondary:var(--cgpt-text-secondary);
  --text-tertiary:var(--cgpt-text-tertiary);
  --main-surface-primary:var(--cgpt-main-surface-primary);
  --main-surface-secondary:var(--cgpt-main-surface-secondary);
  --surface-hover:var(--cgpt-surface-hover);
  --composer-surface-primary:var(--cgpt-composer-surface-primary);
  --border-heavy:var(--composer-border);
}

.text-token-text-primary{
  color:var(--text-primary);
}
.text-token-text-secondary{
  color:var(--text-secondary);
}
.text-token-text-tertiary{
  color:var(--text-tertiary);
}
.user-message-bubble-color{
  background:var(--main-surface-secondary);
}
.bg-token-main-surface-primary{
  background:var(--main-surface-primary);
}
button{
  touch-action:manipulation;
  -webkit-user-select:none;
  user-select:none;
}
#svhProbe{
  position:fixed;
  left:-9999px;
  top:0;
  width:1px;
  height:100svh;
  visibility:hidden;
  pointer-events:none;
}

/*
  Reference contract baseline from the supplied ChatGPT.html.
  V21.64 P2P repair: ScrollRoot owns conversation display only; Composer is a
  sibling overlay layer. The scroller receives only an inert bottom reserve,
  never Composer input/focus events.
*/
#stageLayout{position:relative;}
#scrollRoot{
  --thread-content-max-width:40rem;
  --sticky-padding-top:var(--header-height,72px);
  --sticky-padding-bottom:0px; /* telemetry only; never a ScrollRoot owner */
  --screen-keyboard-height:0px; /* keyboard metadata only */
  --scroll-root-safe-area-inset-top:
    calc(var(--sticky-padding-top) + env(safe-area-inset-top,0px));
  --scroll-root-safe-scroll-bottom:0px;
  --scroll-root-safe-area-inset-bottom:0px;
  --composer-overlap-px:28px;
  --thread-component-gap:var(--runtime-thread-component-gap-px,24px);
  --composer-visual-top:0px;
  --composer-flow-reserve:0px;

  scroll-padding-top:var(--scroll-root-safe-area-inset-top);
  scroll-padding-bottom:0px;
  scrollbar-gutter:stable;
  overflow-anchor:none;
  scrollbar-width:none;
}
#scrollRoot::-webkit-scrollbar{display:none;width:0;height:0}


/* =========================================================
   V21.64 — COMPOSER PLACEMENT OWNER SWITCH
   CLOSED: sticky bottom-0 inside ScrollRoot.
   OPEN:   fixed to the measured VisualViewport bottom.
   Only one placement owner is active at a time.
   ========================================================= */
#composerPlacementSpacer{
  display:block;
  height:var(--composer-flow-reserve,0px);
  flex:0 0 auto;
  pointer-events:none;
}

/* CLOSED: Composer is a stage overlay sibling, not a ScrollRoot child.
   Typing cannot ask the conversation scroller to reveal the caret. */
#thread-bottom-container{
  position:absolute;
  inset-inline:0;
  bottom:0;
  width:100%;
  margin:0;
  z-index:40;
}

/* OPEN: VisualViewport owns only Composer placement; ScrollRoot remains the
   same conversation-display layer. */
#stageLayout[data-composer-placement="visual-viewport"] #thread-bottom-container{
  position:fixed;
  top:var(--composer-visual-top,0px);
  right:0;
  bottom:auto;
  left:0;
  width:100%;
  margin:0;
  z-index:40;
}

#stageLayout[data-composer-placement="visual-viewport"] .composer-source-frame{
  margin-bottom:0;
  padding-bottom:0;
}

/* Conversation content may pass under the floating Composer fade. */
#threadContent{
  margin-bottom:calc(-1 * var(--composer-overlap-px));
  padding-bottom:var(--composer-overlap-px);
  background:var(--theme-surface-primary);
}

#tailRunwaySpace{
  min-height:var(--gutter-remaining-height,0px);
}

/* P2P message actions — V21.9 ZERO REFLOW SIDE RAIL.
   The rail is outside normal flow. Hover/tap only changes visibility. */
.message-unit{
  position:relative;
  width:fit-content;
  max-width:100%;
}
.user-message-unit{
  margin-left:auto;
  max-width:70%;
}
.assistant-message-unit{
  margin-right:auto;
  max-width:min(70%,calc(100% - 46px));
}

.message-action-group{
  position:absolute;
  top:50%;
  z-index:4;
  display:flex;
  align-items:center;
  gap:0;
  height:32px;
  min-height:32px;
  overflow:visible;
  padding:0;
  margin:0;
  white-space:nowrap;
  pointer-events:none;
  opacity:0;
  user-select:none;
  transform:translateY(-50%) scale(.96);
  transform-origin:center;
  transition:
    opacity 160ms ease,
    transform 160ms ease;
}
.message-action-group.user-actions{
  right:100%;
  padding-right:6px;
  justify-content:flex-end;
}
.message-action-group.assistant-actions{
  left:100%;
  padding-left:6px;
  justify-content:flex-start;
}

/* Sender surfaces are intentionally asymmetric:
   outgoing text/link/reply uses a soft bubble; incoming stays on canvas.
   File/audio/image keep their own media containers and receive no outer bubble. */
.user-message-unit>.message-text{
  background:var(--theme-surface-secondary);
  border:0;
  border-radius:22px;
  box-shadow:none;
  padding:9px 13px;
}
.assistant-message-unit>.message-text{
  background:transparent!important;
  border:0!important;
  border-radius:0!important;
  box-shadow:none!important;
  padding:0!important;
}

/* Desktop hover owner is the actual message unit, not the full-width row. */
.message-unit:hover .message-action-group,
.message-unit:focus-within .message-action-group,
.message-turn[data-actions-open="true"] .message-action-group{
  pointer-events:auto;
  opacity:1;
  transform:translateY(-50%) scale(1);
}

/* Wheel/drag owns interaction while content is moving.
   Do not let a stationary pointer make action rails jump between messages. */
#scrollRoot[data-user-scrolling="true"] .message-unit:hover .message-action-group,
#scrollRoot[data-user-dragging="true"] .message-unit:hover .message-action-group{
  pointer-events:none;
  opacity:0;
  transform:translateY(-50%) scale(.96);
}

.message-turn-shell{
  width:100%;
  min-width:0;
}
#messageWindow{
  padding-block:14px 18px;
}
#messageWindow>.message-row{
  margin:0;
}
#messageWindow>.message-row+.message-row{
  margin-top:8px;
}
/* Conversation Content owns the rhythm between sibling messages.
   Same-sender text stays compact; media gets more breathing room by type. */
#messageWindow>.message-row[data-turn="user"]+.message-row[data-turn="user"],
#messageWindow>.message-row[data-turn="assistant"]+.message-row[data-turn="assistant"]{
  margin-top:8px;
}
#messageWindow>.message-row[data-turn="user"][data-content-kind="audio"]+.message-row[data-turn="user"][data-content-kind="audio"],
#messageWindow>.message-row[data-turn="assistant"][data-content-kind="audio"]+.message-row[data-turn="assistant"][data-content-kind="audio"]{
  margin-top:7px;
}
#messageWindow>.message-row[data-turn="user"][data-content-kind="text"]+.message-row[data-turn="user"][data-content-kind="audio"],
#messageWindow>.message-row[data-turn="assistant"][data-content-kind="text"]+.message-row[data-turn="assistant"][data-content-kind="audio"],
#messageWindow>.message-row[data-turn="user"][data-content-kind="audio"]+.message-row[data-turn="user"][data-content-kind="text"],
#messageWindow>.message-row[data-turn="assistant"][data-content-kind="audio"]+.message-row[data-turn="assistant"][data-content-kind="text"],
#messageWindow>.message-row[data-turn="user"][data-content-kind="text"]+.message-row[data-turn="user"][data-content-kind="file"],
#messageWindow>.message-row[data-turn="assistant"][data-content-kind="text"]+.message-row[data-turn="assistant"][data-content-kind="file"],
#messageWindow>.message-row[data-turn="user"][data-content-kind="file"]+.message-row[data-turn="user"][data-content-kind="text"],
#messageWindow>.message-row[data-turn="assistant"][data-content-kind="file"]+.message-row[data-turn="assistant"][data-content-kind="text"]{
  margin-top:9px;
}
#messageWindow>.message-row[data-turn="user"][data-content-kind="text"]+.message-row[data-turn="user"][data-content-kind="image"],
#messageWindow>.message-row[data-turn="assistant"][data-content-kind="text"]+.message-row[data-turn="assistant"][data-content-kind="image"],
#messageWindow>.message-row[data-turn="user"][data-content-kind="text"]+.message-row[data-turn="user"][data-content-kind="gallery"],
#messageWindow>.message-row[data-turn="assistant"][data-content-kind="text"]+.message-row[data-turn="assistant"][data-content-kind="gallery"],
#messageWindow>.message-row[data-turn="user"][data-content-kind="image"]+.message-row[data-turn="user"][data-content-kind="text"],
#messageWindow>.message-row[data-turn="assistant"][data-content-kind="image"]+.message-row[data-turn="assistant"][data-content-kind="text"],
#messageWindow>.message-row[data-turn="user"][data-content-kind="gallery"]+.message-row[data-turn="user"][data-content-kind="text"],
#messageWindow>.message-row[data-turn="assistant"][data-content-kind="gallery"]+.message-row[data-turn="assistant"][data-content-kind="text"],
#messageWindow>.message-row[data-turn="user"][data-content-kind="audio"]+.message-row[data-turn="user"][data-content-kind="image"],
#messageWindow>.message-row[data-turn="assistant"][data-content-kind="audio"]+.message-row[data-turn="assistant"][data-content-kind="image"],
#messageWindow>.message-row[data-turn="user"][data-content-kind="audio"]+.message-row[data-turn="user"][data-content-kind="gallery"],
#messageWindow>.message-row[data-turn="assistant"][data-content-kind="audio"]+.message-row[data-turn="assistant"][data-content-kind="gallery"],
#messageWindow>.message-row[data-turn="user"][data-content-kind="image"]+.message-row[data-turn="user"][data-content-kind="audio"],
#messageWindow>.message-row[data-turn="assistant"][data-content-kind="image"]+.message-row[data-turn="assistant"][data-content-kind="audio"],
#messageWindow>.message-row[data-turn="user"][data-content-kind="gallery"]+.message-row[data-turn="user"][data-content-kind="audio"],
#messageWindow>.message-row[data-turn="assistant"][data-content-kind="gallery"]+.message-row[data-turn="assistant"][data-content-kind="audio"]{
  margin-top:11px;
}
/* Sender change is the strongest separator regardless of content kind. */
#messageWindow>.message-row[data-turn="user"]+.message-row[data-turn="assistant"],
#messageWindow>.message-row[data-turn="assistant"]+.message-row[data-turn="user"]{
  margin-top:15px;
}
.message-body{
  font-size:1rem;
  line-height:1.5rem;
}
.message-body[data-has-link="true"]{
  overflow-wrap:anywhere;
  word-break:break-word;
}
.message-link{
  color:#4f86d9;
  text-decoration:none;
  text-underline-offset:.14em;
  overflow-wrap:anywhere;
  word-break:break-word;
  -webkit-tap-highlight-color:transparent;
}
.message-link[data-link-long="true"]{
  display:-webkit-box;
  width:fit-content;
  max-width:100%;
  overflow:hidden;
  -webkit-box-orient:vertical;
  -webkit-line-clamp:2;
  line-clamp:2;
}
.message-link:hover{text-decoration:underline}
.message-link:focus-visible{
  outline:2px solid #78aef8;
  outline-offset:2px;
  border-radius:2px;
}
.assistant-message-unit>.message-text{
  min-height:0;
}
/* Text + media inside one message uses the same rhythm family. */
.message-unit>.message-text:not([hidden]) + [data-message-media-root="true"]{
  margin-top:9px!important;
}
.message-unit>.message-text:not([hidden]) + [data-message-media-root="true"][data-media-root-kind="image"],
.message-unit>.message-text:not([hidden]) + [data-message-media-root="true"][data-media-root-kind="gallery"]{
  margin-top:11px!important;
}
@media(max-width:520px){
  #messageWindow{padding-block:10px 14px}
  #messageWindow>.message-row+.message-row{margin-top:7px}
  #messageWindow>.message-row[data-turn="user"][data-content-kind="audio"]+.message-row[data-turn="user"][data-content-kind="audio"],
  #messageWindow>.message-row[data-turn="assistant"][data-content-kind="audio"]+.message-row[data-turn="assistant"][data-content-kind="audio"]{margin-top:7px}
  #messageWindow>.message-row[data-turn="user"][data-content-kind="text"]+.message-row[data-turn="user"][data-content-kind="audio"],
  #messageWindow>.message-row[data-turn="assistant"][data-content-kind="text"]+.message-row[data-turn="assistant"][data-content-kind="audio"],
  #messageWindow>.message-row[data-turn="user"][data-content-kind="audio"]+.message-row[data-turn="user"][data-content-kind="text"],
  #messageWindow>.message-row[data-turn="assistant"][data-content-kind="audio"]+.message-row[data-turn="assistant"][data-content-kind="text"]{margin-top:8px}
  #messageWindow>.message-row[data-turn="user"][data-content-kind="text"]+.message-row[data-turn="user"]:is([data-content-kind="image"],[data-content-kind="gallery"]),
  #messageWindow>.message-row[data-turn="assistant"][data-content-kind="text"]+.message-row[data-turn="assistant"]:is([data-content-kind="image"],[data-content-kind="gallery"]),
  #messageWindow>.message-row[data-turn="user"]:is([data-content-kind="image"],[data-content-kind="gallery"])+.message-row[data-turn="user"][data-content-kind="text"],
  #messageWindow>.message-row[data-turn="assistant"]:is([data-content-kind="image"],[data-content-kind="gallery"])+.message-row[data-turn="assistant"][data-content-kind="text"]{margin-top:10px}
  #messageWindow>.message-row[data-turn="user"]+.message-row[data-turn="assistant"],
  #messageWindow>.message-row[data-turn="assistant"]+.message-row[data-turn="user"]{margin-top:13px}
}

@media (hover:none),(pointer:coarse){
  .user-message-unit{
    max-width:70%;
  }
  .assistant-message-unit{
    max-width:min(70%,calc(100% - 46px));
  }

  .message-unit:hover .message-action-group,
  .message-unit:focus-within .message-action-group{
    pointer-events:none;
    opacity:0;
    transform:translateY(-50%) scale(.96);
  }

  .message-turn[data-actions-open="true"] .message-action-group{
    pointer-events:auto;
    opacity:1;
    transform:translateY(-50%) scale(1);
  }
}

/* 280px hard gate: keep the three remote touch actions on-screen. */
@media (max-width:319px) and (hover:none),
       (max-width:319px) and (pointer:coarse){
  .user-message-unit{
    max-width:70%;
  }
  .assistant-message-unit{
    max-width:calc(100% - 42px);
  }
}


/* V21.13 P2P Reply + Important.
   Important colors are backed by exact ChatGPT source tokens. */
.user-message-unit[data-important="true"] .message-text{
  background:var(--cgpt-important-surface);
}
.assistant-message-unit[data-important="true"]::before{
  content:"";
  position:absolute;
  inset-block:2px;
  inset-inline-start:-10px;
  width:3px;
  border-radius:999px;
  background:var(--cgpt-important-rail);
  pointer-events:none;
}
.action-button[aria-pressed="true"] .p2p-important-icon{
  fill:currentColor;
}
.reply-quote{
  --reply-rail:#78aef8;
  appearance:none;
  width:100%;
  color:var(--theme-content-secondary);
  text-align:start;
  background:transparent;
  border:0;
  border-inline-start:2px solid var(--reply-rail);
  border-radius:0;
  margin:0 0 6px;
  padding:2px 0 2px 9px;
  font:inherit;
  font-size:12px;
  line-height:16px;
  cursor:pointer;
  overflow:hidden;
}
.reply-quote:hover{color:var(--theme-content-primary)}
.reply-quote-text{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.message-turn[data-reference-flash="true"] .message-text{
  outline:2px solid #78aef8;
  outline-offset:3px;
}
.reply-context{
  --reply-rail:#78aef8;
  display:grid;
  grid-template-columns:minmax(0,1fr) 32px;
  align-items:center;
  gap:8px;
  margin:8px 10px 0;
  padding:7px 8px 7px 10px;
  border:0;
  border-inline-start:2px solid var(--reply-rail);
  border-radius:0;
  background:color-mix(in srgb,#78aef8 5%,var(--theme-surface-secondary));
  color:var(--theme-content-secondary);
}
.reply-context[hidden]{display:none}
.reply-context-copy{min-width:0}
.reply-context-label{display:block;color:var(--theme-content-primary);font-size:12px;font-weight:600;line-height:16px}
.reply-context-text{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;line-height:16px}
.reply-context-close{
  appearance:none;width:32px;height:32px;display:grid;place-items:center;
  color:var(--theme-content-secondary);background:transparent;border:0;border-radius:0;cursor:pointer
}
.reply-context-close:hover{background:color-mix(in srgb,#78aef8 8%,transparent);color:var(--theme-content-primary)}

.action-button{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:32px;
  height:32px;
  border-radius:8px;
  color:var(--text-secondary);
}
.action-button:hover{
  background:var(--surface-hover);
}
.action-button[aria-pressed="true"]{
  color:#ef4444;
}
.action-button svg{
  width:20px;
  height:20px;
}
@media (hover:none),(pointer:coarse){
  .action-button{
    width:40px;
    height:32px;
  }
}
@media (max-width:319px) and (hover:none),
       (max-width:319px) and (pointer:coarse){
  .action-button{
    width:36px;
  }
}

/* Equivalent purpose to ChatGPT's threadFooterContentFade class:
   messages may pass under the sticky composer, but visually fade below it. */
#thread-bottom-container.threadFooterContentFade::before{
  content:"";
  position:absolute;
  z-index:0;
  pointer-events:none;
  left:0;
  right:0;
  bottom:0;
  height:calc(100% + 56px);
  background:linear-gradient(
    to bottom,
    rgba(255,255,255,0) 0%,
    rgba(255,255,255,.72) 30%,
    rgba(255,255,255,.94) 54%,
    #fff 76%
  );
}





.thread-surface-source{
  background:var(--theme-surface-primary);
}
.header-surface-source{
  background:color-mix(in srgb, var(--theme-surface-primary) 95%, transparent);
}
.presence-source,
.history-status-source{
  color:var(--theme-content-tertiary);
}
.presence-source{
  font-size:.875rem;
  line-height:1.25rem;
}
.history-status-source{
  font-size:.75rem;
  line-height:1rem;
}

.composer-footer-control{
  width:36px;
  height:36px;
  min-width:36px;
  flex:0 0 36px;
  align-self:center;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  box-sizing:border-box;
  padding:0;
  line-height:0;
  vertical-align:middle;
}
.composer-footer-control svg{
  display:block;
  flex:none;
}

.send-button-source{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  border:1px solid transparent;
  border-radius:9999px;
  background:var(--button-primary-background-color-disabled);
  color:var(--button-primary-text-color);
  transition:
    background 120ms ease-out,
    opacity 120ms ease-out;
}
#composerShell[data-can-send="true"] .send-button-source{
  background:var(--button-primary-background-color-rest);
}
.send-button-source:disabled{
  cursor:default;
  opacity:1;
}
.send-button-source svg{
  transform-origin:50% 50%;
  transition:transform 120ms ease-out;
}
.send-button-source[data-arrow="right"] svg{
  transform:rotate(90deg);
}
.send-button-source[data-mode-toggle="true"]{
  cursor:pointer;
}
.composer-plus-source{

.composer-action-menu-source{

  bottom:auto;

  width:min(14rem,calc(100vw - 1.5rem));
  min-width:3.125rem;
  max-width:min(20rem,calc(100vw - .75rem));
  color:var(--theme-content-primary);

.composer-action-menu-surface{

  border:0;

.composer-action-menu-item:hover{

}
.composer-action-menu-item:active{

}
.composer-action-menu-icon{
  width:2.25rem;

@media (hover:hover) and (pointer:fine){

}
@media (width>=48rem){

.composer-source-frame{

     Composer placement owns only the 24px thread component gap. */

}

.composer-shell-source{

.attachment-tray-media-strip{

.attachment-chip{

/* V21.70 — one audio surface at a time.
   RECORDING/PREVIEW/SENDING replace the normal text/footer UI instead of nesting inside it. */
#composerShell[data-audio-state="REQUESTING_PERMISSION"] #editorWrap,
#composerShell[data-audio-state="RECORDING"] #editorWrap,
#composerShell[data-audio-state="STOPPING"] #editorWrap,
#composerShell[data-audio-state="PREVIEW"] #editorWrap,
#composerShell[data-audio-state="SENDING"] #editorWrap,
#composerShell[data-audio-state="REQUESTING_PERMISSION"] #composerFooter,
#composerShell[data-audio-state="RECORDING"] #composerFooter,
#composerShell[data-audio-state="STOPPING"] #composerFooter,
#composerShell[data-audio-state="PREVIEW"] #composerFooter,
#composerShell[data-audio-state="SENDING"] #composerFooter{
  display:none!important;
}
#composerShell[data-audio-state="REQUESTING_PERMISSION"] #attachmentTray,
#composerShell[data-audio-state="RECORDING"] #attachmentTray,
#composerShell[data-audio-state="STOPPING"] #attachmentTray,
#composerShell[data-audio-state="PREVIEW"] #attachmentTray,
#composerShell[data-audio-state="SENDING"] #attachmentTray{
  display:block!important;
  padding:.625rem .75rem!important;
  overflow:visible!important;
}
.audio-recording-card,
.audio-preview-card{
  display:grid;
  grid-template-columns:2.5rem minmax(5rem,1fr) auto auto;
  align-items:center;
  gap:.625rem;
  width:100%;
  min-width:0;
  min-height:3.25rem;
  box-sizing:border-box;
  border:1px solid var(--composer-border);
  background:var(--cgpt-composer-surface-primary);
  border-radius:calc(var(--component-conversation-composer-radius,var(--radius-2xl)) - .5rem);
  padding:.45rem .55rem;
  contain:layout paint;
}
.audio-recording-indicator{
  display:grid;place-items:center;width:2.5rem;height:2.5rem;border-radius:999px;background:#fff1f0;
}
.audio-recording-dot{width:.75rem;height:.75rem;border-radius:999px;background:#ef4444;box-shadow:0 0 0 .3rem rgba(239,68,68,.12);animation:audio-recording-pulse 1.25s ease-in-out infinite;}
@keyframes audio-recording-pulse{50%{transform:scale(.8);opacity:.65;}}
.audio-recording-main,.audio-preview-main{display:flex;align-items:center;gap:.75rem;min-width:0;}
.audio-recording-waveform,.audio-preview-waveform{display:flex;align-items:center;gap:2px;height:1.75rem;min-width:4rem;overflow:hidden;flex:1;}
.audio-recording-waveform i,.audio-preview-waveform i{display:block;width:2px;min-width:2px;border-radius:999px;background:var(--theme-content-tertiary);opacity:.68;}
.audio-recording-waveform i:nth-child(-n+7){background:#ef4444;opacity:.9;}
.audio-recording-time,.audio-preview-duration,.audio-message-time{font:500 .75rem/1rem var(--font-family-sans);color:var(--theme-content-secondary);white-space:nowrap;}
.audio-recording-cancel,.audio-recording-stop,.audio-preview-cancel,.audio-preview-send{
  min-height:2.4rem;border:0;border-radius:999px;padding:0 .8rem;font:600 .75rem/1 var(--font-family-sans);white-space:nowrap;
}
.audio-recording-cancel,.audio-preview-cancel{background:transparent;color:var(--theme-content-secondary);}
.audio-recording-stop{background:#fee2e2;color:#dc2626;}
.audio-preview-send{background:var(--theme-content-primary);color:var(--theme-surface-primary);}
.audio-recording-stop:disabled,.audio-preview-send:disabled,.audio-preview-cancel:disabled{opacity:.45;cursor:default;}
.audio-preview-play{
  display:grid;place-items:center;width:2.5rem;height:2.5rem;border:0;border-radius:999px;
  background:var(--theme-content-primary);color:var(--theme-surface-primary);font-size:.85rem;
}
.audio-preview-card audio,.audio-message-card audio{display:none;}

/* V21.72.39 — image presentation owner.
   Single images keep the full source via contain inside a normalized envelope.
   Gallery tiles intentionally use cover so mixed portrait/landscape sources form one balanced unit. */
.media-image-tile[data-image-presentation]{
  display:block;
  max-width:100%;
  border-radius:14px;
  overflow:hidden;
  background:transparent;
}
.media-image-tile[data-image-presentation] > img{
  width:100%!important;
  height:100%!important;
  display:block;
  object-fit:contain!important;
  object-position:center!important;
}
.media-gallery-grid{
  width:min(25rem,100%)!important;
  max-width:100%;
  gap:4px!important;
  border-radius:14px!important;
  overflow:hidden;
}
.media-gallery-grid .media-image-tile{
  min-width:0;
  min-height:0;
  border-radius:0;
}
.media-gallery-grid .media-image-tile > img{
  width:100%!important;
  height:100%!important;
  object-fit:cover!important;
  object-position:center!important;
}
@media(max-width:520px){
  .media-image-tile[data-image-presentation="portrait"]{width:min(16rem,100%)!important}
  .media-image-tile[data-image-presentation="square"]{width:min(20rem,100%)!important}
  .media-image-tile[data-image-presentation="landscape"]{width:min(25rem,100%)!important}
  .media-gallery-grid{width:min(25rem,100%)!important}
}

/* V21.70 — audio visual hierarchy follows the existing grayscale chat language.
   Remote stays neutral/outlined; self uses the same subtle user-message surface. */
.audio-message-card{
  display:grid;

}

@media(max-width:480px){

  .audio-recording-cancel,.audio-recording-stop,.audio-preview-cancel,.audio-preview-send{padding-inline:.6rem;}
  .audio-message-card{width:min(16rem,100%);grid-template-columns:1.9rem minmax(4.25rem,1fr) auto;gap:.42rem;padding:.32rem .42rem;}
