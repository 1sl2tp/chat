<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>Mic Test</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f5f5f7;color:#111;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:560px;margin:0 auto;padding:18px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h2{margin:0;font-size:22px}.badge{font:700 12px ui-monospace,SFMono-Regular,Menlo,monospace;border:1px solid #ccc;background:#fff;border-radius:999px;padding:7px 10px}.card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:16px;margin-top:14px}.muted{color:#666;font-size:14px;line-height:1.45}.row{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid #eee}.row:last-child{border-bottom:0}.value{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:700;text-align:right;word-break:break-all}button{width:100%;min-height:54px;border:0;border-radius:12px;background:#111;color:#fff;font-size:17px;font-weight:800}button.secondary{margin-top:10px;background:#b42318}button:disabled{opacity:.4}.verdict{margin-top:14px;padding:13px;border-radius:12px;background:#f2f2f2;font-weight:800}.verdict[data-state="ok"]{background:#e7f7ec;color:#116b2c}.verdict[data-state="bad"]{background:#fdecec;color:#a10000}audio{width:100%;margin-top:12px}
  </style>
</head>
<body>
<main>
  <div class="top">
    <h2>Mic Test — Pure gUM</h2>
    <span id="version" class="badge">đang đọc build…</span>
  </div>

  <section class="card">
    <p class="muted">Không AudioContext, không RMS, không LiveKit, không Supabase. Bấm nút: lệnh media đầu tiên là <b>getUserMedia({audio:true})</b>, sau đó ghi đúng stream đó trong 3 giây.</p>
    <button id="start">Bật mic + ghi 3 giây</button>
    <button id="stop" class="secondary" disabled>Dừng</button>
  </section>

  <section class="card">
    <div class="row"><span>Permission</span><span id="permission" class="value">chưa hỏi</span></div>
    <div class="row"><span>Track</span><span id="track" class="value">—</span></div>
    <div class="row"><span>Recorder</span><span id="recorder-state" class="value">—</span></div>
    <div id="verdict" class="verdict" data-state="idle">Chưa thử</div>
  </section>

  <section class="card">
    <b>Phát lại đúng stream vừa ghi</b>
    <div id="playback-note" class="muted" style="margin-top:8px">Chưa có bản ghi.</div>
    <audio id="playback" controls playsinline hidden></audio>
  </section>
</main>
<script type="module" src="/src/mic-test/main.ts"></script>
</body>
</html>
