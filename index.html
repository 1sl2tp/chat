<style>
html,body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  overscroll-behavior:none;
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
}
/* RuntimeProfile document viewport lock. iOS Safari may pan the document
   itself to reveal a focused textarea even though the chat owns its own scroller.
   Lock only the app shell; ScrollRoot remains the sole conversation scroll owner. */
:root[data-runtime-document-viewport-lock] #appShell{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  background:var(--theme-surface-primary);
  color:var(--theme-content-primary);
  font-family:var(--font-family-sans);
  -webkit-font-smoothing:antialiased;
  font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  -webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;
  user-select:none;
}
button,textarea{font-size:16px}
.native-file-input{
  position:fixed;
  inline-size:1px;
  block-size:1px;
  inset-inline-start:-10000px;
  inset-block-start:0;
  opacity:0;
  pointer-events:none;
}

:root{
  --text-primary:var(--cgpt-text-primary);
  --text-secondary:var(--cgpt-text-secondary);
  --text-tertiary:var(--cgpt-text-tertiary);
  --main-surface-primary:var(--cgpt-main-surface-primary);
  --main-surface-secondary:var(--cgpt-main-surface-secondary);
  --surface-hover:var(--cgpt-surface-hover);
  --composer-surface-primary:var(--cgpt-composer-surface-primary);
  --border-heavy:var(--composer-border);
}

.text-token-text-primary{
  color:var(--text-primary);
}
.text-token-text-secondary{
  color:var(--text-secondary);
}
.text-token-text-tertiary{
  color:var(--text-tertiary);
}
.user-message-bubble-color{
  background:var(--main-surface-secondary);
}
.bg-token-main-surface-primary{
  background:var(--main-surface-primary);
}
button{
  touch-action:manipulation;
  -webkit-user-select:none;
  user-select:none;
}
#svhProbe{
  position:fixed;
  left:-9999px;
  top:0;
  width:1px;
  height:100svh;
  visibility:hidden;
  pointer-events:none;
}

/*
  Reference contract baseline from the supplied ChatGPT.html.
  V21.64 P2P repair: ScrollRoot owns conversation display only; Composer is a
  sibling overlay layer. The scroller receives only an inert bottom reserve,
  never Composer input/focus events.
*/
#stageLayout{position:relative;}
#scrollRoot{
  --thread-content-max-width:40rem;
  --sticky-padding-top:var(--header-height,72px);
  --sticky-padding-bottom:0px; /* telemetry only; never a ScrollRoot owner */
  --screen-keyboard-height:0px; /* keyboard metadata only */
  --scroll-root-safe-area-inset-top:
    calc(var(--sticky-padding-top) + env(safe-area-inset-top,0px));
  --scroll-root-safe-scroll-bottom:0px;
  --scroll-root-safe-area-inset-bottom:0px;
  --composer-overlap-px:28px;
  --thread-component-gap:var(--runtime-thread-component-gap-px,24px);
  --composer-visual-top:0px;
  --composer-flow-reserve:0px;

  scroll-padding-top:var(--scroll-root-safe-area-inset-top);
  scroll-padding-bottom:0px;
  scrollbar-gutter:stable;
  overflow-anchor:none;
  scrollbar-width:none;
}
#scrollRoot::-webkit-scrollbar{display:none;width:0;height:0}


/* =========================================================
   V21.64 — COMPOSER PLACEMENT OWNER SWITCH
   CLOSED: sticky bottom-0 inside ScrollRoot.
   OPEN:   fixed to the measured VisualViewport bottom.
   Only one placement owner is active at a time.
   ========================================================= */
#composerPlacementSpacer{
  display:block;
  height:var(--composer-flow-reserve,0px);
  flex:0 0 auto;
  pointer-events:none;
}

/* CLOSED: Composer is a stage overlay sibling, not a ScrollRoot child.
   Typing cannot ask the conversation scroller to reveal the caret. */
#thread-bottom-container{
  position:absolute;
  inset-inline:0;
  bottom:0;
  width:100%;
  margin:0;
  z-index:40;
}

/* OPEN: VisualViewport owns only Composer placement; ScrollRoot remains the
   same conversation-display layer. */
#stageLayout[data-composer-placement="visual-viewport"] #thread-bottom-container{
  position:fixed;
  top:var(--composer-visual-top,0px);
  right:0;
  bottom:auto;
  left:0;
  width:100%;
  margin:0;
  z-index:40;
}

#stageLayout[data-composer-placement="visual-viewport"] .composer-source-frame{
  margin-bottom:0;
  padding-bottom:0;
}

/* Conversation content may pass under the floating Composer fade. */
#threadContent{
  margin-bottom:calc(-1 * var(--composer-overlap-px));
  padding-bottom:var(--composer-overlap-px);
  background:var(--theme-surface-primary);
}

#tailRunwaySpace{
  min-height:var(--gutter-remaining-height,0px);
}

/* P2P message actions — V21.9 ZERO REFLOW SIDE RAIL.
   The rail is outside normal flow. Hover/tap only changes visibility. */
.message-unit{
  position:relative;
  width:fit-content;
  max-width:100%;
}
.user-message-unit{
  margin-left:auto;
  max-width:70%;
}
.assistant-message-unit{
  margin-right:auto;
  max-width:min(70%,calc(100% - 46px));
}

.message-action-group{
  position:absolute;
  top:50%;
  z-index:4;
  display:flex;
  align-items:center;
  gap:0;
  height:32px;
  min-height:32px;
  overflow:visible;
  padding:0;
  margin:0;
  white-space:nowrap;
  pointer-events:none;
  opacity:0;
  user-select:none;
  transform:translateY(-50%) scale(.96);
  transform-origin:center;
  transition:
    opacity 160ms ease,
    transform 160ms ease;
}
.message-action-group.user-actions{
  right:100%;
  padding-right:6px;
  justify-content:flex-end;
}
.message-action-group.assistant-actions{
  left:100%;
  padding-left:6px;
  justify-content:flex-start;
}

/* Desktop hover owner is the actual message unit, not the full-width row. */
.message-unit:hover .message-action-group,
.message-unit:focus-within .message-action-group,
.message-turn[data-actions-open="true"] .message-action-group{
  pointer-events:auto;
  opacity:1;
  transform:translateY(-50%) scale(1);
}

/* Wheel/drag owns interaction while content is moving.
   Do not let a stationary pointer make action rails jump between messages. */
#scrollRoot[data-user-scrolling="true"] .message-unit:hover .message-action-group,
#scrollRoot[data-user-dragging="true"] .message-unit:hover .message-action-group{
  pointer-events:none;
  opacity:0;
  transform:translateY(-50%) scale(.96);
}

.assistant-turn-shell{
  padding-bottom:8px;
}

@media (hover:none),(pointer:coarse){
  .user-message-unit{
    max-width:70%;
  }
  .assistant-message-unit{
    max-width:min(70%,calc(100% - 46px));
  }

  .message-unit:hover .message-action-group,
  .message-unit:focus-within .message-action-group{
    pointer-events:none;
    opacity:0;
    transform:translateY(-50%) scale(.96);
  }

  .message-turn[data-actions-open="true"] .message-action-group{
    pointer-events:auto;
    opacity:1;
    transform:translateY(-50%) scale(1);
  }
}

/* 280px hard gate: keep the three remote touch actions on-screen. */
@media (max-width:319px) and (hover:none),
       (max-width:319px) and (pointer:coarse){
  .user-message-unit{
    max-width:70%;
  }
  .assistant-message-unit{
    max-width:calc(100% - 42px);
  }
}


/* V21.13 P2P Reply + Important.
   Important colors are backed by exact ChatGPT source tokens. */
.user-message-unit[data-important="true"] .message-text{
  background:var(--cgpt-important-surface);
}
.assistant-message-unit[data-important="true"]::before{
  content:"";
  position:absolute;
  inset-block:2px;
  inset-inline-start:-10px;
  width:3px;
  border-radius:999px;
  background:var(--cgpt-important-rail);
  pointer-events:none;
}
.action-button[aria-pressed="true"] .p2p-important-icon{
  fill:currentColor;
}
.reply-quote{
  appearance:none;
  width:100%;
  color:var(--theme-content-secondary);
  text-align:start;
  background:transparent;
  border:0;
  border-inline-start:2px solid var(--theme-border-strong);
  margin:0 0 6px;
  padding:1px 0 1px 8px;
  font:inherit;
  font-size:12px;
  line-height:16px;
  cursor:pointer;
  overflow:hidden;
}
.reply-quote:hover{color:var(--theme-content-primary)}
.reply-quote-label{display:block;font-weight:600}
.reply-quote-text{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.message-turn[data-reference-flash="true"] .message-text{
  outline:2px solid var(--cgpt-important-rail);
  outline-offset:3px;
}
.reply-context{
  display:grid;
  grid-template-columns:minmax(0,1fr) 32px;
  align-items:center;
  gap:8px;
  margin:8px 10px 0;
  padding:7px 8px 7px 10px;
  border-inline-start:2px solid var(--cgpt-important-rail);
  border-radius:8px;
  background:var(--theme-surface-secondary);
  color:var(--theme-content-secondary);
}
.reply-context[hidden]{display:none}
.reply-context-copy{min-width:0}
.reply-context-label{display:block;color:var(--theme-content-primary);font-size:12px;font-weight:600;line-height:16px}
.reply-context-text{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;line-height:16px}
.reply-context-close{
  appearance:none;width:32px;height:32px;display:grid;place-items:center;
  color:var(--theme-content-secondary);background:transparent;border:0;border-radius:8px;cursor:pointer
}
.reply-context-close:hover{background:var(--theme-action-ghost-surface-hover);color:var(--theme-content-primary)}

.action-button{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:32px;
  height:32px;
  border-radius:8px;
  color:var(--text-secondary);
}
.action-button:hover{
  background:var(--surface-hover);
}
.action-button[aria-pressed="true"]{
  color:#ef4444;
}
.action-button svg{
  width:20px;
  height:20px;
}
@media (hover:none),(pointer:coarse){
  .action-button{
    width:40px;
    height:32px;
  }
}
@media (max-width:319px) and (hover:none),
       (max-width:319px) and (pointer:coarse){
  .action-button{
    width:36px;
  }
}

/* Equivalent purpose to ChatGPT's threadFooterContentFade class:
   messages may pass under the sticky composer, but visually fade below it. */
#thread-bottom-container.threadFooterContentFade::before{
  content:"";
  position:absolute;
  z-index:0;
  pointer-events:none;
  left:0;
  right:0;
  bottom:0;
  height:calc(100% + 56px);
  background:linear-gradient(
    to bottom,
    rgba(255,255,255,0) 0%,
    rgba(255,255,255,.72) 30%,
    rgba(255,255,255,.94) 54%,
    #fff 76%
  );
}





.thread-surface-source{
  background:var(--theme-surface-primary);
}
.header-surface-source{
  background:color-mix(in srgb, var(--theme-surface-primary) 95%, transparent);
}
.presence-source,
.history-status-source{
  color:var(--theme-content-tertiary);
}
.presence-source{
  font-size:.875rem;
  line-height:1.25rem;
}
.history-status-source{
  font-size:.75rem;
  line-height:1rem;
}

.composer-footer-control{
  width:36px;
  height:36px;
  min-width:36px;
  flex:0 0 36px;
  align-self:center;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  box-sizing:border-box;
  padding:0;
  line-height:0;
  vertical-align:middle;
}
.composer-footer-control svg{
  display:block;
  flex:none;
}

.send-button-source{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  border:1px solid transparent;
  border-radius:9999px;
  background:var(--button-primary-background-color-disabled);
  color:var(--button-primary-text-color);
  transition:
    background 120ms ease-out,
    opacity 120ms ease-out;
}
#composerShell[data-can-send="true"] .send-button-source{
  background:var(--button-primary-background-color-rest);
}
.send-button-source:disabled{
  cursor:default;
  opacity:1;
}
.send-button-source svg{
  transform-origin:50% 50%;
  transition:transform 120ms ease-out;
}
.send-button-source[data-arrow="right"] svg{
  transform:rotate(90deg);
}
.send-button-source[data-mode-toggle="true"]{
  cursor:pointer;
}
.composer-plus-source{
  width:36px;
  height:36px;
  min-width:36px;
  display:grid;
  place-items:center;
  padding:0;
  border:0;
  border-radius:9999px;
  background:transparent;
  color:var(--theme-content-primary);
  cursor:pointer;
  transition:background 120ms ease-out;
  anchor-name:--composer-add-action-anchor;
}
.composer-plus-source:hover,
#composer-plus-btn[data-state="open"]{
  background:var(--theme-action-ghost-surface-hover);
}
.composer-plus-source:focus-visible{
  outline:2px solid var(--focus-ring);
  outline-offset:2px;
}
.composer-action-menu-source{
  position:fixed;
  z-index:60;
  position-anchor:--composer-add-action-anchor;
  top:calc(anchor(bottom) + .25rem);
  right:auto;
  bottom:auto;
  left:calc(anchor(left) - .4375rem);
  position-try-fallbacks:flip-block;
  width:min(14rem,calc(100vw - 1.5rem));
  min-width:3.125rem;
  max-width:min(20rem,calc(100vw - .75rem));
  color:var(--theme-content-primary);
  background:transparent;
  border:0;
  border-radius:1.25rem;
  margin:0;
  padding:0;
  display:none;
}
.composer-action-menu-source::backdrop{
  background:transparent;
}
.composer-action-menu-source:popover-open,
.composer-action-menu-source[data-fallback-open="true"]{
  display:block;
}
.composer-action-menu-surface{
  border:1px solid var(--theme-border-default);
  border-radius:inherit;
  background:color-mix(in srgb, var(--theme-surface-primary) 94%, transparent);
  -webkit-backdrop-filter:blur(24px) saturate(1.2);
  backdrop-filter:blur(24px) saturate(1.2);
  display:grid;
  gap:.125rem;
  padding:.375rem;
  box-shadow:0 .5rem 2rem #0000001f;
}
.composer-action-menu-item{
  min-height:max(44px,2.875rem);
  width:100%;
  color:var(--theme-content-primary);
  cursor:pointer;
  font:inherit;
  text-align:start;
  border:0;
  border-radius:.875rem;
  background:transparent;
  display:grid;
  grid-template-columns:auto minmax(0,1fr) auto;
  align-items:center;
  gap:.625rem;
  padding:.25rem .625rem .25rem .25rem;
}
.composer-action-menu-item:hover{
  background:var(--theme-action-ghost-surface-hover);
}
.composer-action-menu-item:active{
  background:var(--theme-action-ghost-surface-pressed);
}
.composer-action-menu-icon{
  width:2.25rem;
  height:2.25rem;
  display:grid;
  place-items:center;
  border-radius:999px;
  background:color-mix(in srgb,var(--theme-content-primary) 6%,transparent);
}
.composer-action-menu-label{
  font-size:.9375rem;
  font-weight:400;
  line-height:1.25rem;
}
@media (hover:hover) and (pointer:fine){
  .composer-action-camera{display:none}
}
@media (width>=48rem){
  .composer-action-menu-source{
    width:13.75rem;
    border-radius:1rem;
  }
  .composer-action-menu-surface{
    border:0;
    -webkit-backdrop-filter:none;
    backdrop-filter:none;
    gap:0;
    padding:.375rem 0;
    box-shadow:
      0 .5rem .75rem #00000014,
      inset 0 0 1px #0000,
      0 0 1px #0000009e;
  }
  .composer-action-menu-item{
    min-height:max(44px,2.75rem);
    width:calc(100% - .75rem);
    margin-inline:.375rem;
    border-radius:.625rem;
    grid-template-columns:1.25rem minmax(0,1fr);
    gap:.375rem;
    padding:.375rem .625rem;
  }
  .composer-action-menu-icon{
    width:1.25rem;
    height:1.25rem;
    border-radius:0;
    background:transparent;
  }
  .composer-action-menu-label{
    font-size:.875rem;
    line-height:1.25rem;
  }
}


.composer-source-frame{
  /* V21.64: source-exact ChatGPT physical gap.
     Composer placement owns only the 24px thread component gap. */
  margin-bottom:var(--thread-component-gap,24px);
  padding-bottom:0;
}

.composer-shell-source{
  position:relative;
  display:grid;
  cursor:text;
  overflow:clip;
  border-radius:var(--component-conversation-composer-radius,var(--radius-2xl));
  border:1px solid var(--composer-border);
  background:var(--cgpt-composer-surface-primary);
  box-shadow:
    0 0 0 1px rgba(0,0,0,.04),
    0 2px 8px 0 rgba(0,0,0,.04),
    0 4px 40px 8px rgba(0,0,0,.025);
}
.composer-hint-source{
  min-width:0;
  flex:1;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  color:var(--theme-content-tertiary);
  font-family:var(--font-family-sans);
  font-size:.75rem;
  line-height:1rem;
}

.attachment-tray-media-strip{
  display:flex;
  flex-wrap:nowrap!important;
  overflow-x:auto;
  overflow-y:hidden;
  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}
.attachment-tray-media-strip::-webkit-scrollbar{display:none;}
#attachmentTray[data-layout="audio"]{
  display:block!important;
  overflow-x:hidden;
  overflow-y:visible;
}
#attachmentTray:empty{
  display:none;
}
.attachment-chip{
  display:inline-flex;
  max-width:100%;
  align-items:center;
  gap:6px;
  border:1px solid #e5e5e5;
  background:#f7f7f7;
  border-radius:12px;
  padding:6px 9px;
  font-size:12px;
  line-height:16px;
}

/* V21.70 — one audio surface at a time.
   RECORDING/PREVIEW/SENDING replace the normal text/footer UI instead of nesting inside it. */
#composerShell[data-audio-state="REQUESTING_PERMISSION"] #editorWrap,
#composerShell[data-audio-state="RECORDING"] #editorWrap,
#composerShell[data-audio-state="STOPPING"] #editorWrap,
#composerShell[data-audio-state="PREVIEW"] #editorWrap,
#composerShell[data-audio-state="SENDING"] #editorWrap,
#composerShell[data-audio-state="REQUESTING_PERMISSION"] #composerFooter,
#composerShell[data-audio-state="RECORDING"] #composerFooter,
#composerShell[data-audio-state="STOPPING"] #composerFooter,
#composerShell[data-audio-state="PREVIEW"] #composerFooter,
#composerShell[data-audio-state="SENDING"] #composerFooter{
  display:none!important;
}
#composerShell[data-audio-state="REQUESTING_PERMISSION"] #attachmentTray,
#composerShell[data-audio-state="RECORDING"] #attachmentTray,
#composerShell[data-audio-state="STOPPING"] #attachmentTray,
#composerShell[data-audio-state="PREVIEW"] #attachmentTray,
#composerShell[data-audio-state="SENDING"] #attachmentTray{
  display:block!important;
  padding:.625rem .75rem!important;
  overflow:visible!important;
}
.audio-recording-card,
.audio-preview-card{
  display:grid;
  grid-template-columns:2.5rem minmax(5rem,1fr) auto auto;
  align-items:center;
  gap:.625rem;
  width:100%;
  min-width:0;
  min-height:3.25rem;
  box-sizing:border-box;
  border:1px solid var(--composer-border);
  background:var(--cgpt-composer-surface-primary);
  border-radius:calc(var(--component-conversation-composer-radius,var(--radius-2xl)) - .5rem);
  padding:.45rem .55rem;
  contain:layout paint;
}
.audio-recording-indicator{
  display:grid;place-items:center;width:2.5rem;height:2.5rem;border-radius:999px;background:#fff1f0;
}
.audio-recording-dot{width:.75rem;height:.75rem;border-radius:999px;background:#ef4444;box-shadow:0 0 0 .3rem rgba(239,68,68,.12);animation:audio-recording-pulse 1.25s ease-in-out infinite;}
@keyframes audio-recording-pulse{50%{transform:scale(.8);opacity:.65;}}
.audio-recording-main,.audio-preview-main{display:flex;align-items:center;gap:.75rem;min-width:0;}
.audio-recording-waveform,.audio-preview-waveform{display:flex;align-items:center;gap:2px;height:1.75rem;min-width:4rem;overflow:hidden;flex:1;}
.audio-recording-waveform i,.audio-preview-waveform i{display:block;width:2px;min-width:2px;border-radius:999px;background:var(--theme-content-tertiary);opacity:.68;}
.audio-recording-waveform i:nth-child(-n+7){background:#ef4444;opacity:.9;}
.audio-recording-time,.audio-preview-duration,.audio-message-time{font:500 .75rem/1rem var(--font-family-sans);color:var(--theme-content-secondary);white-space:nowrap;}
.audio-recording-cancel,.audio-recording-stop,.audio-preview-cancel,.audio-preview-send{
  min-height:2.4rem;border:0;border-radius:999px;padding:0 .8rem;font:600 .75rem/1 var(--font-family-sans);white-space:nowrap;
}
.audio-recording-cancel,.audio-preview-cancel{background:transparent;color:var(--theme-content-secondary);}
.audio-recording-stop{background:#fee2e2;color:#dc2626;}
.audio-preview-send{background:var(--theme-content-primary);color:var(--theme-surface-primary);}
.audio-recording-stop:disabled,.audio-preview-send:disabled,.audio-preview-cancel:disabled{opacity:.45;cursor:default;}
.audio-preview-play{
  display:grid;place-items:center;width:2.5rem;height:2.5rem;border:0;border-radius:999px;
  background:var(--theme-content-primary);color:var(--theme-surface-primary);font-size:.85rem;
}
.audio-preview-card audio,.audio-message-card audio{display:none;}

/* V21.70 — audio visual hierarchy follows the existing grayscale chat language.
   Remote stays neutral/outlined; self uses the same subtle user-message surface. */
.audio-message-card{
  display:grid;
  grid-template-columns:2rem minmax(5.5rem,1fr) auto;
  align-items:center;
  gap:.5rem;
  width:min(17rem,68vw);
  max-width:100%;
  min-height:2.75rem;
  border:1px solid var(--composer-border);
  border-radius:14px;
  padding:.35rem .45rem;
  background:var(--theme-surface-primary);
  box-shadow:none;
}
.assistant-message-unit .audio-message-card{
  background:var(--theme-surface-primary);
  border-color:var(--composer-border);
}
.user-message-unit .audio-message-card{
  background:var(--main-surface-secondary);
  border-color:transparent;
}
.audio-message-play{
  display:grid;
  place-items:center;
  width:2rem;
  height:2rem;
  border:1px solid var(--composer-border);
  border-radius:999px;
  background:var(--theme-surface-primary);
  color:var(--theme-content-primary);
  font-size:.72rem;
  line-height:1;
}
.user-message-unit .audio-message-play{
  border-color:transparent;
  background:var(--theme-content-primary);
  color:var(--theme-surface-primary);
}
.audio-message-progress{
  position:relative;
  height:1.15rem;
  min-width:0;
  display:flex;
  align-items:center;
  cursor:pointer;
  touch-action:manipulation;
  border:0;
  background:transparent;
  padding:0;
}
.audio-message-progress::before{
  content:"";
  position:absolute;
  left:0;
  right:0;
  height:2px;
  border-radius:999px;
  background:var(--composer-border);
}
.audio-message-progress-fill{
  position:absolute;
  left:0;
  width:0;
  height:2px;
  border-radius:999px;
  background:var(--theme-content-secondary);
  pointer-events:none;
}
.audio-message-time{
  min-width:4.75rem;
  text-align:right;
  font:400 .6875rem/1rem var(--font-family-sans);
  color:var(--theme-content-tertiary);
  white-space:nowrap;
  font-variant-numeric:tabular-nums;
}
@media(max-width:480px){
  .audio-recording-card,.audio-preview-card{grid-template-columns:2.25rem minmax(4rem,1fr) auto auto;gap:.4rem;padding-inline:.45rem;}
  .audio-recording-cancel,.audio-recording-stop,.audio-preview-cancel,.audio-preview-send{padding-inline:.6rem;}
  .audio-message-card{width:min(16rem,76vw);grid-template-columns:1.9rem minmax(4.25rem,1fr) auto;gap:.42rem;padding:.32rem .42rem;}
  .audio-message-play{width:1.9rem;height:1.9rem;}
  .audio-message-time{min-width:4.4rem;font-size:.65625rem;}
}


/* V21.70.1 — generic file attachment card. Same durable media pipeline as image/audio. */
.file-message-card{
  display:grid;
  grid-template-columns:2rem minmax(0,1fr);
  align-items:center;
  gap:.55rem;
  width:min(18rem,72vw);
  max-width:100%;
  min-height:2.9rem;
  border:1px solid var(--composer-border);
  border-radius:14px;
  padding:.42rem .5rem;
  background:var(--theme-surface-primary);
  color:var(--theme-content-primary);
  text-align:left;
  cursor:pointer;
}
.user-message-unit .file-message-card{
  background:var(--main-surface-secondary);
  border-color:transparent;
}
.file-message-icon{
  display:grid;
  place-items:center;
  width:2rem;
  height:2rem;
  border-radius:10px;
  border:1px solid var(--composer-border);
  background:var(--theme-surface-primary);
  font:700 .56rem/1 var(--font-family-sans);
  letter-spacing:.02em;
}
.file-message-copy{display:grid;min-width:0;gap:.08rem;}
.file-message-name{
  display:block;
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font:600 .75rem/1rem var(--font-family-sans);
}
.file-message-meta{
  color:var(--theme-content-tertiary);
  font:400 .6875rem/1rem var(--font-family-sans);
  font-variant-numeric:tabular-nums;
}
@media(max-width:480px){
  .file-message-card{width:min(16rem,78vw);}

  function estimateTextLines(text,widthPx){
    const charsPerLine=Math.max(8,Math.floor((Number(widthPx)||320)/8.2));

    for(const part of logical){

  }

  function normalizedImageRatio(media){
    const raw=

        Number(media?.width)>0 && Number(media?.height)>0

  function estimateMessageHeight(message,widthPx=320){
    // widthPx is the INNER shared chat-content axis, not ScrollRoot width.
    // Message units are capped to 70% of that axis by the renderer.
    const width=Math.max(180,Number(widthPx)||320);

    const textLines=hasText?estimateTextLines(message?.text||'',Math.max(94,laneWidth-32)):0;

    // Keep the estimate close to DOM height so virtual spacers do not shrink
    // when a row becomes materialized.

    const media=message?.media||null;
    if(media){
      const mediaGap=hasText?8:0;
      if(media.type==='image'){
        const ratio=normalizedImageRatio(media);
        const desired=Math.max(150,Math.min(360,ratio*420));
        const mediaWidth=Math.min(laneWidth,desired);
        height+=mediaGap+Math.round(mediaWidth/ratio);
      }else if(media.type==='gallery'){
        const count=Math.max(1,Array.isArray(media.items)?media.items.length:1);
        const galleryRatio=count===2?1.7:count===3?1.32:1.2;
        const mediaWidth=Math.min(laneWidth,360);
        height+=mediaGap+Math.round(mediaWidth/galleryRatio);
      }else if(media.type==='file'){
        height+=mediaGap+(media.kind==='audio'?52:58);
      }else if(media.type==='audio'){
        height+=mediaGap+52;
      }
    }

    // Self turns own 12px top spacing; remote turns own 8px bottom spacing.
    // 12px is a safe common estimate and avoids the old +16 cache inflation.
    return Math.max(40,Math.ceil(height+12));
  }

  class DataWindowModel{
    constructor({maxDomMessages=120,overscan=20}={}){
      this.maxDomMessages=Math.max(20,Number(maxDomMessages)||120);
      this.overscan=Math.max(0,Number(overscan)||20);
    }

    compute({messages,anchorIndex=null,tailMode=false}){
      const list=Array.isArray(messages)?messages:[];
      const n=list.length;
      if(n<=this.maxDomMessages){
        return{start:0,end:n,items:list.slice()};
      }

      let start;
      let end;

      if(tailMode || anchorIndex===null || !Number.isFinite(Number(anchorIndex))){
        end=n;
        start=Math.max(0,end-this.maxDomMessages);
      }else{
        const anchor=Math.max(0,Math.min(n-1,Number(anchorIndex)));
        const before=Math.min(
          anchor,
          Math.floor(this.maxDomMessages*0.45)+this.overscan
        );
        start=Math.max(0,anchor-before);
        end=Math.min(n,start+this.maxDomMessages);
        start=Math.max(0,end-this.maxDomMessages);
      }

      return{
        start,
        end,
        items:list.slice(start,end)
      };
    }

    estimateSpacer(messages,start,end,widthPx,heightCache){
      let total=0;
      for(let i=start;i<end;i++){
        const m=messages[i];
        const cached=heightCache && heightCache.get(m.id);
        total+=Number(cached)||estimateMessageHeight(m,widthPx);
      }
      return Math.max(0,Math.round(total));
    }

    indexAtOffset(messages,offsetPx,widthPx,heightCache){
      const list=Array.isArray(messages)?messages:[];
      if(!list.length)return 0;

      let remaining=Math.max(0,Number(offsetPx)||0);

      for(let i=0;i<list.length;i++){
        const message=list[i];
        const cached=
          heightCache &&
          heightCache.get(message.id);

        const h=
          Number(cached) ||
          estimateMessageHeight(
            message,
            widthPx
          );

        if(remaining<h){
          return i;
        }

        remaining-=h;
      }

      return list.length-1;
    }
  }

  class HistoryLoader{
    constructor({thresholdPx=400,fetchOlder}={}){
      this.thresholdPx=Math.max(0,Number(thresholdPx)||400);
      this.fetchOlder=fetchOlder || (async()=>({messages:[],nextCursor:null}));
      this.pendingByCursor=new Map();
    }

    maybeLoadOlder({distanceToTop,cursor}={}){
      if(cursor===null || cursor===undefined){
        return Promise.resolve({messages:[],nextCursor:null,skipped:true});
      }

      if(Number(distanceToTop)>this.thresholdPx){
        return Promise.resolve({messages:[],nextCursor:cursor,skipped:true});
      }

      const key=String(cursor);
      if(this.pendingByCursor.has(key)){
        return this.pendingByCursor.get(key);
      }

      const promise=Promise.resolve()
        .then(()=>this.fetchOlder(cursor))
        .finally(()=>this.pendingByCursor.delete(key));

      this.pendingByCursor.set(key,promise);
      return promise;
    }
  }

  return{
    MESSAGE_KINDS,
    VIEWPORT_STATES,
    deriveMessageKind,
    createMessage,
    MessageStore,
    ConversationViewportModel,
    DataWindowModel,
    HistoryLoader,
    estimateMessageHeight
  };
});

        1,

        0,
        Math.round(Number(input.visualTop)||0)

        ?occlusion
        :0;
    }

(()=>{
'use strict';
const VERSION='V21.71';

function createRuntimeId(){
  const cryptoApi=globalThis.crypto||null;
  try{
    if(typeof cryptoApi?.randomUUID==='function'){
      const value=cryptoApi.randomUUID();
      if(value)return String(value);
    }
  }catch(_error){}

  try{
    if(typeof cryptoApi?.getRandomValues==='function'){
      const bytes=new Uint8Array(16);
      cryptoApi.getRandomValues(bytes);
      bytes[6]=(bytes[6]&0x0f)|0x40;
      bytes[8]=(bytes[8]&0x3f)|0x80;
      const hex=Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join('');
      return `${hex.slice(0,8)}-${hex.slice(8,12)}-${hex.slice(12,16)}-${hex.slice(16,20)}-${hex.slice(20)}`;
    }
  }catch(_error){}

  // Last-resort compatibility path for restricted/legacy webviews. Keep the
  // UUID v4 shape because device-key validation persists only UUID-shaped ids.
  // This is not a security token; it is only an app-local identity/idempotency
  // key when the browser exposes no usable cryptographic random source.
  const bytes=new Uint8Array(16);
  for(let index=0;index<bytes.length;index++)bytes[index]=Math.floor(Math.random()*256);
  bytes[6]=(bytes[6]&0x0f)|0x40;
  bytes[8]=(bytes[8]&0x3f)|0x80;
  const hex=Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join('');
  return `${hex.slice(0,8)}-${hex.slice(8,12)}-${hex.slice(12,16)}-${hex.slice(16,20)}-${hex.slice(20)}`;
}

window.V21RuntimeId=Object.freeze({version:VERSION,create:createRuntimeId});
})();

<script data-inlined-source="audio-capture-policy.js">
(()=>{
'use strict';

const RELEASE_VERSION='V21.72.23';
const MODULE_CONTRACT_VERSION='audio-capture-v1';
const DEVICE_KEY='taphoa.v21.audio.inputDeviceId';
const BASE=Object.freeze({
  echoCancellation:true,
  noiseSuppression:true,
  autoGainControl:true,
  channelCount:1
});

let activeStream=null;
let activeOwner='';
let externalOwner='';
let preferredDeviceIdValue=readPreferredDeviceId();
let inputDevices=[];
let refreshPromise=null;

function mediaDevices(){return navigator.mediaDevices||null;}
function readPreferredDeviceId(){
  try{return String(localStorage.getItem(DEVICE_KEY)||'');}catch{return'';}
}
function persistPreferredDeviceId(value){
  preferredDeviceIdValue=String(value||'');
  try{
    if(preferredDeviceIdValue)localStorage.setItem(DEVICE_KEY,preferredDeviceIdValue);
    else localStorage.removeItem(DEVICE_KEY);
  }catch{}
}
function emit(reason,detail={}){
  try{
    document.dispatchEvent(new CustomEvent('v21-audio-capture-state',{
      detail:{...snapshot(),reason:String(reason||'change'),...detail}
    }));
  }catch{}
}
function constraints({pinDevice=true}={}){
  const audio={...BASE};
  if(pinDevice&&preferredDeviceIdValue)audio.deviceId={exact:preferredDeviceIdValue};
  return audio;
}
function liveKitOptions(){
  const options={...BASE};
  if(preferredDeviceIdValue)options.deviceId=preferredDeviceIdValue;
  return options;
}
function tracks(stream){
  return Array.from(stream?.getAudioTracks?.()||stream?.getTracks?.()||[])
    .filter(track=>track?.kind==='audio'||typeof track?.kind==='undefined');
}
function stopStream(stream){
  for(const track of Array.from(stream?.getTracks?.()||[])){
    try{track.stop?.();}catch{}
  }
}
function rememberTrackDevice(track){
  const id=String(track?.getSettings?.()?.deviceId||'');
  if(id&&id!==preferredDeviceIdValue){
    persistPreferredDeviceId(id);
    emit('device-pinned',{deviceId:id});
  }
}
function isPinnedDeviceFailure(error){
  const name=String(error?.name||'');
  return ['OverconstrainedError','NotFoundError','DevicesNotFoundError'].includes(name);
}
function normalizeSingleTrack(stream){
  const audioTracks=tracks(stream).filter(track=>track?.readyState!=='ended');
  if(!audioTracks.length){
    stopStream(stream);
    throw new Error('microphone_not_ready');
  }
  const primary=audioTracks[0];
  for(const duplicate of audioTracks.slice(1)){
    try{duplicate.stop?.();}catch{}
  }
  return primary;
}
async function acquire({owner,purpose='default'}={}){
  const captureOwner=String(owner||'').trim();
  if(!captureOwner)throw new Error('audio_capture_owner_required');
  if(activeStream){
    if(activeOwner===captureOwner)return activeStream;
    throw new Error('audio_capture_busy');
  }
  if(externalOwner)throw new Error('audio_capture_busy');
  const devices=mediaDevices();
  if(!devices?.getUserMedia)throw new Error('microphone_unavailable');

  let stream=null;
  try{
    try{
      stream=await devices.getUserMedia({audio:constraints({pinDevice:true})});
    }catch(error){
      if(!preferredDeviceIdValue||!isPinnedDeviceFailure(error))throw error;
      persistPreferredDeviceId('');
      emit('pinned-device-unavailable');
      stream=await devices.getUserMedia({audio:constraints({pinDevice:false})});
    }

    if(activeStream||externalOwner){
      stopStream(stream);
      throw new Error('audio_capture_busy');
    }
    const primary=normalizeSingleTrack(stream);
    activeStream=stream;
    activeOwner=captureOwner;
    rememberTrackDevice(primary);
    try{
      primary.addEventListener?.('ended',()=>{
        if(activeStream!==stream)return;
        activeStream=null;
        activeOwner='';
        emit('track-ended',{purpose:String(purpose||'default')});
      },{once:true});
    }catch{}
    emit('acquired',{purpose:String(purpose||'default')});
    return stream;
  }catch(error){
    if(stream&&stream!==activeStream)stopStream(stream);
    throw error;
  }
}
function release(stream,{owner=''}={}){
  if(!stream)return false;
  const expectedOwner=String(owner||'');
  if(stream===activeStream&&expectedOwner&&expectedOwner!==activeOwner)return false;
  stopStream(stream);
  if(stream===activeStream){
    const releasedOwner=activeOwner;
    activeStream=null;
    activeOwner='';
    emit('released',{owner:releasedOwner});
  }
  return true;
}
function claimExternal({owner}={}){
  const value=String(owner||'').trim();
  if(!value)return false;
  if(activeStream)return false;
  if(externalOwner&&externalOwner!==value)return false;
  externalOwner=value;
  emit('external-claimed');
  return true;
}
function releaseExternal({owner}={}){
  const value=String(owner||'').trim();
  if(!externalOwner)return false;
  if(value&&value!==externalOwner)return false;
  const releasedOwner=externalOwner;
  externalOwner='';
  emit('external-released',{owner:releasedOwner});
  return true;
}
async function refreshDevices(){
  if(refreshPromise)return refreshPromise;
  const devices=mediaDevices();
  if(!devices?.enumerateDevices)return[];
  refreshPromise=(async()=>{
    const all=await devices.enumerateDevices();
    inputDevices=Array.from(all||[]).filter(device=>device?.kind==='audioinput');
    const knownDeviceIds=inputDevices
      .map(device=>String(device.deviceId||''))
      .filter(Boolean);
    if(
      preferredDeviceIdValue &&
      knownDeviceIds.length>0 &&
      !knownDeviceIds.includes(preferredDeviceIdValue)
    ){
      persistPreferredDeviceId('');
      emit('preferred-device-removed');
    }else{
      emit('devices-refreshed');
    }
    return inputDevices.map(device=>({
      deviceId:String(device.deviceId||''),
      label:String(device.label||''),
      groupId:String(device.groupId||'')
    }));
  })().finally(()=>{refreshPromise=null;});
  return refreshPromise;
}
function preferredDeviceId(){return preferredDeviceIdValue;}
function snapshot(){
  return{
    version:RELEASE_VERSION,
    moduleContractVersion:MODULE_CONTRACT_VERSION,
    owner:activeOwner||externalOwner||null,
    mode:activeStream?'stream':(externalOwner?'external':'idle'),
    preferredDeviceId:preferredDeviceIdValue||null,
    inputCount:inputDevices.length,
    mixing:false,
    echoCancellation:true,
    noiseSuppression:true,
    autoGainControl:true,
    channelCount:1
  };
}

try{
  mediaDevices()?.addEventListener?.('devicechange',()=>{
    void refreshDevices().catch(()=>{});
  });
}catch{}
void refreshDevices().catch(()=>{});

window.V21AudioCapturePolicy=Object.freeze({
  version:RELEASE_VERSION,
  moduleContractVersion:MODULE_CONTRACT_VERSION,
  constraints,
  liveKitOptions,
  acquire,
  release,
  claimExternal,
  releaseExternal,
  refreshDevices,
  preferredDeviceId,
  active:snapshot
});
})();

<script data-inlined-source="app.js">

(()=>{
'use strict';

const {
  deriveMessageKind,
  VIEWPORT_STATES,
  createMessage,
  MessageStore,

  estimateMessageHeight
}=window.ChatConversationCore;

const {
  KeyboardInsetModel
}=window.ChatKeyboardInsetCore;

const ChatGPTRef=window.ChatGPTVisualReference;
const P2PRef=window.P2PVisualReference;
const MESSAGE_FEATURES=Object.freeze({

  important:false
});

const stageLayout=document.getElementById('stageLayout');
const scrollRoot=document.getElementById('scrollRoot');
const messageWindow=document.getElementById('messageWindow');
const topSpacer=document.getElementById('topSpacer');
const bottomSpacer=document.getElementById('bottomSpacer');

const uploadCameraInput=document.getElementById('upload-camera');
const uploadIOSSourceInput=document.getElementById('upload-ios-source');
const uploadInput=document.getElementById('upload-files');
const attachmentTray=document.getElementById('attachmentTray');
const composerHint=document.getElementById('composerHint');

const globalOverlayRoot=document.getElementById('globalOverlayRoot');

function audioCapturePolicy(){return window.V21AudioCapturePolicy||null;}

const InteractionMode=Object.freeze({
  NONE:'NONE',
  IMAGE_VIEWER:'IMAGE_VIEWER',
  PROFILE_MODAL:'PROFILE_MODAL',
  DUPLICATE_WARNING:'DUPLICATE_WARNING',
  AUDIO_RECORDING:'AUDIO_RECORDING',
  VIDEO_RECORDING:'VIDEO_RECORDING',
  CALL_RINGING:'CALL_RINGING',
  CALL_CONNECTING:'CALL_CONNECTING',
  AUDIO_CALL:'AUDIO_CALL',
  VIDEO_CALL:'VIDEO_CALL'
});

const InteractionController=(()=>{
  let mode=InteractionMode.NONE;
  let owner='';
  let generation=0;
  let locksBaseUi=false;
  let priorBaseUiState=null;

  function snapshot(){
    return{mode,owner,generation,locksBaseUi};
  }

  function publish(reason){
    document.dispatchEvent(new CustomEvent('v21-interaction-mode',{
      detail:{...snapshot(),reason:String(reason||'change')}
    }));
  }

  function setBaseUiLocked(locked){
    if(!screenHost)return;
    if(locked){
      if(priorBaseUiState)return;
      priorBaseUiState={
        inert:screenHost.hasAttribute('inert'),
        ariaHidden:screenHost.getAttribute('aria-hidden')
      };
      screenHost.setAttribute('inert','');
      screenHost.setAttribute('aria-hidden','true');
      screenHost.dataset.interactionLocked='true';
      return;
    }
    if(!priorBaseUiState){
      delete screenHost.dataset.interactionLocked;
      return;

    if(!target||target===InteractionMode.NONE)return false;
    return mode===InteractionMode.NONE||mode===target;

    const target=String(next||'');
    const nextOwnerValue=String(nextOwner||target||'interaction');
    if(!canEnter(target))return null;
    if(mode===target){

    if(expectedOwner&&owner!==String(expectedOwner))return null;

    if(!locksBaseUi&&nextLockBaseUi)setBaseUiLocked(true);
    mode=target;
    locksBaseUi=Boolean(nextLockBaseUi);
    generation+=1;
    publish('transition');
    return snapshot();
  }

    const expectedMode=String(expected||'');
    if(mode===InteractionMode.NONE)return false;
    if(expectedMode&&mode!==expectedMode)return false;
    if(expectedOwner&&owner!==String(expectedOwner))return false;

    owner='';

    generation+=1;

    return true;
  }

    return Boolean(
      lease &&
      lease.mode===mode &&
      lease.owner===owner &&

  function forceReset(reason='global-abort'){
    const previous=snapshot();
    document.dispatchEvent(new CustomEvent('v21-interaction-abort',{
      detail:{reason:String(reason||'global-abort'),previous}

    owner='';
    locksBaseUi=false;
    generation+=1;
    publish(reason);

  }

  return Object.freeze({
    snapshot,
    canEnter,
    enter,
    transition,
    exit,
    isLeaseCurrent,
    forceReset

})();

window.V21InteractionMode=InteractionMode;
window.V21InteractionController=InteractionController;

const COMPOSER_SEND_MODE_KEY='taphoa.chat.v21.composerSendMode';
let composerSendMode=readComposerSendMode();

function readComposerSendMode(){

    return localStorage.getItem(COMPOSER_SEND_MODE_KEY)==='enter'
      ?'enter'

  }catch(_error){
    return 'button';
  }

function persistComposerSendMode(){

    localStorage.setItem(COMPOSER_SEND_MODE_KEY,composerSendMode);
  }catch(_error){
    // Preference persistence is optional; composer behavior remains usable.
  }
}

function composerModeHint(){
  return composerSendMode==='enter'
    ?'Return gửi · Shift+Return xuống dòng'
    :'Return xuống dòng · Return lần 2 gửi';
}

function isSmartBlankLineState(
  value,
  selectionStart,
  selectionEnd,
  mode
){
  if(mode!=='button')return false;
  if(
    selectionStart!==selectionEnd ||
    selectionStart!==value.length
  )return false;

  const before=String(value||'')
    .slice(0,selectionStart)
    .replace(/\r\n/g,'\n');
  const lastBreak=before.lastIndexOf('\n');
  if(lastBreak<0)return false;

  const currentLine=before.slice(lastBreak+1);
  const contentBefore=before.slice(0,lastBreak);
  return (
    currentLine.trim()==='' &&
    contentBefore.trim().length>0
  );
}

function shouldSmartSendOnBlankLine(){
  return isSmartBlankLineState(
    editor.value,
    editor.selectionStart,
    editor.selectionEnd,
    composerSendMode
  );
}

function composerEnterAction({
  mode=composerSendMode,
  shiftKey=false,
  value=editor.value,
  selectionStart=editor.selectionStart,
  selectionEnd=editor.selectionEnd
}={}){
  if(shiftKey)return 'newline';
  if(mode==='enter')return 'send';
  return isSmartBlankLineState(value,selectionStart,selectionEnd,mode)
    ?'send'
    :'newline';
}

function renderComposerModeHint(){
  if(mediaRecorder&&mediaRecorder.state==='recording')return;
  if(audioWorkflowState==='REQUESTING_PERMISSION'){composerHint.textContent='Đang mở micro…';return;}

function showComposerMediaError(detail={}){

document.addEventListener('v21-media-outbox-error',event=>{
  const detail=event?.detail||{};
  const scope=currentComposerScope();
  if(detail?.conversationId&&String(detail.conversationId)!==String(scope.conversationId||''))return;
  // Outbox failure belongs to the queued message bubble after Composer commit.
  // Only surface it inside Composer if the exact failed asset is still owned by
  // the visible draft. This prevents an old audio failure from leaking into a
  // later image/file draft (e.g. "Ghi âm chưa gửi · 400" while sending an image).
  const failedIds=new Set((Array.isArray(detail?.assetIds)?detail.assetIds:[])
    .map(value=>String(value||'')).filter(Boolean));
  const owned=pendingAttachments.find(item=>failedIds.has(String(item?.assetId||'')))||null;
  if(!owned)return;
  const label=owned.kind==='audio'?'Ghi âm chưa gửi':(owned.kind==='image'?'Ảnh chưa gửi':'Tệp chưa gửi');
  detail.label=label;
  showComposerMediaError(detail);

function committedMediaAssetIds(detail={}){
  return Array.from(new Set(
    (Array.isArray(detail?.assetIds)?detail.assetIds:[])
      .map(value=>String(value||''))
      .filter(Boolean)
  ));
}

function mediaAttachmentMatchesCommittedScope(item,{assetIds,accountId='',conversationId=''}={}){
  const id=String(item?.assetId||'');
  if(!id||!assetIds?.has?.(id))return false;
  if(accountId&&String(item?.accountId||'')!==String(accountId))return false;
  if(conversationId&&String(item?.conversationId||'')!==String(conversationId))return false;
  return true;
}

function consumeCommittedMediaFromComposer(detail={}){
  const ids=committedMediaAssetIds(detail);
  if(!ids.length)return false;
  const assetIds=new Set(ids);
  const accountId=String(detail?.accountId||'');
  const conversationId=String(detail?.conversationId||'');
  const removedVisible=[];
  pendingAttachments=pendingAttachments.filter(item=>{
    const matched=mediaAttachmentMatchesCommittedScope(item,{assetIds,accountId,conversationId});
    if(matched)removedVisible.push(item);
    return !matched;
  });

  for(const [key,draft] of Array.from(ComposerDraftOwner.drafts.entries())){
    if(accountId&&!String(key).startsWith(`${accountId}::`))continue;
    const nextAttachments=(draft?.attachments||[]).filter(item=>
      !mediaAttachmentMatchesCommittedScope(item,{assetIds,accountId,conversationId})
    );
    if(nextAttachments.length===(draft?.attachments||[]).length)continue;
    const next={...draft,attachments:nextAttachments};
    if(ComposerDraftOwner.isEmpty(next))ComposerDraftOwner.drafts.delete(key);
    else ComposerDraftOwner.drafts.set(key,next);
  }

  if(!removedVisible.length)return false;
  promoteSentMediaPreviewOwnership(removedVisible);
  if(editor.value||pendingAttachments.length||replyTarget)ComposerDraftOwner.saveCurrent();
  else ComposerDraftOwner.commitEmptyCurrent();
  renderAttachmentTray();
  if(!pendingAttachments.some(item=>item?.kind==='audio')&&!(mediaRecorder&&mediaRecorder.state!=='inactive')){
    setAudioWorkflowState('IDLE');
  }else{
    syncSendButtonState();
    renderComposerModeHint();
  }
  return true;
}

function runtimeErrorMessage(error){
  if(error instanceof Error)return `${error.name}: ${error.message}`;
  if(error&&typeof error==='object'){
    const named=String(error.message||error.error_description||error.details||error.hint||error.code||'').trim();
    if(named)return named;
    try{return JSON.stringify(error); }catch(_error){return Object.prototype.toString.call(error);}
  }
  return String(error);
}

function isOwnedRuntimeErrorEvent(event){
  const message=String(event?.message||'').trim();
  const filename=String(event?.filename||'').trim();

  // Safari/file:// and browser extensions can surface an opaque cross-origin
  // ErrorEvent as exactly "Script error." with no usable Error object.
  // Browser/platform/external scripts are outside ChatScreen ownership, so do
  // not convert that opaque event into an application ERROR banner.
  if(!event?.error&&(message==='Script error.'||message==='Script error')){
    console.warn('[ChatScreenModule] ignored opaque external Script error.',event);
    return false;
  }

  // If the browser gives us a filename, only claim errors from the current
  // document/origin. This prevents CDN/extension failures being mislabeled as
  // Chat runtime failures while still preserving first-party app errors.
  if(filename){
    try{
      const eventUrl=new URL(filename,location.href);
      if(location.protocol==='file:')return eventUrl.protocol==='file:';
      return eventUrl.origin===location.origin;
    }catch(_error){
      return true;
    }
  }

  return true;
}

/* =========================================================

const KeyboardInsetAdapter={
  thresholdPx:80,

  keyboardVisualGap(){
    return Math.max(0,Number(RuntimeProfile.keyboardVisualGapPx)||0);
  },

  supportsSoftwareKeyboardPlacement(){
    return Boolean(
      Number(window.navigator.maxTouchPoints||0)>0 ||
      window.matchMedia?.('(pointer:coarse)').matches ||
      /iPhone|iPad|iPod|Android/i.test(window.navigator.userAgent||'')
    );
  },
  layoutBottom:Math.round(
    svhProbe.getBoundingClientRect().height || innerHeight
  ),
  restingVisualHeight:Math.round(
    vv?.height || innerHeight
  ),
  current:0,
  open:false,

  read(){
    const focused=document.activeElement===editor;

    if(!vv){
      return{
        focused,
        visualTop:0,
        visualHeight:innerHeight,
        visualBottom:innerHeight,
        occlusion:0
      };
    }

    const visualTop=Math.max(
      0,
      Math.round(vv.offsetTop||0)
    );
    const visualHeight=Math.max(
      1,
      Math.round(vv.height)
    );
    const visualBottom=visualTop+visualHeight;

    if(!focused){
      this.restingVisualHeight=Math.max(
        this.restingVisualHeight,
        visualHeight
      );
    }

    const heightDrop=Math.max(
      0,
      this.restingVisualHeight-visualHeight
    );
    const layoutOcclusion=Math.max(
      0,
      this.layoutBottom-visualBottom
    );

    return{
      focused,
      visualTop,
      visualHeight,
      visualBottom,
      occlusion:Math.max(
        heightDrop,
        layoutOcclusion
      )
    };
  },

  placeOnVisualViewport(state){
    const firstHeight=Math.max(
      1,
      Math.ceil(
        bottomContainer.getBoundingClientRect().height
      )
    );

    scrollRoot.style.setProperty(
      '--composer-flow-reserve',
      `${firstHeight}px`
    );
    stageLayout.style.setProperty(
      '--composer-visual-top',
      `${Math.max(
        state.visualTop,
        state.visualBottom-
        firstHeight-
        this.keyboardVisualGap()
      )}px`
    );
    scrollRoot.dataset.composerPlacement='visual-viewport';
    stageLayout.dataset.composerPlacement='visual-viewport';

    requestAnimationFrame(()=>{
      if(
        stageLayout.dataset.composerPlacement!=='visual-viewport' ||
        !vv
      )return;

      const actualHeight=Math.max(
        1,
        Math.ceil(
          bottomContainer.getBoundingClientRect().height
        )
      );
      const visualTop=Math.max(
        0,
        Math.round(vv.offsetTop||0)
      );
      const visualBottom=
        visualTop+
        Math.max(1,Math.round(vv.height));

      scrollRoot.style.setProperty(
        '--composer-flow-reserve',
        `${actualHeight}px`
      );
      stageLayout.style.setProperty(
        '--composer-visual-top',
        `${Math.max(
          visualTop,
          visualBottom-
          actualHeight-
          this.keyboardVisualGap()
        )}px`
      );

      publishComposerHeight();
    });
  },

  restoreStickyPlacement(){
    scrollRoot.dataset.composerPlacement='sticky';
    stageLayout.dataset.composerPlacement='sticky';
    stageLayout.style.removeProperty('--composer-visual-top');
  },

  update(){
    const state=this.read();
    const keyboardOpen=
      Boolean(vv) &&
      this.supportsSoftwareKeyboardPlacement() &&
      state.focused &&
      state.occlusion>=this.thresholdPx;

    this.open=keyboardOpen;
    scrollRoot.dataset.keyboardOpen=String(keyboardOpen);
    stageLayout.dataset.keyboardOpen=String(keyboardOpen);

    const next=keyboardOpen
      ?Math.max(0,Math.round(state.occlusion))
      :0;

    this.current=next;
    scrollRoot.style.setProperty(
      '--screen-keyboard-height',
      `${next}px`
    );

    if(keyboardOpen){
      this.placeOnVisualViewport(state);
    }else{
      this.restoreStickyPlacement();
    }
  },

  onOrientation(){
    requestAnimationFrame(()=>{
      this.layoutBottom=Math.round(
        svhProbe.getBoundingClientRect().height ||
        innerHeight
      );
      if(!this.open){
        this.restingVisualHeight=Math.round(
          vv?.height || innerHeight
        );
      }
      this.update();
    });
  }
};

const P2P_TAIL_RUNWAY_PX=0;

function publishTailRunway(){
  /*
    ChatGPT keeps a large AI-response runway because a new assistant turn
    is expected to stream below the user prompt. This app is P2P, so that
    runway would incorrectly pull every new chat line to the top.
    Keep the structural sentinel but no artificial blank tail.
  */
  tailRunway.style.setProperty(
    '--gutter-remaining-height',

function publishComposerHeight(){
  const h=Math.ceil(
    bottomContainer.getBoundingClientRect().height
  );
  const safeHeight=Math.max(0,h);
  const keyboardReserve=KeyboardInsetAdapter.open
    ?Math.max(0,Number(KeyboardInsetAdapter.current)||0)
    :0;
  const totalReserve=safeHeight+keyboardReserve;
  const reserveValue=`${totalReserve}px`;

  // ScrollRoot receives only an inert obstruction reserve. It does not receive
  // Composer input/focus events and does not move while the user is typing.
  const previousReserve=scrollRoot.style.getPropertyValue('--composer-flow-reserve').trim();
  if(previousReserve!==reserveValue){
    scrollRoot.style.setProperty('--composer-flow-reserve',reserveValue);
    // Obstruction geometry changed (Composer growth/shrink or keyboard inset).
    // Preserve the logical tail only when Scroll policy is already FOLLOW_TAIL.
    // USER_AWAY is never pulled back by Composer/keyboard geometry.
    publishViewportGeometryChange('composer-obstruction');
  }

  if(stageLayout.dataset.composerPlacement==='visual-viewport'&&vv){
    const visualTop=Math.max(0,Math.round(vv.offsetTop||0));
    const visualBottom=visualTop+Math.max(1,Math.round(vv.height));
    stageLayout.style.setProperty(
      '--composer-visual-top',
      `${Math.max(
        visualTop,
        visualBottom-safeHeight-KeyboardInsetAdapter.keyboardVisualGap()
      )}px`
    );
  }

  publishTailRunway();
}

function composerFlowReservePx(){

function distanceFromTail(){
  // Composer/keyboard reserve is geometry only, not conversation content.
  // Growing the input must not make the user "away from tail".
  return Math.max(
    0,
    scrollRoot.scrollHeight-
    composerFlowReservePx()-
    scrollRoot.scrollTop-
    scrollRoot.clientHeight

function messageLayoutWidthPx(){
  // Virtual-window estimates must use the same horizontal geometry owner as
  // Header / messages / Composer. Using the full ScrollRoot width on desktop
  // makes offscreen spacer estimates disagree with the actually rendered
  // 48rem content axis and causes shrink/jump when rows are materialized.
  const axis=regionTop?.querySelector?.('.chat-content-axis')||null;
  if(!axis)return Math.max(180,scrollRoot.clientWidth-24);
  const rect=axis.getBoundingClientRect();
  const style=getComputedStyle(axis);
  const padding=(parseFloat(style.paddingLeft)||0)+(parseFloat(style.paddingRight)||0);
  return Math.max(180,Math.round(rect.width-padding));
}

  pendingTailFrame=0;
  pendingTailReason='';
  if(pendingGeometryTailFrame)cancelAnimationFrame(pendingGeometryTailFrame);
  pendingGeometryTailFrame=0;
  pendingGeometryTailReasons.clear();
  if(pendingInteractionAnchorFrame)cancelAnimationFrame(pendingInteractionAnchorFrame);
  pendingInteractionAnchorFrame=0;
  interactionGeometryAnchor=null;
  interactionAnchorGeneration+=1;
}

function beginConversationViewContext(){
  // Conversation Root invalidates every async scroll/window transaction owned by
  // the previous contact before a new store/view is mounted. Old A callbacks may
  // never write into contact B's shared ScrollRoot.
  conversationViewEpoch+=1;
  cancelPendingTailTransaction();
  if(windowRebaseFrame)cancelAnimationFrame(windowRebaseFrame);
  windowRebaseFrame=0;
  loadingOlder=false;
  historyStatus.classList.add('hidden');
  clearUserScrollIntentForExplicitTail();
  programmaticScroll=false;
  lastUserScrollTop=scrollRoot.scrollTop;
  return conversationViewEpoch;
}

function cancelTailRevealOnly(){
  pendingTailToken+=1;
  if(pendingTailFrame)cancelAnimationFrame(pendingTailFrame);
  pendingTailFrame=0;
  pendingTailReason='';
  if(pendingGeometryTailFrame)cancelAnimationFrame(pendingGeometryTailFrame);
  pendingGeometryTailFrame=0;
  pendingGeometryTailReasons.clear();
  tailRevealTargetMessageId='';
}

function claimTailIntent(reason='explicit',{messageId=undefined}={}){
  // ChatViewportPolicy: TAIL and INTERACTION_ANCHOR are mutually exclusive.
  // FOLLOW_TAIL wins because its transaction already owns the viewport. A
  // messageId, when supplied, is part of the same TAIL transaction rather than
  // a second competing anchor transaction.
  clearInteractionGeometryAnchor();
  clearUserScrollIntentForExplicitTail();
  viewport.returnToTail();
  if(messageId!==undefined)tailRevealTargetMessageId=String(messageId||'');
  pendingTailReason=String(reason||'explicit');
  updateScrollFromEndControl();
}

function tailGeometrySignature(){
  return[
    scrollRoot.scrollHeight,
    scrollRoot.clientHeight,
    bottomContainer?.getBoundingClientRect?.().height||0,
    composerFlowReservePx(),
    scrollRoot.dataset.composerPlacement||'sticky',
    KeyboardInsetAdapter?.open?'keyboard-open':'keyboard-closed'
  ].map(value=>String(Math.round(Number(value))||value)).join('|');
}

function messageTurnById(messageId){
  const target=String(messageId||'');
  if(!target)return null;
  for(const node of messageWindow.querySelectorAll('.message-turn[data-id]')){
    if(String(node.dataset.id||'')===target)return node;
  }
  return null;
}

function interactionAnchorVisibleBottomPx(){
  const rootRect=scrollRoot.getBoundingClientRect();
  let bottom=rootRect.bottom;
  if(vv){
    const visualBottom=Math.max(0,Number(vv.offsetTop)||0)+Math.max(1,Number(vv.height)||0);
    bottom=Math.min(bottom,visualBottom);
  }
  const composerRect=composerShell?.getBoundingClientRect?.();
  if(composerRect&&composerRect.top>rootRect.top&&composerRect.top<bottom){
    bottom=composerRect.top;
  }
  return Math.max(rootRect.top+24,bottom-12);
}

function clearInteractionGeometryAnchor(kind=''){
  if(kind&&interactionGeometryAnchor?.kind!==kind)return false;
  interactionGeometryAnchor=null;
  interactionAnchorGeneration+=1;
  if(pendingInteractionAnchorFrame)cancelAnimationFrame(pendingInteractionAnchorFrame);
  pendingInteractionAnchorFrame=0;
  return true;
}

function interactionAnchorGeometrySignature(anchor,node){
  const rect=node?.getBoundingClientRect?.()||{bottom:0};
  return[
    anchor?.messageId||'',
    rect.bottom||0,
    interactionAnchorVisibleBottomPx(),
    composerShell?.getBoundingClientRect?.().height||0,
    scrollRoot.dataset.composerPlacement||'sticky',
    KeyboardInsetAdapter?.open?'keyboard-open':'keyboard-closed'
  ].map(value=>String(Math.round(Number(value))||value)).join('|');
}

function setInteractionGeometryAnchor(messageId,{kind='interaction'}={}){
  const id=String(messageId||'');
  if(!id)return false;
  // FOLLOW_TAIL has higher priority. Reply/interaction anchors are only for a
  // USER_AWAY viewport; own-send uses the TAIL transaction's target message.
  if(viewport.mode===VIEWPORT_STATES.FOLLOW_TAIL){
    clearInteractionGeometryAnchor();
    return false;
  }
  cancelTailRevealOnly();
  interactionGeometryAnchor={
    messageId:id,
    kind:String(kind||'interaction'),
    generation:++interactionAnchorGeneration,
    stableFrames:0,
    previousSignature:'',
    attempts:0
  };
  scheduleInteractionAnchorGeometryReconcile(`${kind}:set`);
  return true;
}

function reconcileInteractionGeometryAnchor(reason='interaction-anchor'){
  const anchor=interactionGeometryAnchor;
  if(!anchor)return false;
  const node=messageTurnById(anchor.messageId);
  if(!node||!node.isConnected){
    clearInteractionGeometryAnchor(anchor.kind);
    return false;
  }
  const rect=node.getBoundingClientRect();
  const visibleBottom=interactionAnchorVisibleBottomPx();
  const delta=Math.ceil(rect.bottom-visibleBottom);
  if(delta>1){
    // ScrollRoot remains the only writer. USER_AWAY stays USER_AWAY and only
    // the minimum delta needed to keep the chosen message above Composer moves.
    setScrollTop(scrollRoot.scrollTop+delta);
  }
  const signature=interactionAnchorGeometrySignature(anchor,node);
  anchor.attempts+=1;
  anchor.stableFrames=(delta<=1&&signature===anchor.previousSignature)?anchor.stableFrames+1:0;
  anchor.previousSignature=signature;
  if(anchor.stableFrames>=2||anchor.attempts>=30){
    clearInteractionGeometryAnchor(anchor.kind);
    return true;
  }
  return true;
}

function scheduleInteractionAnchorGeometryReconcile(reason='interaction-anchor'){
  if(!interactionGeometryAnchor||viewport.mode===VIEWPORT_STATES.FOLLOW_TAIL)return false;
  if(pendingInteractionAnchorFrame)return true;
  const viewEpoch=conversationViewEpoch;
  const generation=interactionGeometryAnchor.generation;
  pendingInteractionAnchorFrame=requestAnimationFrame(()=>{
    pendingInteractionAnchorFrame=0;
    if(viewEpoch!==conversationViewEpoch)return;
    if(!interactionGeometryAnchor||interactionGeometryAnchor.generation!==generation)return;
    reconcileInteractionGeometryAnchor(reason);
    if(interactionGeometryAnchor&&interactionGeometryAnchor.generation===generation){
      scheduleInteractionAnchorGeometryReconcile(`${reason}:settle`);
    }
  });
  return true;
}

function publishViewportGeometryChange(reason='geometry'){
  // One policy decision per geometry event. TAIL and ANCHOR never both react to
  // the same resize/load/keyboard frame.
  if(viewport.mode===VIEWPORT_STATES.FOLLOW_TAIL){
    return scheduleFollowTailGeometryReconcile(reason);
  }
  if(interactionGeometryAnchor){
    return scheduleInteractionAnchorGeometryReconcile(reason);
  }
  return false;
}

function scheduleFollowTailGeometryReconcile(reason='geometry'){
  // Geometry observers publish intent only. ScrollRoot/scrollToTail remains the
  // sole programmatic scroll writer. This covers late image decode, file-meta
  // wrapping, audio hydration and Composer/keyboard obstruction changes.
  if(viewport.mode!==VIEWPORT_STATES.FOLLOW_TAIL)return false;
  pendingGeometryTailReasons.add(String(reason||'geometry'));
  if(pendingGeometryTailFrame)return true;
  const viewEpoch=conversationViewEpoch;
  pendingGeometryTailFrame=requestAnimationFrame(()=>{
    pendingGeometryTailFrame=0;
    if(viewEpoch!==conversationViewEpoch){
      pendingGeometryTailReasons.clear();
      return;
    }
    if(viewport.mode!==VIEWPORT_STATES.FOLLOW_TAIL||hasUserScrollIntent()){
      pendingGeometryTailReasons.clear();
      return;
    }
    const reasons=Array.from(pendingGeometryTailReasons).slice(0,3).join('+')||'geometry';
    pendingGeometryTailReasons.clear();
    scrollToTail(`geometry:${reasons}`);
  });
  return true;
}

function scrollToTail(reason='explicit',{messageId=undefined}={}){
  // ScrollRoot is the ONE tail writer. A send/render/composer shrink can settle
  // over more than two animation frames (especially Safari mobile/PWA). Do not
  // guess a fixed frame count: converge until both geometry and tail distance
  // are stable, with a small bounded safety limit.
  claimTailIntent(reason,{messageId});
  const token=++pendingTailToken;
  const viewEpoch=conversationViewEpoch;
  let stableFrames=0;
  let previousSignature='';
  let attempts=0;
  const maxAttempts=30;

  if(pendingTailFrame)cancelAnimationFrame(pendingTailFrame);

  const settle=()=>{
    if(token!==pendingTailToken||viewEpoch!==conversationViewEpoch)return;

    // A real wheel/touch/drag after the command always wins over auto-follow.
    if(hasUserScrollIntent()){
      pendingTailFrame=0;
      pendingTailReason='';
      updateScrollFromEndControl();
      return;
    }

    attempts+=1;
    let targetScrollTop=scrollRoot.scrollHeight-scrollRoot.clientHeight;
    if(tailRevealTargetMessageId){
      const targetNode=messageTurnById(tailRevealTargetMessageId);
      if(targetNode?.isConnected){
        const targetRect=targetNode.getBoundingClientRect();
        const visibleBottom=interactionAnchorVisibleBottomPx();
        targetScrollTop=Math.max(
          targetScrollTop,
          scrollRoot.scrollTop+Math.max(0,Math.ceil(targetRect.bottom-visibleBottom))
        );
      }
    }
    setScrollTop(targetScrollTop);

    pendingTailFrame=requestAnimationFrame(()=>{
      if(token!==pendingTailToken||viewEpoch!==conversationViewEpoch)return;
      const signature=tailGeometrySignature();
      const atTail=distanceFromTail()<=1;
      stableFrames=(atTail&&signature===previousSignature)?stableFrames+1:0;
      previousSignature=signature;

      if((atTail&&stableFrames>=3)||attempts>=maxAttempts){
        pendingTailFrame=0;
        // Capture the final browser-clamped value before releasing ownership.
        lastUserScrollTop=scrollRoot.scrollTop;
        pendingTailReason='';
        updateScrollFromEndControl();
        return;
      }

      pendingTailFrame=requestAnimationFrame(settle);
    });
  };

  pendingTailFrame=requestAnimationFrame(settle);
}

function firstVisibleAnchor(){
  const rootRect=scrollRoot.getBoundingClientRect();

  for(const node of messageWindow.children){
    const rect=node.getBoundingClientRect();

    if(rect.bottom>rootRect.top+8){
      return{
        id:node.dataset.id,
        renderKey:node.dataset.renderKey||'',
        offset:rect.top-rootRect.top
      };
    }
  }

  return null;
}

function restoreAnchor(anchor){
  if(!anchor)return;

  const byKey=anchor.renderKey
    ?messageWindow.querySelector(
      `[data-render-key="${CSS.escape(anchor.renderKey)}"]`
    )
    :null;
  const node=byKey||(
    anchor.id
      ?messageWindow.querySelector(
        `[data-id="${CSS.escape(anchor.id)}"]`
      )
      :null
  );
  if(!node)return;

  const rootRect=scrollRoot.getBoundingClientRect();
  const delta=
    node.getBoundingClientRect().top-
    rootRect.top-
    anchor.offset;

  if(Math.abs(delta)>0.5){
    setScrollTop(scrollRoot.scrollTop+delta);
  }
}

const mediaObjectUrls=new Map();
const audioHydrationPromises=new WeakMap();
const AudioPlaybackController={
  currentAudio:null,
  claim(audio){
    if(!audio)return;
    const previous=this.currentAudio;
    this.currentAudio=audio;
    if(previous&&previous!==audio&&!previous.paused){
      try{previous.pause();}catch{}
    }
  },
  release(audio){
    if(this.currentAudio===audio)this.currentAudio=null;
  },
  stopAll({reset=false}={}){
    const current=this.currentAudio;
    this.currentAudio=null;
    if(!current)return;
    try{current.pause();}catch{}
    if(reset){
      try{current.currentTime=0;}catch{}
    }
  }
};

function releaseMediaObjectUrl({accountId,assetId}={}){
  const ownerAccountId=String(accountId||'');
  const id=String(assetId||'');
  if(!ownerAccountId||!id)return false;
  const cacheKey=`${ownerAccountId}::${id}`;
  const url=mediaObjectUrls.get(cacheKey);
  if(!url)return false;
  URL.revokeObjectURL(url);
  mediaObjectUrls.delete(cacheKey);
  return true;
}

function scheduleMediaObjectUrlSweep(){
  if(mediaObjectUrlSweepFrame)return;
  mediaObjectUrlSweepFrame=requestAnimationFrame(()=>{
    mediaObjectUrlSweepFrame=0;
    const liveBlobUrls=new Set();
    for(const node of Array.from(document.querySelectorAll('img,audio,video,source'))){
      const url=String(node.currentSrc||node.getAttribute?.('src')||'');
      if(url.startsWith('blob:'))liveBlobUrls.add(url);
    }
    for(const [cacheKey,url] of Array.from(mediaObjectUrls.entries())){
      if(liveBlobUrls.has(url))continue;
      URL.revokeObjectURL(url);
      mediaObjectUrls.delete(cacheKey);
    }
  });
}

function collectConversationImageAssets(){
  const items=[];
  const seen=new Set();
  const add=(media,previewUrl='',createdAt=Date.now(),context={})=>{
    const item=mediaViewerItem(media,previewUrl,createdAt,context);
    if(!item||seen.has(item.assetId))return;
    seen.add(item.assetId);items.push(item);
  };
  for(const message of store.items){
    const context={messageId:message.id,senderKey:message.sender};
    if(message?.media?.type==='image'){
      add(message.media,localImagePreviewUrls.get(String(message.media.assetId||''))||'',message.createdAt,context);
    }else if(message?.media?.type==='gallery'){
      for(const media of (message.media.items||[])){
        add(media,localImagePreviewUrls.get(String(media.assetId||''))||'',message.createdAt,context);
      }
    }
  }
  return items;
}

function isViewerItemInTimeScope(item,scope){
  if(!item)return false;
  if(scope==='all')return true;
  const stamp=Number(item.createdAt)||0;
  if(!stamp)return true;
  const date=new Date(stamp);
  const now=new Date();
  const startToday=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  if(scope==='today')return date>=startToday;
  if(scope==='yesterday'){
    const startYesterday=new Date(startToday);
    startYesterday.setDate(startYesterday.getDate()-1);
    return date>=startYesterday&&date<startToday;
  }
  if(scope==='week'){
    const startWeek=new Date(startToday);
    startWeek.setDate(startWeek.getDate()-6);
    return date>=startWeek;
  }
  if(scope==='month')return date.getFullYear()===now.getFullYear()&&date.getMonth()===now.getMonth();
  return true;
}

function applyCurrentImageViewerFilters({preferAssetId='',behavior='smooth'}={}){
  const currentAssetId=String(preferAssetId||imageViewerItems[imageViewerIndex]?.assetId||'');
  let next=[];
  if(imageViewerFilter==='self')next=imageViewerAllItems.filter(item=>item.senderKey==='self');
  else if(imageViewerFilter==='remote')next=imageViewerAllItems.filter(item=>item.senderKey==='remote');
  else if(imageViewerFilter==='album')next=imageViewerAllItems.filter(item=>item.messageId===imageViewerAlbumId);
  else next=[...imageViewerAllItems];
  next=next.filter(item=>isViewerItemInTimeScope(item,imageViewerTimeFilter));
  if(!next.length&&imageViewerTimeFilter!=='all'){
    imageViewerTimeFilter='all';
    return applyCurrentImageViewerFilters({preferAssetId:currentAssetId,behavior});
  }
  if(!next.length&&imageViewerFilter!=='all'){
    imageViewerFilter='all';
    return applyCurrentImageViewerFilters({preferAssetId:currentAssetId,behavior});
  }
  imageViewerItems=next;
  imageViewerIndex=Math.max(0,next.findIndex(item=>item.assetId===currentAssetId));
  renderImageViewerFilmstrip();
  renderImageViewerFilters();
  hydrateVisibleViewerThumbs();
  return showImageViewerIndex(imageViewerIndex,{behavior});
}
