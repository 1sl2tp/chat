<script data-inlined-source="v21-livekit-session.js">
(()=>{
'use strict';
const VERSION='V21.72.5';
const SDK_URL='https://cdn.jsdelivr.net/npm/livekit-client@2.22.2/dist/livekit-client.umd.min.js';
const PEER_LOSS_CONFIRM_MS=4000;
let sdkPromise=null;
let warmPromise=null;
let room=null;
let roomCallId='';
let latestCanonicalCall=null;
let joining=false;
let connected=false;
let reconnecting=false;
let localMicPermissionReady=false;
let micPreflightPromise=null;
let micReadySubmitted=false;
let localMicPublished=false;
let remoteAudioSubscribed=false;
let remotePlaybackReady=false;
let active=false;
let mediaReadySubmitted=false;
let intentionalLeave=false;
let generation=0;
let lastReason='boot';
let lastError=null;
let peerLossTimer=0;
let callMicOwner='';
const audioElements=new Set();
const remoteAudioAttachments=new Map();

function authStore(){return window.V21AuthSessionStore||null;}
function callEngine(){return window.V21CallEngine||null;}
function audioCapturePolicy(){return window.V21AudioCapturePolicy||null;}
function authSnapshot(){return authStore()?.snapshot?.()||{state:'GUEST'};}
function authenticated(){const s=authSnapshot();return s.state==='AUTHENTICATED'&&Boolean(s.appSessionId&&s.account?.id);}
function client(){return authStore()?.getClient?.()||null;}
function online(){return navigator.onLine!==false;}

function emit(reason){
  lastReason=String(reason||lastReason);
  document.dispatchEvent(new CustomEvent('v21-livekit-state',{detail:snapshot()}));
}

function clearPeerLossTimer(){
  if(peerLossTimer){clearTimeout(peerLossTimer);peerLossTimer=0;}
}

function resetFlags(){
  joining=false;
  connected=false;
  reconnecting=false;
  localMicPermissionReady=false;
  micPreflightPromise=null;
  micReadySubmitted=false;
  localMicPublished=false;
  remoteAudioSubscribed=false;
  remotePlaybackReady=false;
  active=false;
  mediaReadySubmitted=false;
  latestCanonicalCall=null;
  clearPeerLossTimer();
}

function cleanupAudio(){
  for(const el of audioElements){
    try{el.pause?.();}catch{}
    try{el.remove?.();}catch{}
  }
  audioElements.clear();
  remoteAudioAttachments.clear();
}

function loadSdk(){
  if(window.LivekitClient?.Room)return Promise.resolve(window.LivekitClient);
  if(sdkPromise)return sdkPromise;
  sdkPromise=new Promise((resolve,reject)=>{
    const existing=document.querySelector('script[data-v21-livekit-sdk]');
    if(existing){
      existing.addEventListener('load',()=>window.LivekitClient?.Room?resolve(window.LivekitClient):reject(new Error('livekit_sdk_unavailable')),{once:true});
      existing.addEventListener('error',()=>reject(new Error('livekit_sdk_load_failed')),{once:true});
      return;
    }
    const script=document.createElement('script');
    script.src=SDK_URL;
    script.async=true;
    script.crossOrigin='anonymous';
    script.dataset.v21LivekitSdk='true';
    script.addEventListener('load',()=>window.LivekitClient?.Room?resolve(window.LivekitClient):reject(new Error('livekit_sdk_unavailable')),{once:true});
    script.addEventListener('error',()=>reject(new Error('livekit_sdk_load_failed')),{once:true});
    document.head.appendChild(script);
  }).catch(error=>{sdkPromise=null;throw error;});
  return sdkPromise;
}

async function warm(){
  if(!authenticated()||!online())return false;
  if(warmPromise)return warmPromise;
  warmPromise=(async()=>{
    const api=client();
    const sdk=loadSdk().catch(()=>null);
    const fn=api?.functions?.invoke?.('v21-livekit-token',{body:{action:'warm'}}).catch?.(()=>null);
    await Promise.all([sdk,fn]);
    return Boolean(window.LivekitClient?.Room);
  })().finally(()=>{warmPromise=null;});
  return warmPromise;
}

async function tokenFor(call){
  const s=authSnapshot();
  const api=client();
  if(!api||!authenticated())throw new Error('authentication_required');
  const {data,error}=await api.functions.invoke('v21-livekit-token',{
    body:{callId:String(call.id),appSessionId:String(s.appSessionId)}
  });
  if(error)throw error;
  if(!data?.serverUrl||!data?.participantToken)throw new Error(String(data?.error||'livekit_token_failed'));
  return data;
}

function remoteParticipantCount(){return Number(room?.remoteParticipants?.size||0);}

function remoteTrackKey(track){
  return String(
    track?.sid ||
    track?.trackSid ||
    track?.mediaStreamTrack?.id ||
    ''
  );
}

async function attachAudio(track,next){
  let el=null;
  const key=remoteTrackKey(track);
  const existing=key?remoteAudioAttachments.get(key):null;
  if(existing?.element?.isConnected)return true;
  if(existing?.element){
    try{existing.element.pause?.();}catch{}
    try{existing.element.remove?.();}catch{}
    audioElements.delete(existing.element);
    remoteAudioAttachments.delete(key);
  }
  try{
    el=track.attach();
    if(!el)return false;
    el.autoplay=true;
    el.playsInline=true;
    el.style.position='fixed';
    el.style.width='1px';
    el.style.height='1px';
    el.style.opacity='0';
    el.style.pointerEvents='none';
    el.style.inset='auto 0 0 auto';
    document.body.appendChild(el);
    audioElements.add(el);
    if(key)remoteAudioAttachments.set(key,{track,element:el});
    try{await next?.startAudio?.();}catch{}
    const playResult=el.play?.();
    if(playResult&&typeof playResult.then==='function')await playResult;
    return true;
  }catch(error){
    if(el){
      audioElements.delete(el);
      try{el.remove?.();}catch{}
    }
    if(key)remoteAudioAttachments.delete(key);
    lastError=String(error?.message||error||'remote_audio_playback_blocked');
    return false;
  }
}

function detachAudio(track){
  const key=remoteTrackKey(track);
  const existing=key?remoteAudioAttachments.get(key):null;
  if(existing?.element){
    audioElements.delete(existing.element);
    try{existing.element.pause?.();}catch{}
    try{existing.element.remove?.();}catch{}
    remoteAudioAttachments.delete(key);
  }
  try{
    for(const el of track.detach?.()||[]){
      audioElements.delete(el);
      try{el.remove?.();}catch{}
    }
  }catch{}
}

async function preflightMicrophone(call){
  if(localMicPermissionReady)return true;
  if(micPreflightPromise)return micPreflightPromise;
  const capture=audioCapturePolicy();
  if(!capture?.acquire){
    lastError='microphone_unavailable';
    emit('microphone-unavailable');
    return false;
  }
  const localGeneration=generation;
  const captureOwner=`call-preflight:${String(call?.id||'unknown')}`;
  micPreflightPromise=(async()=>{
    let stream=null;
    try{
      stream=await capture.acquire({owner:captureOwner,purpose:'call-preflight'});
      if(localGeneration!==generation||String(call?.id||'')!==String(roomCallId||''))return false;
      const tracks=stream.getAudioTracks?.()||[];
      const ok=tracks.some(track=>track&&track.readyState==='live'&&track.enabled!==false);
      if(!ok)throw new Error('microphone_not_ready');
      capture.release(stream,{owner:captureOwner});
      stream=null;
      localMicPermissionReady=true;
      lastError=null;
      emit('microphone-permission-ready');
      if(!micReadySubmitted){
        micReadySubmitted=true;
        const ack=await callEngine()?.markMicReady?.({callId:String(call.id)});
        if(!ack||String(ack.id)!==String(call.id)){
          micReadySubmitted=false;
          emit('microphone-ready-submit-failed');
          return false;
        }
        latestCanonicalCall=ack;
        emit('microphone-ready-submitted');
        if(ack.micGateOpenAt||ack.mic_gate_open_at)await syncCanonical(ack);
      }
      return true;
    }catch(error){
      if(localGeneration!==generation)return false;
      lastError=String(error?.name||error?.message||error||'microphone_permission_failed');
      localMicPermissionReady=false;
      micReadySubmitted=false;
      emit('microphone-permission-failed');
      return false;
    }finally{
      if(stream)capture.release(stream,{owner:captureOwner});
      micPreflightPromise=null;
    }
  })();
  return micPreflightPromise;
}

async function publishMicrophoneIfGateOpen(call){
  const gate=call?.micGateOpenAt||call?.mic_gate_open_at||null;
  if(!gate||!room||!connected||reconnecting||!localMicPermissionReady)return false;
  if(localMicPublished)return true;
  const capture=audioCapturePolicy();
  const owner=`call:${String(call?.id||'')}`;
  if(!capture?.claimExternal){
    lastError='microphone_policy_unavailable';
    emit('microphone-policy-unavailable');
    return false;
  }
  if(callMicOwner&&callMicOwner!==owner){
    capture.releaseExternal({owner:callMicOwner});
    callMicOwner='';
  }
  if(!callMicOwner){
    if(!capture.claimExternal({owner})){
      lastError='microphone_busy';
      emit('microphone-busy');
      return false;
    }
    callMicOwner=owner;
  }
  const localGeneration=generation;
  try{
    await room.localParticipant.setMicrophoneEnabled(
      true,
      capture.liveKitOptions?.({purpose:'call'})||{
        echoCancellation:true,
        noiseSuppression:true,
        autoGainControl:true,
        channelCount:1
      }
    );
    if(localGeneration!==generation||String(call?.id||'')!==String(roomCallId||'')){
      try{await room?.localParticipant?.setMicrophoneEnabled?.(false);}catch{}
      capture.releaseExternal({owner});
      if(callMicOwner===owner)callMicOwner='';
      return false;
    }
    localMicPublished=Boolean(room.localParticipant.isMicrophoneEnabled);
    if(!localMicPublished){
      capture.releaseExternal({owner});
      if(callMicOwner===owner)callMicOwner='';
    }
    emit(localMicPublished?'microphone-published':'microphone-publish-failed');
    if(localMicPublished)void maybeSubmitMediaReady('local-mic-published');
    return localMicPublished;
  }catch(error){
    if(localGeneration!==generation)return false;
    capture.releaseExternal({owner});
    if(callMicOwner===owner)callMicOwner='';
    lastError=String(error?.message||error||'microphone_publish_failed');
    localMicPublished=false;
    emit('microphone-publish-error');
    return false;
  }
}

async function maybeSubmitMediaReady(reason='media-ready'){
  if(active||mediaReadySubmitted||!room||!connected||reconnecting||!localMicPublished||!remoteAudioSubscribed||!remotePlaybackReady||remoteParticipantCount()<1)return false;
  const callId=String(roomCallId||'');
  if(!callId)return false;
  mediaReadySubmitted=true;
  emit(`${reason}:submitting`);
  const call=await callEngine()?.markMediaReady?.({callId});
  if(!call||String(call.id)!==callId){
    mediaReadySubmitted=false;
    emit(`${reason}:submit-failed`);
    return false;
  }
  latestCanonicalCall=call;
  active=Boolean(call.mediaStartedAt||call.media_started_at) && isMediaHealthy(callId);
  emit(`${reason}:submitted`);
  return true;
}

function schedulePeerLossConfirm(reason='peer-left'){
  clearPeerLossTimer();
  const localGeneration=generation;
  const callId=String(roomCallId||'');
  if(!callId||!online()||reconnecting)return;
  peerLossTimer=setTimeout(()=>{
    peerLossTimer=0;
    if(localGeneration!==generation||String(roomCallId||'')!==callId)return;
    if(!online()||reconnecting||!connected||remoteParticipantCount()>0)return;
    void callEngine()?.confirmPeerLost?.({callId,reason});
  },PEER_LOSS_CONFIRM_MS);
}

function markDegraded(reason='media-degraded'){
  active=false;
  remotePlaybackReady=false;
  callEngine()?.mediaDegraded?.(reason);
  emit(reason);
}

function bindRoomEvents(next,sdk,localGeneration){
  const {RoomEvent,Track}=sdk;
  next.on(RoomEvent.ParticipantConnected,()=>{
    if(localGeneration!==generation||next!==room)return;
    clearPeerLossTimer();
    emit('participant-connected');
  });
  next.on(RoomEvent.ParticipantDisconnected,()=>{
    if(localGeneration!==generation||next!==room||intentionalLeave)return;
    remoteAudioSubscribed=false;
    remotePlaybackReady=false;
    markDegraded('peer-possibly-disconnected');
    if(!reconnecting&&online())schedulePeerLossConfirm('peer-left-confirmed');

    if(localGeneration!==generation||next!==room)return;
    if(track?.kind===Track.Kind.Audio||track?.kind==='audio'){
      remoteAudioSubscribed=true;
      void (async()=>{
        remotePlaybackReady=await attachAudio(track,next);
        if(localGeneration!==generation||next!==room)return;
        emit(remotePlaybackReady?'remote-audio-playable':'remote-audio-blocked');
        if(remotePlaybackReady)void maybeSubmitMediaReady('remote-audio-playable');
      })();
    }
  });
  next.on(RoomEvent.TrackUnsubscribed,(track)=>{
    if(localGeneration!==generation||next!==room)return;
    if(track?.kind===Track.Kind.Audio||track?.kind==='audio'){
      detachAudio(track);
      remoteAudioSubscribed=false;
      remotePlaybackReady=false;
      mediaReadySubmitted=false;
      markDegraded('remote-audio-lost');
    }
  });
  next.on(RoomEvent.Reconnecting,()=>{
    if(localGeneration!==generation||next!==room)return;
    reconnecting=true;
    clearPeerLossTimer();
    markDegraded('reconnecting');
  });
  next.on(RoomEvent.Reconnected,()=>{
    if(localGeneration!==generation||next!==room)return;
    reconnecting=false;
    connected=true;
    emit('reconnected');
    void callEngine()?.recover?.({reason:'livekit-reconnected'});
    if(latestCanonicalCall)void syncCanonical(latestCanonicalCall);
  });
  next.on(RoomEvent.Disconnected,()=>{
    if(localGeneration!==generation||next!==room||intentionalLeave)return;
    connected=false;
    reconnecting=false;
    localMicPublished=false;
    remoteAudioSubscribed=false;
    remotePlaybackReady=false;
    mediaReadySubmitted=false;
    markDegraded('livekit-disconnected');
    if(online())setTimeout(()=>void callEngine()?.recover?.({reason:'livekit-disconnected-recover'}),250);
  });

async function syncCanonical(call){
  if(!call||String(call.id||'')!==String(roomCallId||''))return false;
  latestCanonicalCall=call;
  if(String(call.status||'').toUpperCase()!=='ACCEPTED')return false;
  if(call.micGateOpenAt||call.mic_gate_open_at)await publishMicrophoneIfGateOpen(call);
  const hasServerActive=Boolean(call.mediaStartedAt||call.media_started_at);
  active=hasServerActive&&isMediaHealthy(call.id);
  emit(active?'canonical-active':'canonical-connecting');
  return active;
}

async function ensureJoined(call){
  if(!call||String(call.status||'').toUpperCase()!=='ACCEPTED'||!authenticated())return false;
  const callId=String(call.id||'');
  if(!callId)return false;
  latestCanonicalCall=call;
  if(room&&roomCallId===callId&&(connected||joining||reconnecting)){
    if(!localMicPermissionReady)void preflightMicrophone(call);
    void syncCanonical(call);
    return true;
  }
  if(!online())return false;

  await leave({reason:'switch-call',intentional:true});
  const localGeneration=++generation;
  roomCallId=callId;
  latestCanonicalCall=call;
  joining=true;
  intentionalLeave=false;
  lastError=null;
  emit('joining');

  try{
    const [sdk,token]=await Promise.all([loadSdk(),tokenFor(call)]);
    if(localGeneration!==generation)return false;
    const next=new sdk.Room({adaptiveStream:false,dynacast:false});
    room=next;
    bindRoomEvents(next,sdk,localGeneration);
    await next.connect(String(token.serverUrl),String(token.participantToken),{
      autoSubscribe:true,maxRetries:2,websocketTimeout:10000,peerConnectionTimeout:12000
    });
    if(localGeneration!==generation||next!==room)return false;
    connected=true;
    reconnecting=false;
    joining=false;
    emit('joined-muted');

    // Permission/device health is checked while still muted. The temporary
    // getUserMedia track is stopped immediately; LiveKit microphone publish
    // only happens after Supabase confirms BOTH sides passed this check.
    await preflightMicrophone(call);
    if(localGeneration!==generation||next!==room)return false;
    await syncCanonical(latestCanonicalCall||call);
    return true;
  }catch(error){
    if(localGeneration!==generation)return false;
    lastError=String(error?.message||error||'livekit_join_failed');
    joining=false;
    emit('join-error');
    await leave({reason:'join-error',intentional:true});
    // Join failure is not treated as an immediate CALL_END. Canonical recovery
    // remains authoritative; a later online/realtime recovery may rejoin.
    void callEngine()?.mediaDegraded?.('media-join-failed');
    return false;
  }
}

async function quiet({reason='quiet'}={}){
  const current=room;
  if(!current)return false;
  try{await current.localParticipant?.setMicrophoneEnabled?.(false);}catch{}
  if(callMicOwner){
    audioCapturePolicy()?.releaseExternal?.({owner:callMicOwner});
    callMicOwner='';
  }
  localMicPublished=false;
  active=false;
  emit(reason);
  return true;
}

async function leave({reason='leave',intentional=true}={}){
  const old=room;
  const oldCallId=roomCallId;
  const oldMicOwner=callMicOwner;
  generation+=1;
  intentionalLeave=Boolean(intentional);
  if(old){
    try{await old.localParticipant?.setMicrophoneEnabled?.(false);}catch{}
  }
  if(oldMicOwner)audioCapturePolicy()?.releaseExternal?.({owner:oldMicOwner});
  callMicOwner='';
  room=null;
  roomCallId='';
  resetFlags();
  cleanupAudio();
  if(old){
    try{await old.disconnect?.();}catch{}
  }
  emit(reason);
  intentionalLeave=false;
  return Boolean(old||oldCallId);
}

function isJoinedCall(callId){
  return Boolean(room&&String(roomCallId)===String(callId||''));
}

function isMediaHealthy(callId){
  return Boolean(
    room&&String(roomCallId)===String(callId||'')&&connected&&!reconnecting&&
    localMicPublished&&remoteAudioSubscribed&&remotePlaybackReady&&remoteParticipantCount()>0
  );
}

function snapshot(){
  return{
    version:VERSION,
    callId:roomCallId||null,
    joining,connected,reconnecting,
    localMicPermissionReady,micReadySubmitted,localMicPublished,
    remoteAudioSubscribed,remotePlaybackReady,
    active,mediaReadySubmitted,
    remoteParticipants:remoteParticipantCount(),
    lastReason,lastError,
    sdkLoaded:Boolean(window.LivekitClient?.Room)
  };
}

window.addEventListener('offline',()=>{
  if(!roomCallId)return;
  reconnecting=true;
  clearPeerLossTimer();
  markDegraded('network-offline-reconnecting');
});
window.addEventListener('online',()=>{
  if(!roomCallId)return;
  emit('network-online');
  void callEngine()?.recover?.({reason:'network-online'});
});
document.addEventListener('v21-auth-state',event=>{
  if(event.detail?.state!=='AUTHENTICATED')void leave({reason:'auth-reset',intentional:true});
});

window.V21LiveKitSession=Object.freeze({
  version:VERSION,warm,ensureJoined,syncCanonical,quiet,leave,isJoinedCall,isMediaHealthy,snapshot
});
})();

</script>

(()=>{
'use strict';

let reconnectAttempt=0;
let recoveryTimer=0;
let recoveryAttempt=0;
let presencePublishTimer=0;
let generation=0;
let lifecycle=Promise.resolve();
let lastInteractionAt=Date.now();
let remotePresence=[];
const RECOVERY_BACKOFF_MS=[5000,10000,20000,30000];

function authStore(){return window.V21AuthSessionStore||null;}
function sync(){return window.V21SyncEngine||null;}
function callEngine(){return window.V21CallEngine||null;}
function shell(){return window.ChatAppShell||null;}
function snapshot(){return authStore()?.snapshot?.()||{state:'GUEST'};}
function authenticated(){const s=snapshot();return s.state==='AUTHENTICATED'&&Boolean(s.appSessionId&&s.account?.id);}
function online(){return navigator.onLine!==false;}
function clearTimer(){if(reconnectTimer){clearTimeout(reconnectTimer);reconnectTimer=0;}}

function localPresencePayload(){
  const auth=snapshot();
  const syncState=sync()?.snapshot?.()||{};
  const shellState=shell()?.snapshot?.()||{};
  const isOnline=authenticated()&&online();
  const visible=!document.hidden;
  const route=String(shellState.route||'');
  const conversationId=String(syncState.currentConversationId||'');
  const activeConversation=Boolean(isOnline&&visible&&route==='chat'&&conversationId);
  const state=!isOnline?'OFFLINE':activeConversation?'ACTIVE_CHAT':'ONLINE_IDLE';
  return{
    accountId:String(auth.account?.id||''),
    appSessionId:String(auth.appSessionId||''),
    state,online:isOnline,visible,route,
    conversationId:activeConversation?conversationId:null,
    lastInteractionAt:new Date(lastInteractionAt).toISOString(),
    updatedAt:new Date().toISOString()
  };
}

function emitPresence(){
  document.dispatchEvent(new CustomEvent('v21-presence-change',{
    detail:{local:localPresencePayload(),remote:remotePresence.map(item=>({...item}))}
  }));
}

function refreshRemotePresence(source=channel){
  const auth=snapshot();
  const ownSession=String(auth.appSessionId||'');
  const state=source?.presenceState?.()||{};
  const rows=[];
  for(const entries of Object.values(state)){
    for(const meta of (Array.isArray(entries)?entries:[])){
      const appSessionId=String(meta?.appSessionId||meta?.app_session_id||'');
      if(appSessionId&&appSessionId===ownSession)continue;
      const accountId=String(meta?.accountId||meta?.account_id||'');
      if(!accountId)continue;
      rows.push({
        accountId,appSessionId,
        state:String(meta?.state||'ONLINE_IDLE'),
        online:meta?.online!==false,
        visible:Boolean(meta?.visible),
        route:String(meta?.route||''),
        conversationId:meta?.conversationId||meta?.conversation_id||null,
        lastInteractionAt:meta?.lastInteractionAt||meta?.last_interaction_at||null,
        updatedAt:meta?.updatedAt||meta?.updated_at||null
      });
    }
  }
  remotePresence=rows;
  emitPresence();
}

async function publishPresence(){
  clearPresenceTimer();
  emitPresence();
  if(!channel||channelState!=='SUBSCRIBED'||!authenticated()||!online())return false;
  try{
    await channel.track?.(localPresencePayload());
    return true;
  }catch{return false;}
}

function schedulePresencePublish(delay=120){
  clearPresenceTimer();
  presencePublishTimer=setTimeout(()=>{presencePublishTimer=0;void publishPresence();},Math.max(0,Number(delay)||0));
}

function markInteraction(){
  lastInteractionAt=Date.now();
  schedulePresencePublish(350);
}

function enqueue(task){
  const run=lifecycle.then(task,task);
  lifecycle=run.catch(()=>{});
  return run;
}

async function detachCurrent(){
  const old=channel;
  channel=null;
  channelState='CLOSED';
  remotePresence=[];
  emitPresence();
  if(old&&client){
    try{await old.untrack?.();}catch{}
    try{await client.removeChannel(old);}catch{}
  }
}

function stop(){
  const request=++generation;
  clearTimer();
  clearRecoveryTimer();
  clearPresenceTimer();
  reconnectAttempt=0;
  recoveryAttempt=0;
  return enqueue(async()=>{
    await detachCurrent();
    return request===generation;
  });
}

function schedule(immediate=false){
  if(!authenticated()||!online()||reconnectTimer)return;
  const delay=immediate?0:Math.min(8000,600*(2**Math.min(reconnectAttempt,4)));
  reconnectAttempt+=1;
  reconnectTimer=setTimeout(()=>{reconnectTimer=0;void start();},delay);
}

function scheduleRecovery(){
  if(!authenticated()||!online()||document.hidden||recoveryTimer||channelState==='SUBSCRIBED')return;
  const index=Math.min(recoveryAttempt,RECOVERY_BACKOFF_MS.length-1);
  const delay=RECOVERY_BACKOFF_MS[index];
  recoveryAttempt+=1;
  recoveryTimer=setTimeout(async()=>{
    recoveryTimer=0;
    if(!authenticated()||!online()||document.hidden||channelState==='SUBSCRIBED')return;
    await sync()?.wake?.({reason:'realtime-backoff-recovery'});
    await callEngine()?.recover?.({reason:'realtime-backoff-recovery'});
    if(channelState!=='SUBSCRIBED')scheduleRecovery();
  },delay);
}

function start(){
  const request=++generation;
  clearTimer();
  return enqueue(async()=>{
    await detachCurrent();
    if(request!==generation||!authenticated()||!online())return false;

    client=authStore()?.getClient?.()||client;
    if(!client)return false;
    if(!await authStore()?.syncRealtimeAuth?.()){
      if(request===generation){schedule(false);scheduleRecovery();}
      return false;
    }
    if(request!==generation||!authenticated()||!online())return false;

    const s=snapshot();
    const local=request;
    const next=client.channel(`v21-realtime-${s.appSessionId}`,{
      config:{presence:{key:String(s.appSessionId)}}
    })
      .on('postgres_changes',{
        event:'INSERT',schema:'public',table:'v21_sync_events',
        filter:`target_account_id=eq.${s.account.id}`
      },payload=>{
        if(local!==generation||channel!==next)return;
        const seq=Number(payload?.new?.seq)||0;
        void sync()?.wake?.({reason:'realtime',hintSeq:seq});
      })
      .on('postgres_changes',{
        event:'INSERT',schema:'public',table:'v21_session_events',
        filter:`target_app_session_id=eq.${s.appSessionId}`
      },()=>{
        if(local!==generation||channel!==next)return;
        void authStore()?.handleRevoked?.();
      })
      .on('postgres_changes',{
        event:'INSERT',schema:'public',table:'v21_call_events',
        filter:`target_account_id=eq.${s.account.id}`
      },payload=>{
        if(local!==generation||channel!==next)return;
        const row=payload?.new||{};
        callEngine()?.wake?.({kind:row.kind,callId:row.call_id,seq:row.seq});
      })
      .on('presence',{event:'sync'},()=>{
        if(local!==generation||channel!==next)return;
        refreshRemotePresence(next);
      });

    if(local!==generation)return false;
    channel=next;
    next.subscribe(status=>{
      if(local!==generation||channel!==next)return;
      channelState=String(status||'UNKNOWN');
      if(status==='SUBSCRIBED'){
        reconnectAttempt=0;
        recoveryAttempt=0;
        clearTimer();
        clearRecoveryTimer();
        void publishPresence();
        void sync()?.wake?.({reason:'realtime-subscribed'});
        void callEngine()?.recover?.({reason:'realtime-subscribed'});
      }else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'||status==='CLOSED'){
        schedule(false);
        scheduleRecovery();
      }
    });
    return true;
  });
}

document.addEventListener('v21-auth-state',event=>{
  if(event.detail?.state==='AUTHENTICATED')void start();
  else void stop();
});
document.addEventListener('v21-auth-token-refreshed',()=>{if(authenticated())void start();});
window.addEventListener('online',()=>{
  if(!authenticated())return;
  recoveryAttempt=0;
  schedule(true);
  void sync()?.wake?.({reason:'online'});
  void callEngine()?.recover?.({reason:'online'});
  schedulePresencePublish(0);
});
window.addEventListener('offline',()=>{
  clearTimer();
  clearRecoveryTimer();
  schedulePresencePublish(0);
});
document.addEventListener('visibilitychange',()=>{
  schedulePresencePublish(0);
  if(document.hidden||!authenticated())return;
  recoveryAttempt=0;
  if(channelState!=='SUBSCRIBED'){
    schedule(true);
    scheduleRecovery();
  }
  void sync()?.wake?.({reason:'foreground'});
  void callEngine()?.recover?.({reason:'foreground'});
});
document.addEventListener('navigation-change',()=>schedulePresencePublish(0));
document.addEventListener('v21-active-contact-change',()=>schedulePresencePublish(0));
document.addEventListener('pointerdown',markInteraction,{passive:true,capture:true});
document.addEventListener('keydown',markInteraction,{passive:true,capture:true});
document.addEventListener('input',markInteraction,{passive:true,capture:true});

window.V21RealtimeSession={
  version:VERSION,start,stop,publishPresence,
  snapshot(){return{
    channelState,reconnectAttempt,recoveryAttempt,generation,
    recoveryActive:Boolean(recoveryTimer),authenticated:authenticated(),
    presence:{local:localPresencePayload(),remote:remotePresence.map(item=>({...item}))}
  };}
};

queueMicrotask(()=>{if(authenticated())void start();else emitPresence();});
})();

</script>
<script data-inlined-source="app-update-controller.js">
(()=>{
'use strict';

const RELEASE_VERSION='V21.72.23';
const MODULE_CONTRACT_VERSION='app-update-v1';
const CHECK_INTERVAL_MS=45000;
const DEFER_RECHECK_MS=2500;
const RELOAD_GUARD_MS=20000;
const VERSION_URL='./version.json';
const currentVersion=String(
  document.querySelector('meta[name="app-release-version"]')?.content||RELEASE_VERSION
);
let registration=null;
let pendingVersion='';
let checkPromise=null;
let deferredTimer=0;

function emit(reason,detail={}){
  try{
    document.dispatchEvent(new CustomEvent('v21-app-update',{
      detail:{reason:String(reason||'change'),currentVersion,pendingVersion,...detail}
    }));
  }catch{}
}
function hasDraft(){
  const editor=document.getElementById('editor');
  if(String(editor?.value||'').length)return true;
  const tray=document.getElementById('attachmentTray');
  if(Number(tray?.childElementCount||0)>0)return true;
  const reply=document.getElementById('replyContext');
  if(reply&&!reply.hidden)return true;
  return false;
}
function safeToReload(){
  if(document.visibilityState&&document.visibilityState!=='visible')return false;
  const interaction=window.V21InteractionController?.snapshot?.()||null;
  if(interaction&&String(interaction.mode||'NONE')!=='NONE')return false;
  const capture=window.V21AudioCapturePolicy?.active?.()||null;
  if(capture&&String(capture.mode||'idle')!=='idle')return false;
  const sync=window.V21SyncEngine?.snapshot?.()||null;
  if(sync&&(sync.syncing||sync.wakePending))return false;
  if(hasDraft())return false;
  return true;
}
function guardKey(version){return 'taphoa.v21.reload.'+String(version||'unknown');}
function recentlyReloaded(version){
  try{
    const value=Number(sessionStorage.getItem(guardKey(version))||0);
    return value>0&&Date.now()-value<RELOAD_GUARD_MS;
  }catch{return false;}
}
function rememberReload(version){
  try{sessionStorage.setItem(guardKey(version),String(Date.now()));}catch{}
}
function scheduleDeferred(){
  if(deferredTimer)return;
  deferredTimer=setTimeout(()=>{
    deferredTimer=0;
    maybeReload();
  },DEFER_RECHECK_MS);
}
function maybeReload(){
  if(!pendingVersion)return false;
  document.documentElement.dataset.appUpdatePending=pendingVersion;
  if(!safeToReload()){
    emit('reload-deferred');
    scheduleDeferred();
    return false;
  }
  if(recentlyReloaded(pendingVersion)){
    emit('reload-guarded');
    scheduleDeferred();
    return false;
  }
  rememberReload(pendingVersion);
  emit('reloading');
  location.reload();
  return true;
}
async function activateWaitingWorker(){
  try{
    if(registration?.waiting){
      registration.waiting.postMessage({type:'SKIP_WAITING'});
      return true;
    }
  }catch{}
  return false;
}
async function checkForUpdate({reason='interval'}={}){
  if(checkPromise)return checkPromise;
  checkPromise=(async()=>{
    try{
      try{await registration?.update?.();}catch{}
      const response=await fetch(
        VERSION_URL+'?t='+Date.now(),
        {cache:'no-store',credentials:'same-origin'}
      );
      if(!response.ok)return false;
      const remote=await response.json();
      const next=String(remote?.version||'');
      if(!next||next===currentVersion)return false;
      pendingVersion=next;
      emit('update-found',{trigger:String(reason||'check'),remote});
      await activateWaitingWorker();
      maybeReload();
      return true;
    }catch(error){
      emit('check-failed',{message:String(error?.message||error||'update_check_failed')});
      return false;
    }finally{
      checkPromise=null;
    }
  })();
  return checkPromise;
}
async function registerServiceWorker(){
  if(!('serviceWorker' in navigator))return null;
  if(location.protocol!=='https:'&&location.hostname!=='localhost')return null;
  try{
    registration=await navigator.serviceWorker.register('./sw.js',{
      scope:'./',
      updateViaCache:'none'
    });
    registration.addEventListener?.('updatefound',()=>{
      const worker=registration.installing;
      worker?.addEventListener?.('statechange',()=>{
        if(worker.state==='installed'&&navigator.serviceWorker.controller){
          void activateWaitingWorker();
          if(pendingVersion)maybeReload();
        }
      });
    });
    await registration.update().catch(()=>{});
    return registration;
  }catch(error){
    emit('service-worker-failed',{message:String(error?.message||error||'service_worker_failed')});
    return null;
  }
}
function bind(){
  document.addEventListener('visibilitychange',()=>{
    if(document.visibilityState==='visible')void checkForUpdate({reason:'visible'});
  });
  window.addEventListener('focus',()=>void checkForUpdate({reason:'focus'}));
  window.addEventListener('online',()=>void checkForUpdate({reason:'online'}));
  document.addEventListener('v21-interaction-mode',()=>maybeReload());
  document.addEventListener('input',()=>maybeReload(),true);
  navigator.serviceWorker?.addEventListener?.('controllerchange',()=>maybeReload());
  setInterval(()=>void checkForUpdate({reason:'interval'}),CHECK_INTERVAL_MS);
}
async function boot(){
  bind();
  await registerServiceWorker();
  void checkForUpdate({reason:'boot'});
}

if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded',()=>void boot(),{once:true});
}else{
  void boot();
}

window.V21AppUpdateController=Object.freeze({
  version:RELEASE_VERSION,
  moduleContractVersion:MODULE_CONTRACT_VERSION,
  currentVersion,
  check:checkForUpdate,
  safeToReload,
  snapshot:()=>({currentVersion,pendingVersion,serviceWorker:Boolean(registration)})
});
})();
