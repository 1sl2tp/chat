const UnreadIndicator={
  set(count){
    unreadCount=Math.max(0,Number(count)||0);
    renderMenuUnread();
    return unreadCount;
  },
  increment(delta=1){return this.set(unreadCount+Math.max(0,Number(delta)||0));},
  clear(){return this.set(0);},
  snapshot(){return unreadCount;}
};

function syncSidebarPresentation(){
  shellNavigationLayer.dataset.open=String(sidebarOpen);
  shellNavigationLayer.dataset.persistent=String(desktopSidebarPersistent);
  const visible=sidebarOpen||desktopSidebarPersistent;
  shellNavigationLayer.setAttribute('aria-hidden',String(!visible));
  for(const button of document.querySelectorAll('[data-shell-command="sidebar.open"]')){
    button.setAttribute('aria-expanded',String(visible));
  }
  return visible;
}

function syncDesktopSidebarMode(){
  const next=authState==='AUTHENTICATED'&&desktopDirectoryMedia.matches;
  const changed=next!==desktopSidebarPersistent;
  desktopSidebarPersistent=next;
  appShell.dataset.desktopSidebarPersistent=String(desktopSidebarPersistent);
  if(desktopSidebarPersistent)sidebarOpen=false;
  syncSidebarPresentation();
  if(desktopSidebarPersistent&&changed){
    void window.V21ContactStore?.refresh?.();
  }
  return desktopSidebarPersistent;
}

if(typeof desktopDirectoryMedia.addEventListener==='function'){
  desktopDirectoryMedia.addEventListener('change',syncDesktopSidebarMode);
}else if(typeof desktopDirectoryMedia.addListener==='function'){
  desktopDirectoryMedia.addListener(syncDesktopSidebarMode);
}

function setSidebar(open){
  if(desktopSidebarPersistent){
    sidebarOpen=false;
    syncSidebarPresentation();
    if(authState==='AUTHENTICATED')void window.V21ContactStore?.refresh?.();
    return false;
  }
  sidebarOpen=Boolean(open);
  syncSidebarPresentation();
  if(sidebarOpen&&authState==='AUTHENTICATED'){
    void window.V21ContactStore?.refresh?.();
  }
  return sidebarOpen;
}

function renderTopTabs(){
  for(const tab of document.querySelectorAll('[data-top-tab]')){
    tab.setAttribute('aria-selected',String(tab.dataset.topTab===route));
  }
}

const NavigationCommand={
  open(nextRoute){
    if(!ROUTES.includes(nextRoute))return false;
    route=nextRoute;
    setSidebar(false);
    applyRoutePresentation();
    persistScreenSession();
    document.dispatchEvent(new CustomEvent('navigation-change',{detail:{route}}));
    return true;
  },
  openChat(){return this.open('chat')},
  openWork(){return this.open('work')}
};

function formatCallElapsed(totalSeconds){
  const seconds=Math.max(0,Number(totalSeconds)||0);
  const mm=Math.floor(seconds/60).toString().padStart(2,'0');
  const ss=Math.floor(seconds%60).toString().padStart(2,'0');
  return `${mm}:${ss}`;
}

function callPhase(){
  if(callState==='OUTGOING_RINGING'||callState==='INCOMING_RINGING')return 'RINGING';
  if(callState==='CONNECTING_AUDIO')return 'CONNECTING';
  if(callState==='ACTIVE_AUDIO')return 'ACTIVE';
  return 'IDLE';
}

function stopCallTimer(){
  if(callTimerId){
    clearInterval(callTimerId);
    callTimerId=0;
  }
  callStartedAt=0;
}

function currentElapsed(){
  if(!callStartedAt)return '00:00';
  return formatCallElapsed(Math.floor((Date.now()-callStartedAt)/1000));
}

function updateCallTimer(){
  if(callState!=='ACTIVE_AUDIO')return;
  renderCallFocus();
}

function startCallTimer(startedAt=null){
  stopCallTimer();
  const parsed=startedAt?Date.parse(startedAt):NaN;
  callStartedAt=Number.isFinite(parsed)?parsed:Date.now();
  callTimerId=window.setInterval(updateCallTimer,1000);
}

function clearCallTerminalNotice({render=false}={}){
  if(callTerminalNoticeTimer){
    clearTimeout(callTerminalNoticeTimer);
    callTerminalNoticeTimer=0;
  }
  callTerminalNotice=null;
  if(render)renderCallFocus();
}

function terminalNoticeFromCall(call,reason='call-ended'){
  const status=String(call?.status||'').toUpperCase();
  const me=String(authAccount?.id||'');
  const endedBy=String(call?.endedBy||call?.ended_by||'');
  const direction=String(call?.direction||'').toLowerCase();
  const localActor=Boolean(me&&endedBy&&me===endedBy);
  if(status==='ENDED')return{state:'ended',title:localActor?'Đã kết thúc':'Cuộc gọi đã kết thúc'};
  if(status==='REJECTED')return{state:'rejected',title:localActor?'Đã từ chối':'Bên kia đã từ chối'};
  if(status==='CANCELLED')return{state:'cancelled',title:localActor?'Đã hủy':'Cuộc gọi đã hủy'};
  if(status==='MISSED')return{state:'missed',title:direction==='outgoing'?'Không trả lời':'Cuộc gọi nhỡ'};
  return{state:'ended',title:String(reason||'Đã kết thúc')};
}

function terminalNoticeFromReason(reason='call-ended'){
  const map={
    'hangup':{state:'ended',title:'Đã kết thúc'},
    'peer-left':{state:'ended',title:'Cuộc gọi đã kết thúc'},
    'network-offline':{state:'ended',title:'Đã kết thúc'},
    'media-disconnected':{state:'ended',title:'Đã kết thúc'},
    'media-session-lost':{state:'ended',title:'Đã kết thúc'},
    'media-join-failed':{state:'ended',title:'Không thể kết nối'}
  };
  return map[String(reason||'')]||{state:'ended',title:'Đã kết thúc'};
}

function showCallTerminalNotice(call,reason='call-ended'){
  clearCallTerminalNotice();
  callTerminalNotice=call?.status?terminalNoticeFromCall(call,reason):terminalNoticeFromReason(reason);
  callTerminalNoticeTimer=window.setTimeout(()=>{
    callTerminalNoticeTimer=0;
    callTerminalNotice=null;
    renderCallFocus();
  },2200);
}

function callFocusPresentation(){
  const engineSnapshot=window.V21CallEngine?.snapshot?.()||{};
  const callBusy=Boolean(engineSnapshot.busy);

  if(callState==='ACTIVE_AUDIO'){
    return{
      state:'active',title:'Đang nghe',subtitle:'',timer:currentElapsed(),
      action:'end',actionLabel:'Kết thúc',tone:'danger',disabled:callBusy,
      secondary:null,aria:'Kết thúc cuộc gọi'
    };
  }

  if(callState==='CONNECTING_AUDIO'){
    return{
      state:'connecting',title:'Đang kết nối...',subtitle:'',timer:'',
      action:'end',actionLabel:'Kết thúc',tone:'danger',disabled:callBusy,
      secondary:null,aria:'Kết thúc cuộc gọi đang kết nối'
    };
  }

  if(callState==='INCOMING_RINGING'){
    return{
      state:'incoming',title:'Cuộc gọi đến',subtitle:'Nhấn Nghe để trả lời',timer:'',
      action:'accept',actionLabel:'Nghe',tone:'primary',disabled:callBusy,
      secondary:'reject',secondaryLabel:'Từ chối',aria:`Nghe cuộc gọi từ ${activeContact?.name||'liên hệ'}`
    };
  }

  if(callState==='OUTGOING_RINGING'){
    return{
      state:'calling',title:'Đang gọi...',subtitle:'',timer:'',
      action:'cancel',actionLabel:'Hủy',tone:'danger',disabled:callBusy,
      secondary:null,aria:'Hủy cuộc gọi đang gọi'
    };
  }

  if(callTerminalNotice){
    return{
      state:callTerminalNotice.state,title:callTerminalNotice.title,subtitle:'',timer:'',
      action:'icon',actionLabel:'',tone:'primary',disabled:callBusy,
      secondary:null,aria:activeContact?.id?`Gọi ${activeContact.name}`:'Gọi'
    };
  }

  return{
    state:'idle',title:'',subtitle:'',timer:'',
    action:'icon',actionLabel:'',tone:'primary',disabled:callBusy,
    secondary:null,aria:activeContact?.id?`Gọi ${activeContact.name}`:(authState==='AUTHENTICATED'?'Chưa có liên hệ để gọi':'Gọi')
  };
}

function renderCallFocus(){
  const hasContact=Boolean(activeContact?.id);
  const presentation=callFocusPresentation();
  for(const slot of document.querySelectorAll('[data-call-focus-slot]')){
    const chip=slot.querySelector('[data-call-status-chip]');
    const title=slot.querySelector('[data-call-status-title]');
    const subtitle=slot.querySelector('[data-call-status-subtitle]');
    const timer=slot.querySelector('[data-call-status-timer]');
    const secondary=slot.querySelector('[data-call-secondary-button]');
    slot.dataset.callUiState=presentation.state;
    if(chip){
      chip.hidden=presentation.state==='idle';
      chip.dataset.state=presentation.state;
    }
    if(title)title.textContent=presentation.title;
    if(subtitle){
      subtitle.textContent=presentation.subtitle;
      subtitle.hidden=!presentation.subtitle;
    }
    if(timer){
      timer.textContent=presentation.timer;
      timer.hidden=!presentation.timer;
    }
    if(secondary){
      const show=presentation.secondary==='reject';
      const secondaryLabel=secondary.querySelector('.call-secondary-label');
      secondary.hidden=!show;
      secondary.disabled=Boolean(presentation.disabled);
      if(secondaryLabel)secondaryLabel.textContent=presentation.secondaryLabel||'Từ chối';
    }
  }

  for(const button of document.querySelectorAll('[data-call-focus-button]')){
    const label=button.querySelector('.call-focus-label');
    button.dataset.callLive=String(callState!=='IDLE');
    button.dataset.display=presentation.action;
    button.dataset.tone=presentation.tone;
    button.disabled=presentation.disabled||(authState==='AUTHENTICATED'&&callState==='IDLE'&&!hasContact);
    button.setAttribute('aria-label',presentation.aria);
    if(label)label.textContent=presentation.actionLabel;
    if(hasContact){
      button.dataset.contactId=activeContact.id;
      button.dataset.contactName=activeContact.name;
    }else{
      delete button.dataset.contactId;
      delete button.dataset.contactName;
    }
  }
}

function setActiveContact(contactId,contactName){
  const previousId=activeContact?.id||null;
  if(!contactId){
    activeContact=null;
  }else{
    activeContact={id:String(contactId),name:String(contactName||'Liên hệ')};
  }
  renderCallFocus();
  syncContactActiveState();
  persistScreenSession();
  const nextId=activeContact?.id||null;
  if(previousId!==nextId){
    document.dispatchEvent(new CustomEvent('v21-active-contact-change',{detail:{contact:activeContact?{...activeContact}:null}}));
  }
}

const CallCommand={
  start(contactId,contactName){
    if(callState!=='IDLE')return false;
    clearCallTerminalNotice();
    callPendingAction=null;
    const targetId=String(contactId||activeContact?.id||'');
    const targetName=String(contactName||activeContact?.name||'Liên hệ');
    if(!targetId)return false;
    setActiveContact(targetId,targetName);
    const engine=window.V21CallEngine;
    if(!engine?.startOutgoing)return false;
    void engine.startOutgoing({contactId:targetId,contactName:targetName});
    renderCallFocus();
    return true;
  },
  enterOutgoing(contactId,contactName,call=null){
    if(callState!=='IDLE'&&callState!=='OUTGOING_RINGING')return false;
    if(callState==='IDLE'){
      const lease=interactionController()?.enter?.(interactionMode('CALL_RINGING'),{
        owner:'call-session',lockBaseUi:false
      });
      if(!lease)return false;
    }
    setActiveContact(contactId,contactName);
    if(!activeContact?.id){exitCallInteraction();return false;}
    callRole='CALLER';
    callState='OUTGOING_RINGING';
    callPendingAction=null;
    stopCallTimer();
    renderCallFocus();
    document.dispatchEvent(new CustomEvent('call-state',{detail:{state:callState,role:callRole,phase:callPhase(),contactId:activeContact.id,callId:call?.id||null}}));
    return true;
  },
  receiveIncoming(contactId,contactName,call=null){
    if(callState!=='IDLE'&&callState!=='INCOMING_RINGING')return false;
    if(callState==='IDLE'){
      const lease=interactionController()?.enter?.(interactionMode('CALL_RINGING'),{
        owner:'call-session',lockBaseUi:false
      });
      if(!lease)return false;
    }
    setActiveContact(contactId,contactName);
    if(!activeContact?.id){exitCallInteraction();return false;}
    callRole='CALLEE';
    callState='INCOMING_RINGING';
    callPendingAction=null;
    stopCallTimer();
    renderCallFocus();
    document.dispatchEvent(new CustomEvent('call-state',{detail:{state:callState,role:callRole,phase:callPhase(),contactId:activeContact.id,callId:call?.id||null}}));
    return true;
  },
  accept(){
    if(callState!=='INCOMING_RINGING')return false;
    const engine=window.V21CallEngine;
    if(!engine?.acceptCurrent)return false;
    callPendingAction='accept';
    void engine.acceptCurrent();
    renderCallFocus();
    return true;
  },
  enterConnecting(contactId,contactName,call=null){
    let lease=null;
    if(callState==='IDLE'){
      lease=interactionController()?.enter?.(interactionMode('CALL_CONNECTING'),{
        owner:'call-session',lockBaseUi:false
      });
    }else if(callState==='INCOMING_RINGING'||callState==='OUTGOING_RINGING'){
      lease=interactionController()?.transition?.(
        interactionMode('CALL_RINGING'),interactionMode('CALL_CONNECTING'),
        {owner:'call-session',lockBaseUi:false}
      );
    }else if(callState==='CONNECTING_AUDIO'){
      const snapshot=interactionController()?.snapshot?.()||{};
      if(snapshot.owner==='call-session'&&snapshot.mode===interactionMode('CALL_CONNECTING'))lease=snapshot;
    }else if(callState==='ACTIVE_AUDIO'){
      lease=interactionController()?.transition?.(
        interactionMode('AUDIO_CALL'),interactionMode('CALL_CONNECTING'),
        {owner:'call-session',lockBaseUi:false}
      );
    }
    if(!lease)return false;
    setActiveContact(contactId,contactName);
    callRole=String(call?.direction||'').toLowerCase()==='incoming'?'CALLEE':String(call?.direction||'').toLowerCase()==='outgoing'?'CALLER':callRole;
    clearCallTerminalNotice();
    callPendingAction=null;
    callState='CONNECTING_AUDIO';
    stopCallTimer();
    renderCallFocus();
    document.dispatchEvent(new CustomEvent('call-state',{detail:{state:callState,role:callRole,phase:callPhase(),contactId:activeContact?.id||null,callId:call?.id||null}}));
    return true;
  },
  enterActive(contactId,contactName,call=null){
    let lease=null;
    if(callState==='CONNECTING_AUDIO'){
      lease=interactionController()?.transition?.(
        interactionMode('CALL_CONNECTING'),interactionMode('AUDIO_CALL'),
        {owner:'call-session',lockBaseUi:false}
      );
    }else if(callState==='ACTIVE_AUDIO'){
      const snapshot=interactionController()?.snapshot?.()||{};
      if(snapshot.owner==='call-session'&&snapshot.mode===interactionMode('AUDIO_CALL'))lease=snapshot;
    }
    if(!lease)return false;
    setActiveContact(contactId,contactName);
    callRole=String(call?.direction||'').toLowerCase()==='incoming'?'CALLEE':String(call?.direction||'').toLowerCase()==='outgoing'?'CALLER':callRole;
    clearCallTerminalNotice();
    callPendingAction=null;
    callState='ACTIVE_AUDIO';
    startCallTimer(call?.mediaStartedAt||call?.media_started_at||null);
    renderCallFocus();
    document.dispatchEvent(new CustomEvent('call-state',{detail:{state:callState,role:callRole,phase:callPhase(),contactId:activeContact?.id||null,callId:call?.id||null}}));
    return true;
  },
  connected(call=null){
    const engineCall=call||window.V21CallEngine?.snapshot?.().call||null;
    return this.enterActive(
      engineCall?.peerAccountId||activeContact?.id,
      engineCall?.peerName||activeContact?.name,
      engineCall
    );
  },
  decline(){
    if(callState!=='INCOMING_RINGING')return false;
    const engine=window.V21CallEngine;
    if(!engine?.rejectCurrent)return false;
    void engine.rejectCurrent();
    renderCallFocus();
    return true;
  },
  hangup(){
    if(callState==='IDLE')return false;
    const engine=window.V21CallEngine;
    if(!engine?.stopCurrent)return false;
    void engine.stopCurrent({reason:'hangup'});
    renderCallFocus();
    return true;
  },
  endOptimistic(reason='hangup'){
    callState='IDLE';
    callRole='NONE';
    callPendingAction=null;
    stopCallTimer();
    showCallTerminalNotice(null,reason);
    renderCallFocus();
    exitCallInteraction();
    document.dispatchEvent(new CustomEvent('call-state',{detail:{state:callState,role:callRole,phase:callPhase(),reason:String(reason||'hangup')}}));
    return true;
  },
  resetFromEngine(reason='call-ended',call=null){
    callState='IDLE';
    callRole='NONE';
    callPendingAction=null;
    stopCallTimer();
    if(call?.status)showCallTerminalNotice(call,reason);
    else clearCallTerminalNotice();
    renderCallFocus();
    exitCallInteraction();
    document.dispatchEvent(new CustomEvent('call-state',{detail:{state:callState,role:callRole,phase:callPhase(),reason:String(reason||'call-ended')}}));
    return true;
  },
  refresh(){renderCallFocus();return true;},
  forceReset(){
    callState='IDLE';
    callRole='NONE';
    callPendingAction=null;
    clearCallTerminalNotice();
    stopCallTimer();
    renderCallFocus();
    exitCallInteraction();
    return true;
  }
};


function resolveInitialContact(rows){
  const valid=(Array.isArray(rows)?rows:[])
    .filter(item=>item?.id&&!item.deleted_at);
  if(valid.length!==1)return null;
  const contact=valid[0];
  return{
    id:String(contact.id),
    name:String(contact.display_name||contact.username||'Liên hệ')
  };
}

function reconcileActiveContactFromStore(detail={}){
  if(authState!=='AUTHENTICATED')return false;
  const items=Array.isArray(detail.contacts)?detail.contacts:[];
  const fallback=resolveInitialContact(items);

  // Bootstrap business rule: exactly one valid User ↔ Admin contact may be
  // resolved automatically. Zero contacts selects nothing; multi-contact never
  // guesses. Renderer remains DOM-only and owns none of this navigation.
  if(!activeContact?.id){
    if(!fallback)return false;
    setActiveContact(fallback.id,fallback.name);
    return true;
  }

  const current=items.find(item=>item?.id&&!item.deleted_at&&String(item.id)===String(activeContact.id))||null;
  if(current){
    const nextName=String(current.display_name||current.username||activeContact.name||'Liên hệ');
    if(nextName!==String(activeContact.name||''))setActiveContact(activeContact.id,nextName);
    return false;
  }

  // Contact/Navigation session owner resolves an invalid saved conversation.
  // End any call bound to the missing contact before switching/clearing it.
  if(callState==='INCOMING_RINGING')CallCommand.decline();
  else if(callState!=='IDLE')CallCommand.hangup();
  if(fallback)setActiveContact(fallback.id,fallback.name);
  else setActiveContact(null,null);
  return true;
}

let authMode='login';

function authField(name){return document.getElementById(`guest-auth-${name}`)}
function clearFieldInvalid(name){
  authField(name)?.removeAttribute('aria-invalid');
}
function setFieldInvalid(name){
  authField(name)?.setAttribute('aria-invalid','true');
}
function clearAuthErrors(){['name','account','password'].forEach(clearFieldInvalid)}


function initialsFor(value,fallback='TK'){
  const initials=String(value||'').trim().split(/\s+/).filter(Boolean).slice(0,2).map(part=>part[0]?.toUpperCase()||'').join('');
  return initials||fallback;
}

function accountAvatarColors(model){
  const key=String(model?.id||model?.username||model?.display_name||'account');
  let hash=0;
  for(let i=0;i<key.length;i++)hash=(Math.imul(hash,31)+key.charCodeAt(i))>>>0;
  const hue=hash%360;
  return{
    background:`hsl(${hue} 60% 88%)`,
    foreground:`hsl(${hue} 42% 20%)`
  };
}

function applyAvatarColors(node,model){
  if(!node)return;
  const colors=accountAvatarColors(model);
  node.style.setProperty('--account-avatar-bg',colors.background);
  node.style.setProperty('--account-avatar-fg',colors.foreground);
}

function profileStore(){return window.V21AccountProfileStore||null;}

function avatarUrlFor(path){
  return path?String(profileStore()?.avatarUrl?.(path)||''):'';
}

function renderAvatarInitials(node,display,fallback='TK'){
  if(!node)return;
  node.replaceChildren();
  node.textContent=initialsFor(display,fallback);
  node.dataset.avatarState='initials';
}

function renderAvatarImage(node,url,display,fallback='TK'){
  if(!node||!url)return false;
  node.replaceChildren();
  const img=document.createElement('img');
  img.className='shell-avatar-image';
  img.alt='';
  img.decoding='async';
  img.draggable=false;
  img.src=url;
  img.addEventListener('load',()=>{
    if(!node.contains(img))return;
    node.dataset.avatarState='image';
    if(node.dataset.avatarFailedUrl===url)delete node.dataset.avatarFailedUrl;
  },{once:true});
  img.addEventListener('error',()=>{
    if(!node.contains(img))return;
    node.dataset.avatarFailedUrl=url;
    renderAvatarInitials(node,display,fallback);
  },{once:true});
  node.appendChild(img);
  return true;
}

function renderAvatarNode(node,model,fallback='TK'){
  if(!node)return;
  applyAvatarColors(node,model);
  const display=String(model?.display_name||model?.username||'');
  const url=avatarUrlFor(model?.avatar_path);
  const signature=`${url}|${display}|${fallback}`;
  if(node.dataset.avatarSignature===signature)return;
  node.dataset.avatarSignature=signature;
  if(url&&node.dataset.avatarFailedUrl!==url){
    renderAvatarImage(node,url,display,fallback);
  }else{
    renderAvatarInitials(node,display,fallback);
  }
}

function compactPreview(value){
  return String(value||'').replace(/\s+/g,' ').trim();
}

function formatContactTime(value){
  if(!value)return'';
  const date=new Date(value);
  if(Number.isNaN(date.getTime()))return'';
  const now=new Date();
  const sameDay=date.getFullYear()===now.getFullYear()&&date.getMonth()===now.getMonth()&&date.getDate()===now.getDate();
  if(sameDay)return date.toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit',hour12:false});
  if(date.getFullYear()===now.getFullYear())return date.toLocaleDateString('vi-VN',{day:'2-digit',month:'2-digit'});
  return date.toLocaleDateString('vi-VN',{day:'2-digit',month:'2-digit',year:'2-digit'});
}

function contactPreview(item){
  const kind=String(item?.preview_kind||'text');
  if(kind==='image')return'Ảnh';
  if(kind==='audio')return'Ghi âm';
  if(kind==='file')return'Tệp';
  return compactPreview(item?.preview_text)||'Chưa có tin nhắn';
}

function syncContactActiveState(){
  for(const row of document.querySelectorAll('[data-contact-row]')){
    row.dataset.active=String(Boolean(activeContact?.id)&&String(row.dataset.contactId)===String(activeContact.id));
  }
}

let profileOverlay=null;
let profilePreviewUrl='';
let profileReturnFocus=null;

function lockProfileBackground(){
  const lease=interactionController()?.enter?.(interactionMode('PROFILE_MODAL'),{
    owner:'profile-modal',lockBaseUi:true
  });
  if(!lease)return false;
  profileReturnFocus=document.activeElement instanceof HTMLElement?document.activeElement:null;
  try{profileReturnFocus?.blur?.();}catch{}
  return true;
}

function unlockProfileBackground({restoreFocus=true}={}){
  interactionController()?.exit?.(interactionMode('PROFILE_MODAL'),{owner:'profile-modal'});
  const returnFocus=profileReturnFocus;
  profileReturnFocus=null;
  if(restoreFocus&&returnFocus?.isConnected){window.setTimeout(()=>{try{returnFocus.focus({preventScroll:true});}catch{}},0);}
}

function closeProfileEditor({restoreFocus=true}={}){
  if(profilePreviewUrl){URL.revokeObjectURL(profilePreviewUrl);profilePreviewUrl='';}
  profileOverlay?.remove?.();
  profileOverlay=null;
  unlockProfileBackground({restoreFocus});
}

function profileFocusable(){
  if(!profileOverlay)return[];
  return [...profileOverlay.querySelectorAll('button:not([disabled]),input:not([disabled]),textarea:not([disabled]),select:not([disabled]),[tabindex]:not([tabindex="-1"])')]
    .filter(node=>!node.hidden&&node.getClientRects().length>0);
}

document.addEventListener('keydown',event=>{
  if(!profileOverlay)return;
  if(event.key==='Escape'){
    event.preventDefault();
    closeProfileEditor();
    return;
  }
  if(event.key==='Tab'){
    const nodes=profileFocusable();
    if(!nodes.length){event.preventDefault();return;}
    const first=nodes[0],last=nodes[nodes.length-1];
    if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}
    else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}
  }
});

function buildProfileEditor({mode='self',account:target}={}){
  closeProfileEditor();
  const selfMode=mode==='self';
  const managed=mode==='admin'&&authAccount?.role==='admin'&&target?.role==='user';
  if(!selfMode&&!managed)return null;
  const model=selfMode?authAccount:target;
  if(!model?.id)return null;
  if(!lockProfileBackground())return null;

  const wrap=document.createElement('div');
  wrap.className='shell-profile-overlay';
  wrap.dataset.profileOverlay='';
  wrap.innerHTML=`
    <button type="button" class="shell-profile-backdrop" aria-label="Đóng"></button>
    <section class="shell-profile-card" role="dialog" aria-modal="true" aria-label="Hồ sơ">

        <div class="shell-profile-field"><label for="shell-profile-password">Mật khẩu mới</label><input id="shell-profile-password" type="password" minlength="6" maxlength="128" autocomplete="new-password" data-profile-password placeholder="Để trống nếu không đổi"><button class="shell-form-password-toggle" type="button" data-password-toggle aria-controls="shell-profile-password" aria-label="Hiện mật khẩu" aria-pressed="false"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M2.75 12s3.35-5.25 9.25-5.25S21.25 12 21.25 12 17.9 17.25 12 17.25 2.75 12 2.75 12Z" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linejoin="round"/><circle cx="12" cy="12" r="2.6" fill="none" stroke="currentColor" stroke-width="1.65"/></svg></button></div>
        <p class="shell-profile-error" data-profile-error hidden></p>
        <button type="submit" class="shell-profile-save">Lưu</button>
      </form>
      <div class="shell-profile-admin-actions" data-profile-admin-actions hidden>
        <button type="button" class="shell-profile-secondary" data-profile-lock></button>
        <button type="button" class="shell-profile-danger" data-profile-delete>Xóa tài khoản</button>
      </div>
      <div class="shell-profile-confirm" data-profile-delete-confirm hidden>
        <div class="shell-profile-confirm-card" role="alertdialog" aria-labelledby="profile-delete-title" aria-describedby="profile-delete-copy">
          <strong id="profile-delete-title">Xóa tài khoản?</strong>
          <p id="profile-delete-copy">Tài khoản sẽ bị đăng xuất và không thể đăng nhập lại.</p>
          <div class="shell-profile-confirm-actions">
            <button type="button" class="shell-profile-secondary" data-profile-delete-cancel>Hủy</button>
            <button type="button" class="shell-profile-danger-solid" data-profile-delete-confirm-action>Xóa</button>
          </div>
        </div>
      </div>
    </section>`;

  const title=wrap.querySelector('.shell-profile-header h2');
  const nameInput=wrap.querySelector('[data-profile-name]');
  const usernameInput=wrap.querySelector('[data-profile-username]');
  const passwordInput=wrap.querySelector('[data-profile-password]');
  const avatar=wrap.querySelector('[data-profile-avatar]');
  const fileInput=wrap.querySelector('[data-profile-avatar-file]');
  const errorNode=wrap.querySelector('[data-profile-error]');
  const adminActions=wrap.querySelector('[data-profile-admin-actions]');
  const lockButton=wrap.querySelector('[data-profile-lock]');
  const deleteButton=wrap.querySelector('[data-profile-delete]');
  const deleteConfirm=wrap.querySelector('[data-profile-delete-confirm]');
  const deleteCancel=wrap.querySelector('[data-profile-delete-cancel]');
  const deleteConfirmAction=wrap.querySelector('[data-profile-delete-confirm-action]');
  const saveButton=wrap.querySelector('.shell-profile-save');

  title.textContent=selfMode?'Đổi thông tin':String(model.display_name||model.username||'Người dùng');
  nameInput.value=String(model.display_name||'');
  usernameInput.value=String(model.username||'');
  renderAvatarNode(avatar,model,'TK');

  if(managed){
    adminActions.hidden=false;
    lockButton.textContent=model.locked_at?'Mở khóa tài khoản':'Khóa tài khoản';
  }

  function setError(message=''){
    errorNode.textContent=message;
    errorNode.hidden=!message;
  }

  function setProfileInvalid(input,invalid=true){
    if(!input)return;
    if(invalid)input.setAttribute('aria-invalid','true');
    else input.removeAttribute('aria-invalid');
  }

  function clearProfileValidation(){
    setError('');
    for(const input of [nameInput,usernameInput,passwordInput])setProfileInvalid(input,false);
  }

  function markProfileResultError(message=''){
    const text=String(message||'');
    if(text.includes('Tên đăng nhập'))setProfileInvalid(usernameInput,true);
    else if(text.includes('Mật khẩu'))setProfileInvalid(passwordInput,true);
    else if(text.startsWith('Tên'))setProfileInvalid(nameInput,true);
    setError(text||'Không thể lưu thay đổi');
  }

  for(const input of [nameInput,usernameInput,passwordInput]){
    input.addEventListener('input',()=>{
      setProfileInvalid(input,false);
      if(![nameInput,usernameInput,passwordInput].some(node=>node.getAttribute('aria-invalid')==='true'))setError('');
    });
  }

  function setBusy(busy){
    wrap.dataset.busy=String(Boolean(busy));
    wrap.setAttribute('aria-busy',String(Boolean(busy)));
    for(const control of wrap.querySelectorAll('input,button'))control.disabled=Boolean(busy);
  }


  function applyProfileResult(result){
    const next=result?.account||null;
    if(!next)return;
    Object.assign(model,next);
    title.textContent=selfMode?'Đổi thông tin':String(model.display_name||model.username||'Người dùng');
    nameInput.value=String(model.display_name||'');
    usernameInput.value=String(model.username||'');
    passwordInput.value='';
    fileInput.value='';
    if(profilePreviewUrl){URL.revokeObjectURL(profilePreviewUrl);profilePreviewUrl='';}
    renderAvatarNode(avatar,model,'TK');
    if(managed)lockButton.textContent=model.locked_at?'Mở khóa tài khoản':'Khóa tài khoản';
  }

  fileInput.addEventListener('change',()=>{
    const file=fileInput.files?.[0]||null;
    if(!file)return;
    if(!['image/png','image/jpeg','image/webp'].includes(String(file.type||'').toLowerCase())){
      setError('Chỉ dùng ảnh PNG, JPG hoặc WebP');fileInput.value='';return;
    }
    if(file.size>2*1024*1024){setError('Ảnh tối đa 2 MB');fileInput.value='';return;}
    if(profilePreviewUrl)URL.revokeObjectURL(profilePreviewUrl);
    profilePreviewUrl=URL.createObjectURL(file);
    delete avatar.dataset.avatarFailedUrl;
    avatar.dataset.avatarSignature=`preview|${profilePreviewUrl}`;
    if(!renderAvatarImage(avatar,profilePreviewUrl,String(nameInput.value||model.display_name||model.username||''),'TK')){
      renderAvatarInitials(avatar,String(nameInput.value||model.display_name||model.username||''),'TK');
    }
    setError('');
  });

  usernameInput.addEventListener('blur',()=>{
    usernameInput.value=usernameInput.value.trim().replace(/^@/,'').toLowerCase();
  });

    wrap.querySelector('.shell-profile-backdrop').addEventListener('click',closeProfileEditor);
  wrap.querySelector('.shell-profile-close').addEventListener('click',closeProfileEditor);

  wrap.querySelector('[data-profile-form]').addEventListener('submit',async event=>{
    event.preventDefault();
    clearProfileValidation();
    const store=profileStore();
    if(!store){setError('Không thể mở hồ sơ');return;}
    const payload={
      username:usernameInput.value.trim().replace(/^@/,'').toLowerCase(),
      displayName:nameInput.value.trim(),
      password:passwordInput.value,
      avatarFile:fileInput.files?.[0]||null
    };
    if(!payload.displayName){
      setProfileInvalid(nameInput,true);
      setError('Tên không được để trống');
      nameInput.focus({preventScroll:true});
      return;
    }
    if(!/^[a-z0-9_]{3,24}$/.test(payload.username)){
      setProfileInvalid(usernameInput,true);
      setError('Tên đăng nhập phải có 3–24 ký tự, chỉ gồm a-z, 0-9 và _');
      usernameInput.focus({preventScroll:true});
      return;
    }
    if(payload.password&&payload.password.length<6){
      setProfileInvalid(passwordInput,true);
      setError('Mật khẩu tối thiểu 6 ký tự');
      passwordInput.focus({preventScroll:true});
      return;
    }
    setBusy(true);
    try{
      const result=selfMode
        ?await store.updateSelf(payload)
        :await store.adminSaveUser({...payload,targetAccountId:String(model.id)});
      if(!result?.ok){markProfileResultError(result?.message||'Không thể lưu thay đổi');return;}
      applyProfileResult(result);
      closeProfileEditor();
    }catch(error){markProfileResultError(String(error?.message||'Không thể lưu thay đổi'));}
    finally{setBusy(false);}
  });

  lockButton?.addEventListener('click',async()=>{
    if(!managed)return;
    setBusy(true);setError('');
    try{
      const nextLocked=!Boolean(model.locked_at);
      const result=await profileStore()?.adminSetLocked?.({targetAccountId:String(model.id),locked:nextLocked});
      if(!result?.ok){setError(result?.message||'Không thể đổi trạng thái');return;}
      applyProfileResult(result);
      closeProfileEditor();
    }catch(error){setError(String(error?.message||'Không thể đổi trạng thái'));}
    finally{setBusy(false);}
  });

  deleteButton?.addEventListener('click',()=>{
    if(!managed)return;
    deleteConfirm.hidden=false;
    window.setTimeout(()=>deleteCancel?.focus?.({preventScroll:true}),0);
  });
  deleteCancel?.addEventListener('click',()=>{deleteConfirm.hidden=true;deleteButton?.focus?.({preventScroll:true});});
  deleteConfirmAction?.addEventListener('click',async()=>{
    if(!managed)return;
    setBusy(true);setError('');
    try{
      const result=await profileStore()?.adminDeleteUser?.({targetAccountId:String(model.id)});
      if(!result?.ok){deleteConfirm.hidden=true;setError(result?.message||'Không thể xóa tài khoản');return;}
      if(activeContact?.id&&String(activeContact.id)===String(model.id))setActiveContact(null,null);
      closeProfileEditor();
    }catch(error){deleteConfirm.hidden=true;setError(String(error?.message||'Không thể xóa tài khoản'));}
    finally{if(profileOverlay)setBusy(false);}
  });

  if(!globalOverlayRoot){
    unlockProfileBackground({restoreFocus:false});
    return null;
  }
  globalOverlayRoot.appendChild(wrap);
  profileOverlay=wrap;
  if(shouldAutoFocusShellForm()){
    window.setTimeout(()=>nameInput.focus({preventScroll:true}),0);
  }
  return wrap;
}

function openSelfProfile(){
  if(authState!=='AUTHENTICATED'||!authAccount)return AuthUI.openLogin();
  return buildProfileEditor({mode:'self',account:authAccount});
}

function openManagedProfile(item){
  if(authState!=='AUTHENTICATED'||authAccount?.role!=='admin'||item?.role!=='user')return null;
  return buildProfileEditor({mode:'admin',account:item});
}

function findRenderedContactRow(id){
  return [...document.querySelectorAll('[data-contact-row]')].find(row=>String(row.dataset.contactId)===String(id))||null;
}

function createRenderedContactRow(item){
  const row=document.createElement('div');
  row.className='shell-contact-row';
  row.dataset.contactRow='';
  row.dataset.contactId=String(item.id);
  row.dataset.active=String(Boolean(activeContact?.id)&&String(activeContact.id)===String(item.id));
  row.dataset.locked=String(Boolean(item.locked_at));

  const button=document.createElement('button');
  button.className='shell-contact-chat';
  button.type='button';
  button.dataset.contactSelect='';
  button.dataset.contactId=String(item.id);
  button.dataset.contactName=String(item.display_name||item.username||'Liên hệ');

  const avatarWrap=document.createElement('span');avatarWrap.className='shell-contact-avatar-wrap';
  const avatar=document.createElement('span');avatar.className='contact-avatar-source shell-contact-avatar';
  renderAvatarNode(avatar,item,'L');
  const unread=document.createElement('span');unread.className='shell-contact-unread-dot';unread.hidden=!Boolean(item.has_unread);unread.setAttribute('aria-hidden','true');
  avatarWrap.append(avatar,unread);

  const copy=document.createElement('span');copy.className='shell-contact-copy';
  const title=document.createElement('strong');title.className='shell-contact-name';title.textContent=String(item.display_name||item.username||'Liên hệ');
  const preview=document.createElement('span');preview.className='shell-contact-preview';
  const previewText=contactPreview(item);
  preview.textContent=item.locked_at?(previewText==='Chưa có tin nhắn'?'Đã khóa':`Đã khóa · ${previewText}`):previewText;
  copy.append(title,preview);

  const time=document.createElement('time');time.className='shell-contact-time';time.textContent=formatContactTime(item.latest_at);if(item.latest_at)time.dateTime=String(item.latest_at);
  button.append(avatarWrap,copy,time);
  row.appendChild(button);

  if(authAccount?.role==='admin'&&item.role==='user'){
    const manage=document.createElement('button');
    manage.type='button';manage.className='shell-contact-manage';manage.dataset.contactManage='';manage.dataset.contactId=String(item.id);manage.setAttribute('aria-label',`Quản lý ${title.textContent}`);manage.textContent='⋯';
    row.appendChild(manage);
  }
  return row;
}

function patchRenderedContact(item){
  if(!item?.id)return false;
  const row=findRenderedContactRow(item.id);
  if(!row)return false;
  row.dataset.locked=String(Boolean(item.locked_at));
  const button=row.querySelector('[data-contact-select]');
  if(button){button.dataset.contactName=String(item.display_name||item.username||'Liên hệ');}
  const avatar=row.querySelector('.shell-contact-avatar');
  if(avatar)renderAvatarNode(avatar,item,'L');
  const unread=row.querySelector('.shell-contact-unread-dot');
  if(unread)unread.hidden=!Boolean(item.has_unread);
  const title=row.querySelector('.shell-contact-name');
  if(title)title.textContent=String(item.display_name||item.username||'Liên hệ');
  const preview=row.querySelector('.shell-contact-preview');
  if(preview){
    const previewText=contactPreview(item);
    preview.textContent=item.locked_at?(previewText==='Chưa có tin nhắn'?'Đã khóa':`Đã khóa · ${previewText}`):previewText;
  }
  const time=row.querySelector('.shell-contact-time');
  if(time){time.textContent=formatContactTime(item.latest_at);if(item.latest_at)time.dateTime=String(item.latest_at);else time.removeAttribute('datetime');}
  const manage=row.querySelector('[data-contact-manage]');
  if(manage)manage.setAttribute('aria-label',`Quản lý ${String(item.display_name||item.username||'Liên hệ')}`);
  return true;
}

function shouldAutoFocusShellForm(){
  const runtimeMobile=window.V21RuntimeAdapter?.isMobile?.();
  if(runtimeMobile===true)return false;
  return !Boolean(
    Number(navigator.maxTouchPoints||0)>0 ||
    window.matchMedia?.('(pointer:coarse)')?.matches ||
    /iPhone|iPad|iPod|Android/i.test(navigator.userAgent||'')
  );
}

function setPasswordVisibility(input,button,visible){
  if(!input)return false;
  const show=Boolean(visible);
  input.type=show?'text':'password';
  input.dataset.passwordVisible=String(show);
  if(button){
    button.setAttribute('aria-pressed',String(show));
    button.setAttribute('aria-label',show?'Ẩn mật khẩu':'Hiện mật khẩu');
  }
  return show;
}

const AuthUI={
  openLogin(){
    NavigationCommand.openChat();
    this.setMode('login');
    const card=document.getElementById('guestAuthThread');
    if(shouldAutoFocusShellForm()){
      window.setTimeout(()=>authField('account')?.focus({preventScroll:true}),180);
    }
    return Boolean(card);
  },
  setMode(mode){
    authMode=mode==='register'?'register':'login';
    const card=document.getElementById('guestAuthThread');
    if(card)card.dataset.authMode=authMode;
    const title=document.getElementById('guest-auth-title');
    const primary=document.querySelector('[data-auth-primary-label]');
    const secondary=document.querySelector('[data-auth-secondary-label]');
    const switchPrefix=document.querySelector('[data-auth-switch-prefix]');
    const password=authField('password');
    const passwordToggle=document.querySelector('#guestAuthThread [data-password-toggle]');
    if(title)title.textContent=authMode==='register'?'Đăng ký':'Đăng nhập';
    if(primary)primary.textContent='Tiếp tục';
    if(secondary)secondary.textContent=authMode==='register'?'Về đăng nhập':'Tạo tài khoản';
    if(switchPrefix)switchPrefix.textContent=authMode==='register'?'Đã có tài khoản?':'Chưa có tài khoản?';
    if(password){
      password.autocomplete=authMode==='register'?'new-password':'current-password';
      setPasswordVisibility(password,passwordToggle,false);
    }
    clearAuthErrors();
    return authMode;
  },
  setError(code){
    clearAuthErrors();
    if(code==='invalid_credentials'){
      setFieldInvalid('account');
      setFieldInvalid('password');
      return;
    }
    if(code==='account_exists'){
      setFieldInvalid('account');
      return;
    }
    if(code==='weak_password'){
      setFieldInvalid('password');
      return;
    }
    if(code==='invalid_password'){
      setFieldInvalid('password');
      return;
    }
    if(code==='invalid_display_name'){
      setFieldInvalid('name');
      return;
    }
    if(code==='invalid_username'||code==='registration_failed'||code==='account_create_failed'){
      setFieldInvalid('account');
      return;
    }
    setFieldInvalid(authMode==='register'?'account':'password');
  },
  renderAccountFooter(){
    const footer=document.querySelector('[data-sidebar-account-footer]');
    if(!footer)return;
    const name=footer.querySelector('[data-account-name]');
    const handle=footer.querySelector('[data-account-handle]');
    const avatar=footer.querySelector('[data-account-avatar]');
    const action=footer.querySelector('[data-auth-command]');
    const actionLabel=footer.querySelector('[data-account-action-label]');
    const selfButtons=[...footer.querySelectorAll('[data-account-self-edit]')];
    const authenticated=authState==='AUTHENTICATED'&&authAccount;
    footer.dataset.state=authenticated?'authenticated':'guest';
    if(authenticated){
      if(name)name.textContent=String(authAccount.display_name||authAccount.username||'Tài khoản');
      if(handle)handle.textContent=authAccount.username?`@${String(authAccount.username).replace(/^@/,'')}`:'';
      renderAvatarNode(avatar,authAccount,'TK');
      for(const selfButton of selfButtons){selfButton.disabled=false;selfButton.setAttribute('aria-label','Đổi thông tin tài khoản');}
      if(action)action.dataset.authCommand='logout';
      if(actionLabel)actionLabel.textContent='Đăng xuất';
    }else{
      if(name)name.textContent='Vãng lai';
      if(handle)handle.textContent='Chưa đăng nhập';
      renderAvatarNode(avatar,null,'?');
      for(const selfButton of selfButtons){selfButton.disabled=false;selfButton.setAttribute('aria-label','Đăng nhập');}
      if(action)action.dataset.authCommand='login.open';
      if(actionLabel)actionLabel.textContent='Đăng nhập';
    }
  },
  renderContacts(contacts=[]){
    const host=document.querySelector('[data-v21-contact-list]');
    if(!host)return;
    const scrollHost=host.closest('.wm-sidebar-body');
    const previousScrollTop=scrollHost?.scrollTop||0;
    const items=Array.isArray(contacts)?contacts.filter(item=>item&&item.id&&!item.deleted_at):[];
    const existingById=new Map(
      [...host.querySelectorAll('[data-contact-row]')].map(row=>[String(row.dataset.contactId||''),row])
    );
    host.querySelector('.shell-contact-empty')?.remove();

    if(items.length===0){
      for(const row of existingById.values())row.remove();
      const empty=document.createElement('div');
      empty.className='shell-contact-empty';
      empty.textContent=authState==='AUTHENTICATED'?'Chưa có liên hệ':'Đăng nhập để xem danh bạ';
      host.appendChild(empty);
      // Renderer owns DOM only. Navigation/session owner decides whether the
      // active contact should change when the list becomes empty.
      if(scrollHost)scrollHost.scrollTop=previousScrollTop;

(()=>{
'use strict';

const RELEASE_VERSION='V21.72.23';
const MODULE_CONTRACT_VERSION='call-screen-wake-lock-v1';

let callActive=false;
let sentinel=null;
let requestPromise=null;
let generation=0;

function supported(){
  return Boolean(navigator?.wakeLock&&typeof navigator.wakeLock.request==='function');
}

function visible(){
  return document.visibilityState!=='hidden';
}

function shouldHold(){
  return callActive&&visible();
}

async function release(reason='release'){
  generation+=1;
  const current=sentinel;
  sentinel=null;
  if(current&&!current.released){
    try{await current.release();}catch{}
  }
  return true;
}

async function acquire(reason='acquire'){
  if(!shouldHold()||!supported())return false;
  if(sentinel&&!sentinel.released)return true;
  if(requestPromise)return requestPromise;

  const token=generation;
  requestPromise=(async()=>{
    try{
      const lock=await navigator.wakeLock.request('screen');
      if(token!==generation||!shouldHold()){
        try{if(!lock.released)await lock.release();}catch{}
        return false;
      }
      sentinel=lock;
      lock.addEventListener?.('release',()=>{
        if(sentinel===lock)sentinel=null;
      },{once:true});
      return true;
    }catch{
      return false;
    }finally{
      requestPromise=null;
    }
  })();
  return requestPromise;
}

function sync(reason='sync'){
  return shouldHold()?acquire(reason):release(reason);
}

function setCallState(state){
  callActive=String(state||'')==='ACTIVE_AUDIO';
  void sync('call-state');
  return callActive;
}

document.addEventListener('call-state',event=>{
  setCallState(event.detail?.state);
});

document.addEventListener('visibilitychange',()=>{
  void sync('visibilitychange');
});

document.addEventListener('v21-auth-state',event=>{
  if(event.detail?.state==='AUTHENTICATED')return;
  callActive=false;
  void release('auth-reset');
});

window.addEventListener('pagehide',()=>{
  callActive=false;
  void release('pagehide');
});

window.V21CallScreenWakeLock=Object.freeze({
  version:RELEASE_VERSION,
  contract:MODULE_CONTRACT_VERSION,
  supported,
  snapshot(){
    return{
      callActive,
      held:Boolean(sentinel&&!sentinel.released),
      pending:Boolean(requestPromise),
      visible:visible()
    };
  }
});
})();

<script data-inlined-source="shell-form-viewport-policy.js">
(()=>{
'use strict';

const RELEASE_VERSION='V21.72.23';
const MODULE_CONTRACT_VERSION='shell-form-viewport-v3';
const KEYBOARD_THRESHOLD_PX=80;
const EDGE_PX=12;

const vv=window.visualViewport||null;
let restingVisualHeight=Math.max(1,Math.round(vv?.height||window.innerHeight||1));
let activeField=null;
let activeOwner=null;
let frame=0;

function mobileRuntime(){
  return Boolean(
    Number(navigator.maxTouchPoints||0)>0 ||
    window.matchMedia?.('(pointer:coarse)')?.matches ||
    /iPhone|iPad|iPod|Android/i.test(navigator.userAgent||'')
  );
}

function isFormField(node){
  return Boolean(node?.matches?.('input,textarea,select,[contenteditable="true"]'));
}

function ownerFor(node){
  if(!isFormField(node))return null;

  const profileCard=node.closest?.('.shell-profile-card')||null;
  if(profileCard){
    const overlay=profileCard.closest?.('.shell-profile-overlay')||null;
    if(overlay)return{kind:'profile',surface:profileCard,host:overlay};
  }

  const auth=node.closest?.('#guestAuthThread')||null;
  if(auth)return{kind:'auth',surface:auth,host:auth};

  return null;
}

function sameOwner(a,b){
  return Boolean(a&&b&&a.kind===b.kind&&a.surface===b.surface&&a.host===b.host);
}

function nodesFor(owner){
  return owner?[...new Set([owner.host,owner.surface].filter(Boolean))]:[];
}

function clearKeyboardState(owner){
  for(const node of nodesFor(owner)){
    delete node.dataset.mobileKeyboard;
    node.style?.removeProperty?.('--shell-form-keyboard-inset');
  }
}

function clearOwner(owner){
  if(!owner)return;
  clearKeyboardState(owner);
  for(const node of nodesFor(owner)){
    node.style?.removeProperty?.('--shell-form-vv-top');
    node.style?.removeProperty?.('--shell-form-vv-height');
  }
}

function readViewport(){
  const visualTop=Math.max(0,Math.round(vv?.offsetTop||0));
  const visualHeight=Math.max(1,Math.round(vv?.height||window.innerHeight||1));
  const visualBottom=visualTop+visualHeight;

  const rawDrop=Math.max(0,restingVisualHeight-visualHeight);
  if(!activeField||rawDrop<KEYBOARD_THRESHOLD_PX){
    restingVisualHeight=Math.max(restingVisualHeight,visualHeight);
  }

  const heightDrop=Math.max(0,restingVisualHeight-visualHeight);
  return{
    visualTop,
    visualHeight,
    visualBottom,
    occlusion:heightDrop,
    keyboardOpen:Boolean(
      vv &&
      mobileRuntime() &&
      activeField &&
      heightDrop>=KEYBOARD_THRESHOLD_PX
    )
  };
}

function publishViewport(owner,state){
  if(!owner||!state)return;
  for(const node of nodesFor(owner)){
    node.style.setProperty('--shell-form-vv-top',`${state.visualTop}px`);
    node.style.setProperty('--shell-form-vv-height',`${state.visualHeight}px`);
  }
}

function actionFor(owner){
  if(owner?.kind==='profile')return owner.surface.querySelector?.('.shell-profile-save')||null;
  if(owner?.kind==='auth')return owner.surface.querySelector?.('.guest-auth-primary')||null;
  return null;
}

function revealWithinOwner(owner,field,state){
  if(!owner?.surface||!field?.getBoundingClientRect||!state)return false;

  const surface=owner.surface;
  const surfaceRect=surface.getBoundingClientRect();
  const fieldRect=field.getBoundingClientRect();
  if(!surfaceRect||!fieldRect)return false;

  const visibleTop=Math.max(surfaceRect.top+EDGE_PX,state.visualTop+EDGE_PX);
  const visibleBottom=Math.min(surfaceRect.bottom-EDGE_PX,state.visualBottom-EDGE_PX);
  if(visibleBottom<=visibleTop)return false;

  let revealTop=fieldRect.top;
  let revealBottom=fieldRect.bottom;

  const action=actionFor(owner);
  const actionRect=action?.getBoundingClientRect?.()||null;
  if(actionRect){
    const clusterTop=Math.min(revealTop,actionRect.top);
    const clusterBottom=Math.max(revealBottom,actionRect.bottom);
    const available=Math.max(1,visibleBottom-visibleTop);
    if(clusterBottom-clusterTop<=available){
      revealTop=clusterTop;
      revealBottom=clusterBottom;
    }
  }

  let delta=0;
  if(revealBottom>visibleBottom)delta=revealBottom-visibleBottom;
  else if(revealTop<visibleTop)delta=revealTop-visibleTop;
  if(!delta)return false;

  surface.scrollTop=Math.max(0,Number(surface.scrollTop||0)+delta);
  return true;
}

function publish(){
  frame=0;
  const nextOwner=ownerFor(activeField);

  if(activeOwner&&!sameOwner(activeOwner,nextOwner))clearOwner(activeOwner);
  activeOwner=nextOwner;
  if(!activeOwner)return false;

  const state=readViewport();
  publishViewport(activeOwner,state);

  if(!state.keyboardOpen){
    clearKeyboardState(activeOwner);
    return false;
  }

  activeOwner.host.dataset.mobileKeyboard='true';
  activeOwner.surface.dataset.mobileKeyboard='true';
  activeOwner.surface.style.setProperty(
    '--shell-form-keyboard-inset',
    `${Math.max(0,Math.round(state.occlusion))}px`
  );

  requestAnimationFrame(()=>{
    if(!activeOwner||!activeField)return;
    revealWithinOwner(activeOwner,activeField,state);
  });
  return true;
}

function schedule(){
  if(frame)return;
  frame=requestAnimationFrame(publish);
}

function onFocusIn(event){
  const owner=ownerFor(event.target);
  if(!owner)return;
  activeField=event.target;
  schedule();
}

function onFocusOut(){
  requestAnimationFrame(()=>{
    const next=document.activeElement;
    const owner=ownerFor(next);
    if(owner){
      activeField=next;
      schedule();
      return;
    }
    activeField=null;
    clearOwner(activeOwner);
    activeOwner=null;
  });
}

function refresh(){
  const next=document.activeElement;
  activeField=ownerFor(next)?next:null;
  schedule();
}

document.addEventListener('focusin',onFocusIn,true);
document.addEventListener('focusout',onFocusOut,true);
vv?.addEventListener('resize',schedule,{passive:true});
vv?.addEventListener('scroll',schedule,{passive:true});
window.addEventListener('orientationchange',()=>{
  restingVisualHeight=Math.max(1,Math.round(vv?.height||window.innerHeight||1));
  schedule();
},{passive:true});

window.V21ShellFormViewportPolicy=Object.freeze({
  version:RELEASE_VERSION,
  moduleContractVersion:MODULE_CONTRACT_VERSION,
  refresh,
  snapshot:()=>({
    active:Boolean(activeOwner),
    kind:activeOwner?.kind||null,
    keyboardOpen:Boolean(activeOwner?.host?.dataset?.mobileKeyboard==='true'),
    restingVisualHeight
  })
});
})();

</script>

  },
  async refresh(){
    if(state!=='AUTHENTICATED'){
      this.clear();
      return [];
    }
    return window.V21SyncEngine?.syncContacts?.()||this.snapshot();
  },
  snapshot(){return this.contacts.map(item=>({...item}));}
};


function avatarUrl(path){
  if(!client||!path)return'';
  try{return client.storage.from('v21-avatars').getPublicUrl(String(path)).data?.publicUrl||'';}catch{return'';}
}

async function uploadAvatar(targetAccountId,file){
  if(!client||!targetAccountId||!file)return null;
  if(!AVATAR_TYPES.has(String(file.type||'').toLowerCase()))throw new Error('invalid_avatar');
  if(Number(file.size)>2*1024*1024)throw new Error('avatar_too_large');
  const ext=String(file.type||'image/webp').split('/')[1]?.replace('jpeg','jpg')||'webp';
  const path=`${String(targetAccountId)}/${Date.now()}-${window.V21RuntimeId.create()}.${ext}`;
  const {error}=await client.storage.from('v21-avatars').upload(path,file,{cacheControl:'3600',upsert:false,contentType:file.type||undefined});
  if(error)throw error;
  return path;
}

async function removeAvatar(path){
  if(!client||!path)return false;
  try{const {error}=await client.storage.from('v21-avatars').remove([String(path)]);return !error;}catch{return false;}
}

function profileError(error,fallback='Không thể lưu thay đổi'){
  const raw=String(error?.message||error?.code||error||'').toLowerCase();
  if(raw.includes('invalid_display_name'))return'Tên không hợp lệ';
  if(raw.includes('invalid_username'))return'Tên đăng nhập phải có 3–24 ký tự, chỉ gồm a-z, 0-9 và _';
  if(raw.includes('username_taken'))return'Tên đăng nhập đã được sử dụng';
  if(raw.includes('invalid_password')||raw.includes('password'))return'Mật khẩu tối thiểu 6 ký tự';
  if(raw.includes('avatar_too_large'))return'Ảnh tối đa 2 MB';
  if(raw.includes('invalid_avatar'))return'Chỉ dùng ảnh PNG, JPG hoặc WebP';
  if(raw.includes('admin_required'))return'Bạn không có quyền thực hiện';
  return fallback;
}

async function updateSelf({username,displayName,password='',avatarFile=null}={}){
  if(state!=='AUTHENTICATED'||!account?.id||!appSessionId||!client)return{ok:false,message:'Chưa đăng nhập'};
  let newPath=null;
  const oldPath=account.avatar_path||null;
  const currentUsername=String(account.username||'').toLowerCase();
  const nextUsername=normalizeProfileUsername(username||currentUsername);
  try{
    if(avatarFile)newPath=await uploadAvatar(account.id,avatarFile);
    const body={
      app_session_id:appSessionId,
      username:nextUsername,
      display_name:String(displayName||'').trim(),
      password:password?String(password):undefined
    };
    if(newPath!==null)body.avatar_path=newPath;

    const {data,error}=await client.functions.invoke('v21-account-self',{body});
    if(error)throw error;
    if(!data?.ok)throw new Error(data?.code||'profile_update_failed');

    account={...account,...(data.account||{})};
    authUI()?.setAccount(account);

    if(nextUsername!==currentUsername){
      void client.auth.refreshSession()
        .then(()=>syncRealtimeAuth())
        .catch(()=>false);
    }
    if(newPath&&oldPath&&oldPath!==newPath)void removeAvatar(oldPath);
    document.dispatchEvent(new CustomEvent('v21-account-profile-updated',{detail:{account:{...account}}}));
    void window.V21SyncEngine?.wake?.({reason:'self-profile'});
    return{ok:true,account:{...account}};
  }catch(error){
    if(newPath)void removeAvatar(newPath);
    return{ok:false,message:profileError(error)};
  }
}

async function invokeAdmin(body){
  if(state!=='AUTHENTICATED'||account?.role!=='admin'||!client)return{ok:false,message:'Bạn không có quyền thực hiện'};
  const {data,error}=await client.functions.invoke('v21-account-admin',{body});
  if(error)return{ok:false,message:profileError(error)};
  if(!data?.ok)return{ok:false,message:profileError(data?.code||'admin_update_failed')};
  return{ok:true,account:data.account||null};
}

async function adminSaveUser({targetAccountId,username,displayName,password='',avatarFile=null}={}){
  const target=ContactStore.contacts.find(row=>String(row.id)===String(targetAccountId));
  if(!target||target.role!=='user')return{ok:false,message:'Người dùng không tồn tại'};
  let newPath=null;
  const oldPath=target.avatar_path||null;
  try{
    if(avatarFile)newPath=await uploadAvatar(targetAccountId,avatarFile);
    const result=await invokeAdmin({
      action:'save',
      target_account_id:String(targetAccountId),
      username:String(username||'').trim(),
      display_name:String(displayName||'').trim(),
      avatar_path:newPath===null?undefined:newPath,
      password:password?String(password):undefined
    });
    if(!result.ok){if(newPath)void removeAvatar(newPath);return result;}
    if(result.account)ContactStore.upsert({...target,...result.account});
    if(newPath&&oldPath&&oldPath!==newPath)void removeAvatar(oldPath);
    void window.V21SyncEngine?.wake?.({reason:'admin-profile'});
    return result;
  }catch(error){
    if(newPath)void removeAvatar(newPath);
    return{ok:false,message:profileError(error)};
  }
}

async function adminSetLocked({targetAccountId,locked}={}){
  const target=ContactStore.contacts.find(row=>String(row.id)===String(targetAccountId));
  if(!target||target.role!=='user')return{ok:false,message:'Người dùng không tồn tại'};
  const result=await invokeAdmin({action:'lock',target_account_id:String(targetAccountId),locked:Boolean(locked)});
  if(result.ok&&result.account)ContactStore.upsert({...target,...result.account});
  void window.V21SyncEngine?.wake?.({reason:'admin-lock'});
  return result;
}

async function adminDeleteUser({targetAccountId}={}){
  const target=ContactStore.contacts.find(row=>String(row.id)===String(targetAccountId));
  if(!target||target.role!=='user')return{ok:false,message:'Người dùng không tồn tại'};
  const result=await invokeAdmin({action:'delete',target_account_id:String(targetAccountId)});
  if(result.ok)ContactStore.remove(targetAccountId);
  void window.V21SyncEngine?.wake?.({reason:'admin-delete'});
  return result;
}

const AccountProfileStore={
  version:RELEASE_VERSION,moduleContractVersion:MODULE_CONTRACT_VERSION,
  avatarUrl,updateSelf,adminSaveUser,adminSetLocked,adminDeleteUser,
  snapshot(){return{account:account?{...account}:null,state};}
};

async function bootstrap(){
  if(!client)return false;
  const {data:{session}}=await client.auth.getSession();
  if(!session){renderGuest();return false;}
  const {data,error}=await client.rpc('v21_auth_bootstrap',{
    p_device_key:getDeviceKey(),p_label:deviceLabel(),p_platform:platformLabel()
  });
  if(error){
    await client.auth.signOut({scope:'local'}).catch(()=>{});
    renderGuest();
    return false;
  }
  renderAuthenticated(data);
  startHeartbeat();
  return true;
}

async function login({account:username,password}){
  if(busy||!client)return false;
  setBusy(true);
  try{
    const user=normalizeUsername(username);
    const {error}=await client.auth.signInWithPassword({email:`${user}@taphoa.chat`,password:String(password??'')});
    if(error)throw error;
    const ok=await bootstrap();
    if(!ok)throw new Error('invalid_credentials');
    return true;
  }catch(error){
    authUI()?.setError(mapError(error,'invalid_credentials'));
    return false;
  }finally{setBusy(false);}
}

async function register({name,account:username,password}){
  if(busy||!client)return false;
  setBusy(true);
  try{
    const user=normalizeUsername(username);
    const response=await fetch(`${SUPABASE_URL}/functions/v1/v21-register`,{
      method:'POST',
      headers:{'Content-Type':'application/json','apikey':SUPABASE_PUBLISHABLE_KEY},
      body:JSON.stringify({username:user,display_name:String(name??'').trim(),password:String(password??'')})
    });
    const payload=await response.json().catch(()=>({ok:false,code:'registration_failed'}));
    if(!response.ok||!payload?.ok){
      const code=payload?.code==='username_taken'?'account_exists':payload?.code;
      authUI()?.setError(code||'registration_failed');
      return false;
    }
    const {error}=await client.auth.signInWithPassword({email:`${user}@taphoa.chat`,password:String(password??'')});
    if(error)throw error;
    const ok=await bootstrap();
    if(!ok)throw new Error('registration_failed');
    return true;
  }catch(error){
    authUI()?.setError(mapError(error,'registration_failed'));
    return false;
  }finally{setBusy(false);}
}

async function logout(){
  if(busy||!client)return false;
  setBusy(true);
  try{
    const logoutAppSessionId=appSessionId||null;
    await window.V21CallEngine?.stopCurrent?.({reason:'logout'});
    window.V21CallEngine?.clearLocal?.('logout');
    shell()?.CallCommand?.forceReset?.();
    const logoutAccountId=account?.id||null;
    shell()?.ScreenSession?.clear?.(logoutAccountId);
    clearHeartbeat();
    if(logoutAccountId)await window.V21SyncEngine?.clearAccount?.(logoutAccountId);

    let serverLogoutConfirmed=false;
    if(logoutAppSessionId){
      try{
        const {error}=await client.rpc('v21_auth_logout',{p_app_session_id:logoutAppSessionId});
        serverLogoutConfirmed=!error;
      }catch{}
    }
    // Once the server confirms revocation, its call-cleanup trigger is the
    // canonical owner of any call that could not be ended before logout.
    if(serverLogoutConfirmed&&logoutAppSessionId){
      window.V21CallEngine?.clearPersistedPendingEnd?.(logoutAppSessionId);
    }

    // Local only: a revoked old browser must never revoke the newer browser's Supabase session.
    await client.auth.signOut({scope:'local'});
    renderGuest();
    return true;
  }finally{setBusy(false);}
}

function initClient(){
  if(!window.supabase?.createClient){
    state='ERROR';
    renderGuest();
    return false;
  }
  client=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{
    auth:{
      persistSession:true,
      autoRefreshToken:true,
      detectSessionInUrl:false,
      storageKey:AUTH_STORAGE_KEY
    }
  });

  client.auth.onAuthStateChange((event,session)=>{
    if(event==='SIGNED_OUT'&&!handlingRevoke){
      clearHeartbeat();
      renderGuest();
    }
    if(event==='TOKEN_REFRESHED'&&state==='AUTHENTICATED'){
      document.dispatchEvent(new CustomEvent('v21-auth-token-refreshed',{detail:{accessToken:session?.access_token||null}}));
      void heartbeat();
    }
  });
  return true;
}

async function boot(){
  state='BOOTING';
  if(!initClient())return false;
  return bootstrap();
}

window.V21ContactStore=ContactStore;
window.V21AccountProfileStore=AccountProfileStore;
window.V21AuthSessionStore={
  version:RELEASE_VERSION,moduleContractVersion:MODULE_CONTRACT_VERSION,
  boot,login,register,logout,heartbeat,syncRealtimeAuth,handleRevoked,
  getClient(){return client;},
  snapshot(){return{state,account:account?{...account}:null,appSessionId,deviceId,busy,deviceKey:getDeviceKey()};}
};

void boot();
})();


</script>
<script data-inlined-source="v21-cache-store.js">
(()=>{
'use strict';

const VERSION='V21.71';
const DB_NAME='taphoa-v21-cache';
const DB_VERSION=1;
let dbPromise=null;

function req(request){
  return new Promise((resolve,reject)=>{
    request.onsuccess=()=>resolve(request.result);
    request.onerror=()=>reject(request.error||new Error('idb_request_failed'));
  });
}

function txDone(tx){
  return new Promise((resolve,reject)=>{
    tx.oncomplete=()=>resolve(true);
    tx.onabort=()=>reject(tx.error||new Error('idb_tx_aborted'));
    tx.onerror=()=>reject(tx.error||new Error('idb_tx_failed'));
  });
}

function open(){
  if(dbPromise)return dbPromise;
  if(!('indexedDB' in window)){
    dbPromise=Promise.reject(new Error('indexeddb_unavailable'));
    return dbPromise;
  }
  dbPromise=new Promise((resolve,reject)=>{
    const request=indexedDB.open(DB_NAME,DB_VERSION);
    request.onupgradeneeded=()=>{
      const db=request.result;
      if(!db.objectStoreNames.contains('meta')){
        const store=db.createObjectStore('meta',{keyPath:'key'});
        store.createIndex('by_account','account_id',{unique:false});
      }
      if(!db.objectStoreNames.contains('contacts')){
        const store=db.createObjectStore('contacts',{keyPath:'cache_key'});
        store.createIndex('by_account','account_id',{unique:false});
      }
      if(!db.objectStoreNames.contains('messages')){
        const store=db.createObjectStore('messages',{keyPath:'cache_key'});
        store.createIndex('by_account','account_id',{unique:false});
        store.createIndex('by_account_conversation_created',['account_id','conversation_id','created_at'],{unique:false});
      }
      if(!db.objectStoreNames.contains('read_states')){
        const store=db.createObjectStore('read_states',{keyPath:'cache_key'});
        store.createIndex('by_account','owner_account_id',{unique:false});
      }
      if(!db.objectStoreNames.contains('outbox')){
        const store=db.createObjectStore('outbox',{keyPath:'cache_key'});
        store.createIndex('by_account_created',['account_id','created_at'],{unique:false});
        store.createIndex('by_account_contact',['account_id','contact_id'],{unique:false});
      }
      if(!db.objectStoreNames.contains('media')){
        const store=db.createObjectStore('media',{keyPath:'cache_key'});
        store.createIndex('by_account','account_id',{unique:false});
        store.createIndex('by_account_access',['account_id','last_accessed_at'],{unique:false});
      }
    };
    request.onsuccess=()=>resolve(request.result);
    request.onerror=()=>reject(request.error||new Error('indexeddb_open_failed'));
  });
  return dbPromise;
}

function contactKey(accountId,id){return `${accountId}:contact:${id}`;}
function messageKey(accountId,id){return `${accountId}:message:${id}`;}
function readKey(ownerAccountId,conversationId,accountId){return `${ownerAccountId}:read:${conversationId}:${accountId}`;}
function outboxKey(accountId,clientId){return `${accountId}:outbox:${clientId}`;}
function mediaKey(accountId,assetId){return `${accountId}:media:${assetId}`;}
function metaKey(accountId,name){return `${accountId}:meta:${name}`;}

async function getMeta(accountId,name,fallback=null){
  const db=await open();
  const tx=db.transaction('meta','readonly');
  const row=await req(tx.objectStore('meta').get(metaKey(accountId,name)));
  await txDone(tx);
  return row?.value ?? fallback;
}

async function setMeta(accountId,name,value){
  const db=await open();
  const tx=db.transaction('meta','readwrite');
  tx.objectStore('meta').put({key:metaKey(accountId,name),account_id:String(accountId),name,value,updated_at:Date.now()});
  await txDone(tx);
  return value;
}

async function replaceContacts(accountId,contacts=[]){
  const db=await open();
  const tx=db.transaction('contacts','readwrite');
  const store=tx.objectStore('contacts');
  const index=store.index('by_account');
  await new Promise((resolve,reject)=>{
    const cursor=index.openCursor(IDBKeyRange.only(String(accountId)));
    cursor.onerror=()=>reject(cursor.error||new Error('contacts_cursor_failed'));
    cursor.onsuccess=()=>{
      const c=cursor.result;
      if(!c){resolve();return;}
      c.delete();
      c.continue();
    };
  });
  for(const item of (Array.isArray(contacts)?contacts:[])){
    if(!item?.id)continue;
    store.put({...item,cache_key:contactKey(accountId,item.id),account_id:String(accountId)});
  }
  await txDone(tx);
  return true;
}

async function listContacts(accountId){
  const db=await open();
  const tx=db.transaction('contacts','readonly');
  const rows=await req(tx.objectStore('contacts').index('by_account').getAll(IDBKeyRange.only(String(accountId))));
  await txDone(tx);
  return (rows||[]).map(({cache_key,account_id,...rest})=>rest).sort((a,b)=>String(a.display_name||a.username||'').localeCompare(String(b.display_name||b.username||'')));
}

async function upsertContact(accountId,item){
  if(!item?.id)return false;
  const db=await open();
  const tx=db.transaction('contacts','readwrite');
  tx.objectStore('contacts').put({...item,cache_key:contactKey(accountId,item.id),account_id:String(accountId)});
  await txDone(tx);
  return true;
}

async function removeContact(accountId,id){
  const db=await open();
  const tx=db.transaction('contacts','readwrite');
  tx.objectStore('contacts').delete(contactKey(accountId,id));
  await txDone(tx);
  return true;
}

async function putMessage(accountId,row){
  if(!row?.id)return false;
  const db=await open();
  const tx=db.transaction('messages','readwrite');
  const normalized={
    ...row,
    cache_key:messageKey(accountId,row.id),
    account_id:String(accountId),
    conversation_id:String(row.conversation_id||''),
    created_at:String(row.created_at||new Date().toISOString()),
    version:Number(row.version)||0
  };
  tx.objectStore('messages').put(normalized);
  await txDone(tx);
  return true;
}

async function putMessages(accountId,rows=[]){
  const db=await open();
  const tx=db.transaction('messages','readwrite');
  const store=tx.objectStore('messages');
  for(const row of (Array.isArray(rows)?rows:[])){
    if(!row?.id)continue;
    store.put({
      ...row,
      cache_key:messageKey(accountId,row.id),
      account_id:String(accountId),
      conversation_id:String(row.conversation_id||''),
      created_at:String(row.created_at||new Date().toISOString()),
      version:Number(row.version)||0
    });
  }
  await txDone(tx);
  return true;
}

async function getMessage(accountId,id){
  const db=await open();
  const tx=db.transaction('messages','readonly');
  const row=await req(tx.objectStore('messages').get(messageKey(accountId,id)));
  await txDone(tx);
  if(!row)return null;
  const {cache_key,account_id,...rest}=row;
  return rest;
}

async function listMessages(accountId,conversationId,limit=100){
  const db=await open();
  const tx=db.transaction('messages','readonly');
  const index=tx.objectStore('messages').index('by_account_conversation_created');
  const lower=[String(accountId),String(conversationId),''];
  const upper=[String(accountId),String(conversationId),'\uffff'];
  const rows=await req(index.getAll(IDBKeyRange.bound(lower,upper)));
  await txDone(tx);
  return (rows||[])
    .filter(row=>!row.deleted_at)
    .sort((a,b)=>String(a.created_at).localeCompare(String(b.created_at))||String(a.id).localeCompare(String(b.id)))
    .slice(-Math.max(1,Number(limit)||100))
    .map(({cache_key,account_id,...rest})=>rest);
}

async function removeMessage(accountId,id){
  const db=await open();
  const tx=db.transaction('messages','readwrite');
  tx.objectStore('messages').delete(messageKey(accountId,id));
  await txDone(tx);
  return true;
}

async function putReadState(ownerAccountId,row){
  if(!row?.conversation_id||!row?.account_id)return false;
  const db=await open();
  const tx=db.transaction('read_states','readwrite');
  tx.objectStore('read_states').put({
    ...row,
    cache_key:readKey(ownerAccountId,row.conversation_id,row.account_id),
    owner_account_id:String(ownerAccountId),
    version:Number(row.version)||0
  });
  await txDone(tx);
  return true;
}

async function putOutbox(accountId,item){
  if(!item?.client_id)return false;
  const db=await open();
  const tx=db.transaction('outbox','readwrite');
  tx.objectStore('outbox').put({
    ...item,
    cache_key:outboxKey(accountId,item.client_id),
    account_id:String(accountId),
    contact_id:String(item.contact_id||''),
    created_at:String(item.created_at||new Date().toISOString()),
    attempts:Number(item.attempts)||0
  });
  await txDone(tx);
  return true;
}

async function listOutbox(accountId){
  const db=await open();
  const tx=db.transaction('outbox','readonly');
  const lower=[String(accountId),''];
  const upper=[String(accountId),'\uffff'];
  const rows=await req(tx.objectStore('outbox').index('by_account_created').getAll(IDBKeyRange.bound(lower,upper)));
  await txDone(tx);
  return (rows||[]).sort((a,b)=>String(a.created_at).localeCompare(String(b.created_at))).map(({cache_key,account_id,...rest})=>rest);
}

async function listOutboxForContact(accountId,contactId){
  const db=await open();
  const tx=db.transaction('outbox','readonly');
  const rows=await req(tx.objectStore('outbox').index('by_account_contact').getAll(IDBKeyRange.only([String(accountId),String(contactId)])));
  await txDone(tx);
  return (rows||[]).sort((a,b)=>String(a.created_at).localeCompare(String(b.created_at))).map(({cache_key,account_id,...rest})=>rest);
}

async function removeOutbox(accountId,clientId){
  const db=await open();
  const tx=db.transaction('outbox','readwrite');
  tx.objectStore('outbox').delete(outboxKey(accountId,clientId));
  await txDone(tx);
  return true;
}

async function updateOutbox(accountId,item){return putOutbox(accountId,item);}

async function putMediaRecord(accountId,assetId,record){
  const db=await open();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction('media','readwrite');
    const store=tx.objectStore('media');
    const cacheKey=mediaKey(accountId,assetId);
    tx.oncomplete=()=>resolve(true);
    tx.onabort=()=>reject(tx.error||new Error('idb_media_tx_aborted'));
    tx.onerror=()=>reject(tx.error||new Error('idb_media_tx_failed'));
    const getRequest=store.get(cacheKey);
    getRequest.onerror=()=>{try{tx.abort();}catch{};reject(getRequest.error||new Error('idb_media_get_failed'));};
    getRequest.onsuccess=()=>{
      try{
        store.put({
          ...(getRequest.result||{}),
          ...(record||{}),
          cache_key:cacheKey,
          account_id:String(accountId),
          asset_id:String(assetId),
          last_accessed_at:Date.now()
        });
      }catch(error){
        try{tx.abort();}catch{}
        reject(error);
      }
    };
  });
}

async function getMediaRecord(accountId,assetId){
  const db=await open();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction('media','readonly');
    const store=tx.objectStore('media');
    let row=null;
    tx.oncomplete=()=>resolve(row);
    tx.onabort=()=>reject(tx.error||new Error('idb_media_read_tx_aborted'));
    tx.onerror=()=>reject(tx.error||new Error('idb_media_read_tx_failed'));
    const getRequest=store.get(mediaKey(accountId,assetId));
    getRequest.onerror=()=>reject(getRequest.error||new Error('idb_media_get_failed'));
    getRequest.onsuccess=()=>{row=getRequest.result||null;};
  });
}

async function removeMediaRecord(accountId,assetId){
  const db=await open();
  const tx=db.transaction('media','readwrite');
  tx.objectStore('media').delete(mediaKey(accountId,assetId));
  await txDone(tx);
  return true;
}

async function listMediaRecords(accountId){
  const db=await open();
  const tx=db.transaction('media','readonly');
  const rows=await req(tx.objectStore('media').index('by_account').getAll(IDBKeyRange.only(String(accountId))));
  await txDone(tx);
  return rows||[];
}

async function deleteByAccount(storeName,indexName,accountId){
  const db=await open();
  const tx=db.transaction(storeName,'readwrite');
  const index=tx.objectStore(storeName).index(indexName);
  await new Promise((resolve,reject)=>{
