/* ChatReadAPI — host-authorized read projection. No credentials, network, persistence or write methods. */
const ChatReadAPI=(()=>{
 const id=x=>typeof x==='string'&&x.length>0&&x.length<=200&&x.trim()===x;
 const stamp=x=>typeof x==='string'&&/T.*(?:Z|[+-]\d\d:\d\d)$/.test(x)&&Number.isFinite(Date.parse(x));
 const str=(x,n)=>typeof x==='string'?x.slice(0,n):'';

  if([session,readContacts,readThread].some(x=>typeof x!=='function'))throw Error('Invalid read host');
  let bound=null,contacts=new Map(),disposed=false,request=0;
  function clear(){contacts.clear();bound=null;request++}
  function scope(){
   const s=session();if(disposed||s?.approved!==true||!id(s.accountId)||!id(s.epoch)){clear();throw Error('Read session unavailable')}
   if(bound&&(bound.accountId!==s.accountId||bound.epoch!==s.epoch)){clear();throw Error('Read session changed')}
   bound=Object.freeze({accountId:s.accountId,epoch:s.epoch});return bound;
  }
  function current(s,seq){const now=scope();if(now.accountId!==s.accountId||now.epoch!==s.epoch||seq!==request)throw Error('Stale read response')}
  async function directory(){
   const s=scope(),seq=++request;
   const rows=await readContacts(s);current(s,seq);
   if(!Array.isArray(rows)||rows.length>5000)throw Error('Invalid directory response');
   const next=new Map();
   for(const row of rows){
    if(!row||row.deleted_at||row.locked_at)continue;
    if(!id(row.id)||next.has(row.id)||typeof row.display_name!=='string')throw Error('Invalid contact');
    const value=Object.freeze({id:row.id,name:str(row.display_name,300),role:str(row.role,40),conversationId:id(row.conversation_id)?row.conversation_id:null,preview:str(row.preview_text,500),time:time(row.latest_at),unread:row.has_unread===true});
    next.set(value.id,value);
   }
   contacts=next;return Object.freeze([...next.values()]);
  }
  async function thread(contactId){
   const s=scope(),contact=contacts.get(contactId);if(!contact)throw Error('Contact not in authorized directory');
   const seq=++request;if(!contact.conversationId)return Object.freeze([]);
   const rows=await readThread(s,contact.conversationId);current(s,seq);
   if(!Array.isArray(rows)||rows.length>100)throw Error('Invalid thread response');
   const seen=new Set(),out=[];
   for(const row of rows){
    if(!row||row.deleted_at)continue;
    if(!id(row.id)||seen.has(row.id)||row.conversation_id!==contact.conversationId||!id(row.sender_account_id)||!stamp(row.created_at))throw Error('Invalid message scope');
    seen.add(row.id);
    out.push(Object.freeze({id:row.id,text:str(row.body,20000),mine:row.sender_account_id===s.accountId,date:Date.parse(row.created_at),time:time(row.created_at)}));
   }
   return Object.freeze(out.sort((a,b)=>a.date-b.date||a.id.localeCompare(b.id)));
  }
  function dispose(){disposed=true;clear()}
  return Object.freeze({directory,thread,dispose});
 }
 return Object.freeze({create});
})();

const MainDataController=(()=>{

   const p=room(id),prior=conversations.get(id),sequence=(messages.latest(id)?.sequence||0)+1,seed=typeof value==='string',text=seed?value:value?.text,mine=seed?sequence%2===0:value?.mine;
   if(typeof text!=='string'||typeof mine!=='boolean'||(!seed&&(!Number.isFinite(value.date)||!Number.isFinite(new Date(value.date).getTime())||typeof value.time!=='string'||(value.originalText!==undefined&&typeof value.originalText!=='string'))))throw Error('Invalid fixture message');
   if(!seed&&value.media!==undefined&&(!Array.isArray(value.media)||value.media.length>8||value.media.some(m=>typeof m?.src!=='string'||!m.src.startsWith('blob:')||!Number.isSafeInteger(m.width)||!Number.isSafeInteger(m.height)||m.width<1||m.height<1||typeof m.alt!=='string')))throw Error('Invalid local media');

  function readStatus(id){room(id);return reads.get(id).status()}
  function notificationPlan(messageId,context,permission='default'){const message=messages.get(messageId);if(!message)return null;const actorId='fixture-self',installationId='fixture-local',sessionId='fixture-tab',view=PresenceController.project(context);return NotificationController.plan({actorId,installationId,message,origin:metadata.get(messageId)?.seed?'history':'live',read:readStatus(message.conversationId),presence:{actorId,rows:[{...view,sessionId,generation:1,connection:'fresh'}]},sessionIds:[sessionId],permission})}
  function resetRead(){for(const r of reads.values())r.reset()}
  function sampleRead(id,context,sample){room(id);const r=reads.get(id);r.sample(context,sample);const p=r.proposal();if(p)r.acknowledge({...p,revision:r.status().revision+1});return r.status()}
  function list(id){room(id);return Object.freeze(messages.ids(id).map(key=>project(messages.get(key))))}
  function latest(id){room(id);return project(conversations.project(id)?.message)}
  function renderToken(id){room(id);return conversations.get(id)}
  function checkpoint(){const token=Object.freeze({records:Object.freeze(roomIds.flatMap(id=>messages.ids(id).map(key=>messages.get(key)))),rooms:Object.freeze(roomIds.map(id=>conversations.get(id))),meta:Object.freeze([...metadata].map(pair=>Object.freeze(pair))),receipts:Object.freeze(roomIds.map(id=>readStatus(id))),activity});checkpoints.add(token);return token}
  function restore(token){if(!checkpoints.has(token))throw Error('Invalid fixture checkpoint');const m=MessageStore.create(),c=ConversationStore.create(m);try{m.apply(token.records);c.apply(token.rooms)}catch(e){c.dispose();m.dispose();throw e}for(const r of reads.values())r.dispose();conversations.dispose();messages.dispose();messages=m;conversations=c;metadata=new Map(token.meta);activity=token.activity;reads=new Map(token.receipts.map(s=>[s.conversationId,ReadStateController.create({messages,actorId:s.actorId,conversationId:s.conversationId,head:s.head,initialReceipt:{actorId:s.actorId,conversationId:s.conversationId,sequence:s.confirmed,revision:s.revision}})]));checkpoints.delete(token)}
  function status(){return {messages:messages.status().count,conversations:conversations.status().count,rooms:Object.fromEntries(roomIds.map(id=>[id,{count:messages.ids(id).length,latestId:conversations.get(id)?.latestMessageId||null}]))}}
  return Object.freeze({append,list,latest,renderToken,checkpoint,restore,status,readStatus,resetRead,sampleRead,notificationPlan})
 }
 return Object.freeze({create})
})();

/* CHAT-447 read-only host view, using pinned 0v layout, Contact and Typography. */
(()=>{
const root=Layout.slot({family:'Layout',attrs:{id:'app','data-screen':'contacts','data-layout':'shell','data-main-source':'api'},children:[]});
const rail=Layout.slot({tag:'nav',name:'rail',children:[View.text({role:'version',text:'0v'})]});
const list=Layout.slot({name:'contacts',family:'Scroll',attrs:{id:'contacts'},children:[]});
const query=Input.create({type:'search',parent:'search',placeholder:'Tìm kiếm',label:'Tìm danh bạ',onCommittedInput:renderDirectory});
const status=View.text({role:'caption',tag:'p',text:'Chờ phiên CHAT đã xác thực…',attrs:{role:'status'}});
const directory=Layout.slot({tag:'aside',name:'directory',attrs:{'data-layout':'panel'},children:[Layout.slot({tag:'header',name:'panel-head',children:[View.text({role:'title',text:'CHAT CRM'}),View.text({role:'version',text:'Chỉ đọc'})]}),Layout.slot({name:'search-zone',children:[query]}),status,list]});
const name=View.text({role:'title',tag:'b',text:'Chọn hội thoại'}),thread=Layout.slot({name:'messages',family:'Scroll',attrs:{id:'messages',role:'log','data-layout':'scroll'},children:[]});
const back=View.button({kind:'icon',icon:'back',label:'Về danh bạ',className:'mobile-only',onClick:()=>{root.dataset.screen='contacts'}});
const conversation=Layout.slot({tag:'main',name:'conversation',attrs:{'data-layout':'panel'},children:[Layout.slot({tag:'header',name:'panel-head',children:[back,name]}),Layout.slot({name:'chat-view',attrs:{'data-layout':'region'},children:[thread]}),View.text({role:'caption',text:'Chỉ đọc · Gửi tin và tệp chưa mở'})]});
root.append(rail,directory,conversation);document.body.prepend(root);
const style=document.createElement('style');style.textContent='@media(min-width:768px){#app{grid-template-columns:54px clamp(280px,28vw,340px) minmax(0,1fr)}}#app[data-screen=chat] .conversation{grid-template-rows:auto minmax(0,1fr) auto}#app .chat-view{min-height:0}#app #messages{height:100%;min-height:0}';document.head.append(style);
let rows=[],api=null,active=null,selection=0,port=null,seq=0,scope=null;
const pending=new Map();
function request(kind,id){return new Promise((resolve,reject)=>{if(!port){reject(Error('host unavailable'));return}const n=++seq;pending.set(n,{resolve,reject});port.postMessage({seq:n,kind,id})})}
function renderDirectory(){const q=query.value.toLocaleLowerCase('vi-VN');list.replaceChildren();for(const row of rows){if(q&&!row.name.toLocaleLowerCase('vi-VN').includes(q))continue;const b=Contact.create({id:row.id,name:row.name,avatar:row.name.slice(0,2).toUpperCase(),preview:row.preview,time:row.time,selected:row.id===active});b.addEventListener('click',()=>openThread(row));list.append(b)}}
async function openThread(row){const n=++selection;active=row.id;renderDirectory();root.dataset.screen='chat';name.textContent=row.name;thread.replaceChildren(View.text({role:'caption',text:'Đang đọc…'}));try{const msgs=await api.thread(row.id);if(n!==selection)return;thread.replaceChildren();let last='';for(const msg of msgs){const day=new Intl.DateTimeFormat('vi-VN',{timeZone:'Asia/Ho_Chi_Minh'}).format(msg.date);if(day!==last){thread.append(View.text({role:'caption',name:'day',text:day}));last=day}thread.append(Layout.slot({name:'message'+(msg.mine?' mine':''),children:[View.text({tag:'div',name:'bubble',role:'chat',text:msg.text||'Nội dung media chưa hỗ trợ'}),View.text({tag:'div',name:'meta',role:'caption',text:msg.time})]}))}if(!msgs.length)thread.append(View.text({role:'caption',text:'Chưa có hội thoại'}));thread.scrollTop=thread.scrollHeight}catch{if(n===selection)thread.replaceChildren(View.text({role:'caption',text:'Không đọc được hội thoại'}))}}
function init(e){
 if(port||e.source!==parent||e.origin!==new URL(location.href).origin||e.data?.type!=='chat-0v-read-init'||e.ports.length!==1||e.data.scope?.approved!==true)return;
 scope=e.data.scope;port=e.ports[0];window.removeEventListener('message',init);
 port.onmessage=e=>{const p=pending.get(e.data?.seq);if(!p)return;pending.delete(e.data.seq);e.data.error?p.reject(Error('read failed')):p.resolve(e.data.rows)};
 const rooms=new Map();api=ChatReadAPI.create({session:()=>scope,readContacts:async()=>{const v=await request('directory');rooms.clear();for(const row of v)if(row.conversation_id)rooms.set(row.conversation_id,row.id);return v},readThread:(_s,room)=>request('thread',rooms.get(room))});
 void api.directory().then(v=>{rows=v;status.textContent=v.length+' liên hệ · Chỉ đọc';renderDirectory()}).catch(()=>{status.textContent='Không đọc được danh bạ'});
}
window.addEventListener('message',init);
window.addEventListener('pagehide',()=>{scope=null;api?.dispose();port?.close();for(const p of pending.values())p.reject(Error('closed'));pending.clear();rows=[];list.replaceChildren();thread.replaceChildren()},{once:true});
})();

})();
</script>
