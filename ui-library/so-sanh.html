<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>So sánh UI — ChatGPT và TAPHOA Chat</title><style>:root{font-family:-apple-system-body,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#171717;background:#f6f7f9}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;height:100%}
button{font:inherit;cursor:pointer}
.app{display:grid;grid-template-columns:205px minmax(340px,1fr) minmax(340px,1fr);gap:0;min-height:100vh}
nav{position:sticky;top:0;height:100vh;padding:20px 12px;background:#fff;border-right:1px solid #e7e8eb}
nav h1{font-size:18px;letter-spacing:-.03em;margin:3px 10px 18px}
nav button{border:0;display:block;width:100%;text-align:left;border-radius:11px;padding:12px 13px;margin:4px 0;background:transparent;color:#353b43}
nav button[aria-current="true"]{background:#e9ebef;color:#111;font-weight:650}
.compare-col{padding:18px;background:#f8f9fa;min-width:0}
.compare-col+ .compare-col{border-left:1px solid #e7e8eb}
.compare-head{margin-bottom:16px;font-size:17px;font-weight:700;letter-spacing:-.02em}
.compare-head small{display:block;margin-top:5px;font-size:12px;font-weight:400;color:#777}
.stage{max-width:520px;margin:0 auto}
.phone{width:min(100%,420px);min-height:550px;height:68vh;max-height:780px;display:flex;flex-direction:column;background:#fff;border:1px solid #e4e4e7;border-radius:16px;overflow:hidden;margin:auto}
.phone-head{height:60px;min-height:60px;display:flex;align-items:center;gap:10px;padding:0 14px;background:#fff}
.hamb{font-size:21px;min-width:26px}
.head-title{font-size:15px;font-weight:650}
.chev{color:#858585}
.push-right{flex:1}
.head-control{width:27px;text-align:center;font-size:20px}
.phone-body{flex:1;min-height:0;overflow:auto}
.chat-scroll{padding:18px 0;display:flex;flex-direction:column;gap:9px}
/* Separate source-derived insets: GPT reference = 8% (minimum 18px), TAPHOA = 16px conversation axis + 14px message window. */
#gpt .chat-scroll{padding-inline:max(18px,8%)}
/* TAPHOA: actual DOM ownership on mobile from index.source.html, compiled index.html,
   mobile-chat-refresh.css and mobile-ui-polish.css.
   Message edge: 16px axis + 14px message window = 30px.
   Composer edge: 12px outer width inset + 16px chat-content-axis padding = 28px. */
#tap #conversationContentAxis{box-sizing:border-box;width:100%;padding-inline:16px}
#tap #messageWindow{box-sizing:border-box;width:100%;padding:18px 14px}
#tap .phone-bottom{padding:5px 0 14px}
#tap .composer-source-frame.chat-content-axis{box-sizing:border-box;width:calc(100% - 24px);max-width:44rem;margin-inline:auto;padding-inline:16px}
/* Archived GPT reference: composer-wrap padding is 18px. */
#gpt .phone-bottom{padding-inline:18px}
/* GPT reference assistant text has no additional left/right padding beyond its thread inset. */
#gpt .gpt-reply{padding-inline:0}
.date-line{text-align:center;color:#8b8b8b;font-size:12px;margin:8px 0 16px}
.gpt-user,.chat-b{display:flex;justify-content:flex-end}
.bubble-gpt,.bubble-b{background:#e8f3fe;color:#0c274a;border-radius:19px;padding:10px 13px;max-width:85%;font-size:15px;line-height:1.46}
.gpt-reply{padding:10px 2px;font-size:15px;line-height:1.6}
.chat-a{display:flex;justify-content:flex-start}
.bubble-a{background:#f2f2f2;color:#0d0d0d;border-radius:18px;padding:10px 11px;max-width:100%;font-size:15px;font-weight:400;line-height:1.6;letter-spacing:normal;text-align:left;white-space:pre-wrap;overflow-wrap:anywhere}
.phone-bottom{padding:5px 12px 14px}
.composer-gpt,.composer-tapho{background:#fff;border:1px solid rgba(0,0,0,.1)}
.composer-gpt{border-radius:28px;padding:10px 9px 7px;min-height:65px}
.composer-gpt .composer-prompt{font-size:15px;margin:1px 5px 8px;color:#868686}
.composer-actions{display:flex;gap:8px;align-items:center}
.round{display:grid;place-items:center;min-width:36px;width:36px;height:36px;border-radius:999px}
.round.blue{color:#fff;background:#3b82f6}
.round.grey{color:#fff;background:#b4b4b4}
.composer-tapho{min-height:50px;border-radius:20px;padding:2px;display:flex;gap:2px;align-items:center}
.composer-tapho .round{min-width:40px;width:40px;height:40px}
.composer-tapho .composer-prompt{font-size:15px;color:#858585;min-width:0;flex:1}
.tap-tabs{display:grid;grid-template-columns:1fr 1fr;padding:2px;gap:3px;border-radius:50px;background:#f5f5f5;font-size:13px;flex:1;min-width:0;text-align:center;align-items:center}
.tap-tabs span{padding:9px 4px;color:#656565;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.tap-tabs .selected{background:#fff;border-radius:60px;color:#222;box-shadow:0 1px 4px #0001;font-weight:600}
.directory{padding:14px}
.dir-heading{font-size:17px;font-weight:700;margin:10px 0 23px}
.search-box{background:#f8f8f8;border:1px solid #e0e2e6;border-radius:11px;color:#9ca3af;padding:14px;font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:9px 0 15px}
.chips span{font-size:12px;background:#f2f2f2;border-radius:18px;padding:8px 12px}
.chips span.active{background:#151515;color:#fff}
.contact-row{display:flex;gap:10px;align-items:center;padding:10px 2px;min-height:65px}
.avatar{border-radius:50%;background:#d2edf6;display:grid;place-items:center;width:40px;height:40px;flex:none;color:#364d54}
.contact-row>span:nth-child(2){flex:1;min-width:0}
.contact-row b,.contact-row small{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.contact-row b{font-size:14px}
.contact-row small{font-size:12px;color:#777;margin-top:4px}
.contact-row time{font-size:11px;color:#999}
.gpt-link{font-size:14px;padding:12px 9px;border-radius:10px}
.gpt-link:first-of-type{background:#f3f3f3}
.auth-pane{min-height:550px;display:flex;align-items:center;justify-content:center;background:#fff;padding:20px}
.auth-card{width:100%;max-width:320px}
.auth-card h3{text-align:center;font-size:23px;margin:0 0 30px}
.auth-card label{font-size:13px;display:block;margin:15px 0 6px}
.auth-input{border:1px solid #ddd;border-radius:11px;height:46px;padding:13px;color:#777}
.auth-button{background:#171717;color:white;text-align:center;padding:13px;border-radius:22px;margin:22px 0 18px}
.auth-sub{text-align:center;color:#737373;font-size:13px}
.source-missing{border:1px solid #e6e7e9;background:#fff;border-radius:16px;padding:22px;line-height:1.5;font-size:14px}
.source-missing p{color:#6b7280;font-size:13px}
.area-demo{min-height:390px;display:flex;flex-direction:column;justify-content:center;gap:18px}
.area-legend{color:#8b8b8b;font-size:13px}
.function-space{height:100%;display:flex;align-items:flex-end;padding:12px 13px 5px}
.func-menu{width:100%;border:1px solid #ececec;border-radius:23px;padding:10px;background:#fff;box-shadow:0 5px 22px #00000008}
.func-row{display:flex;gap:10px;align-items:center;font-size:14px;padding:9px 7px;min-height:42px}
.func-icon{width:30px;height:30px;display:grid;place-items:center;border-radius:50%;background:#f4f4f4}
.note{margin:12px auto 0;max-width:520px;font-size:11px;color:#777;line-height:1.5}
@media(max-width:900px){.app{grid-template-columns:160px minmax(290px,1fr) minmax(290px,1fr);min-width:760px}nav{padding:16px 8px}.compare-col{padding:12px}}
@media(max-width:600px){body{overflow-x:auto}.app{min-width:760px}.phone{height:620px}}
/* Demo only: match TAPHOA's Top / Middle / Bottom against the ChatGPT column.
   Keep incoming bubble background, 9px inter-message gap, 30px side gutters. */
/* TOP: header height, gap and icon size already share .phone-head/.hamb/.head-control.
   Align the TAPHOA tab typography with ChatGPT's 15px navigation title. */
#tap .tap-tabs{font-size:15px}
#tap .tap-tabs .selected{font-weight:650}
/* MIDDLE: both columns already share 15px body text and 30px side gutters.
   A preserves its grey bubble, B retains the same blue bubble as ChatGPT. */
/* BOTTOM: keep TAPHOA's existing four elements, lay them out like ChatGPT:
   text above, existing + / mic / send controls on the lower row. */
#tap .composer-tapho{
  display:grid;
  grid-template-columns:36px minmax(0,1fr) 36px 36px;
  grid-template-rows:auto 36px;
  align-items:center;
  column-gap:8px;
  row-gap:0;
  min-height:65px;
  padding:10px 9px 7px;
  border-radius:28px;
}
#tap .composer-tapho>.composer-prompt{
  grid-column:1/-1;
  grid-row:1;
  margin:1px 5px 8px;
  color:#868686;
  font-size:15px;
  flex:none;
}
#tap .composer-tapho>.round{width:36px;min-width:36px;height:36px}
#tap .composer-tapho>.round:nth-child(1){grid-column:1;grid-row:2}
#tap .composer-tapho>.round:nth-child(3){grid-column:3;grid-row:2}
#tap .composer-tapho>.round:nth-child(4){grid-column:4;grid-row:2}
#tap .composer-tapho>.round.grey{background:#3b82f6}
#tap .composer-tapho>.round.grey svg{transform:rotate(-90deg)}

/* Mobile-first comparison viewport.
   iPhone 13/14 CSS viewport reference: 390 × 844.
   Both sides use identical logical coordinates and scale uniformly on desktop.
   The status island and home bar only simulate the device safe areas. */
.iphone-stage{
  position:relative;
  width:min(100%,390px);
  aspect-ratio:390 / 844;
  margin-inline:auto;
  overflow:hidden;
  border-radius:42px;
  outline:1px solid #cfd3da;
  box-shadow:0 12px 24px rgba(16,24,40,.1);
  background:#fff;
}
.iphone-screen{
  position:absolute;
  top:0;left:0;
  width:390px;
  height:844px;
  transform:scale(var(--iphone-scale,1));
  transform-origin:top left;
  background:#fff;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
.iphone-status{
  position:relative;
  flex:none;
  height:54px;
  background:#fff;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:8px 30px 0;
  font-size:15px;
  font-weight:650;
}
.iphone-island{
  position:absolute;
  top:10px;
  left:50%;
  transform:translateX(-50%);
  width:124px;
  height:32px;
  border-radius:40px;
  background:#101113;
}
.iphone-system-icons{font-size:13px;letter-spacing:1px;white-space:nowrap}
.iphone-app{
  flex:1;
  min-height:0;
  min-width:0;
  display:flex;
  flex-direction:column;
  background:#fff;
}
.iphone-app>.phone{
  display:flex;
  flex:1;
  min-height:0;
  height:100%;
  max-height:none;
  width:100%;
  border:0;
  border-radius:0;
  margin:0;
}
.iphone-app>.area-demo,
.iphone-app>.auth-pane{
  width:100%;
  flex:1;
  min-height:0;
  padding-inline:18px;
}
.iphone-app>.source-missing{margin:auto 18px}
.iphone-home{
  flex:none;
  height:30px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#fff;
}
.iphone-home::after{
  content:"";
  display:block;
  width:134px;
  height:5px;
  border-radius:99px;
  background:#151515;
}
@media(max-width:600px){
  .iphone-app>.phone{height:100%;min-height:0;max-height:none}
}

/* MEDIA DEMO — SAMPLE MESSAGES. Isolated to the comparison page; not production chat. */
.media-message{display:flex;flex-direction:column;gap:5px;max-width:100%;min-width:0}
.media-message.out{align-items:flex-end}
.media-message.in{align-items:flex-start}
.media-label{font-size:11px;font-weight:500;color:#85888e;margin:2px 3px 0;line-height:1.35}
.media-divider{margin:10px 0 6px;text-align:center;color:#999;font-size:11px}
.media-photo{display:block;flex:none;padding:0;border:0;background:#edf1f4;overflow:hidden;border-radius:15px;max-width:100%;box-shadow:0 0 0 1px rgba(15,23,42,.055);cursor:zoom-in}
.media-photo img{display:block;width:100%;height:100%;object-fit:cover}
.media-photo.landscape{width:300px;aspect-ratio:16/9}
.media-photo.portrait{width:184px;aspect-ratio:3/4}
.media-photo:focus-visible{outline:3px solid #2563eb;outline-offset:2px}
.media-collage{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3px;width:300px;max-width:100%;border-radius:15px;overflow:hidden}
.media-collage .media-photo{border-radius:0;width:100%;aspect-ratio:1}
.media-collage .media-photo:first-child{grid-row:span 2;aspect-ratio:auto;min-height:0}
.media-collage .media-photo:nth-child(2),.media-collage .media-photo:nth-child(3){height:87px;aspect-ratio:auto}
.media-video{position:relative;width:300px;max-width:100%;aspect-ratio:16/9;border-radius:15px;overflow:hidden;background:#425467;color:white}
.media-video img{display:block;width:100%;height:100%;object-fit:cover;filter:brightness(.68)}
.media-video .play-mark{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:48px;height:48px;background:#0009;border:1px solid #fffc;border-radius:50%;display:grid;place-items:center;font-size:20px;padding-left:3px}
.media-video .duration{position:absolute;bottom:9px;right:10px;padding:3px 6px;border-radius:5px;background:#0009;color:white;font-size:11px;font-variant-numeric:tabular-nums}
.media-audio{display:flex;gap:11px;align-items:center;width:280px;max-width:100%;padding:13px 14px;border-radius:15px;background:#f1f3f5;color:#2e3946}
.media-message.out .media-audio{background:#e8f3fe}
.media-audio .audio-icon{width:32px;height:32px;flex:none;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:15px}
.media-waves{display:flex;align-items:center;justify-content:space-between;gap:3px;min-width:0;flex:1;height:27px}
.media-waves i{display:block;width:3px;flex:1;max-width:3px;background:#8ba2b9;border-radius:99px}
.media-audio .audio-time{font-size:11px;color:#63758b;white-space:nowrap;font-variant-numeric:tabular-nums}
.media-file{display:flex;gap:10px;align-items:center;width:290px;max-width:100%;padding:11px;border:1px solid #e2e7ec;border-radius:15px;background:#fff;color:#25303b}
.media-file .file-mark{display:grid;place-items:center;flex:none;width:39px;height:43px;background:#fee9e8;color:#c03431;border-radius:9px;font-size:11px;font-weight:800}
.media-file .file-text{min-width:0}
.media-file strong{font-size:13px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.media-file small{display:block;margin-top:3px;color:#76808b;font-size:11px}
.media-lightbox{position:fixed;z-index:9999;inset:0;background:rgba(8,12,18,.91);display:flex;align-items:center;justify-content:center;padding:58px 16px 26px}
.media-lightbox img{max-width:min(96vw,1100px);max-height:calc(100vh - 94px);width:auto;height:auto;object-fit:contain;border-radius:9px}
.media-lightbox button{position:absolute;top:16px;right:18px;background:#fff2;border:1px solid #ffffff77;color:#fff;border-radius:100%;height:38px;width:38px;font-size:22px}
.media-lightbox .lightbox-note{position:absolute;bottom:5px;color:#fff9;font-size:11px}
</style></head>

<main class="app">

const IPHONE_WIDTH=390;
function phoneViewport(contents){
  return '<div class="iphone-stage"><div class="iphone-screen">'+
    '<div class="iphone-status" aria-hidden="true">'+
      '<span>9:41</span><span class="iphone-island"></span>'+
      '<span class="iphone-system-icons">▂▄▆ ◉ ▰</span>'+
    '</div><div class="iphone-app">'+contents+'</div>'+
    '<div class="iphone-home" aria-hidden="true"></div></div></div>';
}
function fitIphoneViewports(){
  for(const stage of document.querySelectorAll('.iphone-stage')){
    // Only scale the internal 390px-wide screen. Never alter its font or gap CSS.
    const scale=stage.clientWidth/IPHONE_WIDTH;
    stage.style.setProperty('--iphone-scale',String(scale));
  }
}

function mountMediaSamples(){
  for(const root of [rootGpt,rootTap]){
    const target=root.querySelector('.chat-scroll');
    if(target) target.insertAdjacentHTML('beforeend',mediaSampleMarkup());
  }
}
let mediaPreviewRestore=null;
function closeMediaPreview(){
  const overlay=document.querySelector('.media-lightbox');
  if(overlay)overlay.remove();
  if(mediaPreviewRestore){mediaPreviewRestore.focus();mediaPreviewRestore=null;}
}
document.addEventListener('click',event=>{
  const photo=event.target.closest('.media-photo[data-preview]');
  if(photo){
    const img=photo.querySelector('img');
    if(!img)return;
    closeMediaPreview();mediaPreviewRestore=photo;
    const overlay=document.createElement('div');
    overlay.className='media-lightbox';
    overlay.setAttribute('role','dialog');
    overlay.setAttribute('aria-modal','true');
    overlay.setAttribute('aria-label','Xem ảnh gửi trong cuộc trò chuyện');
    overlay.innerHTML='<button type="button" class="media-close" aria-label="Đóng ảnh">×</button>'+
      '<img alt="" ><span class="lightbox-note">Mẫu ảnh demo, không phải ảnh người dùng</span>';
    overlay.querySelector('img').src=img.src;
    overlay.querySelector('img').alt=img.alt;
    document.body.append(overlay);overlay.querySelector('button').focus();
    return;
  }
  const overlay=document.querySelector('.media-lightbox');
  if(overlay&&(event.target===overlay||event.target.closest('.media-close')))closeMediaPreview();
});
document.addEventListener('keydown',event=>{if(event.key==='Escape')closeMediaPreview();});

function render(category){
  if(!Object.prototype.hasOwnProperty.call(screens,category))return;
  rootGpt.innerHTML=phoneViewport(screens[category].gpt);
  rootTap.innerHTML=phoneViewport(screens[category].tap);
  if(category==='chat')mountMediaSamples();
  for(const item of nav)item.setAttribute('aria-current',String(item.dataset.category===category));
  fitIphoneViewports();
}
