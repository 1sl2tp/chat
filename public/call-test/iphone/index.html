<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>iPhone Mic Test</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #f5f5f7; color: #111; }
    main { width: min(100%, 520px); margin: 0 auto; padding: max(24px, env(safe-area-inset-top)) 18px max(28px, env(safe-area-inset-bottom)); }
    .card { background: #fff; border: 1px solid #e5e5ea; border-radius: 20px; padding: 20px; box-shadow: 0 8px 28px rgba(0,0,0,.05); }
    h1 { margin: 0 0 8px; font-size: 24px; line-height: 1.2; }
    p { margin: 0; color: #666; line-height: 1.45; }
    .status { margin-top: 18px; padding: 14px; border-radius: 14px; background: #f2f2f7; font-weight: 600; }
    .timer { margin-top: 14px; font-size: 42px; font-variant-numeric: tabular-nums; font-weight: 700; letter-spacing: -.04em; }
    button { width: 100%; margin-top: 18px; min-height: 52px; border: 0; border-radius: 14px; background: #111; color: #fff; font: inherit; font-weight: 700; font-size: 17px; }
    button:disabled { opacity: .45; }
    .result { margin-top: 18px; display: none; }
    .result.show { display: block; }
    audio { width: 100%; margin-top: 12px; }
    .meta { margin-top: 10px; font-size: 13px; color: #777; overflow-wrap: anywhere; }
    .note { margin-top: 18px; font-size: 14px; color: #666; }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <h1>Test mic iPhone</h1>
      <p>Chỉ ghi âm 5 giây trên máy này rồi phát lại ngay. Không cần máy thứ hai.</p>

      <div id="status" class="status">Sẵn sàng</div>
      <div id="timer" class="timer">5.0</div>
      <button id="testButton" type="button">Test mic 5 giây</button>

      <div id="result" class="result">
        <strong>Nghe lại đoạn vừa ghi</strong>
        <audio id="playback" controls playsinline></audio>
        <div id="meta" class="meta"></div>
      </div>

      <p class="note">Khi Safari hỏi quyền microphone, chọn Cho phép. Trong 5 giây hãy nói liên tục một câu dễ nhận biết.</p>
    </section>
  </main>

  <script>
    const testButton = document.getElementById('testButton');
    const statusEl = document.getElementById('status');
    const timerEl = document.getElementById('timer');
    const resultEl = document.getElementById('result');
    const playback = document.getElementById('playback');
    const metaEl = document.getElementById('meta');

    let objectUrl = null;
    let timerHandle = null;

    function setStatus(text) {
      statusEl.textContent = text;
    }

    function clearPreviousResult() {
      resultEl.classList.remove('show');
      playback.pause();
      playback.removeAttribute('src');
      playback.load();
      metaEl.textContent = '';
      if (objectUrl) {
        URL.revokeObjectURL(objectUrl);
        objectUrl = null;
      }
    }

    function stopTracks(stream) {
      for (const track of stream.getTracks()) track.stop();
    }

    async function runMicTest() {
      testButton.disabled = true;
      clearPreviousResult();
      timerEl.textContent = '5.0';
      setStatus('Đang xin quyền microphone…');

      let stream = null;
      try {
        if (!navigator.mediaDevices?.getUserMedia) throw new Error('Trình duyệt không hỗ trợ microphone');
        if (typeof MediaRecorder === 'undefined') throw new Error('Trình duyệt không hỗ trợ ghi âm');

        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const chunks = [];
        const recorder = new MediaRecorder(stream);
        const startedAt = performance.now();

        recorder.addEventListener('dataavailable', event => {
          if (event.data && event.data.size > 0) chunks.push(event.data);
        });

        recorder.addEventListener('stop', () => {
          if (timerHandle) {
            clearInterval(timerHandle);
            timerHandle = null;
          }

          stopTracks(stream);
          const mimeType = recorder.mimeType || chunks[0]?.type || 'audio/mp4';
          const blob = new Blob(chunks, { type: mimeType });
          objectUrl = URL.createObjectURL(blob);
          playback.src = objectUrl;
          resultEl.classList.add('show');
          metaEl.textContent = `Dung lượng: ${blob.size.toLocaleString()} bytes · Loại: ${blob.type || 'không xác định'}`;
          timerEl.textContent = '0.0';
          setStatus(blob.size > 0 ? 'Đã ghi xong — bấm Play để nghe lại' : 'Đã dừng nhưng file không có dữ liệu');
          testButton.disabled = false;
          testButton.textContent = 'Test lại';
        }, { once: true });

        setStatus('Đang ghi âm — hãy nói ngay bây giờ');
        recorder.start();

        timerHandle = setInterval(() => {
          const remaining = Math.max(0, 5000 - (performance.now() - startedAt));
          timerEl.textContent = (remaining / 1000).toFixed(1);
        }, 100);

        setTimeout(() => {
          if (recorder.state === 'recording') recorder.stop();
        }, 5000);
      } catch (error) {
        if (timerHandle) {
          clearInterval(timerHandle);
          timerHandle = null;
        }
        if (stream) stopTracks(stream);
        setStatus(`Không test được: ${error?.message || String(error)}`);
        testButton.disabled = false;
      }
    }

    testButton.addEventListener('click', runMicTest);
  </script>
</body>
</html>
