<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#efeae2" />
<title>TAPHOA Chat Demo</title>
<style>
:root{--ink:#111b21;--muted:#667781;--line:#e6e9eb;--chat:#efeae2;--me:#d9fdd3;--wa:#25d366;--wa-dark:#075e54;--danger:#f15a5a;--cream:#f3dfad;--brown:#85551c;--call:#071015}
*{box-sizing:border-box} html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:#eef1f3}
button,input{font:inherit} button{cursor:pointer}.app{width:min(440px,100%);height:100dvh;margin:auto;background:#fff;display:flex;flex-direction:column;position:relative;overflow:hidden;box-shadow:0 16px 50px rgba(0,0,0,.12)}
.header{height:62px;display:flex;align-items:center;gap:9px;padding:8px 10px;background:#fff;border-bottom:1px solid var(--line);z-index:5}.icon{width:40px;height:40px;border:0;background:transparent;border-radius:50%;display:grid;place-items:center;color:#202c33}.icon.soft{background:#f5f6f6}.icon svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--cream);display:grid;place-items:center;flex:0 0 auto;overflow:hidden}.avatar svg{width:28px;height:28px;fill:var(--brown)}.who{flex:1;min-width:0}.who b{display:block;font-size:16px}.who span{font-size:12px;color:var(--muted)}
.call-pill{display:none;margin:7px 9px 0;padding:8px 12px;border-radius:16px;background:#0b6b5d;color:white;align-items:center;gap:8px;z-index:4}.call-pill.show{display:flex}.call-pill b{font-size:13px;flex:1}.call-pill small{opacity:.8}.call-pill button{border:0;background:transparent;color:white;display:grid;place-items:center}.call-pill svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2}
.chat{flex:1;min-height:0;position:relative;background:var(--chat);overflow:hidden}.pattern{position:absolute;inset:0;opacity:.16;background-image:radial-gradient(circle at 12px 12px,#91887d 1px,transparent 1px),radial-gradient(circle at 34px 34px,#91887d 1px,transparent 1px);background-size:44px 44px}.messages{position:relative;height:100%;overflow:auto;padding:14px 10px 18px}.day{width:max-content;margin:2px auto 12px;background:#fff;padding:5px 9px;border-radius:9px;font-size:11px;color:#5b6870;box-shadow:0 1px 1px rgba(0,0,0,.08)}.row{display:flex;margin:5px 0}.row.me{justify-content:flex-end}.bubble{max-width:82%;padding:8px 9px 6px;border-radius:9px;background:white;box-shadow:0 1px 1px rgba(0,0,0,.08);font-size:14px;line-height:1.38}.me .bubble{background:var(--me)}.time{font-size:10px;color:#667781;float:right;margin:6px 0 0 10px}.ticks{color:#53bdeb}.call-card{display:flex;align-items:center;gap:10px;min-width:235px}.call-badge{width:40px;height:40px;border-radius:50%;background:#f2f4f5;display:grid;place-items:center}.call-badge svg{width:20px;height:20px;fill:none;stroke:#008069;stroke-width:2}.call-copy{flex:1}.call-copy b{display:block}.call-copy span{font-size:12px;color:var(--muted)}
.composer{display:flex;align-items:center;gap:7px;padding:7px 8px calc(7px + env(safe-area-inset-bottom));background:#f7f5f2;border-top:1px solid #e5e6e7}.composer .plain{width:38px;height:42px;border:0;background:transparent;display:grid;place-items:center;color:#54656f}.composer .plain svg,.send svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.input{height:42px;flex:1;border:0;outline:0;background:#fff;border-radius:22px;padding:0 14px;color:#3b4a54}.send{width:42px;height:42px;border:0;border-radius:50%;background:var(--wa);color:white;display:grid;place-items:center}
.call-screen{position:absolute;inset:0;background:radial-gradient(circle at 50% 35%,#17252c 0,#0a1419 52%,#04080b 100%);color:white;z-index:20;display:none;flex-direction:column;align-items:center}.call-screen.show{display:flex}.call-top{width:100%;padding:18px 16px 0;display:flex;justify-content:space-between}.call-top button{width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.08);color:white;display:grid;place-items:center}.call-top svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9}.call-name{text-align:center;margin-top:18px}.call-name h2{margin:0;font-size:25px}.call-name p{margin:5px 0 0;color:#c4ced2;font-size:15px}.call-avatar{width:190px;height:190px;border-radius:50%;background:#4a331c;margin-top:58px;display:grid;place-items:center}.call-avatar svg{width:108px;height:108px;fill:#f1bf62}
.actions{margin-top:auto;margin-bottom:32px;display:flex;gap:44px;align-items:end}.action{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;color:#e9edef}.action button{width:64px;height:64px;border:0;border-radius:50%;background:#29363c;color:white;display:grid;place-items:center}.action button svg{width:27px;height:27px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.action .green{background:var(--wa)}.action .red{background:var(--danger)}.active-controls{display:none;margin-top:auto;margin-bottom:24px;width:calc(100% - 32px);border-radius:26px;background:rgba(255,255,255,.08);padding:18px 12px}.active-controls.show{display:block}.controls-row{display:flex;justify-content:space-around}.end-row{display:flex;justify-content:center;margin-top:18px}
.demo-trigger{position:absolute;right:10px;bottom:78px;z-index:50;border:0;background:rgba(17,27,33,.72);color:white;border-radius:14px;padding:6px 9px;font-size:11px}.demo-panel{position:absolute;right:10px;bottom:112px;z-index:51;width:210px;background:white;border:1px solid #dfe3e5;border-radius:16px;padding:10px;box-shadow:0 10px 28px rgba(0,0,0,.18);display:none}.demo-panel.show{display:block}.demo-panel b{font-size:12px}.demo-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}.demo-grid button{height:34px;border:0;border-radius:9px;background:#f0f2f5;color:#33434c;font-size:11px}.demo-grid button.primary{background:#d9fdd3;color:#075e54;font-weight:700}.note{font-size:10px;color:#7a8a93;margin-top:7px;line-height:1.35}.toast{position:absolute;left:50%;bottom:86px;transform:translateX(-50%);z-index:60;background:#111b21;color:white;border-radius:9px;padding:8px 11px;font-size:12px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}
@media(max-width:500px){body{background:#fff}.app{width:100%;box-shadow:none}.call-avatar{width:175px;height:175px;margin-top:48px}.call-avatar svg{width:98px;height:98px}}
</style>
</head>
<body>
<div class="app">
<header class="header">
  <button class="icon" aria-label="Quay lại"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
  <div class="avatar"><svg viewBox="0 0 64 64"><circle cx="32" cy="21" r="12"/><path d="M11 57c2-14 10-22 21-22s19 8 21 22z"/></svg></div>
  <div class="who"><b>Admin hỗ trợ</b><span id="accountLine">Đang hoạt động</span></div>
  <button class="icon soft" id="callBtn" aria-label="Gọi thoại"><svg viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.8.7A2 2 0 0 1 22 16.9z"/></svg></button>
</header>
<div class="call-pill" id="callPill"><b>☎ Admin hỗ trợ · <span id="pillTimer">00:00</span></b><small>Đang gọi</small><button id="restoreCall" aria-label="Mở cuộc gọi"><svg viewBox="0 0 24 24"><path d="M7 17L17 7M8 7h9v9"/></svg></button></div>
<main class="chat">
  <div class="pattern"></div>
  <div class="messages" id="messages">
    <div class="day">Hôm nay</div>
    <div class="row"><div class="bubble">Chào bạn, mình có thể hỗ trợ gì?<span class="time">07:08</span></div></div>
    <div class="row me"><div class="bubble">Mình cần hỏi một chút nhé<span class="time">07:09 <span class="ticks">✓✓</span></span></div></div>
  </div>
</main>
<footer class="composer">
  <button class="plain" aria-label="Thêm"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  <input class="input" id="messageInput" placeholder="Nhập tin nhắn" />
  <button class="plain" aria-label="Đính kèm"><svg viewBox="0 0 24 24"><path d="M21.4 11.6l-8.5 8.5a6 6 0 0 1-8.5-8.5l9-9a4 4 0 0 1 5.7 5.7l-9 9a2 2 0 1 1-2.8-2.8l8.3-8.3"/></svg></button>
  <button class="send" id="sendBtn" aria-label="Gửi"><svg viewBox="0 0 24 24"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/></svg></button>
</footer>

<section class="call-screen" id="callScreen">
  <div class="call-top"><button id="minimizeBtn" aria-label="Thu nhỏ"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button><span></span></div>
  <div class="call-name"><h2>Admin hỗ trợ</h2><p id="callStatus">Đang gọi…</p></div>
  <div class="call-avatar"><svg viewBox="0 0 64 64"><circle cx="32" cy="21" r="12"/><path d="M11 57c2-14 10-22 21-22s19 8 21 22z"/></svg></div>
  <div class="actions" id="incomingActions">
    <div class="action"><button class="red" id="declineBtn"><svg viewBox="0 0 24 24"><path d="M3 11c4-4 14-4 18 0l-3 4-4-2v-2H10v2l-4 2z"/></svg></button><span>Từ chối</span></div>
    <div class="action"><button class="green" id="acceptBtn"><svg viewBox="0 0 24 24"><path d="M6 3h4l2 5-3 2a14 14 0 0 0 5 5l2-3 5 2v4c0 2-2 3-4 3A17 17 0 0 1 3 7c0-2 1-4 3-4z"/></svg></button><span>Nghe</span></div>
  </div>
  <div class="active-controls" id="activeControls">
    <div class="controls-row">
      <div class="action"><button><svg viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4z"/><path d="M15 9a5 5 0 0 1 0 6"/><path d="M18 6a9 9 0 0 1 0 12"/></svg></button><span>Loa</span></div>
      <div class="action"><button><svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5"/></svg></button><span>Mic</span></div>
      <div class="action"><button id="messageFromCall"><svg viewBox="0 0 24 24"><path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"/></svg></button><span>Tin nhắn</span></div>
    </div>
    <div class="end-row"><div class="action"><button class="red" id="endBtn"><svg viewBox="0 0 24 24"><path d="M3 11c4-4 14-4 18 0l-3 4-4-2v-2H10v2l-4 2z"/></svg></button><span>Kết thúc</span></div></div>
  </div>
</section>

<button class="demo-trigger" id="demoTrigger">Demo</button>
<div class="demo-panel" id="demoPanel">
  <b>Mô phỏng nhanh</b>
  <div class="demo-grid">
    <button id="u1Btn" class="primary">User 1</button><button id="u2Btn">User 2</button>
    <button id="incomingBtn">Gọi đến</button><button id="outgoingBtn">Gọi đi</button>
    <button id="activeBtn">Đã nhận</button><button id="minBtn">Thu nhỏ</button>
    <button id="endDemoBtn">Kết thúc</button><button id="closeDemoBtn">Đóng</button>
  </div>
  <div class="note">User 1: chat ngay, chưa Call/Push. User 2: chat + call + lưu lịch sử.</div>
</div>
<div class="toast" id="toast"></div>
</div>
<script>
const $=id=>document.getElementById(id);let userLevel=1,seconds=0,timer=null,callState='idle';
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1500)}
function fmt(n){return `${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`}
function tick(){seconds++;$('callStatus').textContent=fmt(seconds);$('pillTimer').textContent=fmt(seconds)}
function startTimer(){clearInterval(timer);if(!seconds)seconds=0;timer=setInterval(tick,1000)}
function stopTimer(){clearInterval(timer);timer=null}
function setUser(level){userLevel=level;$('u1Btn').classList.toggle('primary',level===1);$('u2Btn').classList.toggle('primary',level===2);$('accountLine').textContent=level===1?'Đang hoạt động':'Đã đăng nhập · User 2'}
function showCall(kind){callState=kind;$('callPill').classList.remove('show');$('callScreen').classList.add('show');$('incomingActions').style.display=kind==='incoming'?'flex':'none';$('activeControls').classList.toggle('show',kind==='active');if(kind==='incoming')$('callStatus').textContent='Cuộc gọi đến';if(kind==='outgoing')$('callStatus').textContent='Đang gọi…';if(kind==='active'){seconds=0;$('callStatus').textContent='00:00';startTimer()}}
function minimize(){if(callState!=='active')return;$('callScreen').classList.remove('show');$('callPill').classList.add('show')}
function endCall(label='Cuộc gọi thoại'){if(callState==='idle')return;const duration=fmt(seconds);stopTimer();$('callScreen').classList.remove('show');$('callPill').classList.remove('show');callState='idle';const row=document.createElement('div');row.className='row';row.innerHTML=`<div class="bubble"><div class="call-card"><div class="call-badge"><svg viewBox="0 0 24 24"><path d="M6 3h4l2 5-3 2a14 14 0 0 0 5 5l2-3 5 2v4c0 2-2 3-4 3A17 17 0 0 1 3 7c0-2 1-4 3-4z"/></svg></div><div class="call-copy"><b>${label}</b><span>${seconds?duration:'Không trả lời'}</span></div></div><span class="time">Bây giờ</span></div>`;$('messages').appendChild(row);$('messages').scrollTop=$('messages').scrollHeight;seconds=0}
$('callBtn').onclick=()=>userLevel===1?toast('Đăng nhập User 2 để gọi'):showCall('outgoing');$('acceptBtn').onclick=()=>showCall('active');$('declineBtn').onclick=()=>endCall('Cuộc gọi nhỡ');$('endBtn').onclick=()=>endCall();$('minimizeBtn').onclick=minimize;$('restoreCall').onclick=()=>showCall('active');$('messageFromCall').onclick=minimize;
$('sendBtn').onclick=()=>{const v=$('messageInput').value.trim();if(!v)return;const r=document.createElement('div');r.className='row me';r.innerHTML=`<div class="bubble">${v}<span class="time">Bây giờ <span class="ticks">✓✓</span></span></div>`;$('messages').appendChild(r);$('messageInput').value='';$('messages').scrollTop=$('messages').scrollHeight};
$('messageInput').addEventListener('keydown',e=>{if(e.key==='Enter')$('sendBtn').click()});$('demoTrigger').onclick=()=>$('demoPanel').classList.toggle('show');$('closeDemoBtn').onclick=()=>$('demoPanel').classList.remove('show');$('u1Btn').onclick=()=>setUser(1);$('u2Btn').onclick=()=>setUser(2);$('incomingBtn').onclick=()=>{setUser(2);showCall('incoming')};$('outgoingBtn').onclick=()=>{setUser(2);showCall('outgoing')};$('activeBtn').onclick=()=>{setUser(2);showCall('active')};$('minBtn').onclick=()=>{if(callState!=='active'){setUser(2);showCall('active')}minimize()};$('endDemoBtn').onclick=()=>endCall();setUser(1);
</script>
</body>
</html>
