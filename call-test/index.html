<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>LiveKit Components Call Test</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f5f5;color:#111}main{max-width:680px;margin:0 auto;padding:18px}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:15px;margin:12px 0}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.muted{color:#666}.ok{color:#116b2c}.bad{color:#a10000}button{min-height:46px;padding:0 15px;border:1px solid #bbb;border-radius:10px;background:#fff;color:#111;font:inherit;font-weight:650}button.primary{background:#111;color:#fff;border-color:#111}button:disabled{opacity:.45}.lk-room{display:block}.lk-control-bar{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.lk-button-group{display:flex;gap:6px}.lk-button-group-menu{display:none}.lk-start-audio-button{margin-top:10px;background:#111;color:#fff;border-color:#111}code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="module">
    import React, { useMemo, useState } from 'https://esm.sh/react@18.3.1';
    import { createRoot } from 'https://esm.sh/react-dom@18.3.1/client';
    import {
      LiveKitRoom,
      RoomAudioRenderer,
      StartAudio,
      ControlBar,
    } from 'https://esm.sh/@livekit/components-react@2.9.24?deps=react@18.3.1,react-dom@18.3.1,livekit-client@2.22.1';
    import { TokenSource } from 'https://esm.sh/livekit-client@2.22.1';

    const TOKEN_SERVER_ID = 'taphoachat-1x4n2g';
    const ROOM_NAME = 'taphoa-livekit-components-audio-v1';

    function getDeviceName() {
      if (/Android/i.test(navigator.userAgent)) return 'Android';
      if (/iPhone|iPad|iPod/i.test(navigator.userAgent)) return 'iPhone/iPad';
      return 'Web';
    }

    function getIdentity(device) {
      const key = 'taphoa-livekit-components-device';
      let id = localStorage.getItem(key);
      if (!id) {
        id = crypto.randomUUID();
        localStorage.setItem(key, id);
      }
      return `${device.toLowerCase().replace(/[^a-z]+/g, '-')}-${id}`;
    }

    function App() {
      const device = useMemo(() => getDeviceName(), []);
      const identity = useMemo(() => getIdentity(device), [device]);
      const [credentials, setCredentials] = useState(null);
      const [joining, setJoining] = useState(false);
      const [status, setStatus] = useState('chưa vào');
      const [error, setError] = useState('');

      async function join() {
        if (joining || credentials) return;
        setJoining(true);
        setError('');
        setStatus('đang lấy token…');
        try {
          const source = TokenSource.developmentTokenServer(TOKEN_SERVER_ID);
          const next = await source.fetch({
            roomName: ROOM_NAME,
            participantIdentity: identity,
            participantName: device,
          });
          setCredentials(next);
          setStatus('đang kết nối…');
        } catch (e) {
          setError(e?.message || String(e));
          setStatus('lỗi');
        } finally {
          setJoining(false);
        }
      }

      function resetAfterDisconnect() {
        setCredentials(null);
        setStatus('đã rời');
      }

      const children = [];
      if (credentials) {
        children.push(
          React.createElement(
            LiveKitRoom,
            {
              key: 'room',
              token: credentials.participantToken,
              serverUrl: credentials.serverUrl,
              connect: true,
              audio: true,
              video: false,
              onConnected: () => setStatus('đã kết nối'),
              onDisconnected: resetAfterDisconnect,
              onError: (e) => {
                setError(e?.message || String(e));
                setStatus('lỗi');
              },
              onMediaDeviceFailure: (failure) => {
                setError(`Media device: ${failure}`);
              },
              className: 'lk-room',
            },
            React.createElement(RoomAudioRenderer, { key: 'renderer' }),
            React.createElement(StartAudio, {
              key: 'start-audio',
              label: 'Bật âm thanh',
              className: 'lk-start-audio-button',
            }),
            React.createElement(ControlBar, {
              key: 'controls',
              variation: 'textOnly',
              saveUserChoices: false,
              controls: {
                microphone: true,
                camera: false,
                screenShare: false,
                chat: false,
                leave: true,
                settings: false,
              },
            }),
          ),
        );
      }

      return React.createElement(
        'main',
        null,
        React.createElement('h2', null, 'LiveKit Components Call Test'),
        React.createElement(
          'p',
          { className: 'muted' },
          'Call viết lại độc lập bằng component chính thức của LiveKit. Không dùng code Call cũ và không tự quản mic/remote audio.',
        ),
        React.createElement(
          'div',
          { className: 'card' },
          React.createElement('div', null, React.createElement('b', null, 'Room: '), React.createElement('code', null, ROOM_NAME)),
          React.createElement('div', { style: { marginTop: 8 } }, React.createElement('b', null, 'Thiết bị: '), device),
          React.createElement('div', { style: { marginTop: 8 } }, React.createElement('b', null, 'Trạng thái: '), React.createElement('span', { className: status === 'đã kết nối' ? 'ok' : '' }, status)),
          error ? React.createElement('div', { className: 'bad', style: { marginTop: 8 } }, error) : null,
        ),
        React.createElement(
          'div',
          { className: 'card' },
          !credentials
            ? React.createElement('button', { className: 'primary', onClick: join, disabled: joining }, joining ? 'Đang vào…' : 'Vào phòng')
            : null,
          children,
          React.createElement(
            'p',
            { className: 'muted' },
            'Mở đúng trang này trên iPhone và Android. Cả hai bấm Vào phòng và cho phép microphone. Nếu Safari hiện nút Bật âm thanh thì bấm một lần.',
          ),
        ),
      );
    }

    createRoot(document.getElementById('root')).render(React.createElement(App));
  </script>
</body>
</html>
