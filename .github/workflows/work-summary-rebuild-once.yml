name: Work Summary Rebuild Once
on:
  push:
    branches: [main]
    paths:
      - '.work-summary-rebuild-trigger'
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build canonical preview
        run: python tools/build_current_preview.py
      - name: Commit generated preview
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html version.json
          if git diff --cached --quiet; then
            echo 'No build changes'
          else
            git commit -m 'build: sync Work reconcile preview'
            git push origin main
          fi
