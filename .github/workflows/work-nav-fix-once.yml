name: Work Navigation Fix Once
on:
  push:
    branches: [main]
    paths:
      - '.work-nav-fix-trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Work overview and mobile directory state
        run: python .github/scripts/work-nav-fix.py
      - name: Verify targeted contracts
        run: |
          node --check work-customer-summary.js
          python tests/test_v21_work_customer_summary_ui.py
          python tests/test_v21_work_customer_summary_reconcile.py
          python tests/test_v21_mobile_chat_navigation.py
      - name: Build canonical preview
        run: python tools/build_current_preview.py
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add work-customer-summary.js work-customer-summary.css index.html version.json
          git commit -m 'fix: pin Work overview and align directory state'
          git push origin main
