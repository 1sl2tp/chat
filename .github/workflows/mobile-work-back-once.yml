name: Mobile Work Back Once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-work-back-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply mobile directory menu and Work back fix
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('work-customer-summary.js')
          s = path.read_text('utf-8')

          account_button = '<button type="button" class="mobile-account-menu-row" role="menuitem" data-mobile-account-action="account">Tài khoản</button>'
          directory_button = '<button type="button" class="mobile-account-menu-row" role="menuitem" data-mobile-account-action="directory">Danh bạ</button>'
          assert account_button in s, 'mobile account menu account button changed'
          s = s.replace(account_button, directory_button + '\n      ' + account_button, 1)

          old = "closeMobileAccountMenu();\n    if(action==='account'){"
          new = "closeMobileAccountMenu();\n    if(action==='directory'){\n      navigation()?.openChat?.();\n      showMobileDirectory('account-menu-directory');\n      return;\n    }\n    if(action==='account'){"
          assert old in s, 'mobile account action handler changed'
          s = s.replace(old, new, 1)

          marker = "function renderCustomerDetail(row,contact){\n"
          helper = "function workDetailBackMode(){\n  if(!mobileDirectoryAllowed())return 'overview';\n  if(shellSnapshot().route!=='work')return 'overview';\n  if(selectedWorkCustomerId)return 'overview';\n  return mobileConversationReturnState?.kind==='contact'?'conversation':'overview';\n}\n\nfunction renderCustomerDetail(row,contact){\n"
          assert marker in s, 'renderCustomerDetail marker changed'
          s = s.replace(marker, helper, 1)

          old = "  const header=node('div','work-summary-header work-summary-detail-header');\n  const all=node('button','work-summary-all','Tất cả');\n  all.type='button';\n  all.dataset.workSummaryAll='true';\n  const title=node('div','work-summary-header-title');"
          new = "  const header=node('div','work-summary-header work-summary-detail-header');\n  const backMode=workDetailBackMode();\n  const all=node('button','work-summary-all',backMode==='conversation'?'Quay lại':'Tất cả');\n  all.type='button';\n  all.dataset.workSummaryAll='true';\n  if(backMode==='conversation')all.dataset.workSummaryBack='conversation';\n  else all.dataset.workSummaryBack='overview';\n  const title=node('div','work-summary-header-title');"
          assert old in s, 'Work detail header changed'
          s = s.replace(old, new, 1)

          old = "  const all=event.target?.closest?.('[data-work-summary-all]');\n  if(all){\n    selectedWorkCustomerId='';\n    forceOverview=true;\n    renderOverview(rowsCache);\n    return;\n  }"
          new = "  const all=event.target?.closest?.('[data-work-summary-all]');\n  if(all){\n    if(all.dataset.workSummaryBack==='conversation'&&mobileDirectoryAllowed()){\n      restoreConversationFromWork('work-detail-back');\n      return;\n    }\n    selectedWorkCustomerId='';\n    forceOverview=true;\n    renderOverview(rowsCache);\n    return;\n  }"
          assert old in s, 'Work detail back click handler changed'
          s = s.replace(old, new, 1)

          path.write_text(s, 'utf-8')
          PY
      - name: Focused mobile navigation contract
        run: |
          node --check work-customer-summary.js
          python tests/test_v21_mobile_chat_navigation.py
      - name: Rebuild canonical preview
        run: python tools/build_current_preview.py
      - name: Recheck focused contract
        run: python tests/test_v21_mobile_chat_navigation.py
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add work-customer-summary.js index.html version.json
          git commit -m 'fix: make mobile Work back origin-aware'
          git push
