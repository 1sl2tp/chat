name: Verify unified sales bridge

on:
  push:
    branches: [unified-sales-foundation]

permissions:
  contents: write

jobs:
  bridge-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unified sales bridge contract
        run: python -m unittest tests.test_v21_work_auth_bridge -v
