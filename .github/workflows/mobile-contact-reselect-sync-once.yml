name: Mobile Contact Reselect Sync Once
on:
  push:
    paths:
      - '.github/workflows/mobile-contact-reselect-sync-once.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild canonical files
        run: python tools/build_current_preview.py
      - name: Verify canonical files before commit
        run: python tools/verify_current.py
      - name: Commit canonical files
        run: |
          rm -f .github/workflows/mobile-contact-reselect-sync-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html version.json .github/workflows/mobile-contact-reselect-sync-once.yml
          git commit -m 'build: sync mobile contact reselect release'
          git push
