name: Quick work composer fix
permissions:
  contents: write
on:
  push:
    branches: [main]
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch work composer visibility
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('shell.js')
          s=p.read_text('utf-8')
          old="""  if(workView)workView.hidden=desktopWorkspace?false:route!=='work';\n  renderTopTabs();"""
          new="""  if(workView)workView.hidden=desktopWorkspace?false:route!=='work';\n  const composer=document.getElementById('thread-bottom-container');\n  if(composer)composer.hidden=!desktopWorkspace&&route==='work';\n  renderTopTabs();"""
          if old not in s: raise SystemExit('shell route anchor not found')
          p.write_text(s.replace(old,new,1),'utf-8')

          t=Path('tests/test_v21_work_hides_composer.py')
          t.write_text('''from pathlib import Path\nimport unittest\nSHELL=Path(__file__).resolve().parents[1].joinpath("shell.js").read_text("utf-8")\nclass WorkComposerContract(unittest.TestCase):\n    def test_work_route_hides_composer_and_chat_restores_it(self):\n        self.assertIn("const composer=document.getElementById(\\'thread-bottom-container\\');", SHELL)\n        self.assertIn("composer.hidden=!desktopWorkspace&&route===\\'work\\';", SHELL)\nif __name__=="__main__": unittest.main()\n''','utf-8')
          PY
      - name: Verify focused fix
        run: |
          python -m unittest tests.test_v21_work_hides_composer -v
          node --check shell.js
      - name: Commit and self-remove helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/quick-work-composer-fix.yml
          git add shell.js tests/test_v21_work_hides_composer.py
          git commit -m 'fix: hide chat composer in work mode'
          git push origin HEAD:main
