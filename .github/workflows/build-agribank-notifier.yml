name: Build TAPHOA Agribank Notifier APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/agribank-notifier/**'
      - '.github/workflows/build-agribank-notifier.yml'
  pull_request:
    paths:
      - 'android/agribank-notifier/**'
      - '.github/workflows/build-agribank-notifier.yml'
jobs:
  android-debug-apk:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Use hosted Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-35" || "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35'
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      - name: Build installer
        working-directory: android/agribank-notifier
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: TAPHOA-Agribank-Notifier-debug-APK
          path: android/agribank-notifier/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
