name: One-shot mobile app icons
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate iOS Android icons and rebuild canonical
        run: |
          python -m pip install pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          import json, subprocess, sys

          ROOT = Path('.')
          ICONS = ROOT / 'icons'
          ICONS.mkdir(exist_ok=True)
          GREEN = '#16a34a'
          WHITE = '#ffffff'

          def make_icon(path, size, inset=0.0):
              im = Image.new('RGB', (size, size), GREEN)
              d = ImageDraw.Draw(im)
              s = float(size)
              x0 = int(s*(0.24+inset))
              y0 = int(s*(0.28+inset))
              x1 = int(s*(0.76-inset))
              y1 = int(s*(0.64-inset))
              radius = max(4, int(s*0.095))
              width = max(4, int(s*0.055))
              d.rounded_rectangle((x0,y0,x1,y1), radius=radius, outline=WHITE, width=width)
              # tail: simple open speech-bubble tail, kept inside safe area
              p1=(int(s*(0.42+inset/2)), int(s*(0.635-inset/2)))
              p2=(int(s*(0.34+inset)), int(s*(0.76-inset)))
              p3=(int(s*(0.49-inset/3)), int(s*(0.66-inset/2)))
              d.line([p1,p2,p3], fill=WHITE, width=width, joint='curve')
              cy=int(s*0.46)
              r=max(2,int(s*0.027))
              for cx in (0.42,0.50,0.58):
                  x=int(s*cx)
                  d.ellipse((x-r,cy-r,x+r,cy+r), fill=WHITE)
              im.save(path, format='PNG', optimize=True)

          make_icon(ICONS/'chat-app-180-v2.png', 180)
          make_icon(ICONS/'chat-app-192-v2.png', 192)
          make_icon(ICONS/'chat-app-512-v2.png', 512)
          make_icon(ICONS/'chat-maskable-512-v2.png', 512, inset=0.07)

          source_path = ROOT/'index.source.html'
          source = source_path.read_text('utf-8')
          old = '<link rel="apple-touch-icon" sizes="192x192" href="./icons/chat-192.png">'
          new = '<link rel="apple-touch-icon" sizes="180x180" href="./icons/chat-app-180-v2.png">'
          if old in source:
              source = source.replace(old, new, 1)
          elif new not in source:
              raise SystemExit('apple touch icon anchor not found')
          source_path.write_text(source, 'utf-8')

          manifest_path = ROOT/'manifest.webmanifest'
          manifest = json.loads(manifest_path.read_text('utf-8'))
          manifest['icons'] = [
              {'src':'./icons/chat-app-192-v2.png','sizes':'192x192','type':'image/png','purpose':'any'},
              {'src':'./icons/chat-app-512-v2.png','sizes':'512x512','type':'image/png','purpose':'any'},
              {'src':'./icons/chat-maskable-512-v2.png','sizes':'512x512','type':'image/png','purpose':'maskable'},
          ]
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2)+'\n', 'utf-8')

          sw_path = ROOT/'sw.js'
          sw = sw_path.read_text('utf-8')
          sw = sw.replace(
              "const SHELL=['./','./manifest.webmanifest','./icons/chat-192.png','./icons/chat-512.png'];",
              "const SHELL=['./','./manifest.webmanifest','./icons/chat-app-180-v2.png','./icons/chat-app-192-v2.png','./icons/chat-app-512-v2.png','./icons/chat-maskable-512-v2.png'];"
          )
          sw = sw.replace("icon:String(payload.icon||'./icons/chat-192.png')", "icon:String(payload.icon||'./icons/chat-app-192-v2.png')")
          sw = sw.replace("badge:'./icons/chat-192.png'", "badge:'./icons/chat-app-192-v2.png'")
          sw_path.write_text(sw, 'utf-8')

          subprocess.run([sys.executable, 'tools/build_current_preview.py'], check=True)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons/chat-app-180-v2.png icons/chat-app-192-v2.png icons/chat-app-512-v2.png icons/chat-maskable-512-v2.png index.source.html manifest.webmanifest sw.js index.html version.json
          if git diff --cached --quiet; then
            echo "mobile app icons already current"
            exit 0
          fi
          git commit -m "Fix iOS Android installed app icons"
          git push
