name: Wire GETLINK auth bridge once

on:
  push:
    branches:
      - feature/getlink-auth-bridge
    paths:
      - ".github/workflows/wire-getlink-auth-bridge-once.yml"

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/getlink-auth-bridge
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verification dependency
        run: python -m pip install pytest
      - name: Wire bridge after auth store
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.source.html')
          s=p.read_text('utf-8')
          anchor='<script src="./auth-session-store.js" data-build-source="auth-session-store.js"></script>'
          line='<script src="./getlink-auth-bridge.js" data-build-source="getlink-auth-bridge.js"></script>'
          if line not in s:
              if anchor not in s: raise SystemExit('auth store anchor missing')
              s=s.replace(anchor,anchor+'\n'+line,1)
              p.write_text(s,'utf-8')
          PY
      - name: Build canonical preview
        run: python tools/build_current_preview.py
      - name: Verify bridge contract
        run: python tests/test_v21_getlink_auth_bridge.py
      - name: Verify canonical source
        run: python tools/verify_current.py
      - name: Commit verified bridge
        run: |
          git config user.name "TAPHOA Chat Auth Bridge"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/wire-getlink-auth-bridge-once.yml
          git add index.source.html index.html version.json
          git commit -m "Wire Chat identity bridge into GETLINK"
          git push origin HEAD:feature/getlink-auth-bridge
