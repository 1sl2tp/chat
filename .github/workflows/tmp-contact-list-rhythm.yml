name: Temporary contact list rhythm patch
on:
  push:
    branches:
      - fix/contact-list-whatsapp-rhythm
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/contact-list-whatsapp-rhythm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch contact list source
        run: python tools/tmp_contact_list_patch.py
      - name: Rebuild canonical preview
        run: python tools/build_current_preview.py
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Verify contact list contract
        run: python -m pytest tests/test_v21_contact_list_whatsapp_rhythm.py -q
      - name: Commit generated production files
        run: |
          if git diff --quiet -- shell.js index.source.html index.html version.json; then
            echo "Already patched"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shell.js index.source.html index.html version.json
          git commit -m "fix: refine contact list time and row rhythm"
          git push origin HEAD:fix/contact-list-whatsapp-rhythm
