name: Mirror Chatwoot UI source

on:
  push:
    branches:
      - feat/chatwoot-ui-1to1-port
    paths:
      - .github/workflows/mirror-chatwoot-ui.yml
      - scripts/mirror-chatwoot-ui.mjs
      - scripts/verify-chatwoot-mirror.mjs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mirror-chatwoot-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Mirror exact upstream UI source
        env:
          CHATWOOT_MOBILE_COMMIT: 228a069c28f7ab8fdf0a59e22f7fa02e71d4ca10
          CHATWOOT_WEB_COMMIT: 9c7177005b3e2466f1de731da75192f8c9592e4b
        run: node scripts/mirror-chatwoot-ui.mjs

      - name: Verify mirror hashes and runtime boundary
        run: node scripts/verify-chatwoot-mirror.mjs

      - name: Commit mirror
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/chatwoot-mobile-ui vendor/chatwoot-web-ui
          if git diff --cached --quiet; then
            echo "Mirror already current"
            exit 0
          fi
          git commit -m "chore: mirror Chatwoot login and call UI sources"
          git push origin HEAD:${GITHUB_REF_NAME}
