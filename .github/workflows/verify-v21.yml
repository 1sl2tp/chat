name: Verify V21
on:
  push:
    branches:
      - main
      - v21-72-16-audio-pwa
      - v21-72-17-mobile-form-keyboard
      - v21-72-18-auth-actions-row
      - v21-72-19-profile-username-avatar
  pull_request:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/remove-legacy-chat-order-source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply legacy Chat order-source cleanup
        shell: bash
        run: |
          if [ ! -f admin-order-source.js ]; then
            echo "Legacy Chat order-source already removed"
          else
            python - <<'PY'
          from pathlib import Path
          root=Path('.')
          index_path=root/'index.source.html'
          text=index_path.read_text(encoding='utf-8')
          legacy='<script src="./admin-order-source.js" data-build-source="admin-order-source.js"></script>\n'
          assert legacy in text
          index_path.write_text(text.replace(legacy,'',1),encoding='utf-8')

          workflow_path=root/'.github/workflows/verify-v21.yml'
          workflow=workflow_path.read_text(encoding='utf-8')
          blocks=[
              "      - name: Customer order source core contract\n        run: node tests/test_v21_order_source_core.mjs\n",
              "      - name: Customer order source database contract\n        run: python tests/test_v21_order_source_db_contract.py\n",
              "      - name: Customer order source Edge contract\n        run: python tests/test_v21_order_source_edge_contract.py\n",
              "      - name: Customer order source timeline UI contract\n        run: python tests/test_v21_order_source_ui.py\n",
          ]
          for block in blocks:
              assert block in workflow
              workflow=workflow.replace(block,'',1)
          workflow_path.write_text(workflow,encoding='utf-8')

          migration=root/'supabase/migrations/20260915_remove_legacy_chat_order_source.sql'
          migration.write_text("""begin;\n\n-- KH incremental scanning now owns new customer-order ingestion.\n-- Remove only the obsolete Chat-side source-state table.\ndrop table if exists public.chat_order_source_states;\n\ncommit;\n""",encoding='utf-8')
          PY
            rm -f \
              admin-order-source.js \
              order-source-core.mjs \
              supabase/functions/v21-order-source/index.ts \
              supabase/functions/v21-order-source/source-core.mjs \
              tests/test_v21_order_source_core.mjs \
              tests/test_v21_order_source_db_contract.py \
              tests/test_v21_order_source_edge_contract.py \
              tests/test_v21_order_source_ui.py
            python tools/build_current_preview.py
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "refactor: remove legacy Chat order-source flow"
            git push origin HEAD:cleanup/remove-legacy-chat-order-source
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: V21.72.17 mobile form keyboard contract
        run: python tests/test_v21_72_17_mobile_form_keyboard_contract.py
      - name: V21.72.17 mobile form keyboard runtime
        run: node tests/test_v21_72_17_mobile_form_keyboard_runtime.js
      - name: V21.72.18 auth actions/PWA SW contract
        run: python tests/test_v21_72_18_auth_actions_row.py
      - name: V21.72.19 profile username/avatar contract
        run: python tests/test_v21_72_19_profile_username_avatar.py
      - name: Directory latest activity viewport contract
        run: python -m pytest tests/test_v21_contact_directory_groups.py -q
      - name: Contact list WhatsApp rhythm contract
        run: python -m pytest tests/test_v21_contact_list_whatsapp_rhythm.py -q
      - name: ChatGPT visual alignment contract
        run: python -m pytest tests/test_v21_chatgpt_visual_alignment.py -q
      - name: Desktop minimal three-column contract
        run: python -m pytest tests/test_v21_desktop_three_column_minimal.py -q
      - name: CHAT-owned work surface contract
        run: python tests/test_v21_remove_getlink_embed.py
      - name: Desktop chat workspace 3-column contract
        run: python tests/test_v21_chat_workspace_3col.py
      - name: Customer order source core contract
        run: node tests/test_v21_order_source_core.mjs
      - name: Customer order source database contract
        run: python tests/test_v21_order_source_db_contract.py
      - name: Customer order source Edge contract
        run: python tests/test_v21_order_source_edge_contract.py
      - name: Customer order source timeline UI contract
        run: python tests/test_v21_order_source_ui.py
      - name: Legacy Chat order-source removal contract
        run: python tests/test_v21_legacy_chat_order_source_removed.py
      - name: Chat image orientation + column-2 viewer contract
        run: python tests/test_v21_chat_image_orientation_column.py
      - name: Chat album viewer column-2 geometry contract
        run: python tests/test_v21_chat_album_viewer_column2.py
      - name: Chat AI product parser core contract
        run: node tests/test_v21_ai_product_parser_core.mjs
      - name: Chat shared-product catalog search contract
        run: node tests/test_v21_ai_product_catalog_search.mjs
      - name: Chat order summary footer contract
        run: node tests/test_v21_ai_order_summary.mjs
      - name: Chat exact key common-left-prefix contract
        run: node tests/test_v21_ai_product_exact_key_prefix.mjs
      - name: Chat AI product parser edge isolation contract
        run: python tests/test_v21_ai_product_parser_edge_contract.py
      - name: Chat AI database isolation contract
        run: python tests/test_v21_ai_product_parser_db_contract.py
      - name: Manual order scribe raw-name core contract
        run: node tests/test_v21_order_scribe_core.mjs
      - name: Master full SL + name contract
        run: node tests/test_v21_order_master_full.mjs
      - name: Handwritten repeat-marker inheritance contract
        run: node tests/test_v21_order_scribe_inherit_marker.mjs
      - name: Manual order scribe client normalization
        run: node tests/test_v21_order_scribe_client_runtime.js
      - name: Manual order scribe Edge contract
        run: python tests/test_v21_order_scribe_edge_contract.py
      - name: Grocery reference ranking contract
        run: node tests/test_v21_grocery_reference.mjs
      - name: Handwritten repeat-marker Edge contract
        run: python tests/test_v21_order_scribe_inherit_marker_edge.py
      - name: Incremental AI scan core contract
        run: node tests/test_v21_ai_incremental_scan_core.mjs
      - name: Incremental AI scan database/edge contract
        run: python tests/test_v21_ai_incremental_scan_db_contract.py
      - name: Chat order draft database contract
        run: python tests/test_v21_order_draft_db_contract.py
      - name: Chat order draft core contract
        run: node tests/test_v21_order_draft_core.mjs
      - name: Chat order draft Edge contract
        run: python tests/test_v21_order_draft_edge_contract.py
      - name: Chat order draft UI contract
        run: |
          node --check admin-order-draft.js
          python tests/test_v21_order_draft_ui.py
      - name: Chat order draft composer integration
        run: |
          node --check admin-ai-extract.js
          python tests/test_v21_order_draft_composer_integration.py
      - name: CHAT work isolation contract
        run: python tests/test_v21_work_context_bridge.py
      - name: Chat quote database contract
        run: python tests/test_v21_quote_db_contract.py
      - name: Chat quote core contract
        run: node tests/test_v21_quote_core.mjs
      - name: Chat quote edge contract
        run: python tests/test_v21_quote_edge_contract.py
      - name: Chat quote public page contract
        run: python tests/test_v21_quote_public_page.py
      - name: Chat quote Admin UI contract
        run: python tests/test_v21_quote_chat_ui.py
      - name: Chat call invite database contract
        run: python -m pytest tests/test_v21_call_invite_db_contract.py -q
      - name: Chat call invite Admin core contract
        run: node tests/test_v21_call_invite_admin_core.mjs
      - name: Chat call invite Admin Edge contract
        run: python -m pytest tests/test_v21_call_invite_admin_edge_contract.py -q
      - name: Chat call invite guest core contract
        run: node tests/test_v21_call_invite_guest_core.mjs
      - name: Chat call invite guest Edge contract
        run: python -m pytest tests/test_v21_call_invite_guest_edge_contract.py -q
      - name: Chat call invite guest session contract
        run: node tests/test_v21_call_invite_session.mjs
      - name: Chat call invite Admin UI contract
        run: python -m pytest tests/test_v21_call_invite_admin_ui.py -q
      - name: Chat call invite public page contract
        run: python -m pytest tests/test_v21_call_invite_public_page.py -q
      - name: Chat call invite incoming alert contract
        run: |
          node --check call-invite-client.js
          python -m pytest tests/test_v21_call_invite_incoming_alert.py -q
      - name: Verify canonical source
        run: python tools/verify_current.py
