name: Verify V21

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chat-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build canonical chat
        run: python tools/build_current_preview.py

      - name: Sync canonical build artifacts on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- index.html version.json; then
            echo "Canonical build artifacts already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html version.json
          git commit -m "build(chat): sync canonical output"
          git push origin HEAD:main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Reject old business Supabase project in runtime code
        shell: bash
        run: |
          set -euo pipefail
          OLD='gcnoahqsrquxkwkjbuxy'
          if git grep -n "$OLD" --             ':!supabase/migrations/**'             ':!docs/**'             ':!tests/**'             ':!**/*.md'             ':!.github/workflows/**'
          then
            echo "::error::Old Supabase project ref found in active runtime/deploy code."
            exit 1
          fi
          echo "OK: active runtime/deploy code has no old Supabase project ref."

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Admin push schema contract
        run: python -m pytest -q tests/test_v21_admin_web_push_schema.py
      - name: Admin push core contract
        run: node tests/test_v21_admin_web_push_core.mjs
      - name: Admin push edge contract
        run: python -m pytest -q tests/test_v21_admin_web_push_edge_contract.py
      - name: Admin push service worker runtime
        run: node tests/test_v21_admin_web_push_sw_runtime.js
      - name: Admin push controller runtime
        run: node tests/test_v21_admin_web_push_controller.js
      - name: Admin push browser ownership contract
        run: python -m pytest -q tests/test_v21_admin_web_push_ui_contract.py
      - name: Admin push open route and logout cleanup contract
        run: python -m pytest -q tests/test_v21_admin_web_push_open_route.py
      - name: Admin push open route runtime
        run: node tests/test_v21_admin_web_push_open_runtime.js

      - name: Zalo schema contract
        run: python -m pytest -q tests/test_v21_zalo_schema_contract.py
      - name: Zalo audio contract
        run: python -m pytest -q tests/test_v21_zalo_audio_contract.py
      - name: Zalo account admin contract
        run: python -m pytest -q tests/test_v21_zalo_account_admin_contract.py
      - name: Bank auto-collection Admin fail-closed contract
        run: python -m pytest -q tests/test_v21_bank_autocollect_admin_setting.py
      - name: BANK-159 SMS-only AI budget tests
        run: |
          python -m pytest -q tests/test_v21_bank159_ai_event_gate.py
          node tests/test_v21_bank159_sms_parser.mjs
      - name: Zalo Admin UI contract
        run: python -m pytest -q tests/test_v21_zalo_admin_ui_contract.py
      - name: Contact directory module syntax
        run: node --check contact-directory-admin.js
      - name: Mobile Chat share and contact role guardrails
        run: python -m pytest -q tests/test_v21_mobile_share_group_roles.py
      - name: TAPHOA order receipt handoff into Chat draft
        run: python -m pytest -q tests/test_v21_taphoa_order_image_prefill.py
      - name: Chat library composer, portrait media and account menu
        run: python -m pytest -q tests/test_v21_ui_library_composer_media_menu.py
      - name: Incoming sender narrow Chat edge layout
        run: python -m pytest -q tests/test_v21_incoming_left_edge_contract.py tests/test_v21_140_zalo_card_narrow_axis.py
      - name: Zalo bridge core tests
        run: cd bridge/zalo && npm test

      - name: V21.72.17 mobile form keyboard contract
        run: python tests/test_v21_72_17_mobile_form_keyboard_contract.py
      - name: V21.72.17 mobile form keyboard runtime
        run: node tests/test_v21_72_17_mobile_form_keyboard_runtime.js
      - name: UI-137 Web/PWA media metadata and bounded cache runtime
        run: node tests/test_v21_137_dual_session_media_runtime.js
      - name: Scoped admin/test deleted-history IndexedDB reset
        run: node tests/test_v21_admin_test_deleted_history_cache.js
      - name: UI-138 Web/PWA open-position and remote-history scroll runtime
        run: node tests/test_v21_138_scroll_visibility_policy.js
      - name: UI-156 message day labels runtime
