name: Rebuild Current Once
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild canonical output
        run: python tools/build_current_preview.py
      - name: Commit generated files
        run: |
          if git diff --quiet -- index.html version.json; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html version.json
          git commit -m "Rebuild canonical Chat output"
          git push
