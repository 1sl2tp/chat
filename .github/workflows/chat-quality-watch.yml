name: Chat Quality Watch

# Scheduled checks never write production, send customer messages, mutate DB,
# open a production browser session, or trigger the Pages deploy workflow.
on:
  schedule:
    - cron: '17 * * * *'    # hourly, lightweight source/contract checks
    - cron: '43 2 * * *'     # daily deep local-browser check (09:43 VN)
  pull_request:
    paths:
      - '.github/workflows/chat-quality-watch.yml'
      - '.agents/skills/modern-web-guidance/**'
      - 'qa/**'
      - 'tests/test_chat_quality_sources_20261123.cjs'
      - 'tests/test_chat_quality_v02_20261124.cjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chat-quality-watch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    name: Read-only chat contracts
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Node syntax and high-value mobile regressions
        run: |
          node --check app.js
          node --check shell.js
          node --check keyboard-inset-core.js
          node --check shell-form-viewport-policy.js
          node tests/test_chat437_mobile_optical_axis_20261123.cjs
          node tests/test_chat438_keyboard_content_priority_20261123.cjs
          node tests/test_chat439_composer_line_height_cap_20261123.cjs
          node tests/test_chat440_contextual_push_policy_20261123.cjs
          node tests/test_chat_desktop_foreground_recovery_20261104.cjs
          node tests/test_chat_web_server_first_sync_20261104.cjs
          node tests/test_chat_outbox_single_flight_20261029.cjs
          node tests/test_chat441_ios_photo_multiselect_20261123.cjs
          node tests/test_chat_quality_sources_20261123.cjs
          node tests/test_chat_quality_v02_20261124.cjs

  browser:
    name: Local multi-engine browser + accessibility
    needs: quick
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event.schedule == '43 2 * * *' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build canonical output in ephemeral CI checkout only
        run: python tools/build_current_preview.py
      - name: Install pinned browser and guidance test packages
        run: npm --prefix qa install --no-audit --no-fund
      - name: Install isolated Chromium, Firefox and WebKit test browsers
        run: npm --prefix qa exec -- playwright install --with-deps chromium firefox webkit
      - name: Verify Modern Web Guidance search works
        env:
          DISABLE_TELEMETRY: '1'
        run: npm --prefix qa run guidance:search -- "responsive design"
      - name: Anonymous localhost geometry, screenshots and axe-core analysis
        run: npm --prefix qa run test:browser
      - name: Archive QA evidence (no credentials or production data)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chat-quality-localhost-${{ github.run_id }}
          path: |
            qa/playwright-report/
            qa/test-results/
          if-no-files-found: ignore
          retention-days: 7
