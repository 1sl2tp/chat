name: Zalo Release Sync
on:
  push:
    branches:
      - feature/zalo-user-link-bridge-design
permissions:
  contents: write
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/fix_zalo_candidate_release.py
      - name: Commit synchronized bundle
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.source.html index.html version.json
          git commit -m "fix(chat): keep current release contract during Zalo candidate"
          git push origin HEAD:${{ github.ref_name }}
