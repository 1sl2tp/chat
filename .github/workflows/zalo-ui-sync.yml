name: Zalo UI Sync
on:
  push:
    branches:
      - feature/zalo-user-link-bridge-design
permissions:
  contents: write
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch canonical source and regenerate bundle
        run: python tools/patch_zalo_admin_ui_build.py
      - name: Commit generated canonical bundle
        run: |
          if git diff --quiet; then
            echo "No build sync changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.source.html index.html version.json tools/verify_current.py
          git commit -m "feat(chat): wire Admin Zalo link UI"
          git push origin HEAD:${{ github.ref_name }}
