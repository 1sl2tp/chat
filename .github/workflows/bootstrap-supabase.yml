name: Bootstrap pinned Supabase SDK

on:
  push:
    branches: ["integration/supabase-0.5.0"]

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install pinned SDK and commit lockfile
        shell: bash
        run: |
          if grep -q '"@supabase/supabase-js"' package.json; then
            echo "Supabase SDK already pinned"
            exit 0
          fi
          npm install @supabase/supabase-js@2.112.4 --save-exact
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "build: pin supabase-js 2.112.4"
          git push
