name: Migrate Zalo Render once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/migrate-zalo-render-once.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_TOKEN: ${{ secrets.SUPABASE_TOKEN }}
      SUPABASE_PAT: ${{ secrets.SUPABASE_PAT }}
      PROJECT_REF: gcnoahqsrquxkwkjbuxy
    steps:
      - uses: actions/checkout@v4
      - name: Apply Zalo Render migration
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.request, urllib.error
          token=(os.environ.get('SUPABASE_ACCESS_TOKEN') or os.environ.get('SUPABASE_TOKEN') or os.environ.get('SUPABASE_PAT') or '').strip()
          if not token:
              print('NO_SUPABASE_MANAGEMENT_TOKEN')
              raise SystemExit(78)
          ref=os.environ['PROJECT_REF']
          sql=open('supabase/migrations/20261001073000_move_zalo_render.sql','r',encoding='utf-8').read()
          req=urllib.request.Request(
              f'https://api.supabase.com/v1/projects/{ref}/database/query',
              data=json.dumps({'query':sql}).encode(),
              headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'},
              method='POST',
          )
          try:
              with urllib.request.urlopen(req,timeout=60) as r:
                  body=r.read().decode('utf-8','ignore')
                  print('MIGRATION_HTTP',r.status)
                  print(body[:4000])
          except urllib.error.HTTPError as e:
              body=e.read().decode('utf-8','ignore')
              print('MIGRATION_HTTP',e.code)
              print(body[:4000])
              raise
          PY
