name: Deploy NCC AI Chat Edge
on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/v21-ncc-ai-room/**"
      - "supabase/migrations/20261115010000_ncc010_product_aliases_vietnamese_names.sql"
      - "tools/release_ncc010_product_identity.mjs"
      - "tests/test_ncc011_release_contract_20261115.mjs"
      - "tests/test_ncc007_chat_room_contract_20261114.cjs"
      - ".github/workflows/deploy-ncc-ai-room-edge.yml"
      - "tools/ncc013_emit_status.mjs"
      - "tests/test_ncc013_release_status_20261115.mjs"
  workflow_dispatch: {}
permissions:
  contents: read
  statuses: write
concurrency:
  group: chat-ncc-ai-edge-prod
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PROJECT_REF: vtqhbhrkdxirqeqkgylo
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Require exact canonical main
        shell: bash
        run: |
          if [ "$GITHUB_REPOSITORY" != "1sl2tp/chat" ] || [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::NCC Edge release restricted to canonical Chat main."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate checked-out source SHA
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "NCC AI source: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Begin NCC release commit status
        env:
          GITHUB_STATUS_TOKEN: ${{ github.token }}
        run: node tools/ncc013_emit_status.mjs pending
      - name: Check UI, canonical product schema and release contract
        run: |
          node --check ncc-ai-room.js
          node --check tools/release_ncc010_product_identity.mjs
          node tests/test_ncc007_chat_room_contract_20261114.cjs
          node tests/test_ncc010_product_linking_20261115.mjs
          node tests/test_ncc011_release_contract_20261115.mjs
          node tests/test_ncc013_release_status_20261115.mjs
      - name: Require preconfigured CI credential
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "NCC_RELEASE_REASON=missing_ci_secret" >> "$GITHUB_ENV"
            echo "::error title=NCC AI blocked::Missing GitHub Actions secret SUPABASE_ACCESS_TOKEN. Configure once in 1sl2tp/chat Settings > Secrets and variables > Actions. No manual production deployment fallback."
            {
              echo "### NCC AI release blocked before any production changes"
              echo "Cause: GitHub Actions secret SUPABASE_ACCESS_TOKEN is not configured."
              echo "Action: repository Settings > Secrets and variables > Actions > SUPABASE_ACCESS_TOKEN."
              echo "Project: $PROJECT_REF | Branch: $GITHUB_REF"
              echo "No database migration or Edge deploy was attempted."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Release only the pinned NCC-010 schema with post-verification
        run: node tools/release_ncc010_product_identity.mjs
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy isolated Admin OCR function (no other migrations)
        env:
          # CLI v3 requires explicit consent for hosted mutations in CI.
          # Consent is scoped to this exact main-only NCC function release.
          SUPABASE_YES: "1"
        run: |
          supabase --version
          supabase functions deploy v21-ncc-ai-room \
            --remote="$PROJECT_REF" \
            --use-api \
            --no-verify-jwt \
            --yes
      - name: Report non-secret release
        run: |
          {
            echo "### NCC AI Edge deployment"
            echo "Project: $PROJECT_REF"
            echo "Function: v21-ncc-ai-room"
            echo "SHA: $GITHUB_SHA"
            echo "NCC-010 schema verified and isolated Edge function released; no customer messages or price updates"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Report NCC production release status on canonical commit
        if: always()
        env:
          GITHUB_STATUS_TOKEN: ${{ github.token }}
          NCC_JOB_STATUS: ${{ job.status }}
        run: node tools/ncc013_emit_status.mjs final
