name: Canonical Sync Temp

on:
  push:
    branches:
      - fix/guest-call-two-way-audio

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/guest-call-two-way-audio
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build canonical preview
        run: python tools/build_current_preview.py
      - name: Commit canonical output
        run: |
          if git diff --quiet -- index.html version.json; then
            echo "canonical output already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html version.json
          git commit -m "chore: sync canonical guest call audio build"
          git push origin HEAD:fix/guest-call-two-way-audio
