name: Apply V21.72.42 Green
on:
  push:
    branches:
      - feature/admin-context-emoticon-mobile-polish
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply bounded production patch
        run: python tools/apply_v21_72_42.py
      - name: Syntax check runtime
        run: |
          node --check app.js
          node --check shell.js
      - name: Build canonical preview
        run: python tools/build_current_preview.py
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Verify all green
        run: python tools/verify_current.py
      - name: Commit green state
        run: |
          rm tools/apply_v21_72_42.py
          rm .github/workflows/apply-v21-72-42-green.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js shell.js index.source.html index.html version.json tests/test_v21_72_42_admin_context_mobile_emoticon.py tools/verify_current.py tools/apply_v21_72_42.py .github/workflows/apply-v21-72-42-green.yml
          git commit -m "feat: polish admin chat context and mobile directory [v21.72.42]"
          git push origin HEAD:feature/admin-context-emoticon-mobile-polish
