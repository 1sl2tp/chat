name: Remove legacy Chat split/order flow

on:
  push:
    branches: [main]
    paths:
      - 'tools/remove_legacy_chat_split_order.py'
      - '.github/workflows/remove-legacy-chat-split-order.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply removal
        run: python tools/remove_legacy_chat_split_order.py
      - name: Verify removal contract
        run: python tests/test_v21_legacy_chat_order_source_removed.py
      - name: Verify preserved Admin actions
        run: |
          node --check admin-composer-actions.js
          python tests/test_v21_quote_chat_ui.py
      - name: Remove one-shot cleanup files
        run: |
          rm -f tools/remove_legacy_chat_split_order.py
          rm -f .github/workflows/remove-legacy-chat-split-order.yml
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'refactor: remove legacy Chat split search order flow'
          git push origin main
