name: Sync contact directory preview
on:
  pull_request:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Add focused directory module loader
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('zalo-admin-link.js')
          text=path.read_text('utf-8').rstrip()
          loader="void import('./contact-directory-admin.js').catch(error=>console.warn('[contact-directory-admin]',error));"
          if loader not in text:
              path.write_text(text+'\n\n'+loader+'\n','utf-8')
          PY
      - name: Build canonical candidate
        run: python tools/build_current_preview.py
      - name: Commit synchronized files
        run: |
          if ! git diff --quiet -- zalo-admin-link.js index.html version.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add zalo-admin-link.js index.html version.json
            git commit -m "build: sync contact directory preview"
            git push origin "HEAD:${{ github.head_ref }}"
          fi
