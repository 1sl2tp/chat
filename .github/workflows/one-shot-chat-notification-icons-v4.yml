name: One-shot chat notification icons v4
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build notification icon and badge
        run: |
          python -m pip install pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          import subprocess,sys

          ROOT=Path('.')
          ICONS=ROOT/'icons'
          GREEN=(22,163,74)
          WHITE=(255,255,255,255)

          # Large notification icon: simpler than app icon, more internal air,
          # optimized for notification trays/cards rather than home-screen mask.
          size=192
          s=4
          S=size*s
          im=Image.new('RGBA',(S,S),GREEN+(255,))
          d=ImageDraw.Draw(im)
          def q(v): return int(v*S/192)
          d.rounded_rectangle((q(36),q(42),q(156),q(136)),radius=q(27),fill=WHITE)
          d.polygon([(q(58),q(126)),(q(43),q(158)),(q(82),q(136))],fill=WHITE)
          cy=q(89); rr=q(7)
          for cx in (78,96,114):
              x=q(cx)
              d.ellipse((x-rr,cy-rr,x+rr,cy+rr),fill=GREEN+(255,))
          im.resize((192,192),Image.Resampling.LANCZOS).save(ICONS/'chat-notification-icon-192-v4.png',optimize=True)

          # Android/Web Push badge: transparent monochrome alpha silhouette.
          # OS tints this itself, so no colored background and minimal geometry.
          B=96
          badge=Image.new('RGBA',(B,B),(0,0,0,0))
          bd=ImageDraw.Draw(badge)
          bd.rounded_rectangle((20,23,76,67),radius=13,fill=WHITE)
          bd.polygon([(31,62),(24,79),(43,67)],fill=WHITE)
          # Three negative dots remain transparent so the mark stays legible at tiny size.
          r=3
          for cx in (40,48,56):
              bd.ellipse((cx-r,43-r,cx+r,43+r),fill=(0,0,0,0))
          badge.save(ICONS/'chat-notification-badge-96-v4.png',optimize=True)

          sw_path=ROOT/'sw.js'
          sw=sw_path.read_text('utf-8')
          sw=sw.replace(
              "'./icons/chat-maskable-512-v3.png'];",
              "'./icons/chat-maskable-512-v3.png','./icons/chat-notification-icon-192-v4.png','./icons/chat-notification-badge-96-v4.png'];"
          )
          sw=sw.replace(
              "icon:String(payload.icon||'./icons/chat-app-192-v3.png'),",
              "icon:'./icons/chat-notification-icon-192-v4.png',"
          )
          sw=sw.replace(
              "badge:'./icons/chat-app-192-v3.png',",
              "badge:'./icons/chat-notification-badge-96-v4.png',"
          )
          sw_path.write_text(sw,'utf-8')

          core_path=ROOT/'supabase/functions/v21-admin-push/push-core.mjs'
          core=core_path.read_text('utf-8').replace(
              "icon:'./icons/chat-192.png'",
              "icon:'./icons/chat-notification-icon-192-v4.png'"
          )
          core_path.write_text(core,'utf-8')

          sw_test_path=ROOT/'tests/test_v21_admin_web_push_sw_runtime.js'
          sw_test=sw_test_path.read_text('utf-8')
          anchor="assert.equal(bg.notices[0].options.tag,'chat:conv-1');"
          insert=anchor+"\n  assert.equal(bg.notices[0].options.icon,'./icons/chat-notification-icon-192-v4.png','notification must use dedicated crisp icon');\n  assert.equal(bg.notices[0].options.badge,'./icons/chat-notification-badge-96-v4.png','notification badge must use dedicated monochrome asset');"
          if "dedicated crisp icon" not in sw_test:
              sw_test=sw_test.replace(anchor,insert)
          sw_test_path.write_text(sw_test,'utf-8')

          core_test_path=ROOT/'tests/test_v21_admin_web_push_core.mjs'
          core_test=core_test_path.read_text('utf-8')
          anchor2="assert.equal(payload.contact_id,'u1');"
          insert2=anchor2+"\nassert.equal(payload.icon,'./icons/chat-notification-icon-192-v4.png','push payload advertises dedicated notification icon');"
          if "push payload advertises dedicated notification icon" not in core_test:
              core_test=core_test.replace(anchor2,insert2)
          core_test_path.write_text(core_test,'utf-8')

          subprocess.run([sys.executable,'tools/build_current_preview.py'],check=True)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons/chat-notification-icon-192-v4.png icons/chat-notification-badge-96-v4.png sw.js supabase/functions/v21-admin-push/push-core.mjs tests/test_v21_admin_web_push_sw_runtime.js tests/test_v21_admin_web_push_core.mjs index.html version.json
          if git diff --cached --quiet; then
            echo "notification icons already current"
            exit 0
          fi
          git commit -m "Separate Chat notification icon and badge"
          git push
