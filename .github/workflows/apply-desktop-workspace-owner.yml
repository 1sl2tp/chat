name: Apply Desktop Workspace Owner Fix
on:
  push:
    branches:
      - fix/desktop-workspace-auth-sync
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/desktop-workspace-auth-sync
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install verify dependency
        run: python -m pip install pytest
      - name: Apply desktop workspace ownership and proportions
        run: |
          python - <<'PY'
          from pathlib import Path

          shell = Path('shell.js')
          s = shell.read_text(encoding='utf-8')

          old = "const appShell=document.getElementById('appShell');\n"
          new = old + "const stageLayout=document.getElementById('stageLayout');\nconst workView=document.getElementById('workThreadView');\nconst workThreadHome=workView?.parentNode||null;\nconst workThreadNext=workView?.nextSibling||null;\n"
          assert old in s
          s = s.replace(old, new, 1)

          old = """function desktopWorkspaceEnabled(){\n  return authState==='AUTHENTICATED'&&desktopWorkspaceMedia.matches;\n}\n\nfunction applyRoutePresentation(){\n  const desktopWorkspace=desktopWorkspaceEnabled();\n  if(desktopWorkspace&&route==='work')route='chat';\n  screenHost.dataset.route=route;\n  appShell.dataset.route=route;\n  appShell.dataset.desktopWorkspace=String(desktopWorkspace);\n  const chatNodes=document.querySelectorAll('[data-chat-thread-node]');\n  const workView=document.getElementById('workThreadView');\n"""
          new = """function desktopWorkspaceEnabled(){\n  return authState==='AUTHENTICATED'&&desktopWorkspaceMedia.matches;\n}\n\nfunction syncDesktopWorkOwner(desktopWorkspace){\n  if(!workView||!stageLayout||!workThreadHome)return false;\n  if(desktopWorkspace){\n    if(workView.parentNode!==stageLayout)stageLayout.appendChild(workView);\n    return true;\n  }\n  if(workView.parentNode!==workThreadHome){\n    if(workThreadNext&&workThreadNext.parentNode===workThreadHome){\n      workThreadHome.insertBefore(workView,workThreadNext);\n    }else{\n      workThreadHome.appendChild(workView);\n    }\n  }\n  return false;\n}\n\nfunction applyRoutePresentation(){\n  const desktopWorkspace=desktopWorkspaceEnabled();\n  if(desktopWorkspace&&route==='work')route='chat';\n  screenHost.dataset.route=route;\n  appShell.dataset.route=route;\n  appShell.dataset.desktopWorkspace=String(desktopWorkspace);\n  syncDesktopWorkOwner(desktopWorkspace);\n  const chatNodes=document.querySelectorAll('[data-chat-thread-node]');\n"""
          assert old in s
          s = s.replace(old, new, 1)

          old = """    this.setAccount(authenticated?account:null);\n    syncDesktopSidebarMode();\n  }\n};\n"""
          new = """    this.setAccount(authenticated?account:null);\n    syncDesktopSidebarMode();\n    syncDesktopWorkspaceMode();\n  }\n};\n"""
          assert old in s
          s = s.replace(old, new, 1)
          shell.write_text(s, encoding='utf-8')

          source = Path('index.source.html')
          h = source.read_text(encoding='utf-8')
          old = '--desktop-directory-width:clamp(328px,27vw,340px);'
          new = '--desktop-directory-width:clamp(260px,17vw,300px);'
          assert old in h
          h = h.replace(old, new, 1)

          old = """  #appShell[data-auth-state=\"authenticated\"][data-desktop-workspace=\"true\"]{\n    --desktop-work-width:clamp(360px,30vw,440px);\n  }\n"""
          new = """  #appShell[data-auth-state=\"authenticated\"][data-desktop-workspace=\"true\"]{\n    --desktop-chat-width:clamp(420px,28vw,560px);\n    --desktop-work-width:calc(100% - var(--desktop-chat-width));\n  }\n"""
          assert old in h
          h = h.replace(old, new, 1)

          old = """    display:block!important;\n    width:var(--desktop-work-width);\n    min-width:0;\n    min-height:0;\n    padding:8px 8px 8px 0;\n"""
          new = """    display:flex!important;\n    width:var(--desktop-work-width);\n    height:auto;\n    min-width:0;\n    min-height:0;\n    padding:0;\n"""
          assert old in h
          h = h.replace(old, new, 1)

          old = """  #appShell[data-auth-state=\"authenticated\"][data-desktop-workspace=\"true\"] #workThreadView .work-thread-frame{\n    border-radius:16px;\n  }\n"""
          new = """  #appShell[data-auth-state=\"authenticated\"][data-desktop-workspace=\"true\"] #workThreadView .work-thread-frame{\n    border-radius:0;\n    border-block:0;\n    border-inline-end:0;\n  }\n"""
          assert old in h
          h = h.replace(old, new, 1)
          source.write_text(h, encoding='utf-8')
          PY
      - name: Verify focused desktop contract
        run: python tests/test_v21_chat_workspace_3col.py
      - name: Rebuild canonical output
        run: python tools/build_current_preview.py
      - name: Verify full canonical source
        id: verify
        continue-on-error: true
        run: python tools/verify_current.py > verify-debug.txt 2>&1
      - name: Commit debug log on verify failure
        if: steps.verify.outcome == 'failure'
        run: |
          git config user.name '1sl2tp'
          git config user.email '1sl2tp@gmail.com'
          git add verify-debug.txt
          git commit -m 'debug: capture desktop workspace verify failure'
          git push origin HEAD:fix/desktop-workspace-auth-sync
      - name: Stop on verify failure
        if: steps.verify.outcome == 'failure'
        run: exit 1
      - name: Commit product files
        if: steps.verify.outcome == 'success'
        run: |
          git config user.name '1sl2tp'
          git config user.email '1sl2tp@gmail.com'
          git add shell.js index.source.html index.html version.json
          git diff --cached --quiet || git commit -m 'fix: make desktop work iframe stage-owned and wider'
          git push origin HEAD:fix/desktop-workspace-auth-sync
