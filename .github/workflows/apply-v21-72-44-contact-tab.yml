name: Apply V21.72.44 Contact Tab Identity

on:
  push:
    branches:
      - feature/contact-tab-identity

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply contact tab identity
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('.')

          source=root/'index.source.html'
          text=source.read_text('utf-8')
          old_css='''.active-contact-context{grid-column:2;grid-row:1;align-self:end;justify-self:center;max-width:min(72vw,260px);margin-bottom:2px;color:var(--theme-content-tertiary);font-size:11px;line-height:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}\n.active-contact-context[hidden]{display:none}\n#appShell[data-admin-contact-context="true"] .top-mode-switch{transform:translateY(-9px)}\n.compact-top-grid:has(.call-focus-slot:not([data-call-ui-state="idle"])) .active-contact-context{display:none}\n'''
          new_css='''.top-mode-tab[data-top-tab="chat"]{display:flex;align-items:center;justify-content:center;gap:6px}\n.top-mode-contact-avatar{width:20px;height:20px;flex:0 0 20px;border-radius:999px;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;font-size:9px;line-height:1;font-weight:700}\n.top-mode-contact-avatar[hidden]{display:none!important}\n.top-mode-contact-avatar>img{width:100%;height:100%;display:block;object-fit:cover}\n.top-mode-tab[data-top-tab="chat"] [data-chat-tab-label]{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n'''
          assert old_css in text, 'old active contact context CSS not found'
          text=text.replace(old_css,new_css,1)
          text=text.replace('  .active-contact-context{max-width:210px;font-size:10.5px}\n','',1)
          old_html='''          <button type="button" class="top-mode-tab" role="tab" aria-selected="false" data-top-tab="chat" data-nav-target="chat">Trò chuyện</button>\n          <button type="button" class="top-mode-tab" role="tab" aria-selected="false" data-top-tab="work" data-nav-target="work">Công việc</button>\n        </div>\n        <div class="active-contact-context" data-active-contact-context hidden aria-live="polite"><span data-active-contact-context-text></span></div>\n'''
          new_html='''          <button type="button" class="top-mode-tab" role="tab" aria-selected="false" data-top-tab="chat" data-nav-target="chat"><span class="contact-avatar-source top-mode-contact-avatar" data-chat-tab-avatar hidden></span><span data-chat-tab-label>Trò chuyện</span></button>\n          <button type="button" class="top-mode-tab" role="tab" aria-selected="false" data-top-tab="work" data-nav-target="work">Công việc</button>\n        </div>\n'''
          assert old_html in text, 'top mode HTML block not found'
          text=text.replace(old_html,new_html,1)
          source.write_text(text,'utf-8')

          shell=root/'shell.js'
          js=shell.read_text('utf-8')
          old_fn='''function renderActiveContactContext(){\n  const node=document.querySelector('[data-active-contact-context]');\n  const text=node?.querySelector('[data-active-contact-context-text]');\n  const visible=Boolean(\n    authState==='AUTHENTICATED' &&\n    authAccount?.role==='admin' &&\n    route==='chat' &&\n    activeContact?.id\n  );\n  if(appShell)appShell.dataset.adminContactContext=String(visible);\n  if(!node)return visible;\n  node.hidden=!visible;\n  if(text)text.textContent=visible?`Đang chat · ${String(activeContact?.name||'Liên hệ')}`:'';\n  return visible;\n}\n'''
          new_fn='''function renderChatTabIdentity(){\n  const tab=document.querySelector('[data-top-tab="chat"]');\n  const avatar=tab?.querySelector('[data-chat-tab-avatar]');\n  const label=tab?.querySelector('[data-chat-tab-label]');\n  const visible=Boolean(\n    authState==='AUTHENTICATED' &&\n    authAccount?.role==='admin' &&\n    route==='chat' &&\n    activeContact?.id\n  );\n  if(!tab||!avatar||!label)return visible;\n  if(!visible){\n    avatar.hidden=true;\n    label.textContent='Trò chuyện';\n    tab.removeAttribute('title');\n    return false;\n  }\n  const item=window.V21ContactStore?.snapshot?.().find(row=>\n    row?.id&&!row.deleted_at&&String(row.id)===String(activeContact.id)\n  )||null;\n  const name=String(item?.display_name||item?.username||activeContact?.name||'Liên hệ');\n  label.textContent=name;\n  tab.title=name;\n  avatar.hidden=false;\n  renderAvatarNode(avatar,item||{id:activeContact.id,display_name:name,username:name,avatar_path:null},'L');\n  return true;\n}\n'''
          assert old_fn in js, 'old renderActiveContactContext function not found'
          js=js.replace(old_fn,new_fn,1)
          js=js.replace('renderActiveContactContext();','renderChatTabIdentity();')
          old_listener="""document.addEventListener('v21-contact-store-change',event=>{\n  reconcileActiveContactFromStore(event.detail||{});\n});"""
          new_listener="""document.addEventListener('v21-contact-store-change',event=>{\n  reconcileActiveContactFromStore(event.detail||{});\n  renderChatTabIdentity();\n});"""
          assert old_listener in js, 'contact store listener not found'
          js=js.replace(old_listener,new_listener,1)
          shell.write_text(js,'utf-8')

          legacy=root/'tests'/'test_v21_72_42_admin_context_mobile_emoticon.py'
          t=legacy.read_text('utf-8')
          old_contract='''# Admin-only conversation context stays in the header so rapid contact switching never loses who owns the thread.\nassert "data-active-contact-context" in source\nassert "function renderActiveContactContext()" in shell\nassert "authAccount?.role==='admin'" in shell\nassert "route==='chat'" in shell\nassert "activeContact?.id" in shell\nassert "Đang chat ·" in shell\n'''
          new_contract='''# Admin-only conversation identity stays in the header, now inside the Chat tab itself.\nassert "data-active-contact-context" not in source\nassert "data-chat-tab-avatar" in source\nassert "data-chat-tab-label" in source\nassert "function renderChatTabIdentity()" in shell\nassert "authAccount?.role==='admin'" in shell\nassert "route==='chat'" in shell\nassert "activeContact?.id" in shell\nassert "Đang chat ·" not in shell\n'''
          assert old_contract in t, 'legacy admin context contract not found'
          legacy.write_text(t.replace(old_contract,new_contract,1),'utf-8')
          print('V21.72.44 contact tab identity patch applied')
          PY
      - name: Build canonical preview
        run: python tools/build_current_preview.py
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Verify all green
        run: python tools/verify_current.py
      - name: Commit green state
        shell: bash
        run: |
          rm .github/workflows/apply-v21-72-44-contact-tab.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.source.html index.html shell.js version.json tests/test_v21_72_42_admin_context_mobile_emoticon.py .github/workflows/apply-v21-72-44-contact-tab.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: show active contact inside chat tab"
          git push origin HEAD:feature/contact-tab-identity
