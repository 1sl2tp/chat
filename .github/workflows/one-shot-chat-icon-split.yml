name: One-shot chat icon split
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Patch chat favicon links
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          old = '''<link rel="apple-touch-icon" sizes="192x192" href="./icons/chat-192.png">
          <link rel="icon" type="image/png" sizes="192x192" href="./icons/chat-192.png">'''.replace('          ', '')
          new = '''<link rel="apple-touch-icon" sizes="192x192" href="./icons/chat-192.png">
          <link rel="icon" type="image/svg+xml" href="./icons/chat-favicon.svg">
          <link rel="shortcut icon" type="image/svg+xml" href="./icons/chat-favicon.svg">
          <link rel="mask-icon" href="./icons/chat-favicon.svg" color="#16a34a">'''.replace('          ', '')
          if old in text:
              text = text.replace(old, new, 1)
              p.write_text(text, encoding='utf-8')
          PY
          if git diff --quiet -- index.html; then
            echo "index already patched"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Split chat favicon from app icon"
          git push
