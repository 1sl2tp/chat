name: BANK-READER-ROOT-02 lab
on:
  pull_request:
    paths:
      - 'labs/bank-reader-root-02/**'
      - '.github/workflows/bank-reader-root-02.yml'
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node labs/bank-reader-root-02/reader.test.mjs
