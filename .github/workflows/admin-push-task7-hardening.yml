name: Admin Push Task7 Hardening
on:
  push:
    branches:
      - feature/admin-web-push-design
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/admin-web-push-design
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch hardening changes
        run: |
          echo '' | base64 -d > /tmp/admin-push-hardening.py
          python /tmp/admin-push-hardening.py
      - name: Verify hardening contracts
        run: |
          python -m pip install -q pytest
          python -m pytest -q tests/test_v21_admin_web_push_open_route.py
          node tests/test_v21_admin_web_push_open_runtime.js
          node --check auth-session-store.js
          node --check shell.js
          node --check admin-push-controller.js
      - name: Build canonical preview
        run: python tools/build_current_preview.py
      - name: Commit and remove one-shot workflow
        run: |
          rm -f .github/workflows/admin-push-task7-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add auth-session-store.js shell.js admin-push-controller.js index.html version.json .github/workflows/admin-push-task7-hardening.yml
          git commit -m "fix: harden admin push logout and cold-open routing"
          git push origin HEAD:feature/admin-web-push-design
