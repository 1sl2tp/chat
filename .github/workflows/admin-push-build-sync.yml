name: Admin Push Build Sync
on:
  push:
    branches:
      - feature/admin-web-push-design
permissions:
  contents: write
jobs:
  build-sync:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/admin-web-push-design
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build canonical preview
        run: python tools/build_current_preview.py
      - name: Commit generated files and remove one-shot workflow
        run: |
          rm -f .github/workflows/admin-push-build-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html version.json .github/workflows/admin-push-build-sync.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build: sync admin push canonical preview"
          git push origin HEAD:feature/admin-web-push-design
