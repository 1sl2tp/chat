name: Deploy Bank Bill OCR Edge
on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/v21-bank-bill-event/**"
      - "supabase/functions/v21-agribank-notification-ingest/**"
      - "tests/test_bank266_bill_format_variants_20261108.mjs"
      - "tests/test_bank267_bill_ocr_swap_report_20261110.cjs"
      - "tests/test_bank269_bill_literal_date_clock_20261110.mjs"
      - "tests/test_bank270_printed_date_ocr_correction_20261110.mjs"
      - "tests/test_bank284_receipt_fields_manual_fallback_20261111.mjs"
      - "tests/test_bank286_recognition_casebook_20261111.mjs"

      - "tests/test_bank287_agribank_qr_memo_20261112.mjs"
      - "tests/test_bank291_techcombank_comma_date_20261112.mjs"
      - "tests/test_bank292_delayed_bank_credit_recheck_20261112.mjs"
      - "tests/test_bank288_edge_deploy_main_only_20261112.cjs"
      - ".github/workflows/deploy-bank-bill-edge.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: chat-bank-bill-edge-prod
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: vtqhbhrkdxirqeqkgylo
    steps:
      - name: Require canonical Chat main branch and repo
        shell: bash
        run: |
          if [ "$GITHUB_REPOSITORY" != "1sl2tp/chat" ] || [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Bank-bill Edge deploy is restricted to 1sl2tp/chat:main. Nothing deployed."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact release commit and record non-secret provenance
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA" || {
            echo "::error::Checkout SHA differs from requested main commit. Nothing deployed."
            exit 1
          }
          {
            echo "### Bank-bill Edge deployment source"
            echo "- Repository: \`$GITHUB_REPOSITORY\`"
            echo "- Branch ref: \`$GITHUB_REF\`"
            echo "- Source commit: \`$GITHUB_SHA\`"
            echo "- Supabase project: \`$PROJECT_REF\`"
            echo "- Function: \`v21-bank-bill-event\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate bank receipt OCR and report contracts
        run: |
          node tests/test_bank266_bill_format_variants_20261108.mjs
          node tests/test_bank267_bill_ocr_swap_report_20261110.cjs
          node tests/test_bank269_bill_literal_date_clock_20261110.mjs
          node tests/test_bank270_printed_date_ocr_correction_20261110.mjs
          node tests/test_bank284_receipt_fields_manual_fallback_20261111.mjs
          node tests/test_bank286_recognition_casebook_20261111.mjs
          node tests/test_bank287_agribank_qr_memo_20261112.mjs
          node tests/test_bank291_techcombank_comma_date_20261112.mjs
          node tests/test_bank292_delayed_bank_credit_recheck_20261112.mjs
          node tests/test_bank288_edge_deploy_main_only_20261112.cjs
      - name: Require configured Supabase deployment credential
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is unavailable in this GitHub Actions job. An existing Supabase connector token is separate; nothing deployed."
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy ONLY the existing bank bill OCR function
        shell: bash
        run: |
          supabase functions deploy v21-bank-bill-event \
            --project-ref "$PROJECT_REF" --no-verify-jwt
          supabase functions deploy v21-agribank-notification-ingest \
            --project-ref "$PROJECT_REF" --no-verify-jwt
