name: Fix Zalo WebView runtime once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-zalo-webview-runtime-once.yml"

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install verifier dependency
        run: python -m pip install --quiet pytest

      - name: Write Zalo WebView regression test
        run: |
          cat > tests/test_v21_72_40_zalo_webview_runtime_error.js <<'JS'
          const fs=require('fs');
          const vm=require('vm');
          const assert=require('assert');
          const path=require('path');

          const source=fs.readFileSync(path.join(__dirname,'..','app.js'),'utf8');
          const start=source.indexOf('function isOwnedRuntimeErrorEvent(event){');
          const end=source.indexOf("\nwindow.addEventListener('error'",start);
          assert(start>=0&&end>start,'runtime ownership function must exist');

          const context={
            console:{warn(){}},
            URL,
            location:{
              href:'https://chat.taphoa.xyz/',
              origin:'https://chat.taphoa.xyz',
              protocol:'https:'
            }
          };
          vm.createContext(context);
          vm.runInContext(source.slice(start,end)+'\nthis.__isOwned=isOwnedRuntimeErrorEvent;',context);
          const isOwned=context.__isOwned;

          assert.strictEqual(
            isOwned({
              message:"ReferenceError: Can't find variable: zaloJSV2",
              filename:'',
              error:{message:"Can't find variable: zaloJSV2"}
            }),
            false,
            'Zalo WebView bridge ReferenceError must be treated as external runtime noise'
          );

          assert.strictEqual(
            isOwned({
              message:'ReferenceError: zaloJSV2 is not defined',
              filename:'https://chat.taphoa.xyz/',
              error:{message:'zaloJSV2 is not defined'}
            }),
            false,
            'Zalo bridge noise must stay ignored even when the WebView attributes it to the page'
          );

          assert.strictEqual(
            isOwned({
              message:"ReferenceError: Can't find variable: chatOwnedVariable",
              filename:'',
              error:{message:"Can't find variable: chatOwnedVariable"}
            }),
            true,
            'ordinary no-filename app ReferenceErrors must still surface'
          );

          assert.strictEqual(
            isOwned({
              message:'TypeError: first-party failure',
              filename:'https://chat.taphoa.xyz/app.js',
              error:{message:'first-party failure'}
            }),
            true,
            'first-party runtime errors must still surface'
          );

          assert.strictEqual(
            isOwned({
              message:'TypeError: external failure',
              filename:'https://cdn.example.com/widget.js',
              error:{message:'external failure'}
            }),
            false,
            'existing external-origin filtering must remain intact'
          );

          console.log('V21.72.40 Zalo WebView runtime error scope PASS');
          JS

      - name: RED - prove current build exposes Zalo bridge noise
        run: |
          set +e
          node tests/test_v21_72_40_zalo_webview_runtime_error.js > /tmp/zalo-red.log 2>&1
          status=$?
          set -e
          cat /tmp/zalo-red.log
          if [ "$status" -eq 0 ]; then
            echo "Expected regression test to fail before the production fix"
            exit 1
          fi
          echo "RED confirmed: current runtime ownership filter misclassifies zaloJSV2"

      - name: Patch only the runtime ownership boundary
        run: |
          python - <<'PY'
          from pathlib import Path

          app=Path('app.js')
          text=app.read_text(encoding='utf-8')
          anchor="""function isOwnedRuntimeErrorEvent(event){
            const message=String(event?.message||'').trim();
            const filename=String(event?.filename||'').trim();

          """.replace('          ','')
          replacement="""function isOwnedRuntimeErrorEvent(event){
            const message=String(event?.message||'').trim();
            const filename=String(event?.filename||'').trim();
            const externalMessage=`${message} ${String(event?.error?.message||'')}`.trim();

            // Zalo's in-app WebView can inject a bridge reference into the page and
            // then report the missing bridge as a page-level ReferenceError with no
            // trustworthy filename. It is outside Chat ownership; ignore only this
            // exact bridge signature so real application ReferenceErrors still fail.
            if(
              /\\bzalojsv2\\b/i.test(externalMessage) &&
              /(?:can't find variable|is not defined|referenceerror)/i.test(externalMessage)
            ){
              console.warn('[ChatScreenModule] ignored Zalo WebView bridge ReferenceError.',event);
              return false;
            }

          """.replace('          ','')
          if anchor not in text:
              raise SystemExit('runtime ownership anchor not found')
          text=text.replace(anchor,replacement,1)
          text=text.replace("runtimeError.textContent='V21.72.39 runtime: '+message;","runtimeError.textContent='V21.72.40 runtime: '+message;",1)
          text=text.replace("console.error('[ChatScreenModule V21.72.39]',error);","console.error('[ChatScreenModule V21.72.40]',error);",1)
          app.write_text(text,encoding='utf-8')

          source=Path('index.source.html')
          src=source.read_text(encoding='utf-8')
          old='<meta name="app-release-version" content="V21.72.39">'
          new='<meta name="app-release-version" content="V21.72.40">'
          if old not in src:
              raise SystemExit('release meta anchor not found')
          source.write_text(src.replace(old,new,1),encoding='utf-8')

          verify=Path('tools/verify_current.py')
          vt=verify.read_text(encoding='utf-8')
          line="subprocess.run(['node',str(ROOT/'tests'/'test_v21_72_40_zalo_webview_runtime_error.js')],check=True,cwd=ROOT)\n"
          if line not in vt:
              marker="subprocess.run(['node',str(ROOT/'tests'/'test_v21_72_20_call_screen_wake_lock.js')],check=True,cwd=ROOT)\n"
              if marker not in vt:
                  raise SystemExit('verify marker not found')
              vt=vt.replace(marker,marker+line,1)
              verify.write_text(vt,encoding='utf-8')
          PY

      - name: GREEN - verify targeted regression
        run: node tests/test_v21_72_40_zalo_webview_runtime_error.js

      - name: Rebuild canonical shell
        run: python tools/build_current_preview.py

      - name: Verify complete locked source
        run: python tools/verify_current.py

      - name: Commit verified fix and remove one-time workflow
        run: |
          git config user.name "TAPHOA Chat Runtime"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/fix-zalo-webview-runtime-once.yml
          git add app.js index.source.html index.html version.json tools/verify_current.py tests/test_v21_72_40_zalo_webview_runtime_error.js
          git commit -m "V21.72.40 — ignore Zalo WebView bridge runtime noise"
          git push origin HEAD:main
