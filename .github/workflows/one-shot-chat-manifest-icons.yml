name: One-shot chat manifest icons
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch manifest icons and rebuild
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, subprocess, sys
          p = Path('manifest.webmanifest')
          data = json.loads(p.read_text(encoding='utf-8'))
          data['icons'] = [
              {'src':'./icons/chat-192.png','sizes':'192x192','type':'image/png','purpose':'any'},
              {'src':'./icons/chat-512.png','sizes':'512x512','type':'image/png','purpose':'any'},
              {'src':'./icons/chat-512.png','sizes':'512x512','type':'image/png','purpose':'maskable'},
              {'src':'./icons/chat-icon.svg','sizes':'any','type':'image/svg+xml','purpose':'any'},
          ]
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          subprocess.run([sys.executable, 'tools/build_current_preview.py'], check=True)
          PY
          if git diff --quiet -- manifest.webmanifest index.html version.json; then
            echo "manifest already patched"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.webmanifest index.html version.json
          git commit -m "Restore chat PNG manifest icons"
          git push
