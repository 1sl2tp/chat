name: Feature diagnostics build

on:
  push:
    branches:
      - feat/livekit-production-foundation
    paths:
      - .github/workflows/feature-diagnostics-build.yml

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Build diagnostics inputs
        run: npm run build
        env:
          VITE_INCLUDE_DIAGNOSTICS: 'true'
          VITE_BUILD_ID: diagnostics-${{ github.sha }}
