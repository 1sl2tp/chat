name: Patch Docked Image Workbench
on:
  push:
    branches:
      - feat/docked-image-workbench
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message != 'feat: dock image workbench in Chat'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/docked-image-workbench
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch app
        run: python tools/patch_image_workbench.py
      - name: Verify syntax and focused contract
        run: |
          node --check app.js
          python tests/test_v21_image_workbench.py
      - name: Remove one-shot patcher
        run: rm -f tools/patch_image_workbench.py .github/workflows/patch-docked-image-workbench.yml
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: dock image workbench in Chat'
          git push origin HEAD:feat/docked-image-workbench
