name: Cleanup Chat-only isolation helpers
on:
  push:
    branches:
      - isolate/remove-getlink-embed
    paths:
      - .github/workflows/apply-chat-only-isolation.yml
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: isolate/remove-getlink-embed
      - name: Remove one-shot and obsolete bridge test
        run: |
          rm -f .github/workflows/apply-chat-only-isolation.yml
          rm -f tools/apply_chat_only_isolation.py
          rm -f tests/test_v21_getlink_auth_bridge.py
      - name: Commit cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "chore: remove GETLINK isolation helpers"
          git push origin HEAD:isolate/remove-getlink-embed
