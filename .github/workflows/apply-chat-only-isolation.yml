name: Apply Chat-only isolation
on:
  push:
    branches:
      - isolate/remove-getlink-embed
    paths:
      - tools/apply_chat_only_isolation.py
      - .github/workflows/apply-chat-only-isolation.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: isolate/remove-getlink-embed
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply isolation and rebuild canonical index
        run: python tools/apply_chat_only_isolation.py
      - name: Commit transformed files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.source.html index.html shell.js version.json getlink-auth-bridge.js
          git diff --cached --quiet && exit 0
          git commit -m "isolate: remove GETLINK embed from Chat"
          git push origin HEAD:isolate/remove-getlink-embed
