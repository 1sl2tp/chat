name: Verify Region 3 detail list surface
on:
  push:
    branches:
      - fix/region3-detail-list-surface
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install pytest
      - name: Build canonical preview
        run: python tools/build_current_preview.py
      - name: Verify Region 3 detail list and stable workspace
        run: |
          python tests/test_v21_72_57_region3_detail_list_surface.py
          python tests/test_v21_72_56_region3_state_geometry.py
          python tests/test_v21_72_55_region3_detail_check_control.py
          python tests/test_v21_work_customer_summary_ui.py
          python tests/test_v21_work_customer_summary_reconcile.py
          python tools/verify_current.py
      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html version.json
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Build Region 3 detail list surface"
          git push
