name: Verify Region 3 work row interaction
on:
  push:
    branches:
      - fix/region3-work-row-interaction
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install pytest
      - name: Build canonical preview
        run: python tools/build_current_preview.py
      - name: Verify Region 3 row interaction and stable workspace
        run: |
          node --check work-customer-summary.js
          python tests/test_v21_72_53_region3_work_row_interaction.py
          python tests/test_v21_72_52_region3_work_surface_owner.py
          python tests/test_v21_work_customer_summary_ui.py
          python tests/test_v21_chat_workspace_3col.py
          python tools/verify_current.py
      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html version.json
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Build Region 3 work row interaction"
          git push
