name: One-shot professional image viewer
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Redesign image viewer
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess,sys
          
          root=Path('.')
          app_path=root/'app.js'
          app=app_path.read_text('utf-8')
          
          old="""function positionImageViewerBelowHeader(){
            if(!imageViewerOverlay)return 0;
            const top=regionTop?Math.max(0,regionTop.getBoundingClientRect().bottom):0;
            const host=stageLayout||document.getElementById('threadContent');
            const rect=host?.getBoundingClientRect?.()||null;
            const viewportWidth=Math.max(0,window.innerWidth||document.documentElement.clientWidth||0);
            const workThreadView=document.getElementById('workThreadView');
            const workspaceActive=appShell?.dataset?.desktopWorkspace==='true';
            const workRect=workspaceActive&&workThreadView?.getBoundingClientRect
              ?workThreadView.getBoundingClientRect()
              :null;
            const regionRight=(
              rect&&workRect&&workRect.width>0&&
              workRect.left>rect.left&&workRect.left<rect.right
            )?workRect.left:(rect?.right||viewportWidth);
            const left=rect?Math.max(0,rect.left):0;
            const right=Math.max(0,viewportWidth-regionRight);
            imageViewerOverlay.style.setProperty('--image-viewer-top',`${Math.round(top*100)/100}px`);
            imageViewerOverlay.style.setProperty('--image-viewer-left',`${Math.round(left*100)/100}px`);
            imageViewerOverlay.style.setProperty('--image-viewer-right',`${Math.round(right*100)/100}px`);
            return top;
          }"""
          new="""function positionImageViewerBelowHeader(){
            if(!imageViewerOverlay)return 0;
            const compact=window.matchMedia?.('(max-width:700px)')?.matches===true;
            if(compact){
              imageViewerOverlay.style.setProperty('--image-viewer-top','0px');
              imageViewerOverlay.style.setProperty('--image-viewer-left','0px');
              imageViewerOverlay.style.setProperty('--image-viewer-right','0px');
              return 0;
            }
            const top=regionTop?Math.max(0,regionTop.getBoundingClientRect().bottom):0;
            const host=stageLayout||document.getElementById('threadContent');
            const rect=host?.getBoundingClientRect?.()||null;
            const viewportWidth=Math.max(0,window.innerWidth||document.documentElement.clientWidth||0);
            const workThreadView=document.getElementById('workThreadView');
            const workspaceActive=appShell?.dataset?.desktopWorkspace==='true';
            const workRect=workspaceActive&&workThreadView?.getBoundingClientRect
              ?workThreadView.getBoundingClientRect()
              :null;
            const regionRight=(
              rect&&workRect&&workRect.width>0&&
              workRect.left>rect.left&&workRect.left<rect.right
            )?workRect.left:(rect?.right||viewportWidth);
            const left=rect?Math.max(0,rect.left):0;
            const right=Math.max(0,viewportWidth-regionRight);
            imageViewerOverlay.style.setProperty('--image-viewer-top',`${Math.round(top*100)/100}px`);
            imageViewerOverlay.style.setProperty('--image-viewer-left',`${Math.round(left*100)/100}px`);
            imageViewerOverlay.style.setProperty('--image-viewer-right',`${Math.round(right*100)/100}px`);
            return top;
          }"""
          assert old in app, 'viewer bounds block not found'
          app=app.replace(old,new,1)
          app=app.replace("title.textContent='Xem lại ảnh';","title.textContent='Xem ảnh';",1)
          app_path.write_text(app,'utf-8')
          
          source_path=root/'index.source.html'
          source=source_path.read_text('utf-8')
          marker="""@media (max-width:700px){
            .image-review-head{
              min-height:3.5rem;
              padding:.4rem .75rem;
            }
            .image-review-main{padding:.65rem 3rem;}
            .image-review-prev{left:.45rem;}
            .image-review-next{right:.45rem;}
            .image-review-bottom{
              min-height:calc(6.75rem + env(safe-area-inset-bottom,0px));
              padding:.45rem .625rem calc(.5rem + env(safe-area-inset-bottom,0px));
            }
            .image-review-menu{right:0;left:auto;max-width:min(14rem,calc(100vw - 1.25rem));}
            .image-review-thumb{width:3.875rem;height:3.25rem;}
            .image-review-meta{bottom:.55rem;max-width:calc(100% - 6rem);}
          }
          """
          assert marker in source, 'mobile viewer css marker not found'
          redesign=marker+"""
          /* V21 image viewer redesign — gallery-first, iOS/Photos inspired */
          .image-viewer-overlay{
            background:#050506;
          }
          .image-review{
            position:relative;
            isolation:isolate;
            background:
              radial-gradient(circle at 50% 42%,rgba(42,48,58,.34),rgba(8,9,11,.08) 42%,transparent 66%),
              #070708;
          }
          .image-review-head{
            position:absolute;
            inset:0 0 auto 0;
            z-index:8;
            min-height:4.5rem;
            padding:.75rem 1rem;
            border:0;
            background:linear-gradient(180deg,rgba(6,7,9,.92) 0%,rgba(6,7,9,.62) 58%,transparent 100%);
            pointer-events:none;
          }
          .image-review-heading,
          .image-review-head .image-review-control,
          .image-review-head .chat-image-viewer-rotate-controls,
          .image-review-head .image-review-zoom-controls{
            pointer-events:auto;
          }
          .image-review-title{
            font-size:1rem;
            font-weight:700;
            letter-spacing:-.01em;
          }
          .image-review-count{
            color:rgba(255,255,255,.58);
            font-weight:500;
          }
          .image-review-close{
            margin-left:.25rem;
            background:rgba(26,27,30,.74);
            border-color:rgba(255,255,255,.16);
            box-shadow:0 6px 18px rgba(0,0,0,.24),inset 0 0 0 1px rgba(255,255,255,.04);
            backdrop-filter:blur(16px);
            -webkit-backdrop-filter:blur(16px);
          }
          .image-review-main{
            padding:5.25rem 4.75rem 8rem;
            background:transparent;
          }
          .image-review-image{
            border-radius:.4rem;
            background:#0b0b0c;
            box-shadow:0 18px 60px rgba(0,0,0,.34);
          }
          .image-review-nav{
            width:2.75rem;
            height:2.75rem;
            background:rgba(24,25,28,.62);
            border-color:rgba(255,255,255,.17);
            box-shadow:0 8px 24px rgba(0,0,0,.22);
            backdrop-filter:blur(14px);
            -webkit-backdrop-filter:blur(14px);
          }
          .image-review-prev{left:1rem;}
          .image-review-next{right:1rem;}
          .image-review-meta{
            bottom:6.2rem;
            background:rgba(12,12,13,.64);
            color:rgba(255,255,255,.68);
            border:1px solid rgba(255,255,255,.08);
            backdrop-filter:blur(12px);
            -webkit-backdrop-filter:blur(12px);
          }
          .image-review-bottom{
            position:absolute;
            z-index:7;
            left:0;
            right:0;
            bottom:0;
            min-height:6rem;
            padding:.45rem 1rem calc(.7rem + env(safe-area-inset-bottom,0px));
            border:0;
            background:linear-gradient(0deg,rgba(6,7,9,.94) 0%,rgba(6,7,9,.70) 58%,transparent 100%);
            pointer-events:none;
          }
          .image-review-bottom>*{pointer-events:auto;}
          .image-review-filters{
            order:2;
            min-height:2.5rem;
          }
          .image-review-thumbs{
            order:1;
            justify-content:center;
            max-width:min(34rem,calc(100% - 7rem));
            margin:0 auto;
            gap:.38rem;
          }
          .image-review-thumb{
            width:3.45rem;
            height:3.05rem;
            border-radius:.55rem;
            border:2px solid transparent;
            background:#111214;
            opacity:.55;
            transition:opacity .14s ease,transform .14s ease,border-color .14s ease;
          }
          .image-review-thumb[aria-current="true"]{
            border-color:#0a84ff;
            opacity:1;
            transform:translateY(-2px);
          }
          .image-review-filter-scroll{
            opacity:.7;
          }
          .image-review-chip{
            background:rgba(20,21,24,.48);
            border-color:rgba(255,255,255,.14);
            color:rgba(255,255,255,.65);
            backdrop-filter:blur(10px);
            -webkit-backdrop-filter:blur(10px);
          }
          .image-review-chip[aria-current="true"]{
            background:rgba(255,255,255,.14);
            color:#fff;
            border-color:rgba(255,255,255,.26);
          }
          .image-review-more{
            background:rgba(24,25,28,.66);
            border-color:rgba(255,255,255,.16);
          }
          .image-review-menu{
            background:rgba(24,25,28,.94);
            border-color:rgba(255,255,255,.12);
            box-shadow:0 18px 48px rgba(0,0,0,.42);
            backdrop-filter:blur(22px);
            -webkit-backdrop-filter:blur(22px);
          }
          
          @media (max-width:700px){
            .image-viewer-overlay{
              top:0!important;
              right:0!important;
              bottom:0!important;
              left:0!important;
              width:100vw;
              height:100dvh;
              z-index:120;
            }
            .image-review-head{
              min-height:calc(4rem + env(safe-area-inset-top,0px));
              padding:calc(.55rem + env(safe-area-inset-top,0px)) .75rem .8rem;
              gap:.5rem;
            }
            .image-review-heading{
              gap:.08rem;
              padding-left:.15rem;
            }
            .image-review-title{font-size:.95rem;}
            .image-review-count{font-size:.69rem;}
            .image-review-close{
              width:2.35rem;
              height:2.35rem;
              flex-basis:2.35rem;
            }
            .image-review-main{
              padding:
                calc(4.75rem + env(safe-area-inset-top,0px))
                .75rem
                calc(8.65rem + env(safe-area-inset-bottom,0px));
            }
            .image-review-image{
              max-width:100%;
              max-height:100%;
              border-radius:.28rem;
              box-shadow:none;
            }
            .image-review-nav{
              width:2.45rem;
              height:2.45rem;
              flex-basis:2.45rem;
              background:rgba(18,19,21,.54);
            }
            .image-review-prev{left:.4rem;}
            .image-review-next{right:.4rem;}
            .image-review-meta{
              bottom:calc(7.25rem + env(safe-area-inset-bottom,0px));
              max-width:calc(100% - 3rem);
              padding:.28rem .5rem;
              font-size:.62rem;
              line-height:.9rem;
              background:rgba(0,0,0,.42);
            }
            .image-review-bottom{
              min-height:calc(7rem + env(safe-area-inset-bottom,0px));
              padding:.35rem .7rem calc(.55rem + env(safe-area-inset-bottom,0px));
              gap:.35rem;
            }
            .image-review-thumbs{
              justify-content:flex-start;
              max-width:100%;
              margin:0;
              padding-inline:.1rem;
              gap:.32rem;
            }
            .image-review-thumb{
              width:3rem;
              height:2.72rem;
              border-radius:.45rem;
            }
            .image-review-filters{
              position:relative;
              min-height:2.55rem;
              justify-content:flex-end;
            }
            .image-review-filter-scroll{
              display:none;
            }
            .image-review-tools{
              margin-left:auto;
            }
            .image-review-more{
              width:2.4rem;
              height:2.4rem;
              flex-basis:2.4rem;
            }
            .image-review-menu{
              right:0;
              bottom:calc(100% + .45rem);
              max-width:min(15rem,calc(100vw - 1.4rem));
            }
          }
          """
          source=source.replace(marker,redesign,1)
          source_path.write_text(source,'utf-8')
          
          orient_path=root/'chat-image-orientation.js'
          orient=orient_path.read_text('utf-8')
          anchor="""    @media(max-width:639px){
                .chat-image-rotate-button{width:28px;height:28px;right:6px;top:6px}
                .chat-image-viewer-rotate-controls,.image-review-zoom-controls{height:36px}
                .chat-image-viewer-rotate-controls button,.image-review-zoom-button{width:30px;height:30px}
                .image-review-zoom-controls{margin-left:5px;margin-right:5px}
                .image-review-zoom-value{width:40px;font-size:10px}
              }
          """
          assert anchor in orient, 'orientation media block missing'
          replacement=anchor+"""    .image-review .chat-image-viewer-rotate-controls,
              .image-review .image-review-zoom-controls{
                border-color:rgba(255,255,255,.14);
                background:rgba(24,25,28,.66);
                box-shadow:0 8px 24px rgba(0,0,0,.18);
                backdrop-filter:blur(16px);
                -webkit-backdrop-filter:blur(16px);
              }
              @media(max-width:700px){
                .image-review .chat-image-viewer-rotate-controls{
                  position:fixed;
                  z-index:125;
                  left:50%;
                  bottom:calc(.62rem + env(safe-area-inset-bottom,0px));
                  transform:translateX(-7.15rem);
                  margin:0;
                }
                .image-review .image-review-zoom-controls{
                  position:fixed;
                  z-index:125;
                  left:50%;
                  bottom:calc(.62rem + env(safe-area-inset-bottom,0px));
                  transform:translateX(-3.15rem);
                  margin:0;
                }
              }
          """
          orient=orient.replace(anchor,replacement,1)
          orient_path.write_text(orient,'utf-8')
          
          test_path=root/'tests/test_v21_image_viewer_shell_controls.py'
          test=test_path.read_text('utf-8')
          extra="""
          assert "window.matchMedia?.('(max-width:700px)')" in app
          assert "title.textContent='Xem ảnh'" in app
          """
          if "title.textContent='Xem ảnh'" not in test:
              test += extra
          test_path.write_text(test,'utf-8')
          
          layout_test=root/'tests/test_v21_image_viewer_professional_layout.py'
          layout_test.write_text("""from pathlib import Path
          ROOT=Path(__file__).resolve().parents[1]
          source=(ROOT/'index.source.html').read_text('utf-8')
          orient=(ROOT/'chat-image-orientation.js').read_text('utf-8')
          assert 'V21 image viewer redesign' in source
          assert '.image-viewer-overlay{' in source
          assert 'height:100dvh' in source
          assert '.image-review-bottom{' in source
          assert 'position:absolute' in source
          assert '.image-review-filter-scroll{\n    display:none;' in source
          assert 'bottom:calc(.62rem + env(safe-area-inset-bottom,0px))' in orient
          assert 'backdrop-filter:blur(16px)' in orient
          print('professional image viewer layout contract PASS')
          """,encoding='utf-8')
          
          subprocess.run([sys.executable,'tools/build_current_preview.py'],check=True)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js chat-image-orientation.js index.source.html index.html version.json tests/test_v21_image_viewer_shell_controls.py tests/test_v21_image_viewer_professional_layout.py
          if git diff --cached --quiet; then
            echo "viewer redesign already current"
            exit 0
          fi
          git commit -m "Redesign Chat image viewer"
          git push
