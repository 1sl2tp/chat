name: Verify stable viewer reference patch
on:
  push:
    branches:
      - fix/stable-viewer-reference
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install pytest
      - name: Build canonical preview
        run: python tools/build_current_preview.py
      - name: Viewer and layout checks
        run: |
          node --check app.js
          python tests/test_v21_image_viewer_shell_controls.py
          python tests/test_v21_chat_image_orientation_column.py
          python tests/test_v21_chat_album_viewer_column2.py
          python -m pytest tests/test_v21_desktop_three_column_minimal.py -q
          python tests/test_v21_chat_workspace_3col.py
          python tools/verify_current.py
      - name: Commit built artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html version.json
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Build stable viewer reference patch"
          git push
