name: Verify profile delete confirm layer
on:
  push:
    branches:
      - fix/profile-delete-confirm-layer
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install pytest
      - name: Build canonical preview
        run: python tools/build_current_preview.py
      - name: Verify profile confirm hierarchy and stable app
        run: |
          node --check shell.js
          python tests/test_v21_72_62_profile_delete_confirm_layer.py
          python tests/test_v21_72_61_mobile_account_menu_contract.py
          python -m pytest tests/test_v21_72_33_directory_profile_polish.py -q
          python tools/verify_current.py
      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html version.json
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Build profile delete confirm layer"
          git push
