name: One-shot chat UI + mobile viewer polish
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply scoped visual and viewer polish
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess, sys

          root=Path('.')

          # 1) Mobile viewer gestures: double tap toggles zoom, black backdrop tap closes,
          # swipe down closes, while pinch/pan and horizontal image navigation remain intact.
          app_path=root/'app.js'
          app=app_path.read_text('utf-8')

          globals_anchor="const imageViewerPointers=new Map();\\nlet imageViewerReturnFocus=null;"
          globals_replacement="const imageViewerPointers=new Map();\\nconst imageViewerTapStarts=new Map();\\nlet imageViewerBackdropClickBlockedUntil=0;\\nlet imageViewerLastTapAt=0;\\nlet imageViewerLastTapX=0;\\nlet imageViewerLastTapY=0;\\nlet imageViewerReturnFocus=null;"
          if 'const imageViewerTapStarts=new Map();' not in app:
              assert globals_anchor in app, 'viewer globals anchor missing'
              app=app.replace(globals_anchor,globals_replacement,1)

          old_zoom_line="const next=imageViewerZoom<2?2:Math.min(5,imageViewerZoom+.5);"
          new_zoom_line="const next=imageViewerZoom>1?1:2.5;"
          if old_zoom_line in app:
              app=app.replace(old_zoom_line,new_zoom_line,1)
          else:
              assert new_zoom_line in app, 'viewer dblclick contract missing'

          gesture_anchor="main.addEventListener('pointercancel',finishPointer);\\n\\n  main.addEventListener('wheel',event=>{"
          gesture_block="""main.addEventListener('pointercancel',finishPointer);

          // Mobile-first media viewer gesture layer. Keep this separate from the
          // pan/pinch engine above so single taps never interfere with zoom/pan.
          main.addEventListener('pointerdown',event=>{
            if(event.target instanceof Element&&event.target.closest('button'))return;
            const pointerType=String(event.pointerType||'');
            if(pointerType!=='touch'&&pointerType!=='pen')return;
            const existing=[...imageViewerTapStarts.values()];
            const multi=existing.length>0;
            if(multi){
              for(const start of existing)start.multi=true;
            }
            imageViewerTapStarts.set(event.pointerId,{
              x:event.clientX,
              y:event.clientY,
              pointerType,
              onImage:event.target===image,
              moved:false,
              multi
            });
          });
          main.addEventListener('pointermove',event=>{
            const start=imageViewerTapStarts.get(event.pointerId);
            if(!start)return;
            if(Math.hypot(event.clientX-start.x,event.clientY-start.y)>8)start.moved=true;
          },{passive:true});
          const finishViewerTap=event=>{
            const start=imageViewerTapStarts.get(event.pointerId);
            if(!start)return;
            imageViewerTapStarts.delete(event.pointerId);
            const dx=event.clientX-start.x;
            const dy=event.clientY-start.y;
            const moved=start.moved||Math.hypot(dx,dy)>8;
            if(start.multi||moved)imageViewerBackdropClickBlockedUntil=performance.now()+320;
            if(start.multi)return;

            // Familiar Zalo/WhatsApp-style downward dismissal at fit-to-screen.
            if(
              imageViewerZoom===1&&
              dy>72&&
              Math.abs(dy)>Math.abs(dx)*1.15
            ){
              imageViewerBackdropClickBlockedUntil=performance.now()+360;
              imageViewerLastTapAt=0;
              closeImageViewer({restoreFocus:false});
              return;
            }

            if(!start.onImage||moved)return;
            const now=performance.now();
            const isDoubleTap=(
              imageViewerLastTapAt>0&&
              now-imageViewerLastTapAt<=285&&
              Math.hypot(event.clientX-imageViewerLastTapX,event.clientY-imageViewerLastTapY)<=34
            );
            if(isDoubleTap){
              imageViewerLastTapAt=0;
              imageViewerBackdropClickBlockedUntil=now+320;
              const next=imageViewerZoom>1?1:2.5;
              setImageViewerZoom(next,{clientX:event.clientX,clientY:event.clientY});
              return;
            }
            imageViewerLastTapAt=now;
            imageViewerLastTapX=event.clientX;
            imageViewerLastTapY=event.clientY;
          };
          main.addEventListener('pointerup',finishViewerTap);
          main.addEventListener('pointercancel',event=>{
            imageViewerTapStarts.delete(event.pointerId);
            imageViewerBackdropClickBlockedUntil=performance.now()+180;
          });

          // A tap on the actual black stage closes immediately. Taps on the
          // image and chrome remain owned by those controls.
          main.addEventListener('click',event=>{
            if(event.target!==main)return;
            if(performance.now()<imageViewerBackdropClickBlockedUntil)return;
            closeImageViewer({restoreFocus:false});
          });
          review.addEventListener('click',event=>{
            if(event.target!==review)return;
            if(performance.now()<imageViewerBackdropClickBlockedUntil)return;
            closeImageViewer({restoreFocus:false});
          });

          main.addEventListener('wheel',event=>{"""
          if 'const finishViewerTap=event=>' not in app:
              assert gesture_anchor in app, 'viewer pointer gesture anchor missing'
              app=app.replace(gesture_anchor,gesture_block,1)

          close_anchor="resetImageViewerZoom();\\n  closeImageViewerTimeMenu();"
          close_replacement="resetImageViewerZoom();\\n  imageViewerTapStarts.clear();\\n  imageViewerBackdropClickBlockedUntil=0;\\n  imageViewerLastTapAt=0;\\n  closeImageViewerTimeMenu();"
          if 'imageViewerTapStarts.clear();' not in app:
              assert close_anchor in app, 'viewer close reset anchor missing'
              app=app.replace(close_anchor,close_replacement,1)

          app_path.write_text(app,'utf-8')

          # 2) Visual reference polish. Keep current business/navigation model;
          # borrow only density, hierarchy, card rhythm and mobile viewer chrome.
          css_path=root/'zalo-admin-link.css'
          css=css_path.read_text('utf-8')
          marker='/* V21.72.49 chat management reference polish */'
          if marker not in css:
              css += r'''

          /* V21.72.49 chat management reference polish */
          #appShell[data-auth-state="authenticated"] .composer-shell-source{
            border:1px solid color-mix(in srgb,var(--theme-border-default,#d9d9d9) 92%,transparent)!important;
            border-radius:24px!important;
            background:var(--theme-surface-primary,#fff)!important;
            box-shadow:0 1px 2px rgba(0,0,0,.035)!important;
          }
          #appShell[data-auth-state="authenticated"] #composerFooter{
            padding-inline:8px!important;
            padding-bottom:7px!important;
          }
          #appShell[data-auth-state="authenticated"] #editorWrap{
            padding-inline:12px!important;
            padding-top:8px!important;
          }
          #appShell[data-auth-state="authenticated"] #threadScrollControl{
            border:1px solid var(--theme-border-default)!important;
            background:color-mix(in srgb,var(--theme-surface-primary) 94%,transparent)!important;
            box-shadow:0 4px 16px rgba(0,0,0,.09)!important;
          }

          /* Directory density follows the supplied compact mobile/desktop reference
             without changing the current directory routing model. */
          #appShell[data-auth-state="authenticated"] .shell-contact-row,
          #appShell[data-auth-state="authenticated"] .shell-contact-chat{
            height:64px!important;
            min-height:64px!important;
            border-radius:14px!important;
          }
          #appShell[data-auth-state="authenticated"] .shell-contact-chat{
            grid-template-columns:40px minmax(0,1fr) 54px!important;
            grid-template-rows:1.2rem 1.05rem!important;
            column-gap:10px!important;
            row-gap:2px!important;
            padding:8px 8px!important;
          }
          #appShell[data-auth-state="authenticated"] .shell-contact-avatar-wrap,
          #appShell[data-auth-state="authenticated"] .shell-contact-avatar{
            width:40px!important;height:40px!important;min-width:40px!important;min-height:40px!important;
          }
          #appShell[data-auth-state="authenticated"] .shell-contact-name{
            font-size:.88rem!important;
            line-height:1.2rem!important;
          }
          #appShell[data-auth-state="authenticated"] .shell-contact-preview{
            font-size:.76rem!important;
            line-height:1.05rem!important;
          }
          #appShell[data-auth-state="authenticated"] .shell-contact-time{
            width:54px!important;
            font-size:.68rem!important;
          }
          #appShell[data-auth-state="authenticated"] .shell-contact-row:not(:last-child)::after{
            left:58px!important;
          }

          /* Header reads as menu + selected contact/work mode + call, matching the
             supplied reference while retaining the existing tab/call controllers. */
          #appShell[data-auth-state="authenticated"] #regionTop .top-mode-switch{
            width:max-content!important;
            max-width:min(100%,300px)!important;
            background:transparent!important;
            padding:0!important;
            gap:6px!important;
          }
          #appShell[data-auth-state="authenticated"] #regionTop .top-mode-tab{
            min-height:34px!important;
            font-size:12.5px!important;
            box-shadow:none!important;
          }
          #appShell[data-auth-state="authenticated"] #regionTop .top-mode-tab[aria-selected="true"]{
            background:var(--theme-surface-secondary)!important;
            border:1px solid color-mix(in srgb,var(--theme-border-default) 78%,transparent)!important;
          }
          #appShell[data-auth-state="authenticated"] #regionTop .top-mode-tab:not([aria-selected="true"]){
            background:transparent!important;
            color:var(--theme-content-secondary)!important;
          }

          /* Work column adopts the compact selected-product card rhythm from the
             reference, but keeps CHAT's existing reconcile/check business logic. */
          [data-work-summary-root] .work-summary-header{
            min-height:56px!important;
            padding:10px 14px!important;
          }
          [data-work-summary-root] .work-summary-body{
            padding:10px 12px 18px!important;
          }
          [data-work-summary-root] .work-summary-list{
            display:grid!important;
            gap:8px!important;
            border:0!important;
            border-radius:0!important;
            overflow:visible!important;
            background:transparent!important;
          }
          [data-work-summary-root] .work-summary-item{
            min-height:44px!important;
            border:1px solid color-mix(in srgb,var(--theme-border-default) 86%,transparent)!important;
            border-radius:12px!important;
            background:var(--theme-surface-primary)!important;
            padding:8px 10px 8px 36px!important;
          }
          [data-work-summary-root] .work-summary-item+.work-summary-item{
            border-top:1px solid color-mix(in srgb,var(--theme-border-default) 86%,transparent)!important;
          }
          [data-work-summary-root] .work-summary-item:nth-child(even){
            background:color-mix(in srgb,var(--theme-surface-secondary) 54%,var(--theme-surface-primary))!important;
          }
          [data-work-summary-root] .work-summary-item.is-completed{
            opacity:.52!important;
            background:var(--theme-surface-secondary)!important;
          }
          [data-work-summary-root] .work-summary-check{
            width:22px!important;height:22px!important;min-width:22px!important;
            border-radius:6px!important;
          }
          [data-work-summary-root] .work-summary-item-name,
          [data-work-summary-root] .work-summary-item-qty{
            font-size:13px!important;
            line-height:18px!important;
          }

          @media (min-width:64rem) and (hover:hover) and (pointer:fine){
            #appShell[data-auth-state="authenticated"] #screenHost{
              --desktop-directory-width:clamp(300px,24vw,360px)!important;
            }
            #appShell[data-auth-state="authenticated"] #shellNavigationLayer{
              background:var(--theme-surface-primary)!important;
            }
          }

          /* Mobile media viewing: interaction-first, like a messaging app viewer.
             Toolbar/filter chrome is removed; gestures own zoom/navigation/dismissal. */
          @media (max-width:700px) and (pointer:coarse){
            .image-viewer-overlay{
              top:0!important;right:0!important;bottom:0!important;left:0!important;
              width:100vw!important;height:100dvh!important;
              background:#000!important;
            }
            .image-review{
              background:#000!important;
            }
            .image-review-main{
              padding:
                calc(4.15rem + env(safe-area-inset-top,0px))
                .5rem
                calc(.75rem + env(safe-area-inset-bottom,0px))!important;
              background:#000!important;
              touch-action:none!important;
            }
            .image-review-bottom,
            .image-review-nav,
            .image-review .image-review-zoom-controls,
            .image-review .chat-image-viewer-rotate-controls{
              display:none!important;
            }
            .image-review-head{
              min-height:calc(3.8rem + env(safe-area-inset-top,0px))!important;
              padding:calc(.48rem + env(safe-area-inset-top,0px)) .7rem .7rem!important;
              background:linear-gradient(180deg,rgba(0,0,0,.76),rgba(0,0,0,.22) 62%,transparent)!important;
            }
            .image-review-title{
              font-size:.9rem!important;
              font-weight:650!important;
            }
            .image-review-count{
              font-size:.68rem!important;
              color:rgba(255,255,255,.62)!important;
            }
            .image-review-close{
              width:2.35rem!important;height:2.35rem!important;flex-basis:2.35rem!important;
              border-color:rgba(255,255,255,.14)!important;
              background:rgba(28,28,30,.58)!important;
            }
            .image-review-image{
              max-width:100%!important;
              max-height:100%!important;
              border-radius:0!important;
              box-shadow:none!important;
              background:transparent!important;
            }
            .image-review-meta{
              bottom:calc(.7rem + env(safe-area-inset-bottom,0px))!important;
              max-width:calc(100% - 2rem)!important;
              background:rgba(0,0,0,.38)!important;
              border-color:rgba(255,255,255,.06)!important;
              font-size:.62rem!important;
            }
          }
          '''
              css_path.write_text(css,'utf-8')

          # 3) Update the existing viewer contract so CI locks the new mobile behavior.
          test_path=root/'tests/test_v21_image_viewer_shell_controls.py'
          test=test_path.read_text('utf-8')
          test=test.replace(
              'assert "imageViewerZoom<2?2:Math.min(5,imageViewerZoom+.5)" in app\n'
              'assert "if(imageViewerZoom>1)resetImageViewerZoom();" not in app\n',
              'assert "const next=imageViewerZoom>1?1:2.5;" in app\n'
              'assert "const imageViewerTapStarts=new Map();" in app\n'
              'assert "dy>72" in app\n'
              'assert "event.target!==main" in app\n'
          )
          test_path.write_text(test,'utf-8')

          subprocess.run([sys.executable,'tools/build_current_preview.py'],check=True)
          subprocess.run(['node','--check','app.js'],check=True)
          subprocess.run([sys.executable,'tests/test_v21_image_viewer_shell_controls.py'],check=True)
          subprocess.run([sys.executable,'-m','pytest','-q','tests/test_v21_contact_list_whatsapp_rhythm.py'],check=True)
          subprocess.run([sys.executable,'-m','pytest','-q','tests/test_v21_desktop_three_column_minimal.py'],check=True)
          subprocess.run([sys.executable,'tools/verify_current.py'],check=True)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js zalo-admin-link.css index.html version.json tests/test_v21_image_viewer_shell_controls.py
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Polish chat UI and mobile image viewer"
          git push
