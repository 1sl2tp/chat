name: One-shot multi-image reference polish
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install verification dependency
        run: python -m pip install pytest
      - name: Apply newest multi-image reference
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess, sys

          root=Path('.')
          css_path=root/'zalo-admin-link.css'
          css=css_path.read_text('utf-8')
          marker='/* V21.72.50 multi-image reference polish */'
          if marker not in css:
              css += r'''

          /* V21.72.50 multi-image reference polish */
          /* The supplied multi-image reference keeps pending photos in a short
             horizontal strip rather than letting previews dominate the composer. */
          #appShell[data-auth-state="authenticated"] .attachment-image-chip{
            width:4.25rem!important;
            height:4.25rem!important;
            border-radius:12px!important;
          }
          #appShell[data-auth-state="authenticated"] .attachment-image-remove{
            width:2rem!important;
            height:2rem!important;
            top:-.15rem!important;
            right:-.15rem!important;
          }
          #appShell[data-auth-state="authenticated"] .attachment-image-remove::before{
            width:1.35rem!important;
            height:1.35rem!important;
          }
          #appShell[data-auth-state="authenticated"] #attachmentTray{
            gap:.5rem!important;
            padding-top:.4rem!important;
            padding-bottom:.35rem!important;
            overscroll-behavior-x:contain;
            scrollbar-width:none;
          }
          #appShell[data-auth-state="authenticated"] #attachmentTray::-webkit-scrollbar{display:none;}

          /* Existing CHAT gallery business logic already owns 2/3/4-photo layouts
             and +N overflow. Tighten only the mobile geometry to the new reference. */
          @media (max-width:520px){
            .media-gallery-grid{
              width:min(22rem,100%)!important;
              max-width:88vw!important;
              gap:3px!important;
              border-radius:16px!important;
            }
            .media-gallery-grid .media-image-tile{border-radius:10px!important;}
          }
          '''
              css_path.write_text(css,'utf-8')

          subprocess.run([sys.executable,'tools/build_current_preview.py'],check=True)
          subprocess.run(['node','--check','app.js'],check=True)
          subprocess.run([sys.executable,'tests/test_v21_image_viewer_shell_controls.py'],check=True)
          subprocess.run([sys.executable,'-m','pytest','-q','tests/test_v21_contact_list_whatsapp_rhythm.py'],check=True)
          subprocess.run([sys.executable,'tools/verify_current.py'],check=True)

          # One-shot only: retire this patch workflow in the same commit.
          retired='''name: One-shot chat UI + mobile viewer polish (retired)
          on:
            workflow_dispatch:
          permissions:
            contents: read
          jobs:
            retired:
              runs-on: ubuntu-latest
              steps:
                - run: echo "Chat UI, multi-image layout and mobile viewer polish already applied."
          '''
          (root/'.github/workflows/one-shot-professional-image-viewer.yml').write_text(retired,'utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add zalo-admin-link.css index.html version.json .github/workflows/one-shot-professional-image-viewer.yml
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Polish multi-image chat presentation"
          git push
