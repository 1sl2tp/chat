name: Verify ChatGPT blue theme reference
on:
  push:
    branches:
      - fix/chatgpt-blue-theme
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install pytest
      - name: Build canonical preview
        run: python tools/build_current_preview.py
      - name: Reference and regression checks
        run: |
          python - <<'PY'
          from pathlib import Path
          src=Path('index.source.html').read_text('utf-8')
          aliases=Path('reference/chatgpt/chatgpt-token-aliases.css').read_text('utf-8')
          assert 'data-chat-theme="blue"' in src
          assert 'data-ds-colored-user-message-bubbles="true"' in src
          assert 'background:var(--theme-user-msg-bg);' in src
          assert 'color:var(--theme-user-msg-text);' in src
          assert 'background:var(--theme-submit-btn-bg);' in src
          assert '--blue-theme-user-msg-bg:var(--blue-50);' in aliases
          assert '--blue-theme-user-msg-text:var(--blue-900);' in aliases
          assert '--blue-theme-submit-btn-bg:var(--blue-400);' in aliases
          print('ChatGPT blue theme reference contract PASS')
          PY
          node --check app.js
          python -m pytest tests/test_v21_chatgpt_visual_alignment.py -q
          python -m pytest tests/test_v21_desktop_three_column_minimal.py -q
          python tests/test_v21_chat_workspace_3col.py
          python tests/test_v21_image_viewer_shell_controls.py
          python tools/verify_current.py
      - name: Commit built artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html version.json
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Build ChatGPT blue theme reference"
          git push
