name: Verify rich message composer polish
on:
  push:
    branches:
      - fix/chatgpt-rich-message-composer
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install pytest
      - name: Build canonical preview
        run: python tools/build_current_preview.py
      - name: Verify rich messages and stable chat geometry
        run: |
          node --check app.js
          python tests/test_v21_72_30_chat_polish_lock.py
          python -m pytest tests/test_v21_contact_list_whatsapp_rhythm.py -q
          python -m pytest tests/test_v21_chatgpt_visual_alignment.py -q
          python -m pytest tests/test_v21_desktop_three_column_minimal.py -q
          python tests/test_v21_chat_workspace_3col.py
          python tools/verify_current.py
      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html version.json
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Build rich message composer polish"
          git push
