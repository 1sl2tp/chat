name: Mobile Guest Login Once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-guest-login-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply mobile guest login fix
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('work-customer-summary.js')
          s = path.read_text('utf-8')

          old = """function showMobileDirectory(reason='directory'){
            if(!mobileDirectoryAllowed())return false;
            const app=document.getElementById('appShell');
          """
          new = """function showMobileDirectory(reason='directory'){
            if(!mobileDirectoryAllowed())return false;
            if(snapshot().state!=='AUTHENTICATED'){
              hideMobileDirectory('guest-auth');
              navigation()?.openChat?.();
              window.ChatAppShell?.AuthUI?.openLogin?.();
              return false;
            }
            const app=document.getElementById('appShell');
          """
          assert old in s, 'showMobileDirectory owner changed'
          s = s.replace(old, new, 1)

          old = """function openMobileAccountMenu(){
            if(!mobileDirectoryAllowed())return false;
            const menu=ensureMobileAccountMenu();
          """
          new = """function openMobileAccountMenu(){
            if(!mobileDirectoryAllowed())return false;
            if(snapshot().state!=='AUTHENTICATED'){
              closeMobileAccountMenu();
              hideMobileDirectory('guest-auth');
              navigation()?.openChat?.();
              window.ChatAppShell?.AuthUI?.openLogin?.();
              return true;
            }
            const menu=ensureMobileAccountMenu();
          """
          assert old in s, 'openMobileAccountMenu owner changed'
          s = s.replace(old, new, 1)

          old = """document.addEventListener('v21-auth-state',()=>{
            selectedWorkCustomerId='';
            forceOverview=false;
            mobileConversationReturnState={kind:'directory',contact:null};
            closeMobileAccountMenu();
            void refresh('auth-state');
          });
          """
          new = """document.addEventListener('v21-auth-state',()=>{
            selectedWorkCustomerId='';
            forceOverview=false;
            mobileConversationReturnState={kind:'directory',contact:null};
            closeMobileAccountMenu();
            const auth=snapshot();
            if(mobileDirectoryAllowed()&&auth.state!=='AUTHENTICATED'){
              hideMobileDirectory('guest-auth');
              navigation()?.openChat?.();
              window.ChatAppShell?.AuthUI?.openLogin?.();
            }else if(mobileDirectoryAllowed()&&auth.state==='AUTHENTICATED'&&shellSnapshot().route==='chat'&&!activeContact()?.id){
              showMobileDirectory('auth-directory');
            }
            void refresh('auth-state');
          });
          """
          assert old in s, 'auth-state owner changed'
          s = s.replace(old, new, 1)

          old = """window.setTimeout(()=>{
            if(shellSnapshot().route==='chat'&&mobileDirectoryAllowed()){
              mobileConversationReturnState={kind:'directory',contact:null};
              showMobileDirectory('chat-default');
            }
          },0);
          """
          new = """window.setTimeout(()=>{
            const auth=snapshot();
            if(auth.state==='AUTHENTICATED'&&shellSnapshot().route==='chat'&&mobileDirectoryAllowed()){
              mobileConversationReturnState={kind:'directory',contact:null};
              showMobileDirectory('chat-default');
            }else if(auth.state==='GUEST'&&mobileDirectoryAllowed()){
              hideMobileDirectory('guest-boot');
              navigation()?.openChat?.();
              window.ChatAppShell?.AuthUI?.openLogin?.();
            }
          },0);
          """
          assert old in s, 'boot directory owner changed'
          s = s.replace(old, new, 1)

          path.write_text(s, 'utf-8')
          PY
      - name: Focused guest-login contract
        run: |
          node --check work-customer-summary.js
          python tests/test_v21_mobile_chat_navigation.py
      - name: Rebuild canonical preview
        run: python tools/build_current_preview.py
      - name: Recheck focused contract
        run: python tests/test_v21_mobile_chat_navigation.py
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add work-customer-summary.js index.html version.json
          git commit -m 'fix: restore mobile guest login access'
          git push
