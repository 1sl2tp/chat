name: Chat Security Audit

# Source-only audit. No user credentials, production requests, banking flows,
# chat sends, DB writes, rollout, or GitHub Pages deployment.
on:
  pull_request:
    paths:
      - '.github/workflows/chat-security-audit.yml'
      - '.github/codeql/**'
      - 'qa/**'
      - '**/*.js'
      - '**/*.cjs'
      - '**/*.mjs'
      - '**/*.ts'
      - '**/*.tsx'
  schedule:
    - cron: '12 3 * * 2'  # Tuesday 10:12 Asia/Ho_Chi_Minh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chat-security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL JS/TS security
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
          config-file: .github/codeql/chat-security-config.yml
      - name: Analyze source without executing app
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript

  secrets:
    name: Gitleaks changed-commit secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned official Gitleaks binary (verified digest)
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 2 \
            --output /tmp/chat-gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/chat-gitleaks.tar.gz' | sha256sum --check
          mkdir -p /tmp/chat-gitleaks-bin
          tar -xzf /tmp/chat-gitleaks.tar.gz -C /tmp/chat-gitleaks-bin gitleaks
          /tmp/chat-gitleaks-bin/gitleaks version
      - name: Scan changed commits only (full secret redaction)
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # Base SHA is a GitHub-generated commit identifier, never untrusted PR text.
            RANGE="${PR_BASE_SHA}..HEAD"
          else
            RANGE="-10"
          fi
          /tmp/chat-gitleaks-bin/gitleaks git . \
            --log-opts="$RANGE" --redact=100 --no-banner --exit-code=1
