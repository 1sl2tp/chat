name: Admin Push VAPID Vault Sync
on:
  push:
    branches:
      - feature/admin-web-push-design
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/admin-web-push-design
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch admin push VAPID ownership
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('supabase/functions/v21-admin-push/index.ts')
          s=p.read_text('utf-8')
          old='''  const vapidPublic=Deno.env.get("VAPID_PUBLIC_KEY")??"";\n  const vapidPrivate=Deno.env.get("VAPID_PRIVATE_KEY")??"";\n  const vapidSubject=Deno.env.get("VAPID_SUBJECT")??"";\n'''
          assert old in s, 'VAPID env block missing'
          s=s.replace(old,'',1)
          marker='''async function sha256Hex(value:string){\n  const digest=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(value));\n  return Array.from(new Uint8Array(digest),b=>b.toString(16).padStart(2,"0")).join("");\n}\n'''
          helper='''async function sha256Hex(value:string){\n  const digest=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(value));\n  return Array.from(new Uint8Array(digest),b=>b.toString(16).padStart(2,"0")).join("");\n}\n\ntype VapidConfig={publicKey:string;privateKey:string;subject:string};\nasync function loadVapid(admin:ReturnType<typeof createClient>):Promise<VapidConfig|null>{\n  const {data,error}=await admin.rpc("chat_service_get_call_push_vapid");\n  if(error)return null;\n  const row=(data&&typeof data==="object")?data as Record<string,unknown>:{};\n  const publicKey=clean(row.public_key,512);\n  const privateKey=clean(row.private_key,512);\n  const subject=clean(row.subject,512)||"mailto:admin@taphoa.xyz";\n  if(!publicKey||!privateKey)return null;\n  return{publicKey,privateKey,subject};\n}\n'''
          assert marker in s, 'sha helper marker missing'
          s=s.replace(marker,helper,1)
          old='''    if(!vapidPublic||!vapidPrivate||!vapidSubject)return reply(503,{ok:false,code:"push_not_configured"});\n\n    webpush.setVapidDetails(vapidSubject,vapidPublic,vapidPrivate);\n'''
          new='''    const vapid=await loadVapid(admin);\n    if(!vapid)return reply(503,{ok:false,code:"push_not_configured"});\n\n    webpush.setVapidDetails(vapid.subject,vapid.publicKey,vapid.privateKey);\n'''
          assert old in s, 'drain VAPID block missing'
          s=s.replace(old,new,1)
          old='''  if(action === "public_key"){\n    if(!vapidPublic)return reply(503,{ok:false,code:"push_not_configured"});\n    return reply(200,{ok:true,public_key:vapidPublic});\n  }\n'''
          new='''  if(action === "public_key"){\n    const vapid=await loadVapid(admin);\n    if(!vapid)return reply(503,{ok:false,code:"push_not_configured"});\n    return reply(200,{ok:true,public_key:vapid.publicKey});\n  }\n'''
          assert old in s, 'public_key VAPID block missing'
          s=s.replace(old,new,1)
          p.write_text(s,'utf-8')
          PY
      - name: Verify shared Vault contract
        run: |
          python -m pip install -q pytest
          python -m pytest -q tests/test_v21_admin_web_push_edge_contract.py tests/test_v21_admin_web_push_schema.py
      - name: Commit and remove one-shot workflow
        run: |
          rm -f .github/workflows/admin-push-vapid-vault-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/v21-admin-push/index.ts .github/workflows/admin-push-vapid-vault-sync.yml
          git commit -m "fix: reuse canonical vault vapid for admin push"
          git push origin HEAD:feature/admin-web-push-design
