name: Apply Grouped Customer Order Source
on:
  push:
    branches:
      - fix/group-customer-order-source
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/group-customer-order-source
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verification dependency
        run: python -m pip install pytest
      - name: Patch grouped order-source UI
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('admin-order-source.js')
          text=path.read_text(encoding='utf-8')

          old="let corePromise=null;"
          new="""let corePromise=null;
          let orderGroup={sourceMessageIds:[],text:'',firstCreatedAt:'',lastCreatedAt:'',count:0};
          let groupSplitResult=null;"""
          assert old in text, 'corePromise anchor missing'
          text=text.replace(old,new,1)

          start=text.index('function renderResult(row){')
          end=text.index('function setStatus(',start)
          replacement="""function emptyOrderGroup(){return{sourceMessageIds:[],text:'',firstCreatedAt:'',lastCreatedAt:'',count:0};}
          function resetOrderGroup(){
            orderGroup=emptyOrderGroup();
            groupSplitResult=null;
            selectedIds.clear();
          }
          function renderResult(result){
            if(!result)return'';
            if(result.error)return`<div class=\"order-source-result\"><div class=\"order-source-unresolved\">${escapeHtml(result.error)}</div></div>`;
            const entries=Array.isArray(result.previewEntries)?result.previewEntries:[];
            return`<div class=\"order-source-result\">
              ${entries.map(entry=>entry.type==='unresolved'
                ?`<div class=\"order-source-unresolved\">Chưa tách · ${escapeHtml(entry.text||'')}</div>`
                :`<div><b>${Number(entry.quantity||0)}</b> ${escapeHtml(entry.name||'')}</div>`).join('')}
              ${!entries.length?'<div>Không có dòng để tách.</div>':''}
            </div>`;
          }
          function render(){
            ensurePanel();
            const contact=currentContact();
            const customer=panel.querySelector('[data-source-customer]');
            const summary=panel.querySelector('[data-source-summary]');
            const scroll=panel.querySelector('#adminOrderSourceScroll');
            if(customer)customer.textContent=contact?`Khách: ${contact.name}`:'Chưa chọn khách';
            if(summary)summary.textContent=contact
              ?`Chỉ tin khách gửi · ${orderGroup.count} tin · ${orderGroup.count?'1 đơn':'0 đơn'}`
              :'Chỉ tin khách gửi';
            for(const button of panel.querySelectorAll('[data-source-preset]'))button.setAttribute('aria-pressed',String(button.dataset.sourcePreset===preset));
            const include=panel.querySelector('[data-source-include-all]');
            if(include)include.checked=includeAll;
            const custom=panel.querySelector('[data-source-custom]');
            if(custom)custom.hidden=preset!=='custom';
            for(const input of panel.querySelectorAll('[data-source-date]'))input.value=customRange[input.dataset.sourceDate]||'';
            if(!scroll)return;
            if(!contact){scroll.innerHTML='<div class=\"order-source-empty\">Chọn khách trong Danh bạ để xem tin báo hàng.</div>';return;}
            if(!orderGroup.count){scroll.innerHTML='<div class=\"order-source-empty\">Không còn tin đơn hàng chưa tạo trong khoảng này. Có thể bật “Hiện tất cả tin khách”.</div>';return;}
            const first=timeText(orderGroup.firstCreatedAt);
            const last=timeText(orderGroup.lastCreatedAt);
            const timeRange=first&&last&&first!==last?`${first} → ${last}`:(first||last);
            scroll.innerHTML=`<article class=\"order-source-message\" data-source-order-group data-selected=\"true\" data-state=\"working\">
              <div class=\"order-source-message-top\">
                <time class=\"order-source-time\">${escapeHtml(timeRange)}</time>
                <span class=\"order-source-state\" data-state=\"working\">${orderGroup.count} tin · 1 đơn</span>
              </div>
              <div class=\"order-source-text\">${escapeHtml(orderGroup.text)}</div>
              <div class=\"order-source-actions\">
                <button type=\"button\" data-source-action=\"quick\">Tách nhanh</button>
                <button type=\"button\" data-source-action=\"ai\">AI</button>
                <button type=\"button\" data-source-action=\"ignore\">Bỏ qua</button>
              </div>
              ${renderResult(groupSplitResult)}
            </article>`;
          }
          """
          text=text[:start]+replacement+text[end:]

          old="""  if(!contact){rows=[];selectedIds.clear();lastRange={from:'',to:''};render();return false;}"""
          new="""  if(!contact){rows=[];resetOrderGroup();lastRange={from:'',to:''};render();return false;}"""
          assert old in text, 'refresh no-contact anchor missing'
          text=text.replace(old,new,1)

          old="""    rows=Array.isArray(data.items)?data.items:[];
              const valid=new Set(rows.map(row=>String(row.messageId||'')));
              selectedIds=new Set([...selectedIds].filter(id=>valid.has(id)));
              render();"""
          new="""    rows=Array.isArray(data.items)?data.items:[];
              const helper=await core();
              orderGroup=helper.customerOrderSourceGroup(rows);
              selectedIds=new Set(orderGroup.sourceMessageIds);
              groupSplitResult=null;
              render();"""
          assert old in text, 'refresh grouping anchor missing'
          text=text.replace(old,new,1)

          old="""    rows=[];
              setStatus(errorText(error),true);"""
          new="""    rows=[];
              resetOrderGroup();
              setStatus(errorText(error),true);"""
          assert old in text, 'refresh error anchor missing'
          text=text.replace(old,new,1)

          start=text.index('async function setRowState(')
          end=text.index('async function open(',start)
          actions="""async function setGroupState(messageIds,state){
            const contact=currentContact();
            const ids=Array.from(new Set((Array.isArray(messageIds)?messageIds:[]).map(clean).filter(Boolean)));
            if(!contact?.id||!ids.length)return false;
            for(const messageId of ids)await invoke('set_state',{contactId:contact.id,messageId,state});
            for(const row of rows){if(ids.includes(String(row.messageId||'')))row.state=state;}
            return true;
          }
          async function splitGroup(mode){
            const contact=currentContact();
            if(!contact?.id||!orderGroup.count||!orderGroup.text)return false;
            groupSplitResult={items:[],unresolved:[],error:mode==='ai'?'AI đang tách…':'Đang tách nhanh…'};
            render();
            try{
              const client=window.V21OrderScribeClient;
              if(!client?.[mode])throw new Error('invalid_response');
              const data=await client[mode]({contactId:contact.id,text:orderGroup.text});
              const helper=await core();
              const splitResult={items:data.items||[],unresolved:data.unresolved||[],error:''};
              splitResult.previewEntries=helper.orderSplitPreviewEntries(splitResult);
              groupSplitResult=splitResult;
            }catch(error){
              groupSplitResult={items:[],unresolved:[],error:errorText(error)};
            }
            render();
            return true;
          }
          async function ignoreGroup(){
            const ids=[...orderGroup.sourceMessageIds];
            if(!ids.length)return false;
            await setGroupState(ids,'ignored');
            const helper=await core();
            orderGroup=helper.customerOrderSourceGroup(rows);
            selectedIds=new Set(orderGroup.sourceMessageIds);
            groupSplitResult=null;
            render();
            dispatchContext();
            return true;
          }
          function onClick(event){
            const button=event.target.closest?.('[data-source-preset],[data-source-action]');
            if(!button)return;
            const nextPreset=button.dataset.sourcePreset;
            if(nextPreset){
              preset=String(nextPreset);
              if(preset==='custom'&&(!customRange.from||!customRange.to)){
                const today=dateValue(new Date());
                customRange={from:today,to:today};
              }
              render();
              void refresh();
              return;
            }
            const action=String(button.dataset.sourceAction||'');
            if(action==='quick'||action==='ai')void splitGroup(action);
            else if(action==='ignore')void ignoreGroup();
          }
          function onChange(event){
            const target=event.target;
            if(target?.matches?.('[data-source-include-all]')){includeAll=Boolean(target.checked);void refresh();return;}
            if(target?.matches?.('[data-source-date]')){
              customRange={...customRange,[target.dataset.sourceDate]:String(target.value||'')};
              if(customRange.from&&customRange.to)void refresh();
            }
          }
          """
          text=text[:start]+actions+text[end:]

          old="""  for(const row of rows){if(ids.includes(String(row.messageId||'')))row.state='imported';}
            for(const id of ids)selectedIds.delete(id);
            render();
            dispatchContext();"""
          new="""  for(const row of rows){if(ids.includes(String(row.messageId||'')))row.state='imported';}
            const helper=await core();
            orderGroup=helper.customerOrderSourceGroup(rows);
            selectedIds=new Set(orderGroup.sourceMessageIds);
            groupSplitResult=null;
            render();
            dispatchContext();"""
          assert old in text, 'markImported anchor missing'
          text=text.replace(old,new,1)

          old="""  requestSeq++;
            selectedIds.clear();
            if(panel&&!panel.hidden)void refresh();"""
          new="""  requestSeq++;
            resetOrderGroup();
            if(panel&&!panel.hidden)void refresh();"""
          assert old in text, 'active-contact anchor missing'
          text=text.replace(old,new,1)

          old="""    requestSeq++;
              selectedIds.clear();
              rows=[];
              lastRange={from:'',to:''};"""
          new="""    requestSeq++;
              resetOrderGroup();
              rows=[];
              lastRange={from:'',to:''};"""
          assert old in text, 'directory-contact anchor missing'
          text=text.replace(old,new,1)

          path.write_text(text,encoding='utf-8')
          PY
      - name: Verify focused contracts
        run: |
          node tests/test_v21_order_source_core.mjs
          node --check admin-order-source.js
          python tests/test_v21_order_source_ui.py
      - name: Rebuild canonical output
        run: python tools/build_current_preview.py
      - name: Verify canonical output
        run: python tools/verify_current.py
      - name: Commit implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add admin-order-source.js index.html version.json
          git diff --cached --quiet && exit 0
          git commit -m "feat: group customer order sources into one order"
          git push origin HEAD:fix/group-customer-order-source
