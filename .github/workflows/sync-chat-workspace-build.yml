name: Sync Chat Workspace Canonical Build
on:
  push:
    branches:
      - feature/chat-workspace-3col
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/chat-workspace-3col
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install verify dependency
        run: python -m pip install pytest
      - name: Rebuild canonical output
        run: python tools/build_current_preview.py
      - name: Verify synchronized output
        run: python tools/verify_current.py
      - name: Upload canonical build files
        uses: actions/upload-artifact@v4
        with:
          name: chat-workspace-canonical
          path: |
            index.html
            version.json
          if-no-files-found: error
