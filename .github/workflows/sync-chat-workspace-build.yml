name: Sync Chat Workspace Canonical Build
on:
  push:
    branches:
      - feature/chat-workspace-3col
permissions:
  contents: write
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/chat-workspace-3col
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install verify dependency
        run: python -m pip install pytest
      - name: Rebuild canonical output
        run: python tools/build_current_preview.py
      - name: Verify synchronized output
        run: python tools/verify_current.py
      - name: Commit canonical build files
        run: |
          git config user.name '1sl2tp'
          git config user.email '1sl2tp@gmail.com'
          git add index.html version.json
          git diff --cached --quiet || git commit -m 'build: sync desktop workspace canonical output'
          git push origin HEAD:feature/chat-workspace-3col
