name: Mobile Hierarchy Patch Once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-hierarchy-patch-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply mobile hierarchy patch
        run: python tools/patch_mobile_hierarchy_once.py
      - name: Commit source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add work-customer-summary.js work-customer-summary.css shell.js
          git commit -m 'fix: mobile hierarchy swipe and account menu'
          git push
