name: Admin Push Source Sync
on:
  push:
    branches:
      - feature/admin-web-push-design
permissions:
  contents: write
jobs:
  source-sync:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/admin-web-push-design
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wire controller source
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.source.html')
          s=p.read_text('utf-8')
          marker='<script src="./v21-realtime-session.js" data-build-source="v21-realtime-session.js"></script>\n'
          insert=marker+'<script src="./admin-push-controller.js" data-build-source="admin-push-controller.js"></script>\n'
          if 'data-build-source="admin-push-controller.js"' not in s:
              assert marker in s
              s=s.replace(marker,insert,1)
              p.write_text(s,'utf-8')
          PY
          python tools/build_current_preview.py
      - name: Commit canonical source and build
        run: |
          rm -f .github/workflows/admin-push-source-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.source.html index.html version.json .github/workflows/admin-push-source-sync.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build: wire admin push controller"
          git push origin HEAD:feature/admin-web-push-design
