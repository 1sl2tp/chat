name: Block old Supabase runtime refs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-old-supabase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject old business Supabase project in runtime code
        shell: bash
        run: |
          set -euo pipefail
          OLD='gcnoahqsrquxkwkjbuxy'
          if git grep -n "$OLD" --             ':!supabase/migrations/**'             ':!docs/**'             ':!tests/**'             ':!**/*.md'             ':!.github/workflows/no-old-supabase.yml'
          then
            echo "::error::Old Supabase project ref found in active runtime/deploy code."
            exit 1
          fi
          echo "OK: active runtime/deploy code has no old Supabase project ref."
