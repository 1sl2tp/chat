name: Apply Desktop Chat Workspace 3 Col
on:
  push:
    branches:
      - feature/chat-workspace-3col
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/chat-workspace-3col
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install verify dependency
        run: python -m pip install pytest
      - name: Apply desktop workspace geometry
        run: python tools/apply_chat_workspace_3col.py
      - name: Build canonical preview
        run: python tools/build_current_preview.py
      - name: Verify GREEN
        run: python tools/verify_current.py
      - name: Commit GREEN and remove temporary apply files
        run: |
          rm .github/workflows/apply-chat-workspace-3col.yml
          rm tools/apply_chat_workspace_3col.py
          git config user.name '1sl2tp'
          git config user.email '1sl2tp@gmail.com'
          git add -A
          git commit -m 'feat: show chat and work side by side on desktop'
          git push origin HEAD:feature/chat-workspace-3col
