name: Apply Order Source Contact Switch
on:
  push:
    branches:
      - design/customer-order-source-timeline
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/customer-order-source-timeline
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python tools/apply_order_source_contact_switch_fix.py
      - run: python tools/build_current_preview.py
      - run: python tests/test_v21_order_source_ui.py
      - run: node --check admin-order-source.js
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-order-source.js index.html version.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "fix: follow directory customer in order source panel"
          git push origin HEAD:design/customer-order-source-timeline
