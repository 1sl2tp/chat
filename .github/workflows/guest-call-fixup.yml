name: Guest call fixup
on:
  push:
    branches:
      - feature/guest-call-incoming-alert
permissions:
  contents: write
jobs:
  fixup:
    if: ${{ !contains(github.event.head_commit.message, '[guest-call-fixup]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/guest-call-incoming-alert
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve locked status copy
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('call-invite-client.js')
          s=p.read_text('utf-8')
          old="if(invite.guestJoinedAt)return 'Khách đang gọi';"
          new="if(invite.guestJoinedAt)return 'Khách đã vào phòng · đang gọi';"
          assert old in s
          p.write_text(s.replace(old,new,1),'utf-8')
          PY
      - name: Syntax and canonical build
        run: |
          node --check call-invite-client.js
          node --check admin-push-controller.js
          node --check sw.js
          python tools/build_current_preview.py
      - name: Commit generated files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add call-invite-client.js index.html version.json
          git diff --cached --quiet && exit 0
          git commit -m "fix: preserve guest call UI contract [guest-call-fixup]"
          git push origin HEAD:feature/guest-call-incoming-alert
