name: Apply Order Image Vision
on:
  push:
    branches:
      - feature/order-scribe-image-vision
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/order-scribe-image-vision
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply bounded quick-parser fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('supabase/functions/_shared/customer-order-parser.mjs')
          s=p.read_text()
          marker="const startUnit=new RegExp(`^(\\\\d+(?:[.,]\\\\d+)?)\\\\s*(${UNIT})\\\\s+(.+)$`,'iu');"
          assert marker in s
          s=s.replace(marker, marker+"\nconst quickOnlyStartUnit=/^(\\d+(?:[.,]\\d+)?)\\s*(bịch|bich)\\s+(.+)$/iu;",1)
          needle="  let match=text.match(startUnit);\n"
          assert needle in s
          block="""  if(preserveRaw){
    const quickMatch=text.match(quickOnlyStartUnit);
    if(quickMatch){
      const quantityEnd=String(quickMatch[1]).length;
      const unitWasAttached=!/^\\s/u.test(text.slice(quantityEnd));
      const rawQuantityLabel=unitWasAttached?`${quickMatch[1]}${quickMatch[2]}`:`${quickMatch[1]} ${quickMatch[2]}`;
      return finalize(quickMatch[1],quickMatch[3],{preserveRaw,rawName:quickMatch[3],rawQuantityLabel});
    }
  }

"""
          s=s.replace(needle,block+needle,1)
          p.write_text(s)
          PY
      - name: Run focused contracts
        run: |
          node tests/test_v21_order_source_core.mjs
          python tests/test_v21_order_source_edge_contract.py
          python tests/test_v21_order_source_ui.py
          node tests/test_v21_ai_product_parser_core.mjs
          node tests/test_v21_order_scribe_core.mjs
          node tests/test_v21_order_scribe_client_runtime.js
          python tests/test_v21_order_scribe_edge_contract.py
      - name: Rebuild canonical output
        run: python tools/build_current_preview.py
      - name: Verify canonical output
        run: python tools/verify_current.py
      - name: Commit generated and bounded fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/_shared/customer-order-parser.mjs index.html version.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: finish handwritten order image flow"
          git push origin HEAD:feature/order-scribe-image-vision
