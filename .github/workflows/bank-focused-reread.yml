name: Focused bill reread fixture
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/test_bank_focused_reread_budget.mjs
      - run: node tests/test_bank295_gemini_503_fallback_20261112.mjs
      - run: node tests/test_bank303_gemini_invalid_json_recovery_20261112.mjs

      - run: node tests/test_bank_deferred_reread.mjs

  queue:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: fixture
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: PGPASSWORD=fixture psql -h localhost -U postgres -X -v ON_ERROR_STOP=1 -f fixtures/bill-focused-reread/queue-test.sql

      - run: PGPASSWORD=fixture psql -h localhost -U postgres -X -v ON_ERROR_STOP=1 -f fixtures/bill-focused-reread/dispatch-test.sql
