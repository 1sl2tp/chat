name: Apply GETLINK work embed once
on:
  push:
    branches:
      - feature/work-getlink-embed
    paths:
      - tools/apply_getlink_work_embed_once.py
      - .github/workflows/apply-getlink-work-embed-once.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/work-getlink-embed
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply thin GETLINK work embed
        run: python tools/apply_getlink_work_embed_once.py
      - name: Commit generated integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.source.html index.html shell.js version.json
          git diff --cached --quiet && exit 0
          git commit -m "feat: restore thin GETLINK work embed"
          git push origin HEAD:feature/work-getlink-embed
