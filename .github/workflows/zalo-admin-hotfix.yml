name: Apply Zalo admin hotfix
on:
  push:
    branches: [fix/zalo-admin-avatar-subpopup]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/zalo-admin-avatar-subpopup
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch nested popup
        run: |
          python - <<'PY'
          from pathlib import Path
          js=Path('zalo-admin-link.js')
          text=js.read_text('utf-8')
          old='      <div data-zalo-account-panel></div>'
          new='      <div class="zalo-account-submodal" data-zalo-account-panel></div>'
          if old not in text:
              raise SystemExit('panel marker not found')
          text=text.replace(old,new,1)
          old2="  accountModal.querySelector('.zalo-account-close').addEventListener('click',closeAccountAdmin);\n  setAccountBusy(true);"
          new2="  accountModal.querySelector('.zalo-account-close').addEventListener('click',closeAccountAdmin);\n  const submodal=accountModal.querySelector('[data-zalo-account-panel]');\n  submodal.addEventListener('click',event=>{if(event.target===submodal)closeAccountPanel();});\n  setAccountBusy(true);"
          if old2 not in text:
              raise SystemExit('modal hook not found')
          text=text.replace(old2,new2,1)
          js.write_text(text,'utf-8')

          css=Path('zalo-admin-link.css')
          style=css.read_text('utf-8')
          block='''\n\n/* Zalo account chooser/create is a nested popup: no scrolling to the bottom of the main admin list. */\n.zalo-account-submodal:empty{display:none}\n.zalo-account-submodal:not(:empty){\n  position:fixed;inset:0;z-index:190;display:grid;place-items:center;padding:18px;box-sizing:border-box;background:rgba(0,0,0,.24);backdrop-filter:blur(2px)\n}\n.zalo-account-submodal>.zalo-account-panel{\n  width:min(100%,520px);max-height:min(82svh,640px);overflow:auto;overscroll-behavior:contain;margin:0;background:var(--theme-surface-primary,#fff);box-shadow:0 18px 60px rgba(0,0,0,.22)\n}\n@media(max-width:640px){\n  .zalo-account-submodal:not(:empty){place-items:end center;padding:8px}\n  .zalo-account-submodal>.zalo-account-panel{width:100%;max-height:calc(100svh - 16px);border-radius:20px;padding:14px}\n}\n'''
          if '.zalo-account-submodal' not in style:
              css.write_text(style+block,'utf-8')
          PY
      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/zalo-admin-hotfix.yml
          git add zalo-admin-link.js zalo-admin-link.css
          git commit -m "fix: sync avatar and open Zalo actions in nested popup"
          git push origin HEAD:fix/zalo-admin-avatar-subpopup
