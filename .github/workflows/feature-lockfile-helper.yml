name: Feature lockfile helper

on:
  push:
    branches:
      - feat/livekit-production-foundation
    paths:
      - .github/workflows/feature-lockfile-helper.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/livekit-production-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Generate exact lockfile
        run: npm install --package-lock-only --save-exact livekit-client@2.22.1
      - name: Commit generated package files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "build(call): pin LiveKit client dependency"
          git push origin HEAD:feat/livekit-production-foundation
