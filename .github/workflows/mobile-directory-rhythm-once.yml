name: Mobile Directory Rhythm Once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-directory-rhythm-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply mobile directory rhythm fix
        run: |
          python - <<'PY'
          from pathlib import Path

          directory_path = Path('contact-directory-admin.js')
          directory = directory_path.read_text('utf-8')
          old = '@media(max-width:640px){.contact-directory-tools{padding-inline:6px}.zalo-account-group-select{min-width:104px}}'
          new = '@media(max-width:640px){.contact-directory-tools{margin-top:-12px;padding-inline:6px}.zalo-account-group-select{min-width:104px}}'
          assert old in directory, 'mobile directory tools rule changed'
          directory_path.write_text(directory.replace(old, new, 1), 'utf-8')

          source_path = Path('index.source.html')
          source = source_path.read_text('utf-8')
          old = '''@media (hover:hover) and (pointer:fine){
            .shell-contact-manage{opacity:0;pointer-events:none;transition:opacity 120ms ease,background-color 120ms ease,color 120ms ease}
            .shell-contact-row:hover .shell-contact-manage,
            .shell-contact-row:focus-within .shell-contact-manage{opacity:1;pointer-events:auto}
          }
          '''
          new = old + '''@media (hover:none), (pointer:coarse){
            .shell-contact-manage{display:none!important}
          }
          '''
          assert old in source, 'contact manage hover rule changed'
          source_path.write_text(source.replace(old, new, 1), 'utf-8')
          PY
      - name: Focused RED-GREEN contract
        run: python tests/test_v21_mobile_chat_navigation.py
      - name: Rebuild canonical preview
        run: python tools/build_current_preview.py
      - name: Recheck focused contract
        run: python tests/test_v21_mobile_chat_navigation.py
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add contact-directory-admin.js index.source.html index.html version.json
          git commit -m 'fix: tighten mobile directory rhythm'
          git push
