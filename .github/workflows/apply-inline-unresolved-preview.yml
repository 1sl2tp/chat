name: Sync Inline Unresolved Preview Build
on:
  push:
    branches:
      - fix/order-source-inline-unresolved
permissions:
  contents: write
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/order-source-inline-unresolved
          fetch-depth: 0
      - name: Install verification dependency
        run: python -m pip install pytest
      - name: Verify focused contracts
        run: |
          node tests/test_v21_order_source_core.mjs
          python tests/test_v21_order_source_ui.py
      - name: Rebuild canonical output
        run: python tools/build_current_preview.py
      - name: Verify canonical output
        run: python tools/verify_current.py
      - name: Commit canonical build
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html version.json
          git diff --cached --quiet && exit 0
          git commit -m "build: sync inline unresolved preview"
          git push origin HEAD:fix/order-source-inline-unresolved
