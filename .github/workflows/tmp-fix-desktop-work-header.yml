name: Temporary fix desktop work header
on:
  push:
    branches:
      - fix/desktop-three-column-minimal
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/desktop-three-column-minimal
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Move work title into shared top header
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('zalo-admin-link.css')
          css = path.read_text('utf-8')
          old = '''  #appShell[data-auth-state="authenticated"][data-desktop-workspace="true"] #workThreadView .work-thread-frame{\n    display:flex;\n    flex-direction:column;\n  }\n  #appShell[data-auth-state="authenticated"][data-desktop-workspace="true"] #workThreadView .work-thread-frame::before{\n    content:"Công việc";\n    box-sizing:border-box;\n    display:flex;\n    align-items:center;\n    min-height:var(--header-height,72px);\n    padding-inline:24px;\n    color:var(--theme-content-primary);\n    background:var(--theme-surface-primary);\n    font-size:.95rem;\n    font-weight:600;\n  }\n  #appShell[data-auth-state="authenticated"][data-desktop-workspace="true"] #workThreadView .work-thread-empty{display:none!important}\n'''
          new = '''  #appShell[data-auth-state="authenticated"][data-desktop-workspace="true"] #regionTop::after{\n    content:"Công việc";\n    position:absolute;\n    inset-block:0;\n    inset-inline-end:0;\n    width:var(--desktop-work-width);\n    box-sizing:border-box;\n    display:flex;\n    align-items:center;\n    padding-inline:24px;\n    border-inline-start:1px solid var(--theme-border-default);\n    color:var(--theme-content-primary);\n    background:var(--theme-surface-primary);\n    font-size:.95rem;\n    font-weight:600;\n    pointer-events:none;\n  }\n  #appShell[data-auth-state="authenticated"][data-desktop-workspace="true"] #workThreadView .work-thread-empty{display:none!important}\n'''
          if old not in css:
              raise SystemExit('expected work-header block not found')
          path.write_text(css.replace(old, new, 1), 'utf-8')
          PY
      - name: Rebuild canonical preview
        run: python tools/build_current_preview.py
      - name: Commit corrected desktop header geometry
        run: |
          if git diff --quiet -- zalo-admin-link.css index.html version.json; then
            echo "Already corrected"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add zalo-admin-link.css index.html version.json
          git commit -m "fix: anchor work title in desktop top header"
          git push origin HEAD:fix/desktop-three-column-minimal
