name: Apply V21.72.46 Green
on:
  push:
    branches:
      - feature/top-mode-switch-state-geometry-tdd
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/top-mode-switch-state-geometry-tdd
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install verify dependency
        run: python -m pip install pytest
      - name: Apply bounded header geometry fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.source.html')
          s=p.read_text('utf-8')
          old_grid='  grid-template-columns:minmax(0,2fr) minmax(0,1fr);\n'
          assert s.count(old_grid)==1, s.count(old_grid)
          s=s.replace(old_grid,'  grid-template-columns:minmax(0,1fr) minmax(0,1fr);\n',1)
          anchor='.top-mode-tab[data-top-tab="chat"]{display:flex;align-items:center;justify-content:center;gap:6px}\n'
          assert s.count(anchor)==1, s.count(anchor)
          s=s.replace(anchor,anchor+'.top-mode-tab[data-top-tab="chat"][data-contact-identity="true"]{\n  justify-content:flex-start;\n  padding-left:4px;\n  padding-right:8px;\n}\n',1)
          marker='.top-mode-tab{\n'
          assert s.count(marker)>=1
          conditional='.top-mode-switch[data-contact-identity="true"]{\n  grid-template-columns:minmax(0,2fr) minmax(0,1fr);\n}\n'
          s=s.replace(marker,conditional+marker,1)
          p.write_text(s,'utf-8')
          p=Path('shell.js')
          s=p.read_text('utf-8')
          old='function renderChatTabIdentity(){\n  const tab=document.querySelector(\'[data-top-tab="chat"]\');\n  const avatar=tab?.querySelector(\'[data-chat-tab-avatar]\');\n  const label=tab?.querySelector(\'[data-chat-tab-label]\');\n  const visible=Boolean(\n'
          new='function renderChatTabIdentity(){\n  const tab=document.querySelector(\'[data-top-tab="chat"]\');\n  const switcher=tab?.closest?.(\'.top-mode-switch\')||document.querySelector(\'.top-mode-switch\');\n  const avatar=tab?.querySelector(\'[data-chat-tab-avatar]\');\n  const label=tab?.querySelector(\'[data-chat-tab-label]\');\n  const visible=Boolean(\n'
          assert s.count(old)==1, s.count(old)
          s=s.replace(old,new,1)
          start=s.index('function renderChatTabIdentity(){')
          old2='  );\n  if(!tab||!avatar||!label)return visible;\n  if(!visible){\n'
          new2='  );\n  if(switcher)switcher.dataset.contactIdentity=String(visible);\n  if(tab)tab.dataset.contactIdentity=String(visible);\n  if(!tab||!avatar||!label)return visible;\n  if(!visible){\n'
          pos=s.index(old2,start)
          s=s[:pos]+new2+s[pos+len(old2):]
          p.write_text(s,'utf-8')
          PY
      - name: Build canonical preview
        run: python tools/build_current_preview.py
      - name: Verify GREEN
        run: python tools/verify_current.py
      - name: Commit GREEN and remove temporary workflow
        run: |
          rm .github/workflows/apply-v21-72-46.yml
          git config user.name '1sl2tp'
          git config user.email '1sl2tp@gmail.com'
          git add -A
          git commit -m 'fix: stabilize top mode switch geometry'
          git push origin HEAD:feature/top-mode-switch-state-geometry-tdd
