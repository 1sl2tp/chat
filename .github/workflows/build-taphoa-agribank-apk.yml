name: Build TAPHOA Agribank SMS APK
on:
  push:
    branches:
      - taphoa-sms-apk-build
    paths:
      - android/agribank-sms/**
      - .github/workflows/build-taphoa-agribank-apk.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --version
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Test SMS safety
        run: |
          mkdir -p /tmp/sms-filter-classes
          javac -encoding UTF-8 -d /tmp/sms-filter-classes android/agribank-sms/app/src/main/java/xyz/taphoa/agribanksms/SmsSafety.java android/agribank-sms/tests/SmsSafetyTest.java
          java -cp /tmp/sms-filter-classes xyz.taphoa.agribanksms.SmsSafetyTest
      - name: Assemble debug APK
        working-directory: android/agribank-sms
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify output APK
        run: |
          test -s android/agribank-sms/app/build/outputs/apk/debug/app-debug.apk
          unzip -t android/agribank-sms/app/build/outputs/apk/debug/app-debug.apk | tail -1
          cp android/agribank-sms/app/build/outputs/apk/debug/app-debug.apk TAPHOA_Agribank_SMS.apk
          sha256sum TAPHOA_Agribank_SMS.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TAPHOA_Agribank_SMS_APK
          path: TAPHOA_Agribank_SMS.apk
          retention-days: 30
          if-no-files-found: error
