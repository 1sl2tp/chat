name: Admin Push Task6 UI Sync
on:
  push:
    branches:
      - feature/admin-web-push-design
permissions:
  contents: write
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/admin-web-push-design
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch notification row into existing admin popup
        run: |
          python - <<'PY'
          from pathlib import Path

          js_path=Path('zalo-admin-link.js')
          js=js_path.read_text('utf-8')
          marker="async function openAccountAdmin(){\n"
          assert marker in js
          helper=r'''function adminPushView(snapshot={}){
  const code=String(snapshot?.code||'');
  if(code==='ios_install_required')return{status:'Cài TAPHOA Chat ra Màn hình chính để nhận thông báo nền',action:'',mode:'none'};
  if(code==='unsupported'||snapshot?.supported===false)return{status:'Thiết bị này không hỗ trợ',action:'',mode:'none'};
  if(code==='blocked')return{status:'Thông báo bị chặn',action:'',mode:'none'};
  if(snapshot?.enabled)return{status:'Đã bật thông báo',action:'Tắt thông báo',mode:'disable'};
  return{status:'Bật thông báo',action:'Bật thông báo',mode:'enable'};
}

function paintAdminPushSetting(snapshot={}){
  if(!accountModal)return;
  const setting=accountModal.querySelector('[data-admin-push-setting]');
  const statusNode=setting?.querySelector?.('[data-admin-push-status]');
  const action=setting?.querySelector?.('[data-admin-push-action]');
  if(!setting||!statusNode||!action)return;
  const view=adminPushView(snapshot);
  statusNode.textContent=view.status;
  action.textContent=view.action||'Bật thông báo';
  action.dataset.mode=view.mode;
  action.hidden=view.mode==='none';
  action.disabled=false;
  setting.dataset.state=String(snapshot?.code||view.mode||'idle');
}

async function refreshAdminPushSetting(){
  const push=window.V21AdminPush;
  if(!push?.status){
    paintAdminPushSetting({supported:false,code:'unsupported'});
    return null;
  }
  try{
    const snapshot=await push.status();
    paintAdminPushSetting(snapshot);
    return snapshot;
  }catch{
    paintAdminPushSetting({supported:false,code:'unsupported'});
    return null;
  }
}

async function runAdminPushAction(button){
  const push=window.V21AdminPush;
  if(!push||!button||button.disabled)return;
  button.disabled=true;
  const mode=String(button.dataset.mode||'enable');
  try{
    const snapshot=mode==='disable'?await push.disable():await push.enable();
    paintAdminPushSetting(snapshot);
  }catch{
    await refreshAdminPushSetting();
  }finally{
    if(button.isConnected)button.disabled=false;
  }
}

'''
          if 'function adminPushView(' not in js:
              js=js.replace(marker,helper+marker,1)

          old='''      <header class="zalo-account-modal-head"><div><h2 id="zalo-account-title">Zalo & tài khoản</h2><p>Quản lý Chat User ↔ Zalo</p></div><button type="button" class="zalo-account-close" aria-label="Đóng">×</button></header>
      <p class="zalo-account-error" data-zalo-account-error hidden></p>'''
          new='''      <header class="zalo-account-modal-head"><div><h2 id="zalo-account-title">Zalo & tài khoản</h2><p>Quản lý Chat User ↔ Zalo</p></div><button type="button" class="zalo-account-close" aria-label="Đóng">×</button></header>
      <div class="zalo-account-notification" data-admin-push-setting data-state="loading">
        <span class="zalo-account-notification-copy"><strong>Thông báo</strong><small data-admin-push-status>Đang kiểm tra…</small></span>
        <button type="button" class="zalo-account-notification-action" data-admin-push-action data-mode="enable">Bật thông báo</button>
      </div>
      <p class="zalo-account-error" data-zalo-account-error hidden></p>'''
          if 'data-admin-push-setting' not in js:
              assert old in js
              js=js.replace(old,new,1)

          old_bind="""  accountModal.querySelector('.zalo-account-close').addEventListener('click',closeAccountAdmin);\n  const submodal=accountModal.querySelector('[data-zalo-account-panel]');"""
          new_bind="""  accountModal.querySelector('.zalo-account-close').addEventListener('click',closeAccountAdmin);\n  const pushAction=accountModal.querySelector('[data-admin-push-action]');\n  pushAction?.addEventListener('click',()=>void runAdminPushAction(pushAction));\n  void refreshAdminPushSetting();\n  const submodal=accountModal.querySelector('[data-zalo-account-panel]');"""
          if 'runAdminPushAction(pushAction)' not in js:
              assert old_bind in js
              js=js.replace(old_bind,new_bind,1)
          js_path.write_text(js,'utf-8')

          css_path=Path('zalo-admin-link.css')
          css=css_path.read_text('utf-8')
          css_block=r'''
.zalo-account-notification{
  display:flex;align-items:center;justify-content:space-between;gap:12px;min-width:0;margin:0 0 12px;padding:10px 12px;border:1px solid var(--theme-border-default,#e1e1e1);border-radius:16px;background:color-mix(in srgb,var(--theme-surface-secondary,#f3f3f3) 46%,var(--theme-surface-primary,#fff))
}
.zalo-account-notification-copy{display:grid;gap:2px;min-width:0}
.zalo-account-notification-copy strong{font-size:14px;font-weight:600;line-height:20px}
.zalo-account-notification-copy small{color:var(--theme-content-secondary,#777);font-size:12px;line-height:17px}
.zalo-account-notification-action{
  flex:0 0 auto;min-height:36px;border:0;border-radius:10px;padding:0 11px;background:var(--theme-content-primary,#171717);color:var(--theme-surface-primary,#fff);font:inherit;font-size:13px;font-weight:600;cursor:pointer
}
.zalo-account-notification-action:disabled{opacity:.55;cursor:default}
.zalo-account-notification-action[hidden]{display:none!important}
'''
          if '.zalo-account-notification{' not in css:
              css += '\n'+css_block
          css_path.write_text(css,'utf-8')
          PY
      - name: Verify Task 6 contract
        run: |
          python -m pip install -q pytest
          python -m pytest -q tests/test_v21_admin_web_push_ui_contract.py
          node --check zalo-admin-link.js
      - name: Build canonical preview
        run: python tools/build_current_preview.py
      - name: Commit UI and remove one-shot workflow
        run: |
          rm -f .github/workflows/admin-push-task6-ui-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add zalo-admin-link.js zalo-admin-link.css index.html version.json .github/workflows/admin-push-task6-ui-sync.yml
          git commit -m "feat: add admin push setting row"
          git push origin HEAD:feature/admin-web-push-design
