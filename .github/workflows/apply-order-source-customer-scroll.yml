name: Apply Order Source Customer Scroll
on:
  push:
    branches:
      - fix/order-source-parser-customer-scroll
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/order-source-parser-customer-scroll
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/apply_order_source_customer_scroll_fix.py
      - run: python tools/build_current_preview.py
      - run: python tests/test_v21_order_source_ui.py
      - name: Commit UI fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-order-source.js index.html version.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "fix: show customer and scroll only source list"
          git push origin HEAD:fix/order-source-parser-customer-scroll
