name: Desktop Layout Fix Once
on:
  push:
    paths:
      - '.github/workflows/desktop-layout-fix-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch responsive desktop geometry
        run: |
          python - <<'PY'
          from pathlib import Path

          def patch(path, replacements):
              p=Path(path)
              text=p.read_text('utf-8')
              for old,new,count in replacements:
                  actual=text.count(old)
                  assert actual==count, f'{path}: expected {count} occurrences of {old!r}, found {actual}'
                  text=text.replace(old,new)
              p.write_text(text,'utf-8')

          patch('shell.js',[
              ("const DESKTOP_DIRECTORY_QUERY='(min-width: 68rem) and (hover: hover) and (pointer: fine)';","const DESKTOP_DIRECTORY_QUERY='(min-width: 64rem) and (hover: hover) and (pointer: fine)';",1),
              ("const DESKTOP_WORKSPACE_QUERY='(min-width: 74rem) and (hover: hover) and (pointer: fine)';","const DESKTOP_WORKSPACE_QUERY='(min-width: 80rem) and (hover: hover) and (pointer: fine)';",1),
          ])
          patch('work-customer-summary.js',[
              ("(min-width:68rem) and (hover:hover) and (pointer:fine)","(min-width:64rem) and (hover:hover) and (pointer:fine)",1),
          ])
          patch('work-customer-summary.css',[
              ("@media(max-width:67.999rem){","@media(max-width:63.999rem){",1),
          ])
          patch('zalo-admin-link.css',[
              ("@media (min-width:74rem) and (hover:hover) and (pointer:fine){","@media (min-width:80rem) and (hover:hover) and (pointer:fine){",2),
          ])
          patch('index.source.html',[
              ("@media (min-width:68rem) and (hover:hover) and (pointer:fine){","@media (min-width:64rem) and (hover:hover) and (pointer:fine){",2),
              ("--desktop-directory-width:clamp(328px,27vw,340px);","--desktop-directory-width:clamp(300px,26vw,340px);",1),
              ("@media (min-width:74rem) and (hover:hover) and (pointer:fine){","@media (min-width:80rem) and (hover:hover) and (pointer:fine){",1),
              ("--desktop-chat-width:clamp(420px,28vw,560px);","--desktop-chat-width:clamp(520px,40vw,640px);",1),
              ("@media(max-width:67.999rem){#shellNavigationLayer .shell-navigation-panel{height:100dvh;max-height:100dvh}}","@media(max-width:63.999rem){#shellNavigationLayer .shell-navigation-panel{height:100dvh;max-height:100dvh}}",1),
          ])
          PY
      - name: Verify focused desktop layout contract
        run: python tests/test_v21_chat_workspace_3col.py
      - name: Rebuild canonical preview
        run: python tools/build_current_preview.py
      - name: Commit source and canonical build
        run: |
          rm -f .github/workflows/desktop-layout-fix-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add shell.js work-customer-summary.js work-customer-summary.css zalo-admin-link.css index.source.html index.html version.json .github/workflows/desktop-layout-fix-once.yml
          git commit -m 'fix: balance responsive desktop chat workspace'
          git push
