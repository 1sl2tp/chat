name: One-shot chat icon canonical rebuild
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch source and rebuild index
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess, sys
          p = Path('index.source.html')
          text = p.read_text(encoding='utf-8')
          old = '''<link rel="apple-touch-icon" sizes="192x192" href="./icons/chat-192.png">
          <link rel="icon" type="image/png" sizes="192x192" href="./icons/chat-192.png">'''.replace('          ', '')
          new = '''<link rel="apple-touch-icon" sizes="192x192" href="./icons/chat-192.png">
          <link rel="icon" type="image/svg+xml" href="./icons/chat-favicon.svg">
          <link rel="shortcut icon" type="image/svg+xml" href="./icons/chat-favicon.svg">
          <link rel="mask-icon" href="./icons/chat-favicon.svg" color="#16a34a">'''.replace('          ', '')
          if old in text:
              text = text.replace(old, new, 1)
              p.write_text(text, encoding='utf-8')
          elif new not in text:
              raise SystemExit('favicon source anchor not found')
          subprocess.run([sys.executable, 'tools/build_current_preview.py'], check=True)
          PY
          if git diff --quiet -- index.source.html index.html version.json; then
            echo "canonical source already patched"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.source.html index.html version.json
          git commit -m "Regenerate chat icon split from source"
          git push
