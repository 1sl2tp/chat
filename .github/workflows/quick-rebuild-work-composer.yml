name: Quick rebuild work composer
permissions:
  contents: write
on:
  push:
    branches: [main]
jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install pytest
      - name: Rebuild canonical and verify
        run: |
          python tools/build_current_preview.py
          python -m unittest tests.test_v21_work_hides_composer -v
          node --check shell.js
          python tools/verify_current.py
      - name: Commit canonical and cleanup triggers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/quick-rebuild-work-composer.yml
          git rm -f tests/.work-composer-verify || true
          git add index.html version.json shell.js tests/test_v21_work_hides_composer.py
          git commit -m 'fix: publish work composer hard hide'
          git push origin HEAD:main
