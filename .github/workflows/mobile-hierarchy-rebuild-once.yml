name: Mobile Hierarchy Rebuild Once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-hierarchy-rebuild-once.yml'
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild canonical preview
        run: python tools/build_current_preview.py
      - name: Commit canonical build
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html version.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'build: sync mobile hierarchy preview'
          git push
