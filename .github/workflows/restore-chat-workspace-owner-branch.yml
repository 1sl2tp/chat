name: Restore CHAT work owner branch

on:
  push:
    branches:
      - feature/restore-chat-workspace-owner

permissions:
  contents: write

jobs:
  patch-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/restore-chat-workspace-owner
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Remove GETLINK embed from CHAT and restore CHAT-owned work surface
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('.')
          source_path = root / 'index.source.html'
          shell_path = root / 'shell.js'
          bridge_path = root / 'getlink-auth-bridge.js'

          source = source_path.read_text(encoding='utf-8')

          old_css = '''.work-thread-embed{
            display:block;
            width:100%;
            height:100%;
            min-width:0;
            min-height:0;
            border:0;
            background:#fff;
          }'''
          new_css = '''.work-thread-empty{
            width:100%;
            height:100%;
            min-width:0;
            min-height:0;
            display:grid;
            place-content:center;
            gap:6px;
            padding:24px;
            box-sizing:border-box;
            text-align:center;
            color:var(--theme-content-secondary);
          }
          .work-thread-empty strong{
            color:var(--theme-content-primary);
            font-size:1rem;
            font-weight:600;
          }
          .work-thread-empty span{
            font-size:.9rem;
            line-height:1.35rem;
          }'''

          old_markup = '''              <div class="work-thread-frame" data-work-frame-owner="getlink">
                        <iframe
                          id="workGetlinkFrame"
                          class="work-thread-embed"
                          src="https://get.taphoa.xyz/?embed=1"
                          title="Công việc"
                          loading="lazy"
                          referrerpolicy="strict-origin-when-cross-origin"
                        ></iframe>
                      </div>'''
          new_markup = '''              <div class="work-thread-frame" data-work-owner="chat">
                        <div class="work-thread-empty" role="status" aria-live="polite">
                          <strong>Công việc</strong>
                          <span>Khu vực này để phát triển sau.</span>
                        </div>
                      </div>'''

          bridge_script = '<script src="./getlink-auth-bridge.js" data-build-source="getlink-auth-bridge.js"></script>\n'

          assert source.count(old_css) == 1, 'expected exactly one GETLINK iframe CSS block'
          assert source.count(old_markup) == 1, 'expected exactly one GETLINK iframe markup block'
          assert source.count(bridge_script) == 1, 'expected exactly one GETLINK auth bridge script include'

          source = source.replace(old_css, new_css)
          source = source.replace(old_markup, new_markup)
          source = source.replace(bridge_script, '')
          source_path.write_text(source, encoding='utf-8')

          shell = shell_path.read_text(encoding='utf-8')
          old_shell = '''function syncDesktopWorkspaceMode(){
            applyRoutePresentation();
            if(desktopWorkspaceEnabled())void window.V21GetlinkAuthBridge?.sync?.();
            return desktopWorkspaceEnabled();
          }'''
          new_shell = '''function syncDesktopWorkspaceMode(){
            applyRoutePresentation();
            return desktopWorkspaceEnabled();
          }'''
          assert shell.count(old_shell) == 1, 'expected exactly one GETLINK bridge sync call'
          shell = shell.replace(old_shell, new_shell)
          shell_path.write_text(shell, encoding='utf-8')

          if bridge_path.exists():
              bridge_path.unlink()

          # Ownership gate before build.
          source = source_path.read_text(encoding='utf-8')
          shell = shell_path.read_text(encoding='utf-8')
          for forbidden in (
              'workGetlinkFrame',
              'https://get.taphoa.xyz/?embed=1',
              'data-work-frame-owner="getlink"',
              'getlink-auth-bridge.js',
              'V21GetlinkAuthBridge',
          ):
              assert forbidden not in source, forbidden
              assert forbidden not in shell, forbidden
          assert 'data-work-owner="chat"' in source
          assert 'Khu vực này để phát triển sau.' in source
          PY

      - name: Rebuild canonical index
        run: python tools/build_current_preview.py

      - name: Run ownership and geometry gates
        run: |
          python tests/test_v21_remove_getlink_embed.py
          python tests/test_v21_work_context_bridge.py
          python tests/test_v21_chat_workspace_3col.py
          python tests/test_v21_work_hides_composer.py

      - name: Commit generated CHAT-only change back to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.source.html index.html version.json shell.js getlink-auth-bridge.js
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "fix: restore CHAT-owned Công việc surface"
          git push origin HEAD:feature/restore-chat-workspace-owner
