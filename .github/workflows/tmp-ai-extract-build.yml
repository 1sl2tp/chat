name: Temporary AI Extract Canonical Build
on:
  push:
    branches:
      - feature/ai-selection-image-extract
    paths:
      - '.github/workflows/tmp-ai-extract-build.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ai-selection-image-extract
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild canonical page
        run: python tools/build_current_preview.py
      - name: Commit canonical outputs
        run: |
          if git diff --quiet -- index.html version.json; then
            echo 'Canonical outputs already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html version.json
          git commit -m 'build: refresh canonical AI extract preview'
          git push origin HEAD:feature/ai-selection-image-extract
