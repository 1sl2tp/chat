name: Package fixed Vercel PWA preview

on:
  push:
    branches:
      - feat/chatwoot-responsive-pc-mobile-0174
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vercel-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify and build PWA
        env:
          VITE_BUILD_ID: ${{ github.sha }}
        run: npm run build

      - name: Verify exact Vite preview layout
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/admin/index.html
          test -f dist/manifest.webmanifest
          test -f dist/admin/manifest.webmanifest
          test -f dist/sw.js
          test -d dist/assets
          grep -q '../assets/admin-' dist/admin/index.html
          grep -q './assets/user-' dist/index.html
          grep -q '../assets/login-screen-' dist/admin/index.html
          grep -q './assets/login-screen-' dist/index.html
          printf '{"sha":"%s"}\n' "$GITHUB_SHA" > dist/preview-meta.json

      - name: Publish exact Vite dist branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist
          git init -q
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .
          git commit -qm "preview: ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:refs/heads/vercel-preview-dist

      - name: Upload Vercel preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: taphoa-chat-preview-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
