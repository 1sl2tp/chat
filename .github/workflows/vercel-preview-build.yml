name: Package fixed Vercel PWA preview

on:
  push:
    branches:
      - feat/chatwoot-responsive-pc-mobile-0174
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify and build PWA
        env:
          VITE_BUILD_ID: ${{ github.sha }}
        run: npm run build

      - name: Upload Vercel preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: taphoa-chat-preview-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
