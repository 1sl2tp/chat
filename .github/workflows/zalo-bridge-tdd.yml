name: Zalo Bridge TDD
on:
  pull_request:
jobs:
  tdd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install pytest
      - name: Zalo schema contract
        run: python -m pytest -q tests/test_v21_zalo_schema_contract.py
