name: Work Scroll Build Once
on:
  push:
    branches: [main]
    paths:
      - '.work-scroll-build-trigger'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build canonical preview
        run: python tools/build_current_preview.py
      - name: Commit canonical build
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html version.json
          if ! git diff --cached --quiet; then
            git commit -m 'build: refresh Work outer scroll lock'
            git push origin main
          fi
