name: Apply verified live fixes

on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-live-fixes.yml']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reconstruct verified patch
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            255f4dd76e933445446c80bf417e89f334e43fcbeafdcbcd08285681004e30cb
            4d9726a83b4cfb14059c3059abe822a68b3acb12eedd5262a197ef68ffb90dc1
            2ba322594fbabf7490988feb9012568ae6d45d3b23609a9cc1fe5ca39e977838
            86bfc773dbbbc6f53916fd5193ae552ca85363503fcc2683bfacc56123f5d285
          )
          : > /tmp/livefix.b64
          i=0
          for part in 00 01 02 03; do
            curl -fsSL "https://raw.githubusercontent.com/1sl2tp/chat/fix-mobile-viewport-20260903/.staging/livefix-${part}.b64" -o "/tmp/part-${part}.b64"
            actual="$(tr -d '[:space:]' < "/tmp/part-${part}.b64" | sha256sum | awk '{print $1}')"
            echo "part-${part}: ${actual}"
            test "$actual" = "${expected[$i]}"
            cat "/tmp/part-${part}.b64" >> /tmp/livefix.b64
            i=$((i+1))
          done
          base64 -d /tmp/livefix.b64 > /tmp/livefix.patch
          echo "e98669b0d97e38e120aa144021cc0d11f3a664d8e3789d8ee8815b510e9eea33  /tmp/livefix.patch" | sha256sum -c -
          git apply --check /tmp/livefix.patch
          git apply /tmp/livefix.patch

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify source
        run: npm run verify

      - name: Production build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://gcnoahqsrquxkwkjbuxy.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_UY3gfQ9MsntDFCUJ_uV0UA__eTYXz_w' }}
        run: npm run build

      - name: Commit verified patch to main
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-live-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: mobile idle/editing viewport and live call account ui"
          git push origin HEAD:main
