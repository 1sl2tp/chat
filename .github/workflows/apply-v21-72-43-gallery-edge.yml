name: Apply V21.72.43 Gallery Edge

on:
  push:
    branches:
      - fix/gallery-edge-alignment

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply gallery edge owner fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('.')
          source=root/'index.source.html'
          text=source.read_text('utf-8')
          old=""".media-gallery-grid{\n  width:min(25rem,100%)!important;\n  max-width:100%;"""
          new=""".media-gallery-grid{\n  width:25rem!important;\n  max-width:100%;"""
          assert old in text, 'gallery base width contract not found'
          text=text.replace(old,new,1)
          mobile=".media-gallery-grid{width:min(25rem,100%)!important}"
          assert mobile in text, 'gallery mobile width contract not found'
          text=text.replace(mobile,".media-gallery-grid{width:25rem!important;max-width:100%}",1)
          anchor=""".media-gallery-grid .media-image-tile{\n  min-width:0;"""
          insert=""".user-message-unit>.media-gallery-grid{margin-left:auto}\n.assistant-message-unit>.media-gallery-grid{margin-right:auto}\n.media-gallery-grid .media-image-tile{\n  min-width:0;"""
          assert anchor in text, 'gallery tile anchor not found'
          text=text.replace(anchor,insert,1)
          source.write_text(text,'utf-8')

          test=root/'tests'/'test_v21_72_28_image_presentation_owner.py'
          t=test.read_text('utf-8')
          old_assert="assert 'width:min(25rem,100%)!important' in source"
          assert old_assert in t, 'old image presentation contract not found'
          t=t.replace(old_assert,"assert 'width:25rem!important' in source\nassert 'max-width:100%' in source\nassert 'width:min(25rem,100%)!important' not in source")
          test.write_text(t,'utf-8')
          print('V21.72.43 gallery edge patch applied')
          PY
      - name: Build canonical preview
        run: python tools/build_current_preview.py
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Verify all green
        run: python tools/verify_current.py
      - name: Commit green state
        shell: bash
        run: |
          rm .github/workflows/apply-v21-72-43-gallery-edge.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.source.html index.html version.json tests/test_v21_72_28_image_presentation_owner.py .github/workflows/apply-v21-72-43-gallery-edge.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: align multi-image gallery to sender edge"
          git push origin HEAD:fix/gallery-edge-alignment
