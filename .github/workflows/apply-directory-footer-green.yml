name: Apply Directory Footer Green
on:
  push:
    branches:
      - feature/directory-fixed-tools-footer-row
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply bounded directory layout changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('.')
          source=root/'index.source.html'
          s=source.read_text('utf-8')
          old='.wm-sidebar-body{flex:1 1 auto;min-height:0;overflow:auto}'
          new='.wm-sidebar-body{flex:1 1 auto;min-height:0;overflow:hidden;display:flex;flex-direction:column}\n.wm-sidebar-navigation{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain}'
          assert s.count(old)==1, s.count(old)
          s=s.replace(old,new,1)
          old_footer='.shell-sidebar-account-footer{gap:8px}'
          new_footer='.shell-sidebar-account-footer{grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px;padding:6px 0 max(6px,env(safe-area-inset-bottom))}\n.shell-sidebar-account-footer .shell-sidebar-account-main,.shell-sidebar-account-footer .shell-sidebar-account-action,.shell-sidebar-account-footer .zalo-account-admin-open{width:100%;min-width:0;height:40px;min-height:40px;padding:0 8px;border-radius:12px;font-size:.82rem;font-weight:600}\n.shell-sidebar-account-footer .shell-sidebar-account-main{display:flex;align-items:center;justify-content:center;background:var(--theme-surface-secondary)}\n.shell-sidebar-account-footer .shell-sidebar-account-avatar,.shell-sidebar-account-footer .shell-sidebar-account-copy span,.shell-sidebar-account-footer .shell-sidebar-account-chevron{display:none}\n.shell-sidebar-account-footer .shell-sidebar-account-copy strong{display:block;min-width:0;font-size:.82rem;line-height:1rem;font-weight:600;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.shell-sidebar-account-footer .zalo-account-admin-open{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n'
          assert s.count(old_footer)==1, s.count(old_footer)
          s=s.replace(old_footer,new_footer,1)
          source.write_text(s,'utf-8')
          directory=root/'contact-directory-admin.js'
          d=directory.read_text('utf-8')
          old_tools='.contact-directory-tools{position:sticky;top:0;z-index:4;'
          new_tools='.contact-directory-tools{position:static;z-index:4;'
          assert d.count(old_tools)==1, d.count(old_tools)
          d=d.replace(old_tools,new_tools,1)
          old_scroll="const scrollHost=host.closest('.wm-sidebar-body');"
          new_scroll="const scrollHost=host.closest('.wm-sidebar-navigation');"
          assert d.count(old_scroll)==1, d.count(old_scroll)
          d=d.replace(old_scroll,new_scroll,1)
          directory.write_text(d,'utf-8')
          zalo=root/'zalo-admin-link.js'
          z=zalo.read_text('utf-8')
          old_label="button.textContent='Zalo & tài khoản';"
          new_label="button.textContent='Zalo';\n  button.setAttribute('aria-label','Zalo & tài khoản');"
          assert z.count(old_label)==1, z.count(old_label)
          z=z.replace(old_label,new_label,1)
          zalo.write_text(z,'utf-8')
          PY
      - name: Syntax check changed JS
        run: |
          node --check contact-directory-admin.js
          node --check zalo-admin-link.js
      - name: Verify new contract before build
        run: python tests/test_v21_72_41_directory_scroll_footer_row.py
      - name: Build canonical preview
        run: python tools/build_current_preview.py
      - name: Install verify dependency
        run: python -m pip install pytest
      - name: Verify all green
        run: python tools/verify_current.py
      - name: Commit generated green state
        shell: bash
        run: |
          rm .github/workflows/apply-directory-footer-green.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.source.html index.html version.json contact-directory-admin.js zalo-admin-link.js .github/workflows/apply-directory-footer-green.yml
          git commit -m "feat: fix directory scroll owner and compact footer row [directory-footer-green]"
          git push origin HEAD:feature/directory-fixed-tools-footer-row
