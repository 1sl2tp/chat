name: Rebuild Preview Once
on:
  push:
    branches:
      - feature/admin-web-push-design
    paths:
      - .github/workflows/rebuild-preview-once.yml
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/admin-web-push-design
      - name: Rebuild canonical preview
        run: python tools/build_current_preview.py
      - name: Commit generated preview and remove one-shot workflow
        run: |
          rm .github/workflows/rebuild-preview-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html version.json .github/workflows/rebuild-preview-once.yml
          git diff --cached --quiet && exit 0
          git commit -m "build: sync admin push preview artifact"
          git push origin HEAD:feature/admin-web-push-design
