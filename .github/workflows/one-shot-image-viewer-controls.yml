name: One-shot image viewer controls
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch image viewer zoom and rotation controls
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess, sys

          root=Path('.')
          app_path=root/'app.js'
          app=app_path.read_text('utf-8')

          old="""let imageViewerSwipeStartX=0;
let imageViewerZoom=1;
let imageViewerPanX=0;
let imageViewerPanY=0;
let imageViewerGesture=null;"""
          new="""let imageViewerSwipeStartX=0;
let imageViewerZoom=1;
let imageViewerZoomOut=null;
let imageViewerZoomIn=null;
let imageViewerZoomValue=null;
let imageViewerPanX=0;
let imageViewerPanY=0;
let imageViewerGesture=null;"""
          assert old in app, 'zoom state anchor missing'
