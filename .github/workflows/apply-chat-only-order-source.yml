name: Apply Chat Only Order Source
on:
  push:
    branches:
      - fix/chat-only-order-source
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/chat-only-order-source
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install verification dependency
        run: python -m pip install pytest
      - name: Verify focused contracts
        run: |
          node tests/test_v21_order_source_core.mjs
          python tests/test_v21_order_source_ui.py
          python tests/test_v21_work_context_bridge.py
      - name: Rebuild canonical output
        run: python tools/build_current_preview.py
      - name: Verify canonical output
        run: python tools/verify_current.py
      - name: Commit generated output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html version.json
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "build: refresh chat-only order-source preview"
          git push origin HEAD:fix/chat-only-order-source
